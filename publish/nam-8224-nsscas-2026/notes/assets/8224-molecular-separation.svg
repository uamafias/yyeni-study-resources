<svg xmlns="http://www.w3.org/2000/svg" width="840" height="460" viewBox="0 0 840 460" role="img" aria-labelledby="title desc">
<title id="title">Separating molecules during a phase change</title><desc id="desc">Pairs of iodine atoms remain joined within I2 molecules as the molecules move farther apart. Dotted lines represent between-molecule attractions, not the covalent I–I bonds.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="26" y="26" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" fill="#172b3a">Separating molecules during a phase change</text>
<text x="152" y="143" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">I</text>
<polyline points="175,160 222,160" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="227" y="143" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">I</text>
<text x="282" y="143" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">I</text>
<polyline points="305,160 352,160" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="357" y="143" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">I</text>
<polyline points="250,160 255,160" fill="none" stroke="#66747b" stroke-width="2" stroke-linejoin="round"/>
<polyline points="260,160 265,160" fill="none" stroke="#66747b" stroke-width="2" stroke-linejoin="round"/>
<polyline points="270,160 275,160" fill="none" stroke="#66747b" stroke-width="2" stroke-linejoin="round"/>
<text x="152" y="298" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">I</text>
<polyline points="175,315 222,315" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="227" y="298" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">I</text>
<text x="612" y="298" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">I</text>
<polyline points="635,315 682,315" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="687" y="298" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">I</text>
<text x="26" y="80" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="20" fill="#172b3a">Closer molecules</text>
<text x="26" y="245" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="20" fill="#172b3a">Separated molecules</text>
<text x="26" y="415" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="16" fill="#172b3a">Internal I–I covalent bonds remain; spacing between whole molecules increases.</text>
</svg>
