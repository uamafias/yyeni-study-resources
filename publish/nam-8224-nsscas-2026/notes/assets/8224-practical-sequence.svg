<svg xmlns="http://www.w3.org/2000/svg" width="840" height="460" viewBox="0 0 840 460" role="img" aria-labelledby="title desc">
<title id="title">Read the observation sequence</title><desc id="desc">Three labelled boxes linked by arrows: fresh portion of X, add reagent dropwise and record initial effect, add excess of the same reagent and record final effect.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="26" y="26" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" fill="#172b3a">Read the observation sequence</text>
<polyline points="35,150 265,150 265,310 35,310 35,150" fill="none" stroke="#24475c" stroke-width="2" stroke-linejoin="round"/>
<text x="47" y="185" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="19" fill="#172b3a">Fresh portion</text>
<text x="47" y="230" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="19" fill="#172b3a">of sample X</text>
<polyline points="300,150 530,150 530,310 300,310 300,150" fill="none" stroke="#24475c" stroke-width="2" stroke-linejoin="round"/>
<text x="312" y="185" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="19" fill="#172b3a">Add dropwise</text>
<text x="312" y="230" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="19" fill="#172b3a">Record initial effect</text>
<polyline points="565,150 795,150 795,310 565,310 565,150" fill="none" stroke="#24475c" stroke-width="2" stroke-linejoin="round"/>
<text x="577" y="185" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="19" fill="#172b3a">Add excess</text>
<text x="577" y="230" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="19" fill="#172b3a">Record final effect</text>
<polyline points="270,230 290,230" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="280.0950818741206,234.78462087522354 290,230 280.0950818741206,225.21537912477646" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="535,230 555,230" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="545.0950818741205,234.78462087522354 555,230 545.0950818741205,225.21537912477646" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="40" y="395" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="19" fill="#172b3a">Use a new original-sample portion for a different reagent comparison.</text>
</svg>
