<text x="542.4172275364533" y="280.0769376058564" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="30" fill="#172b3a">H</text>
<polyline points="397.8606919351724,207.14208384096457 285.58277246354663,294.0769376058564" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="273.58277246354663" y="280.0769376058564" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="30" fill="#172b3a">H</text>
<text x="407" y="170" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="32" fill="#172b3a">O</text>
<text x="350" y="120" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="24" fill="#172b3a">••</text>
<text x="466" y="120" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="24" fill="#172b3a">••</text>
<text x="365" y="260" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" fill="#172b3a">104.5°</text>
<text x="26" y="410" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="18" fill="#172b3a">Two bonds and two lone pairs: the molecule is bent, not linear.</text>
