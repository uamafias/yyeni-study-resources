<svg xmlns="http://www.w3.org/2000/svg" width="840" height="460" viewBox="0 0 840 460" role="img" aria-labelledby="title desc">
<title id="title">Bent molecule: water</title><desc id="desc">Oxygen at the centre with two O–H bonds, two lone pairs and a bond angle of approximately 104.5 degrees. Schematic electron-region drawing.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="26" y="26" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" fill="#172b3a">Bent molecule: water</text>
