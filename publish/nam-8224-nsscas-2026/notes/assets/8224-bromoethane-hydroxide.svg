<title id="title">Bromoethane substitution by hydroxide</title><desc id="desc">Hydroxide oxygen lone pair attacks carbon attached to Br while C-Br pair goes to Br. Primary direct route; no discrete carbocation intermediate. Products ethanol and bromide.</desc>
