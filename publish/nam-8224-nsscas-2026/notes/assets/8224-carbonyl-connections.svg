<svg xmlns="http://www.w3.org/2000/svg" width="840" height="460" viewBox="0 0 840 460" role="img" aria-labelledby="title desc">
<title id="title">Aldehyde and ketone carbonyl connections</title><desc id="desc">Ethanal has carbonyl C attached to H and methyl; propanone has carbonyl C attached to two methyl groups. Condensed methyl groups are explicit abbreviations.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="26" y="26" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" fill="#172b3a">Aldehyde and ketone carbonyl connections</text>
<text x="45" y="90" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="24" fill="#172b3a">Ethanal</text>
<text x="40" y="230" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" fill="#172b3a">CH3</text>
<text x="190" y="230" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">C</text>
<text x="305" y="230" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" fill="#172b3a">H</text>
<text x="190" y="125" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">O</text>
<polyline points="110,248 180,248" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="225,248 293,248" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="197,172 197,220" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="209,172 209,220" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="465" y="90" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="24" fill="#172b3a">Propanone</text>
<text x="460" y="230" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" fill="#172b3a">CH3</text>
<text x="610" y="230" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">C</text>
<text x="725" y="230" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" fill="#172b3a">CH3</text>
<text x="610" y="125" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">O</text>
<polyline points="530,248 600,248" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="645,248 713,248" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="617,172 617,220" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="629,172 629,220" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="28" y="410" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="18" fill="#172b3a">C=O carbon has four bond contributions; CH3 groups are condensed.</text>
</svg>
