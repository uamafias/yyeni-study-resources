<svg xmlns="http://www.w3.org/2000/svg" width="840" height="460" viewBox="0 0 840 460" role="img" aria-labelledby="title desc">
<title id="title">Hess cycle: the same initial and final states</title><desc id="desc">Three complete states A, B and C. A to B is −45, A to C is −120 and B to C is unknown, all in kJ per mole on the same basis.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="26" y="26" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" fill="#172b3a">Hess cycle: the same initial and final states</text>
<text x="110" y="100" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="30" fill="#172b3a">A</text>
<text x="660" y="100" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="30" fill="#172b3a">C</text>
<text x="385" y="330" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="30" fill="#172b3a">B</text>
<polyline points="155,120 635,120" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="625.0950818741205,124.78462087522354 635,120 625.0950818741205,115.21537912477646" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="280" y="76" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="22" fill="#172b3a">−120 kJ/mol</text>
<polyline points="145,147 370,325" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="359.26344394894426,322.6070177262382 370,325 365.2005371430662,315.10226509321893" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="60" y="249" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="21" fill="#172b3a">−45 kJ/mol</text>
<polyline points="430,325 651,150" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="646.2050658203376,159.89992960645205 651,150 640.2645398525684,152.39789395572637" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="552" y="249" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="21" fill="#172b3a">Unknown</text>
<text x="40" y="402" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="18" fill="#172b3a">A → C = A → B + B → C. Arrow directions define the signs.</text>
</svg>
