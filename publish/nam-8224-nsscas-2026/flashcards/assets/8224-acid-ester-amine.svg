<svg xmlns="http://www.w3.org/2000/svg" width="840" height="460" viewBox="0 0 840 460" role="img" aria-labelledby="title desc">
<title id="title">Acid, ester and primary amine connections</title><desc id="desc">Condensed connections of ethanoic acid, methyl ethanoate and ethanamine. In acid the second O bears H; in ester it bears methyl; primary amine N bears two H and one carbon group.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="26" y="26" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" fill="#172b3a">Acid, ester and primary amine connections</text>
<text x="35" y="105" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="21" fill="#172b3a">Ethanoic acid</text>
<text x="310" y="130" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" fill="#172b3a">CH3</text>
<text x="440" y="130" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="27" fill="#172b3a">C</text>
<text x="570" y="130" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="27" fill="#172b3a">O</text>
<text x="710" y="130" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" fill="#172b3a">H</text>
<polyline points="375,148 430,148" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="475,148 560,148" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="605,148 700,148" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="440" y="55" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="27" fill="#172b3a">O</text>
<polyline points="447,98 447,125" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="459,98 459,125" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="35" y="265" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="21" fill="#172b3a">Methyl ethanoate</text>
<text x="310" y="290" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" fill="#172b3a">CH3</text>
<text x="440" y="290" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="27" fill="#172b3a">C</text>
<text x="570" y="290" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="27" fill="#172b3a">O</text>
<text x="710" y="290" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" fill="#172b3a">CH3</text>
<polyline points="375,308 430,308" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="475,308 560,308" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="605,308 700,308" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="440" y="215" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="27" fill="#172b3a">O</text>
<polyline points="447,258 447,285" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="459,258 459,285" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="35" y="405" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" fill="#172b3a">Primary amine:  CH3–CH2–NH2</text>
