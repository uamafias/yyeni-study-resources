<svg xmlns="http://www.w3.org/2000/svg" width="840" height="460" viewBox="0 0 840 460" role="img" aria-labelledby="title desc">
<title id="title">Alkane representations</title><desc id="desc">Displayed ethane has six hydrogen bonds and a carbon-carbon single bond. A three-segment skeletal zigzag represents four-carbon butane.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="26" y="26" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" fill="#172b3a">Alkane representations</text>
<text x="45" y="85" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" fill="#172b3a">Displayed ethane</text>
<text x="180" y="220" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="30" fill="#172b3a">C</text>
<text x="180" y="130" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="26" fill="#172b3a">H</text>
<text x="180" y="325" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="26" fill="#172b3a">H</text>
<polyline points="190,165 190,210" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="190,260 190,315" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="340" y="220" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="30" fill="#172b3a">C</text>
<text x="340" y="130" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="26" fill="#172b3a">H</text>
<text x="340" y="325" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="26" fill="#172b3a">H</text>
<polyline points="350,165 350,210" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="350,260 350,315" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="80" y="220" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="26" fill="#172b3a">H</text>
<text x="440" y="220" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="26" fill="#172b3a">H</text>
<polyline points="115,237 168,237" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="215,237 328,237" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="375,237 428,237" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="520" y="85" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" fill="#172b3a">Skeletal butane</text>
<polyline points="520,240 600,180 680,240 760,180" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="525" y="305" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="20" fill="#172b3a">4 carbon positions</text>
<text x="525" y="345" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" fill="#172b3a">C4H10</text>
</svg>
