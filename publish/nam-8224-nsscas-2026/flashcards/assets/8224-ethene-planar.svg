<svg xmlns="http://www.w3.org/2000/svg" width="840" height="460" viewBox="0 0 840 460" role="img" aria-labelledby="title desc">
<title id="title">Ethene: planar around each carbon</title><desc id="desc">Two carbon atoms joined by a double bond. Each carbon joins two hydrogens in one plane; angles approximately 120 degrees. Schematic lengths.</desc>
