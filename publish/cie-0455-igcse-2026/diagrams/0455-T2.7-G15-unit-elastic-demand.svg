   <g id="text_13">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(247.850098 92.922558)">The two rectangles have the same area:</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(247.850098 109.797558)">the price change is offset exactly by</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(247.850098 126.672558)">the change in quantity, so spending</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(247.850098 143.547558)">does not change. The curve bends</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(247.850098 160.422558)">towards the origin.</text>
   </g>
