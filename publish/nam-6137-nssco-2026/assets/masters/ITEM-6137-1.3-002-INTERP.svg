  <text x="84" y="1064" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >Beyond the divide, slopes drain the other way: stream C flows</text>
  <text x="84" y="1096" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >east to a different outlet, E.</text>
  <text x="36" y="1138" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >The divide follows higher ground: its spot heights are above those</text>
  <text x="36" y="1170" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >of the channels inside it, and it meets the river only at O.</text>
