  <text x="52" y="1171" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff" >3</text>
  <text x="84" y="1171" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >S is a lower remnant covered at high tide: a stump, the stack</text>
  <text x="84" y="1203" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >reduced further. The letters give the order, not equal times.</text>
