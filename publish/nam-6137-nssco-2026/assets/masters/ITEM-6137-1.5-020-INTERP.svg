  <text x="52" y="1099" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff" >2</text>
  <text x="84" y="1099" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >R stands alone with water all round: the roof has collapsed,</text>
  <text x="84" y="1131" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >leaving a stack separated from the headland.</text>
