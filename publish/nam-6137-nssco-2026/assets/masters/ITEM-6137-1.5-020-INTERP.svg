  <text x="84" y="995" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >P is a cave: erosion has enlarged a weakness into a blind</text>
  <text x="84" y="1027" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >opening. At Q the opening passes right through the headland under</text>
  <text x="84" y="1059" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >a roof: an arch.</text>
