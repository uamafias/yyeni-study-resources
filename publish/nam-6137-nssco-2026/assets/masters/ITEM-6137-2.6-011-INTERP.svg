  <text x="84" y="690" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >The tree cover is reduced and fragmented: one connected block</text>
  <text x="84" y="722" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >becomes two separate patches.</text>
