  <text x="52" y="762" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff" >2</text>
  <text x="84" y="762" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >The cleared corridor interrupts the earlier connection, so</text>
  <text x="84" y="794" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >movement or access to resources may be constrained for species</text>
  <text x="84" y="826" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >that need tree cover.</text>
  <circle cx="52" cy="857" r="19" fill="#0b6e4f" stroke="#ffffff" stroke-width="2.5" />
  <text x="52" y="866" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff" >3</text>
  <text x="84" y="866" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >With no counts or species-use records, it cannot show an exact</text>
  <text x="84" y="898" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >animal-population loss.</text>
