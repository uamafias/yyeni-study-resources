assessment_objectives:
- code: A
  name: Knowledge with understanding
  description: 'A1 scientific phenomena, facts, laws, definitions, concepts and theories
    A2 scientific vocabulary, terminology and conventions, (including symbols, quantities,
    units) A3 scientific instruments and apparatus, including techniques of operation
    and aspects of safety A4 scientific quantities and their determination A5 scientific
    and technological applications with their social, economic and environmental

    implications'
  qualification_weight_percent: 50
- code: B
  name: Handling information, application and solving problems
  description: B1 locate, select, organise and present information from a variety
    of sources B2 translate information from one form to another B3 manipulate numerical
    and other data B4 use information to identify patterns, report trends and draw
    inferences B5 present reasoned explanations for phenomena, patterns and relationships
    B6 make predictions and hypotheses B7 solve quantitative and qualitative problems
    as they relate to everyday life
  qualification_weight_percent: 30
- code: C
  name: Practical (experimental and investigative) skills and abilities
  description: 'C1    demonstrate knowledge of how to safely use techniques, apparatus
    and materials (including

    following a sequence of instructions where appropriate) C2    plan experiments
    and investigations C3    make and record observations, measurements and estimates
    C4    interpret and evaluate experimental observations and data, including dealing
    with anomalous or

    inconsistent results C5    evaluate methods and suggest possible improvements'
  qualification_weight_percent: 20
command_words:
- word: Define
  meaning: "      Define (the      is intended literally. Only a formal statement\
    \ or equivalent paraphrase is\n      term(s)...).     required"
- word: What do you understand by / What is meant by
  meaning: "      What do you      normally implies that a definition should be given,\
    \ together with some\n      understand       relevant comment on the significance\
    \ or context of the term(s) concerned,\n      by/What is       especially where\
    \ two or more terms are included in the question. The\n      meant by (the   \
    \ amount of supplementary comment intended should be interpreted in the\n    \
    \  term(s)...)      light of the indicated mark value."
- word: State
  meaning: "      State            implies a concise answer with little or no supporting\
    \ argument, e.g. a\n                       numerical answer that can be obtained\
    \ ‘by inspection’."
- word: List
  meaning: "      List             requires a number of points with no elaboration.\
    \ If a specific number of\n                       points is requested, this number\
    \ should not be exceeded."
- word: Explain
  meaning: "      Explain          may imply reasoning or some reference to theory,\
    \ depending on the\n                       context."
- word: Describe
  meaning: "      Describe         requires candidates to state in words (using diagrams\
    \ where appropriate)\n                       the main points of the topic. It\
    \ is often used with reference either to\n                       particular phenomena\
    \ or to particular experiments.\n\n                       For particular phenomena,\
    \ the term usually implies that the answer should\n                       include\
    \ reference to (visual) observations associated with the phenomena.\n        \
    \               In other contexts, describe and give an account of should be interpreted\n\
    \                       more generally, i.e. the candidate has greater discretion\
    \ about the nature\n                       and the organisation of the material\
    \ to be included in the answer. Describe\n                       and explain may\
    \ be coupled in a similar way to state and explain."
- word: Discuss
  meaning: "      Discuss          requires candidates to give a critical account\
    \ of the points involved in the\n                       topic."
- word: Outline
  meaning: '      Outline          implies brevity, i.e. restricting the answer to
    giving essentials.'
- word: Deduce / predict
  meaning: "      Deduce/          implies that the candidate is not expected to produce\
    \ the required answer\n      predict          by recall but by making a logical\
    \ connection between other pieces of\n                       information. Such\
    \ information may be wholly given in the question or may\n                   \
    \    depend on answers extracted in an earlier part of the question."
- word: Comment
  meaning: "      Comment          is intended as an open-ended instruction, inviting\
    \ candidates to recall or\n                       infer points of interest relevant\
    \ to the context of the question, taking\n                       account of the\
    \ number of marks available."
- word: Suggest
  meaning: "      Suggest          is used in two main contexts. It may imply either\
    \ that there is no unique\n                       answer (e.g. in chemistry, two\
    \ or more substances may satisfy the given\n                       conditions\
    \ describing an ‘unknown’), or that candidates are expected to\n             \
    \          apply their general knowledge to a new situation (one that may not\n\
    \                       formally be in the syllabus)."
- word: Find
  meaning: "      Find             is a general term that may variously be interpreted\
    \ as calculate, measure,\n                       determine, etc."
- word: Calculate
  meaning: "    Calculate          is used when a numerical answer is required. In\
    \ general, working should be\n                       shown, especially where two\
    \ or more steps are involved."
- word: Measure
  meaning: "    Measure            implies that the quantity concerned can be directly\
    \ obtained from a suitable\n                       measuring\n               \
    \        instrument, e.g. length, using a rule, or angle, using a protractor."
- word: Determine
  meaning: "    Determine          often implies that the quantity concerned cannot\
    \ be measured directly but\n                       is obtained by calculation,\
    \ substituting measured or known values of other\n                       quantities\
    \ into a standard formula, e.g.\n                       relative molecular mass."
- word: Estimate
  meaning: "    Estimate           implies a reasoned order of magnitude statement\
    \ or calculation of the\n                       quantity concerned. Candidates\
    \ should make any necessary simplifying\n                       assumptions about\
    \ points of principle and about the values of quantities not\n               \
    \        otherwise included in the question."
- word: Sketch
  meaning: "    Sketch             when applied to graph work, implies that the shape\
    \ and/or position of the\n                       curve need only be qualitatively\
    \ correct, but candidates should be aware\n                       that, depending\
    \ on the context, some quantitative aspects may be looked\n                  \
    \     for, e.g. passing through the origin, having an intercept, asymptote or\n\
    \                       discontinuity at a particular value. In diagrams, sketch\
    \ implies that a simple,\n                       freehand drawing is acceptable\
    \ though care should be taken over\n                       proportions and the\
    \ clear exposition of important details."
- word: Construct
  meaning: "    Construct          is often used in relation to chemical equations\
    \ where a candidate is\n                       expected to write a balanced equation,\
    \ not by factual recall but by analogy\n                       or by using information\
    \ in the question."
- word: Compare
  meaning: "    Compare            requires candidates to provide both the similarities\
    \ and differences between\n                       things or concepts."
- word: Classify
  meaning: '    Classify           requires candidates to group things based on common
    characteristics.'
