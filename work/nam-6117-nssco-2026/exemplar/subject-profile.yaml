quantitative_model:
  required_components:
  - equation
  - unit conversion
  - substitution
  - unrounded working
  - rounded answer and unit
  interpretation_rules:
  - Recompute every result independently.
  - Use 24 dm³/mol at room conditions when specified.
  - Distinguish mass concentration from amount concentration.
learning_item_model:
  item_types:
  - flashcard
  - multiple_choice_set
  - short_answer
  - calculation
  - practical_task
  flashcard_subtypes:
  - DEF
  - FEATURE
  - MECH
  - APP
  - PROC
  - DIST
  - INTERP
  - CALC
  - LIM
  - MISCON
  rules:
  - Every slot carries AO, Bloom, command, tariff and an answer rubric.
  - No invented allocation for commentary-only evidence.
  - Official question and report wording remains internal.
terminology_rules:
- Use ion charges and oxidation states consistently.
- Distinguish a coloured precipitate from a coloured solution.
- State aqueous/molten and electrode conditions when predicting electrolysis products.
- Pressure changes equilibrium yield only where gas stoichiometry permits; rate and
  yield are distinct.
- Do not conflate concentration with strength.
- Keep every item self-contained.
prohibited_patterns:
- Content beyond explicit scope limits
- Copied assessment wording
- Unverified report arithmetic
- Invented credit allocations for the five commentary-only parts
semantic_review_questions:
- Can a learner answer from the notes alone?
- Are every listed syllabus member and required skill covered?
- Do answers distinguish observation, inference and explanation?
- Are apparatus and graph visuals scientifically possible?
