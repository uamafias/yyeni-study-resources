assessment_skill_model:
- skill_id: A
  label: Knowledge with understanding
  definition: 'A1 scientific phenomena, facts, laws, definitions, concepts and theories
    A2 scientific vocabulary, terminology and conventions, (including symbols, quantities,
    units) A3 scientific instruments and apparatus, including techniques of operation
    and aspects of safety A4 scientific quantities and their determination A5 scientific
    and technological applications with their social, economic and environmental

    implications'
  authoring_requirements:
  - Use the slot AO and Bloom label; do not infer AO from the command alone.
- skill_id: B
  label: Handling information, application and solving problems
  definition: B1 locate, select, organise and present information from a variety of
    sources B2 translate information from one form to another B3 manipulate numerical
    and other data B4 use information to identify patterns, report trends and draw
    inferences B5 present reasoned explanations for phenomena, patterns and relationships
    B6 make predictions and hypotheses B7 solve quantitative and qualitative problems
    as they relate to everyday life
  authoring_requirements:
  - Use the slot AO and Bloom label; do not infer AO from the command alone.
- skill_id: C
  label: Practical (experimental and investigative) skills and abilities
  definition: 'C1    demonstrate knowledge of how to safely use techniques, apparatus
    and materials (including

    following a sequence of instructions where appropriate) C2    plan experiments
    and investigations C3    make and record observations, measurements and estimates
    C4    interpret and evaluate experimental observations and data, including dealing
    with anomalous or

    inconsistent results C5    evaluate methods and suggest possible improvements'
  authoring_requirements:
  - Use the slot AO and Bloom label; do not infer AO from the command alone.
application_model:
  core_rule: Use fresh substances, values or experimental contexts to apply the same
    syllabus idea.
  context_dimensions:
  - substance
  - apparatus
  - data
  - conditions
  worked_application_policy:
    minimum_per_major_objective: 1
    contrast_required_for_decisions: true
    coverage_dimensions:
    - context
    - reason
    - consequence
  pseudo_application_patterns:
  - Adding a name to an unchanged definition
  - Reusing an official question with substituted numbers
analysis_model:
  chain_template:
  - evidence or condition
  - chemical reason
  - supported conclusion
  rules:
  - Distinguish observation from inference.
  - Use particle, energy or mole reasoning where the task requires it.
evaluation_model:
  judgement_template:
  - criterion
  - evidence
  - limitation and improvement
  decision_dimensions:
  - safety
  - fairness
  - precision
  - validity
  rules:
  - Do not claim repeats remove systematic error.
  - Tie each improvement to a named source of error.
