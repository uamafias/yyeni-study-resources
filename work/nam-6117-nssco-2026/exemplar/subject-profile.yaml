variant_register:
- term: electrolysis
  variants:
  - aqueous
  - molten
  - inert electrode
  - copper electrode
  consequence: Electrode products and charge carriers depend on the stated conditions.
- term: acid
  variants:
  - strong
  - weak
  - concentrated
  - dilute
  consequence: Strength is degree of ionisation; concentration is amount per volume.
