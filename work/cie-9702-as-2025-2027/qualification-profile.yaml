assessment_objectives:
- code: AO1
  name: Knowledge and understanding
  description: Scientific phenomena, facts, laws, definitions, concepts and theories; vocabulary, terminology and
    conventions (including symbols, quantities and units); instruments and apparatus; quantities and their
    determination; applications and their implications.
  qualification_weight_percent: 40
- code: AO2
  name: Handling, applying and evaluating information
  description: Locate, select, organise and present information; translate it from one form to another; manipulate
    numerical and other data; identify patterns, report trends and draw conclusions; give reasoned explanations;
    make predictions; make sense of new situations; evaluate hypotheses; solve problems.
  qualification_weight_percent: 40
- code: AO3
  name: Experimental skills and investigations
  description: Plan experiments and investigations; collect, record and present observations, measurements and
    estimates; analyse and interpret data to reach conclusions; evaluate methods and quality of data, and suggest
    improvements.
  qualification_weight_percent: 20
ao_source_note: Names, descriptions and AS weights from syllabus pages 13-14. The per-paper split (page 14) weighted by
  the paper weights (page 11) gives 38.5/38.5/23; the syllabus states 40/40/20 for the qualification, and that is the
  target.
papers:
- paper_id: P1
  name: Multiple Choice
  duration_minutes: 75
  marks: 40
  qualification_weight_percent: 31
  question_basis: Forty four-choice multiple-choice items on the AS content (topics 1-11).
  assessment_objective_weights: {AO1: 50, AO2: 50, AO3: 0}
- paper_id: P2
  name: AS Level Structured Questions
  duration_minutes: 75
  marks: 60
  qualification_weight_percent: 46
  question_basis: Structured questions on the AS content (topics 1-11).
  assessment_objective_weights: {AO1: 50, AO2: 50, AO3: 0}
- paper_id: P3
  name: Advanced Practical Skills
  duration_minutes: 120
  marks: 40
  qualification_weight_percent: 23
  question_basis: Two 20-mark laboratory questions assessing the AS practical skills; the physics may be outside the
    syllabus content and no prior knowledge of its theory is required (pages 40, 42-43).
  assessment_objective_weights: {AO1: 0, AO2: 0, AO3: 100}
