assessment_objectives:
- code: AO1
  name: Knowledge with understanding
  description: The processes, including human actions, that shape physical, economic and social environments and
    their spatial patterns; the relationships between human activity and the environment; scale; change through time.
  qualification_weight_percent: 30
- code: AO2
  name: Skills and analysis
  description: Interpret and analyse geographical data; apply knowledge to maps and to numerical, diagrammatic,
    pictorial, photographic and graphical forms; recognise patterns and deduce relationships; select techniques for
    collecting, organising and presenting data.
  qualification_weight_percent: 52
- code: AO3
  name: Judgement and decision-making
  description: Reason and make judgements and decisions, including evaluation and conclusions, aware of the values of
    others, the opportunities and constraints of people in different places, and the need for sustainable development.
  qualification_weight_percent: 18
ao_source_note: Names, descriptions and weights from syllabus pages 10-11.
papers:
- paper_id: P1
  name: Geographical Themes
  duration_minutes: 105
  marks: 75
  qualification_weight_percent: 45
  question_basis: Six 25-mark questions in three sections, one per theme; the candidate answers one from each section.
    75 marks weighted to 100. Resource-based tasks and place-specific case studies.
  assessment_objective_weights: {AO1: 48, AO2: 30, AO3: 22}
- paper_id: P2
  name: Geographical Skills
  duration_minutes: 90
  marks: 60
  qualification_weight_percent: 27.5
  question_basis: All questions answered. A mapwork question on a 1:25 000 or 1:50 000 map (a third of the marks);
    graphs, tables, photographs and diagrams. No place-specific knowledge needed.
  assessment_objective_weights: {AO1: 11, AO2: 80, AO3: 9}
- paper_id: P4
  name: Alternative to Coursework
  duration_minutes: 90
  marks: 60
  qualification_weight_percent: 27.5
  question_basis: Two compulsory questions on fieldwork enquiries relating to the themes.
  assessment_objective_weights: {AO1: 20, AO2: 60, AO3: 20}
learner_context:
  region: Namibia
  medium: English
  currency: N$
  note: IGCSE learners taking Papers 12, 22 and 42. Namibian and southern African case studies are used where they
    fit the syllabus; every case study is a real place.
prior_teaching: None assumed; every term is introduced before it is used.
first_exam: '2026-10-14'
