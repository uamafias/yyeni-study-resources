- paper_id: P1
  name: Business Concepts 1
  duration_minutes: 75
  marks: 40
  qualification_weight_percent: 40
  question_basis: Questions are based on AS Level subject content, topics 1.1–5.5.
  sections:
  - 'Section A: four compulsory questions of five marks each; the first three questions have two parts.'
  - 'Section B: answer one essay from a choice of two; each essay has two parts and totals 20 marks.'
  evaluation_locations:
  - The second part of each Section B essay should show AO4 evaluation.
  assessment_objective_weights:
    AO1: 35
    AO2: 30
    AO3: 20
    AO4: 15
- paper_id: P2
  name: Business Concepts 2
  duration_minutes: 90
  marks: 60
  qualification_weight_percent: 60
  question_basis: Two compulsory data-response questions based on AS Level subject content, topics 1.1–5.5.
  sections:
  - Two questions of 30 marks each.
  - Each question contains written, numerical, and/or diagrammatic stimulus and has six parts.
  evaluation_locations:
  - The last part of each question should show AO4 evaluation.
  assessment_objective_weights:
    AO1: 30
    AO2: 30
    AO3: 20
    AO4: 20
assessment_objectives:
- code: AO1
  name: Knowledge and understanding
  description: Demonstrate knowledge and understanding of business concepts, terms and theories.
  qualification_weight_percent: 30
- code: AO2
  name: Application
  description: Apply knowledge and understanding to problems and issues in familiar and unfamiliar business situations and
    contexts.
  qualification_weight_percent: 30
- code: AO3
  name: Analysis
  description: Analyse qualitative and quantitative business information, causes, impacts and consequences; distinguish evidence
    from opinion; and draw valid inferences and generalisations.
  qualification_weight_percent: 20
- code: AO4
  name: Evaluation
  description: Evaluate evidence to make reasoned judgements, present substantiated conclusions and, where appropriate, recommend
    action and implementation.
  qualification_weight_percent: 20
command_words:
- word: Advise
  meaning: Write down a suggested course of action in a given situation.
- word: Analyse
  meaning: Examine in detail to show meaning, identify elements and the relationship between them.
- word: Assess
  meaning: Make an informed judgement.
- word: Calculate
  meaning: Work out from given facts, figures or information.
- word: Define
  meaning: Give precise meaning.
- word: Evaluate
  meaning: Judge or calculate the quality, importance, amount or value of something.
- word: Explain
  meaning: Set out purposes or reasons, make relationships clear, say why and/or how, and support with relevant evidence.
- word: Identify
  meaning: Name, select or recognise.
- word: Justify
  meaning: Support a case with evidence or argument.
