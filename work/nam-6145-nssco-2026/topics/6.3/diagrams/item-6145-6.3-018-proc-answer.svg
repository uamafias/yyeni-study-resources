<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" data-item="ITEM-6145-6.3-018-PROC" data-side="answer">
<title>Binding minimum price creates a surplus</title>
<desc>Original equilibrium E at N$200 a bag and 300 bags a week. A minimum price of N$250, above equilibrium, is drawn as a horizontal line. Neither curve shifts: at N$250 quantity demanded is 200 bags (on D) and quantity supplied is 400 bags (on S), a surplus of 200 bags a week. Farmers offer 400 bags but only 200 are bought.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="62" font-family="Arial, Helvetica, sans-serif" font-size="27" text-anchor="start" font-weight="normal" fill="#111111">E (original): N$200 a bag, 300 bags a week</text>
<text x="40" y="102" font-family="Arial, Helvetica, sans-serif" font-size="27" text-anchor="start" font-weight="normal" fill="#111111">At the N$250 minimum price: demanded 200, supplied 400</text>
<text x="40" y="142" font-family="Arial, Helvetica, sans-serif" font-size="27" text-anchor="start" font-weight="normal" fill="#111111">Surplus = 400 − 200 = 200 bags a week</text>
<text x="40" y="182" font-family="Arial, Helvetica, sans-serif" font-size="27" text-anchor="start" font-weight="normal" fill="#111111">Farmers offer 400 but sell only 200 (fewer than 300)</text>
<text x="40" y="238" font-family="Arial, Helvetica, sans-serif" font-size="27" text-anchor="start" font-weight="bold" fill="#111111">Neither curve shifts: read both quantities off D and S.</text>
