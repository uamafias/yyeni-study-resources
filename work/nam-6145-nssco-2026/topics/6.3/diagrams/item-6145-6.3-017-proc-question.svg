<text x="40" y="128" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#111111">The government sets a maximum price</text>
<text x="40" y="168" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#111111">of N$12 a loaf.</text>
