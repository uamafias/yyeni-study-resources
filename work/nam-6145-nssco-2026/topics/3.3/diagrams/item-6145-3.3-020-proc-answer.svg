<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" data-item="ITEM-6145-3.3-020-PROC" data-side="answer">
<title>Elastic and inelastic supply curves through a common starting point</title>
<desc>Both supply curves pass through R (50 chairs, N$400). Workshop A's curve (flatter) passes through A (90, N$600): PES = +80% / +50% = 1.6, elastic. Workshop B's curve (steeper) passes through B (60, N$600): PES = +20% / +50% = 0.4, inelastic. Arrows along each curve show the movement from R as price rises.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="66" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#111111">Price rise: N$400 to N$600 = +50%</text>
<text x="40" y="108" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#111111">Workshop A: +80% ÷ +50% = 1.6, elastic</text>
<text x="40" y="150" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#111111">Workshop B: +20% ÷ +50% = 0.4, inelastic</text>
<text x="40" y="214" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="bold" fill="#111111">Same axes, same starting point R: the flatter</text>
<text x="40" y="252" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="bold" fill="#111111">supply curve is the more elastic over this change.</text>
