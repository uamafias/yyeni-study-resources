<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" data-item="ITEM-6145-3.3-019-PROC" data-side="answer">
<title>Inelastic and elastic demand curves through a common starting point</title>
<desc>Both demand curves pass through R (100 packets, N$20). The maize meal curve (solid, steeper) passes through M (75, N$30): PED = -25% / +50% = -0.5, inelastic. The crisps curve (dashed, flatter) passes through C (25, N$30): PED = -75% / +50% = -1.5, elastic. Arrows along each curve show the movement from R as price rises.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="60" y="66" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#111111">Price rise: N$20 to N$30 = +50%</text>
<text x="60" y="108" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#111111">Maize meal: −25% ÷ +50% = −0.5, inelastic</text>
<text x="60" y="150" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#111111">Crisps: −75% ÷ +50% = −1.5, elastic</text>
<text x="60" y="214" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="bold" fill="#111111">Same axes, same starting point R: the flatter</text>
<text x="60" y="252" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="bold" fill="#111111">curve is the more elastic over this change.</text>
