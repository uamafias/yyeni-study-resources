<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" data-item="ITEM-6145-5.4-031-PROC" data-side="answer">
<title>U-shaped long-run average cost curve with economies, optimum scale and diseconomies</title>
<desc>Average cost (total cost divided by output) is N$8.50, 6.00, 4.50, 4.00, 4.50 and 6.00 a litre at 10 to 60 thousand litres. The LRAC curve falls to a minimum M at 40 thousand litres and N$4.00 (optimum scale), then rises. Economies of scale are labelled where it falls and diseconomies where it rises. From 20 to 40 thousand litres total cost rises from N$120,000 to N$160,000 while average cost falls from N$6.00 to N$4.00.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="62" font-family="Arial, Helvetica, sans-serif" font-size="27" text-anchor="start" font-weight="normal" fill="#111111">Average cost = total cost ÷ output (N$ per litre)</text>
<text x="40" y="102" font-family="Arial, Helvetica, sans-serif" font-size="27" text-anchor="start" font-weight="normal" fill="#111111">M: lowest LRAC, optimum scale = 40,000 litres at N$4.00</text>
<text x="40" y="142" font-family="Arial, Helvetica, sans-serif" font-size="27" text-anchor="start" font-weight="normal" fill="#111111">20,000 to 40,000 litres: total cost rises (N$120,000 to</text>
<text x="40" y="182" font-family="Arial, Helvetica, sans-serif" font-size="27" text-anchor="start" font-weight="normal" fill="#111111">N$160,000) but average cost falls (N$6.00 to N$4.00)</text>
<text x="40" y="238" font-family="Arial, Helvetica, sans-serif" font-size="27" text-anchor="start" font-weight="bold" fill="#111111">Economies of scale show as falling cost per litre.</text>
