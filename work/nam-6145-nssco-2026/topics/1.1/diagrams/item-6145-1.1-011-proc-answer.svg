<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" data-item="ITEM-6145-1.1-011-PROC" data-side="answer">
<title>Production possibility curve with points J and K and the movement from C to D</title>
<desc>PPC bowed outwards through A (0, 80), B (50, 75), C (100, 60), D (150, 35) and E (200, 0). J (50, 40) lies inside the curve and K (100, 80) outside it. From C, an arrow across shows 50 more tonnes of maize and an arrow down to D shows 25 fewer cattle: the opportunity cost of the extra 50 t of maize is 25 cattle.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="60" y="66" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#111111">J: inside the PPC – resources unemployed or used inefficiently</text>
<text x="60" y="108" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#111111">K: outside the PPC – unattainable with present resources</text>
<text x="60" y="150" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#111111">C to D: 50 t more maize, 25 fewer cattle</text>
<text x="60" y="214" font-family="Arial, Helvetica, sans-serif" font-size="30" text-anchor="start" font-weight="bold" fill="#111111">Opportunity cost of the extra 50 t of maize = 25 cattle</text>
