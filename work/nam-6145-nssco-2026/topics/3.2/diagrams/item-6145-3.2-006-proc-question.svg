<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" data-item="ITEM-6145-3.2-006-PROC" data-side="question">
<title>Seed-packet demand and supply schedule</title>
<desc>Table: at N$10, N$20 and N$30 a packet, weekly demand is 90, 60 and 30 packets and weekly supply is 30, 60 and 90 packets. Instruction to draw D and S, mark the equilibrium and show the change towards it from N$10.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<g data-role="table" data-id="schedule">
<text x="60" y="66" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="bold" fill="#111111">Weekly demand and supply of seed packets</text>
<rect x="60" y="80" width="820" height="54" fill="#f1f4f9" stroke="#111111" stroke-width="2"/>
<rect x="60" y="80" width="820" height="162" fill="none" stroke="#111111" stroke-width="2"/>
<line x1="60" y1="134" x2="880" y2="134" stroke="#888888" stroke-width="1.5" stroke-linecap="round"/>
<line x1="60" y1="188" x2="880" y2="188" stroke="#888888" stroke-width="1.5" stroke-linecap="round"/>
<line x1="400" y1="80" x2="400" y2="242" stroke="#888888" stroke-width="1.5" stroke-linecap="round"/>
<line x1="560" y1="80" x2="560" y2="242" stroke="#888888" stroke-width="1.5" stroke-linecap="round"/>
<line x1="720" y1="80" x2="720" y2="242" stroke="#888888" stroke-width="1.5" stroke-linecap="round"/>
<text x="230" y="117.08" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="bold" fill="#111111" data-role="cell" data-row="0" data-col="0">Price (N$ per packet)</text>
<text x="480" y="117.08" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="bold" fill="#111111" data-role="cell" data-row="0" data-col="1">10</text>
<text x="640" y="117.08" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="bold" fill="#111111" data-role="cell" data-row="0" data-col="2">20</text>
<text x="800" y="117.08" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="bold" fill="#111111" data-role="cell" data-row="0" data-col="3">30</text>
<text x="230" y="171.08" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#111111" data-role="cell" data-row="1" data-col="0">Demand (packets)</text>
<text x="480" y="171.08" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#111111" data-role="cell" data-row="1" data-col="1">90</text>
<text x="640" y="171.08" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#111111" data-role="cell" data-row="1" data-col="2">60</text>
<text x="800" y="171.08" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#111111" data-role="cell" data-row="1" data-col="3">30</text>
<text x="230" y="225.08" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#111111" data-role="cell" data-row="2" data-col="0">Supply (packets)</text>
<text x="480" y="225.08" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#111111" data-role="cell" data-row="2" data-col="1">30</text>
<text x="640" y="225.08" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#111111" data-role="cell" data-row="2" data-col="2">60</text>
<text x="800" y="225.08" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#111111" data-role="cell" data-row="2" data-col="3">90</text>
</g>
<text x="60" y="300" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="bold" fill="#111111">Draw D and S on labelled axes, mark the equilibrium</text>
<text x="60" y="340" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="bold" fill="#111111">and show the change towards it from N$10.</text>
</svg>
