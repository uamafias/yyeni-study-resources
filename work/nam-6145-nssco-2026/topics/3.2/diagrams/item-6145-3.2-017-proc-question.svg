<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" data-item="ITEM-6145-3.2-017-PROC" data-side="question">
<title>Seed-packet schedules before and after a rise in supply</title>
<desc>Table: at N$10, N$20 and N$30 a packet, unchanged weekly demand D is 90, 60 and 30, original supply S0 is 30, 60 and 90 and new supply S1 is 60, 90 and 120. Instruction to draw D, S0 and S1 and label the original and changed equilibria.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<g data-role="table" data-id="schedule">
