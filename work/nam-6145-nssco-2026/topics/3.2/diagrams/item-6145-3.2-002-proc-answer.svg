<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" data-item="ITEM-6145-3.2-002-PROC" data-side="answer">
<title>Demand and supply curves with movements along both curves</title>
<desc>Price (N$ per unit) on the vertical axis and quantity (units per week) on the horizontal axis. D slopes down through (80, N$8), (60, N$12) and (40, N$16); S slopes up through (40, N$8), (60, N$12) and (80, N$16). Arrows along the curves show the price rise from N$8 to N$16: up-left along D (80 to 40 units) and up-right along S (40 to 80 units).</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="62" font-family="Arial, Helvetica, sans-serif" font-size="27" text-anchor="start" font-weight="normal" fill="#111111">D through (80, N$8), (60, N$12), (40, N$16): slopes down</text>
<text x="40" y="102" font-family="Arial, Helvetica, sans-serif" font-size="27" text-anchor="start" font-weight="normal" fill="#111111">S through (40, N$8), (60, N$12), (80, N$16): slopes up</text>
<text x="40" y="142" font-family="Arial, Helvetica, sans-serif" font-size="27" text-anchor="start" font-weight="normal" fill="#111111">N$8 to N$16: quantity demanded 80 to 40 along D,</text>
<text x="40" y="182" font-family="Arial, Helvetica, sans-serif" font-size="27" text-anchor="start" font-weight="normal" fill="#111111">quantity supplied 40 to 80 along S</text>
<text x="40" y="238" font-family="Arial, Helvetica, sans-serif" font-size="27" text-anchor="start" font-weight="bold" fill="#111111">A change in the product's own price moves along the curves.</text>
