<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" data-item="ITEM-6145-3.2-006-PROC" data-side="answer">
<title>Equilibrium, the shortage at N$10 and the upward price adjustment</title>
<desc>D through (90, N$10), (60, N$20), (30, N$30) and S through (30, N$10), (60, N$20), (90, N$30) cross at E: N$20 and 60 packets a week, projected to both axes. At N$10 quantity supplied is 30 and quantity demanded 90, an excess demand (shortage) of 60. Arrows along both curves show price rising towards E: quantity demanded contracts and quantity supplied extends.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="62" font-family="Arial, Helvetica, sans-serif" font-size="27" text-anchor="start" font-weight="normal" fill="#111111">E: N$20 a packet and 60 packets a week (D = S)</text>
<text x="40" y="102" font-family="Arial, Helvetica, sans-serif" font-size="27" text-anchor="start" font-weight="normal" fill="#111111">At N$10: supplied 30, demanded 90, excess demand 60</text>
<text x="40" y="142" font-family="Arial, Helvetica, sans-serif" font-size="27" text-anchor="start" font-weight="normal" fill="#111111">Price is pushed up towards N$20: quantity demanded</text>
<text x="40" y="182" font-family="Arial, Helvetica, sans-serif" font-size="27" text-anchor="start" font-weight="normal" fill="#111111">contracts along D, quantity supplied extends along S</text>
<text x="40" y="238" font-family="Arial, Helvetica, sans-serif" font-size="27" text-anchor="start" font-weight="bold" fill="#111111">The shortage at N$10 closes as price rises to E.</text>
