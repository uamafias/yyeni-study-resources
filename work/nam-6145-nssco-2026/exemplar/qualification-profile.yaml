  verbatim: Paper 2 2 hours 80 marks Weighting 50%
  description: A paper containing structured questions which will be presented for
    interpretation and analysis of real economic situations. Questions in this paper
    will seek to cover the assessment objectives A (Knowledge with understanding),
    B (Application and Analysis), and C (Evaluation and Decision Making). The paper
    is divided into two sections. Learners will be required to answer all questions
    in Section A. In Section B learners will choose three out of five questions available.
    Section A Structured questions (20 marks) Questions will include drawing and interpretation
    of diagrams. Section B (contains optional questions) Learners will be required
    to answer three structured essay questions (3 x 20 marks) from the five questions
    available. (60 marks)
