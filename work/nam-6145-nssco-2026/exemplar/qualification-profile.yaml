- No prior Economics qualification required.
assessment_objectives:
- code: A
  name: Knowledge with understanding
  description: economic phenomena, facts, definitions, concepts principles and theories
    economic vocabulary, terminology and conventions
  qualification_weight_percent: 39.0
  provenance: 'name/definition: syllabus PDF17; overall weight: calculation from PDF19
    and equal paper weights'
- code: B
  name: Application and analysis
  description: use economic data, to recognise patterns in such data, and to deduce
    relationships select, organise and interpret data analyse economic knowledge and
    understanding in verbal, numerical, diagrammatic, pictorial and graphical form
    recognise that economic theory is subject to various limitations and uncertainties
  qualification_weight_percent: 25.5
  provenance: 'name/definition: syllabus PDF17; overall weight: calculation from PDF19
    and equal paper weights'
- code: C
  name: Evaluation and decision making
  description: distinguish between evidence and opinion, make reasoned judgements
    and communicate them in an accurate and logical manner evaluate the social and
    environmental implications of particular courses of economic action make decisions
    and suggest proposals based on novel data that will be provided
  qualification_weight_percent: 35.5
  provenance: 'name/definition: syllabus PDF17; overall weight: calculation from PDF19
    and equal paper weights'
