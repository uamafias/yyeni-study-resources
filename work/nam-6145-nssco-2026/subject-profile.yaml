  - '2.2'
  - '6.2'
  - '6.3'
learning_item_model:
  item_types:
  - flashcard
  - short_answer
  - data_response
  - case_analysis
  - essay_plan
  flashcard_subtypes:
  - DEF
  - FEATURE
  - WHY
  - DIST
  - APP
  - MECH
  - CHAIN
  - BEN
  - LIM
  - EVAL
  - CALC
  - INTERP
  - PROC
  - MISCON
  rules:
  - One main retrieval target per flashcard.
  - Each package supplies its own facts and a worked answer for every part.
  - Marking guidance identifies concrete content and allocations; do not paste generic
    rubric text.
terminology_rules:
- Social costs include private and external costs.
- Capital-account legacy language must not turn investment flows into service exports.
- Keep ownership sector distinct from the stage of production.
prohibited_patterns:
- Unqualified causal universals.
- Copied assessment wording.
- Generic repeated answer templates.
- Treating a source error as an economic law.
semantic_review_questions:
- Can the learner reconstruct every answer from the notes?
- Are mechanisms and diagrams consistent?
- Is each judgement conditional?
- Does the rubric credit the actual answer rather than generic keywords?
variant_register:
- term: unemployment
  variants:
  - cyclical
  - structural
  - seasonal
  - frictional
  consequence: The cause determines the classification and the appropriate policy.
- term: elasticity
  variants:
  - elastic
  - inelastic
  - unit elastic
  - perfectly inelastic
  consequence: Magnitude determines quantity/revenue responsiveness; coefficient has
    no percentage unit.
