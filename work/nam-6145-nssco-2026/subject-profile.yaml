conditioned_mechanisms:
- mechanism_id: CM-6145-PRICE-REVENUE
  name: Price rise increases total revenue
  asserted_when:
  - \bprice ris\w*\b
  - \btotal revenue\b
  - \bincreas\w*\b
  required_conditions:
  - name: inelastic demand for the relevant change
    any_of:
    - \binelastic\b
    - \bPED.*(?:below|less than) 1\b
  rationale: Revenue does not rise with price for all elasticities.
- mechanism_id: CM-6145-MINIMUM-WAGE
  name: A binding wage floor creates excess labour supply in the basic competitive
    model
  asserted_when:
  - \bminimum wage\b
  - \b(?:raises?|increases?|creates?|causes?)\b
  - \bunemployment\b
  required_conditions:
  - name: the floor is above the equilibrium wage in the competitive model
    any_of:
    - \babove (?:the )?(?:market|equilibrium) wage\b
    - \bbinding wage floor\b
  rationale: A floor below equilibrium is not binding; do not generalise beyond the
    stated model.
- mechanism_id: CM-6145-DEPRECIATION
  name: Depreciation improves the current account
  asserted_when:
  - \bdepreciat\w*\b
  - \bcurrent account\b
  - \bimprov\w*\b
  required_conditions:
  - name: trade quantities and supply can respond sufficiently
    any_of:
    - \bsupply can respond\b
    - \bsufficient(?:ly)? respons\w*\b
    - \belastic enough\b
  rationale: The import bill and production constraints can offset price competitiveness.
- mechanism_id: CM-6145-GROWTH
  name: Growth improves living standards
  asserted_when:
  - \beconomic growth\b
  - \b(?:raises?|improves?) living standards\b
  required_conditions:
  - name: distribution and external costs are considered
    any_of:
    - \bdistribut\w*\b
    - \bshared\b
    - \bexternal costs?\b
  rationale: Higher output alone does not establish better living standards for every
    person.
depiction_rule: Use original generated economic diagrams or complete coordinate tables;
  label axes, curves, equilibrium and changes. Never claim a generic business break-even
  renderer validates supply/demand geometry.
