assessment_skill_model:
- skill_id: A
  label: Knowledge with understanding
  definition: economic phenomena, facts, definitions, concepts principles and theories;
    economic vocabulary, terminology and conventions
  authoring_requirements:
  - Follow the 6145 answer shapes and the slot labels.
- skill_id: B
  label: Application and analysis
  definition: use economic data, to recognise patterns in such data, and to deduce
    relationships; select, organise and interpret data; analyse economic knowledge
    and understanding in verbal, numerical, diagrammatic, pictorial and graphical
    form; recognise that economic theory is subject to various limitations and uncertainties
  authoring_requirements:
  - Follow the 6145 answer shapes and the slot labels.
- skill_id: C
  label: Evaluation and decision making
  definition: distinguish between evidence and opinion, make reasoned judgements and
    communicate them in an accurate and logical manner; evaluate the social and environmental
    implications of particular courses of economic action; make decisions and suggest
    proposals based on novel data that will be provided
  authoring_requirements:
  - Follow the 6145 answer shapes and the slot labels.
application_model:
  core_rule: The supplied case facts must affect the explanation, not merely decorate
    a recalled answer.
  context_dimensions:
  - economic agent
  - sector
  - income group
  - time horizon
  - market condition
  worked_application_policy:
    minimum_per_major_objective: 1
    contrast_required_for_decisions: true
    coverage_dimensions:
    - initial change
    - mechanism
    - outcome
  pseudo_application_patterns:
  - Adding a business name to a definition without using any case facts.
analysis_model:
  chain_template:
  - initial change
  - economic mechanism
  - consequence for the specified agent
  rules:
  - State the direction of change and relevant conditions.
  - Do not count repeated or mirrored points as new analysis.
evaluation_model:
  judgement_template:
  - relevant case for
  - relevant case against
  - supported judgement with condition
  decision_dimensions:
  - distribution
  - time horizon
  - capacity
  - implementation
  - opportunity cost
  rules:
  - Use two sides for whether/always decisions, not every descriptive Discuss task.
  - Conclusion must add a supported condition or priority, not repeat an earlier claim.
