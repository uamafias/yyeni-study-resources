  performance_tasks:
  - item_type: data_response
    brief: 'Original 20-mark Paper 1 Section B-style case: (a) Describe 6, developing
      three relevant features; (b) Examine 7, tracing effects in this original case;
      (c) Suggest 7, selecting and justifying an appropriate course of action. Keep
      all parts within this topic. Include source data, complete model answers and
      exact content-specific mark guidance. AO split is an estimate of the task demands,
      not a quotation of an official grid.'
    ao_split:
      B: 6
      C: 14
  - item_type: short_answer
    brief: 'Original 16-mark knowledge mini-test: eight separate two-mark short responses
      on this topic. Vary definitions, distinctions and precise reasons; avoid repeating
      a member definition. Each part uses an observed 2-mark command. Give answers
      and content-specific mark allocation. This is a short practice set, not a whole
      paper.'
    ao_split:
      A: 16
  - item_type: case_analysis
    brief: 'Original 20-mark 6145 Paper 2 structured case: (a) Define 2; (b) Explain
      4; (c) Explain 7 using a diagram or a developed mechanism as appropriate; (d)
      Discuss 7 evaluating a genuine decision in this topic. Supply all data, an original
      invented Namibian case, full answers and task-specific marking. Where a narrow
      topic cannot support the decision without scope creep, report it before authoring.'
    ao_split:
      A: 6
      B: 7
      C: 7
  - item_type: essay_plan
    brief: 'An original 9-mark Evaluate decision plan: a relevant developed case for,
      a developed case against and a supported condition-based judgement. Use only
      this topic’s concepts and fresh context. Provide the complete plan and a content-specific
      rubric; this is an extended-response drill, not a full Paper 2 essay.'
    ao_split:
      C: 9
