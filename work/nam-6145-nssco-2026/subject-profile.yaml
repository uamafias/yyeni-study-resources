quantitative_model:
  required_components:
  - formula
  - substitution
  - checked result
  - unit or coefficient
  interpretation_rules:
  - Elasticity is not a percentage.
  - Use price-index deflation for exact real-income calculations; label approximations.
  - Convert persons and millions consistently.
legal_and_jurisdiction_model:
  core_rule: Use Namibia as the context; no unsupported current thresholds, statutory
    section numbers or universal legal-form claims.
  high_risk_topics:
