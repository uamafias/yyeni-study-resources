assessment_objectives:
- code: A
  name: Knowledge with understanding
  description: economic phenomena, facts, definitions, concepts principles and theories;
    economic vocabulary, terminology and conventions
  qualification_weight_percent: 39.0
- code: B
  name: Application and analysis
  description: use economic data, to recognise patterns in such data, and to deduce
    relationships; select, organise and interpret data; analyse economic knowledge
    and understanding in verbal, numerical, diagrammatic, pictorial and graphical
    form; recognise that economic theory is subject to various limitations and uncertainties
  qualification_weight_percent: 25.5
- code: C
  name: Evaluation and decision making
  description: distinguish between evidence and opinion, make reasoned judgements
    and communicate them in an accurate and logical manner; evaluate the social and
    environmental implications of particular courses of economic action; make decisions
    and suggest proposals based on novel data that will be provided
  qualification_weight_percent: 35.5
command_words:
- word: Analyse
  meaning: examine in detail to show meaning, identify elements and the relationship
    between them
- word: Calculate
  meaning: work out from given facts, figures or information
- word: Define
  meaning: give precise meaning
- word: Describe
  meaning: state the points of a topic / give characteristics and main features
- word: Discuss
  meaning: write about issue(s) or topic(s) in depth in a structured way
- word: Evaluate
  meaning: judge or calculate the quality, importance, amount, or value of something
- word: Explain
  meaning: set out purposes or reasons / make the relationships between things evident
    / provide why and/or how, and support with relevant evidence
- word: Give
  meaning: produce an answer from a given source or recall/memory
- word: Identify
  meaning: name/select/recognise
- word: Justify
  meaning: support a case with evidence/argument
- word: Outline
  meaning: set out main points
- word: State
  meaning: express in clear terms
- word: Suggest
  meaning: apply knowledge and understanding to situations where there are a range
    of valid responses in order to make proposals / put forward considerations
