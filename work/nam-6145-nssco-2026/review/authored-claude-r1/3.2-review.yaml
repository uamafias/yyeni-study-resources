  - 3.2 claim "A supply contraction with demand unchanged raises equilibrium price…"
  finding: A leftward shift of supply is called a "contraction" ("can contract bread
    supply", "contracted supply curve S2", "supply contracts left", "supply contraction").
    In the convention NSSCO inherits, contraction/extension mean movements ALONG a
    curve; a shift is an increase/decrease. The notes elsewhere carefully separate
    movements from shifts, so this word undermines their own distinction.
  evidence: 3.2-014-APP answer "…less is offered at each price and supply contracts
    left." Examiner material for this subject uses "decrease in supply" for a leftward
    shift and "shift S to S1".
  educational_consequence: Learners may write "contraction of supply" for a shift,
    or misread an exam question that uses "contraction" for a movement along the curve,
    and lose the shift/movement mark.
  recommended_repair: Replace with "decrease in supply (leftward shift)" in all listed
    blocks, items and the claim text. Optionally add one sentence in B-6145-3.2-002/003
    that extension/contraction describe movements along a curve. Revise and restamp
    the claim. The wording comes from the planning performance spec, but fixing the
    learner text needs no plan rebuild.
  confidence: 0.8
  status: open
