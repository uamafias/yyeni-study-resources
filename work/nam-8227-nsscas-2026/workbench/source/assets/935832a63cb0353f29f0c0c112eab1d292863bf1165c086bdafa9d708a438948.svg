<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (1, 0) and (4, -0.75). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="272.0197" x2="1100.0000" y2="272.0197"/>
<line x1="214.2373" y1="55.0000" x2="214.2373" y2="550.0000"/>
</g>
<line x1="95.0000" y1="230.5665" x2="1100.0000" y2="374.4335" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="28" fill="#111"><text x="1120" y="279.0197">x</text><text x="192.2373" y="39">ln y</text><text x="184.2373" y="314.0197">0</text>
<circle cx="384.5763" cy="272.0197" r="5" fill="#174777"/>
<text x="408.5763" y="220.0197">(1, 0)</text>
<circle cx="895.5932" cy="345.1724" r="5" fill="#174777"/>
<text x="693.5932" y="387.1724">(4, -0.75)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
</g></svg>
