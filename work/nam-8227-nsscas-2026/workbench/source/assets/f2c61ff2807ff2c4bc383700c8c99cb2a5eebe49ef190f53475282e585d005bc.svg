<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-label="Modulus graph with exact labelled vertex and intercepts"><title>Modulus graph with exact labelled vertex and intercepts</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="15" fill="#17212b"><text x="30.00" y="30.00" >Labelled modulus graph</text><line x1="155.00" y1="130.00" x2="405.00" y2="130.00" stroke="#17212b" stroke-width="1.5" /><line x1="205.00" y1="355.00" x2="205.00" y2="55.00" stroke="#17212b" stroke-width="1.5" /><text x="411.00" y="134.00" >x</text><text x="213.00" y="47.00" >y</text><defs><clipPath id="plot"><rect x="48" y="45" width="470" height="325"/></clipPath></defs><path d="M155.000,30.000 L280.000,280.000 L405.000,30.000" fill="none" stroke="#1565c0" stroke-width="3" clip-path="url(#plot)"/><text x="545.00" y="70.00" >Exact coordinates</text><text x="545.00" y="110.00" >V: (3, -6)</text><text x="545.00" y="154.00" >L: (0, 0)</text><text x="545.00" y="198.00" >R: (6, 0)</text><text x="545.00" y="242.00" >Y: (0, 0)</text><circle cx="280.000" cy="280.000" r="4.5" fill="#17212b"/><line x1="280.00" y1="280.00" x2="280.00" y2="292.50" stroke="#667085" stroke-width="1.5" /><text x="280.00" y="310.00" text-anchor="middle" data-point-label="true">V</text><circle cx="205.000" cy="130.000" r="4.5" fill="#17212b"/><line x1="205.00" y1="130.00" x2="194.88" y2="135.06" stroke="#667085" stroke-width="1.5" /><text x="174.59" y="150.21" text-anchor="middle" data-point-label="true">L/Y</text><circle cx="355.000" cy="130.000" r="4.5" fill="#17212b"/><line x1="355.00" y1="130.00" x2="360.74" y2="138.69" stroke="#667085" stroke-width="1.5" /><text x="368.77" y="155.86" text-anchor="middle" data-point-label="true">R</text><text x="30.00" y="414.00" >V is the vertex. L and R are x-intercepts. Y is the y-intercept.</text><text x="30.00" y="438.00" >Use the exact labelled coordinates; screen measurement is unnecessary.</text></g></svg>