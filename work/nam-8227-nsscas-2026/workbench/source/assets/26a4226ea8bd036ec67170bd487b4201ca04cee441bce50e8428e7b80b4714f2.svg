<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (3, 2) and (4, 1.75). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="413.4483" x2="1100.0000" y2="413.4483"/>
<line x1="214.2373" y1="55.0000" x2="214.2373" y2="550.0000"/>
</g>
<line x1="95.0000" y1="191.5517" x2="1100.0000" y2="303.4483" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="28" fill="#111"><text x="1120" y="420.4483">x</text><text x="192.2373" y="39">ln y</text><text x="184.2373" y="455.4483">0</text>
<circle cx="725.2542" cy="261.7241" r="5" fill="#174777"/>
<text x="749.2542" y="209.7241">(3, 2)</text>
<circle cx="895.5932" cy="280.6897" r="5" fill="#174777"/>
<text x="919.5932" y="228.6897">(4, 1.75)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
</g></svg>
