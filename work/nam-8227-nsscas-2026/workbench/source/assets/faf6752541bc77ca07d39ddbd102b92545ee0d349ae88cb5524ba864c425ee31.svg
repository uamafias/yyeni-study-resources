<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (3, 3) and (6, 4.5). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="447.5862" x2="1100.0000" y2="447.5862"/>
<line x1="184.0506" y1="55.0000" x2="184.0506" y2="550.0000"/>
</g>
<line x1="95.0000" y1="382.1552" x2="1100.0000" y2="157.4138" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="28" fill="#111"><text x="1120" y="454.5862">x</text><text x="162.0506" y="39">ln y</text><text x="154.0506" y="489.5862">0</text>
<circle cx="565.6962" cy="276.8966" r="5" fill="#174777"/>
<text x="589.6962" y="224.8966">(3, 3)</text>
<circle cx="947.3418" cy="191.5517" r="5" fill="#174777"/>
<text x="875.3418" y="139.5517">(6, 4.5)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
