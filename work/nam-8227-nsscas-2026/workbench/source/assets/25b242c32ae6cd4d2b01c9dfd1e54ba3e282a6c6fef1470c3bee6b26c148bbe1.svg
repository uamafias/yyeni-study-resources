<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (2, 1.75) and (3, 2). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="398.9831" x2="1100.0000" y2="398.9831"/>
<line x1="238.5714" y1="55.0000" x2="238.5714" y2="550.0000"/>
</g>
<line x1="95.0000" y1="308.7924" x2="1100.0000" y2="206.0169" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="28" fill="#111"><text x="1120" y="405.9831">x</text><text x="216.5714" y="39">ln y</text><text x="208.5714" y="440.9831">0</text>
<circle cx="648.7755" cy="252.1610" r="5" fill="#174777"/>
<text x="568.2755" y="200.1610">(2, 1.75)</text>
<circle cx="853.8776" cy="231.1864" r="5" fill="#174777"/>
<text x="877.8776" y="179.1864">(3, 2)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
</g></svg>
