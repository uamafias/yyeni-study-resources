<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (1, 1.5) and (2, 2). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="406.2903" x2="1100.0000" y2="406.2903"/>
<line x1="275.3846" y1="55.0000" x2="275.3846" y2="550.0000"/>
</g>
<line x1="95.0000" y1="354.3952" x2="1100.0000" y2="198.7097" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="28" fill="#111"><text x="1120" y="413.2903">x</text><text x="253.3846" y="39">ln y</text><text x="245.3846" y="448.2903">0</text>
<circle cx="533.0769" cy="286.5323" r="5" fill="#174777"/>
<text x="557.0769" y="234.5323">(1, 1.5)</text>
<circle cx="790.7692" cy="246.6129" r="5" fill="#174777"/>
<text x="814.7692" y="194.6129">(2, 2)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
</g></svg>
