<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (3, 4) and (6, 4.75). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="446.9942" x2="1100.0000" y2="446.9942"/>
<line x1="184.0506" y1="55.0000" x2="184.0506" y2="550.0000"/>
</g>
<line x1="95.0000" y1="271.0260" x2="1100.0000" y2="158.0058" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="28" fill="#111"><text x="1120" y="453.9942">x</text><text x="162.0506" y="39">ln y</text><text x="160.0506" y="475.9942">0</text>
<circle cx="565.6962" cy="218.0925" r="5" fill="#174777"/>
<text x="589.6962" y="166.0925">(3, 4)</text>
<circle cx="947.3418" cy="175.1734" r="5" fill="#174777"/>
<text x="762.3418" y="123.1734">(6, 4.75)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
