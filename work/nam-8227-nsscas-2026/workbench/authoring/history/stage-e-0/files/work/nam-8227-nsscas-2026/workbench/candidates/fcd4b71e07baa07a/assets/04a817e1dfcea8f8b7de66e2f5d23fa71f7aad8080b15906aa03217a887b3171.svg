<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (2, -1.75) and (4, -2.25). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="199.8780" x2="1100.0000" y2="199.8780"/>
<line x1="214.2373" y1="55.0000" x2="214.2373" y2="550.0000"/>
</g>
<line x1="95.0000" y1="286.4024" x2="1100.0000" y2="405.1220" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="28" fill="#111"><text x="1120" y="206.8780">x</text><text x="192.2373" y="39">ln y</text><text x="190.2373" y="228.8780">0</text>
<circle cx="554.9153" cy="340.7317" r="5" fill="#174777"/>
<text x="578.9153" y="288.7317">(2, -1.75)</text>
<circle cx="895.5932" cy="380.9756" r="5" fill="#174777"/>
<text x="693.5932" y="328.9756">(4, -2.25)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
</g></svg>
