<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (1, 3) and (2, 3.5). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="434.2857" x2="1100.0000" y2="434.2857"/>
<line x1="275.3846" y1="55.0000" x2="275.3846" y2="550.0000"/>
</g>
<line x1="95.0000" y1="296.0714" x2="1100.0000" y2="170.7143" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="28" fill="#111"><text x="1120" y="441.2857">x</text><text x="253.3846" y="39">ln y</text><text x="251.3846" y="463.2857">0</text>
<circle cx="533.0769" cy="241.4286" r="5" fill="#174777"/>
<text x="557.0769" y="189.4286">(1, 3)</text>
<circle cx="790.7692" cy="209.2857" r="5" fill="#174777"/>
<text x="814.7692" y="157.2857">(2, 3.5)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
</g></svg>
