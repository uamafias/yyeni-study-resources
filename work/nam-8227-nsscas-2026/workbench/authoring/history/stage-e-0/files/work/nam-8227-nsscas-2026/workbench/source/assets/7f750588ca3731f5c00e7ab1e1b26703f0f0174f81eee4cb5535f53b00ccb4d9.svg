<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (2, 3.25) and (4, 4.75). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="453.6757" x2="1100.0000" y2="453.6757"/>
<line x1="214.2373" y1="55.0000" x2="214.2373" y2="550.0000"/>
</g>
<line x1="95.0000" y1="388.1216" x2="1100.0000" y2="151.3243" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="28" fill="#111"><text x="1120" y="460.6757">x</text><text x="192.2373" y="39">ln y</text><text x="190.2373" y="482.6757">0</text>
<circle cx="554.9153" cy="279.7568" r="5" fill="#174777"/>
<text x="369.9153" y="227.7568">(2, 3.25)</text>
<circle cx="895.5932" cy="199.4865" r="5" fill="#174777"/>
<text x="710.5932" y="147.4865">(4, 4.75)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
</g></svg>
