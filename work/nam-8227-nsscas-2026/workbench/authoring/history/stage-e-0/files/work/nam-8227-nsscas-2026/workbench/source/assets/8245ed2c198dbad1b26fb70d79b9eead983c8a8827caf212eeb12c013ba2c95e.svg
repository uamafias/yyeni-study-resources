<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (2, 0.25) and (5, -0.5). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="308.3099" x2="1100.0000" y2="308.3099"/>
<line x1="196.9565" y1="55.0000" x2="196.9565" y2="550.0000"/>
</g>
<line x1="95.0000" y1="222.3239" x2="1100.0000" y2="382.6761" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="28" fill="#111"><text x="1120" y="315.3099">x</text><text x="174.9565" y="39">ln y</text><text x="172.9565" y="337.3099">0</text>
<circle cx="488.2609" cy="285.0704" r="5" fill="#174777"/>
<text x="512.2609" y="233.0704">(2, 0.25)</text>
<circle cx="925.2174" cy="354.7887" r="5" fill="#174777"/>
<text x="740.2174" y="396.7887">(5, -0.5)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
</g></svg>
