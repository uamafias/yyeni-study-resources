<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (3, -2) and (6, -2.75). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="188.9850" x2="1100.0000" y2="188.9850"/>
<line x1="184.0506" y1="55.0000" x2="184.0506" y2="550.0000"/>
</g>
<line x1="95.0000" y1="269.0038" x2="1100.0000" y2="416.0150" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="28" fill="#111"><text x="1120" y="195.9850">x</text><text x="162.0506" y="39">ln y</text><text x="160.0506" y="217.9850">0</text>
<circle cx="565.6962" cy="337.8571" r="5" fill="#174777"/>
<text x="589.6962" y="285.8571">(3, -2)</text>
<circle cx="947.3418" cy="393.6842" r="5" fill="#174777"/>
<text x="745.3418" y="341.6842">(6, -2.75)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
</g></svg>
