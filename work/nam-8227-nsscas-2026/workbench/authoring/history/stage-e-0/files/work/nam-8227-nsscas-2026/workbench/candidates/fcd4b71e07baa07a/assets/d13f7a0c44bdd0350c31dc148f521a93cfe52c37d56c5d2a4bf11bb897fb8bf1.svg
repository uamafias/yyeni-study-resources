<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-label="Modulus graph with exact labelled vertex and intercepts"><title>Modulus graph with exact labelled vertex and intercepts</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="15" fill="#17212b"><text x="30.00" y="30.00" >Labelled modulus graph</text><line x1="196.67" y1="280.00" x2="363.33" y2="280.00" stroke="#17212b" stroke-width="1.5" /><line x1="246.67" y1="355.00" x2="246.67" y2="55.00" stroke="#17212b" stroke-width="1.5" /><text x="369.33" y="284.00" >x</text><text x="254.67" y="47.00" >y</text><defs><clipPath id="plot"><rect x="48" y="45" width="470" height="325"/></clipPath></defs><path d="M196.667,380.000 L280.000,130.000 L363.333,380.000" fill="none" stroke="#1565c0" stroke-width="3" clip-path="url(#plot)"/><text x="545.00" y="70.00" >Exact coordinates</text><text x="545.00" y="110.00" >V: (2, 9)</text><text x="545.00" y="154.00" >L: (-1, 0)</text><text x="545.00" y="198.00" >R: (5, 0)</text><text x="545.00" y="242.00" >Y: (0, 3)</text><circle cx="280.000" cy="130.000" r="4.5" fill="#17212b"/><text x="288.00" y="117.00" text-anchor="start">V</text><circle cx="230.000" cy="280.000" r="4.5" fill="#17212b"/><text x="220.00" y="304.00" text-anchor="end">L</text><circle cx="330.000" cy="280.000" r="4.5" fill="#17212b"/><text x="338.00" y="304.00" text-anchor="start">R</text><circle cx="246.667" cy="230.000" r="4.5" fill="#17212b"/><text x="254.67" y="254.00" text-anchor="start">Y</text><text x="30.00" y="414.00" >V is the vertex. L and R are x-intercepts. Y is the y-intercept.</text><text x="30.00" y="438.00" >Use the exact labelled coordinates; screen measurement is unnecessary.</text></g></svg>