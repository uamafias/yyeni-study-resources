<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (3, 3) and (5, 4). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="441.3415" x2="1100.0000" y2="441.3415"/>
<line x1="196.9565" y1="55.0000" x2="196.9565" y2="550.0000"/>
</g>
<line x1="95.0000" y1="371.9207" x2="1100.0000" y2="163.6585" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="28" fill="#111"><text x="1120" y="448.3415">x</text><text x="174.9565" y="39">ln y</text><text x="172.9565" y="470.3415">0</text>
<circle cx="633.9130" cy="260.2439" r="5" fill="#174777"/>
<text x="657.9130" y="208.2439">(3, 3)</text>
<circle cx="925.2174" cy="199.8780" r="5" fill="#174777"/>
<text x="949.2174" y="147.8780">(5, 4)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
</g></svg>
