<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-label="Modulus graph with exact labelled vertex and intercepts"><title>Modulus graph with exact labelled vertex and intercepts</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="15" fill="#17212b"><text x="30.00" y="30.00" >Labelled modulus graph</text><line x1="80.00" y1="255.00" x2="480.00" y2="255.00" stroke="#17212b" stroke-width="1.5" /><line x1="380.00" y1="355.00" x2="380.00" y2="55.00" stroke="#17212b" stroke-width="1.5" /><text x="486.00" y="259.00" >x</text><text x="388.00" y="47.00" >y</text><defs><clipPath id="plot"><rect x="48" y="45" width="470" height="325"/></clipPath></defs><path d="M80.000,355.000 L280.000,155.000 L480.000,355.000" fill="none" stroke="#1565c0" stroke-width="3" clip-path="url(#plot)"/><text x="545.00" y="70.00" >Exact coordinates</text><text x="545.00" y="110.00" >V: (-2, 2)</text><text x="545.00" y="154.00" >L: (-4, 0)</text><text x="545.00" y="198.00" >R: (0, 0)</text><text x="545.00" y="242.00" >Y: (0, 0)</text><circle cx="280.000" cy="155.000" r="4.5" fill="#17212b"/><line x1="280.00" y1="155.00" x2="280.00" y2="142.50" stroke="#667085" stroke-width="1.5" /><text x="280.00" y="135.00" text-anchor="middle" data-point-label="true">V</text><circle cx="180.000" cy="255.000" r="4.5" fill="#17212b"/><line x1="180.00" y1="255.00" x2="171.24" y2="246.24" stroke="#667085" stroke-width="1.5" /><text x="162.32" y="242.32" text-anchor="middle" data-point-label="true">L</text><circle cx="380.000" cy="255.000" r="4.5" fill="#17212b"/><line x1="380.00" y1="255.00" x2="392.13" y2="242.87" stroke="#667085" stroke-width="1.5" /><text x="404.04" y="235.96" text-anchor="middle" data-point-label="true">R/Y</text><text x="30.00" y="414.00" >V is the vertex. L and R are x-intercepts. Y is the y-intercept.</text><text x="30.00" y="438.00" >Use the exact labelled coordinates; screen measurement is unnecessary.</text></g></svg>