<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-label="Modulus graph with exact labelled vertex and intercepts"><title>Modulus graph with exact labelled vertex and intercepts</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="15" fill="#17212b"><text x="30.00" y="30.00" >Labelled modulus graph</text><line x1="145.00" y1="265.00" x2="415.00" y2="265.00" stroke="#17212b" stroke-width="1.5" /><line x1="355.00" y1="355.00" x2="355.00" y2="55.00" stroke="#17212b" stroke-width="1.5" /><text x="421.00" y="269.00" >x</text><text x="363.00" y="47.00" >y</text><defs><clipPath id="plot"><rect x="48" y="45" width="470" height="325"/></clipPath></defs><path d="M145.000,385.000 L265.000,145.000 L415.000,445.000" fill="none" stroke="#1565c0" stroke-width="3" clip-path="url(#plot)"/><text x="545.00" y="70.00" >Exact coordinates</text><text x="545.00" y="110.00" >V: (-3, 4)</text><text x="545.00" y="154.00" >L: (-5, 0)</text><text x="545.00" y="198.00" >R: (-1, 0)</text><text x="545.00" y="242.00" >Y: (0, -2)</text><circle cx="265.000" cy="145.000" r="4.5" fill="#17212b"/><line x1="265.00" y1="145.00" x2="265.00" y2="132.50" stroke="#667085" stroke-width="1.5" /><text x="265.00" y="125.00" text-anchor="middle" data-point-label="true">V</text><circle cx="205.000" cy="265.000" r="4.5" fill="#17212b"/><line x1="205.00" y1="265.00" x2="199.26" y2="256.31" stroke="#667085" stroke-width="1.5" /><text x="191.23" y="249.14" text-anchor="middle" data-point-label="true">L</text><circle cx="325.000" cy="265.000" r="4.5" fill="#17212b"/><line x1="325.00" y1="265.00" x2="330.74" y2="256.31" stroke="#667085" stroke-width="1.5" /><text x="338.77" y="249.14" text-anchor="middle" data-point-label="true">R</text><circle cx="355.000" cy="325.000" r="4.5" fill="#17212b"/><line x1="355.00" y1="325.00" x2="368.07" y2="318.46" stroke="#667085" stroke-width="1.5" /><text x="377.36" y="318.82" text-anchor="middle" data-point-label="true">Y</text><text x="30.00" y="414.00" >V is the vertex. L and R are x-intercepts. Y is the y-intercept.</text><text x="30.00" y="438.00" >Use the exact labelled coordinates; screen measurement is unnecessary.</text></g></svg>