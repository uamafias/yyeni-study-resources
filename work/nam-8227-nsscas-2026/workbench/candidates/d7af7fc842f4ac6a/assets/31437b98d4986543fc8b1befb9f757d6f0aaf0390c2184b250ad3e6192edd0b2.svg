<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (1, 3.5) and (4, 5.75). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="463.0732" x2="1100.0000" y2="463.0732"/>
<line x1="214.2373" y1="55.0000" x2="214.2373" y2="550.0000"/>
</g>
<line x1="95.0000" y1="355.6220" x2="1100.0000" y2="141.9268" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="28" fill="#111"><text x="1120" y="470.0732">x</text><text x="192.2373" y="39">ln y</text><text x="184.2373" y="505.0732">0</text>
<circle cx="384.5763" cy="294.0488" r="5" fill="#174777"/>
<text x="408.5763" y="242.0488">(1, 3.5)</text>
<circle cx="895.5932" cy="185.3902" r="5" fill="#174777"/>
<text x="919.5932" y="133.3902">(4, 5.75)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
</g></svg>
