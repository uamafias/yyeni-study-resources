<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (1, -0.5) and (4, -2). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="217.4809" x2="1100.0000" y2="217.4809"/>
<line x1="214.2373" y1="55.0000" x2="214.2373" y2="550.0000"/>
</g>
<line x1="95.0000" y1="191.0305" x2="1100.0000" y2="413.9695" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="28" fill="#111"><text x="1120" y="224.4809">x</text><text x="192.2373" y="39">ln y</text><text x="184.2373" y="259.4809">0</text>
<circle cx="384.5763" cy="255.2672" r="5" fill="#174777"/>
<text x="408.5763" y="203.2672">(1, -0.5)</text>
<circle cx="895.5932" cy="368.6260" r="5" fill="#174777"/>
<text x="919.5932" y="316.6260">(4, -2)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
</g></svg>
