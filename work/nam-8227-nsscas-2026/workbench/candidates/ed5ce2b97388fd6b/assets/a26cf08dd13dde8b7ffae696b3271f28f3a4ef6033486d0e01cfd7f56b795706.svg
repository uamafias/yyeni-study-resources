<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (3, -2.5) and (6, -4.75). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="162.8346" x2="1100.0000" y2="162.8346"/>
<line x1="184.0506" y1="55.0000" x2="184.0506" y2="550.0000"/>
</g>
<line x1="95.0000" y1="148.5433" x2="1100.0000" y2="456.4567" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="28" fill="#111"><text x="1120" y="169.8346">x</text><text x="162.0506" y="39">ln y</text><text x="160.0506" y="191.8346">0</text>
<circle cx="565.6962" cy="292.7559" r="5" fill="#174777"/>
<text x="589.6962" y="240.7559">(3, -2.5)</text>
<circle cx="947.3418" cy="409.6850" r="5" fill="#174777"/>
<text x="745.3418" y="451.6850">(6, -4.75)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
</g></svg>
