<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (1, -1) and (2, -1.75). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="212.4138" x2="1100.0000" y2="212.4138"/>
<line x1="275.3846" y1="55.0000" x2="275.3846" y2="550.0000"/>
</g>
<line x1="95.0000" y1="191.5517" x2="1100.0000" y2="413.4483" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="28" fill="#111"><text x="1120" y="219.4138">x</text><text x="253.3846" y="39">ln y</text><text x="251.3846" y="241.4138">0</text>
<circle cx="533.0769" cy="288.2759" r="5" fill="#174777"/>
<text x="382.0769" y="330.2759">(1, -1)</text>
<circle cx="790.7692" cy="345.1724" r="5" fill="#174777"/>
<text x="814.7692" y="293.1724">(2, -1.75)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
</g></svg>
