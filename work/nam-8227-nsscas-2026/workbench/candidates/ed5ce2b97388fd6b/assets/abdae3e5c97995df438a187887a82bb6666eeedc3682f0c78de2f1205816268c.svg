<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (3, 4) and (6, 6.25). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="467.1163" x2="1100.0000" y2="467.1163"/>
<line x1="184.0506" y1="55.0000" x2="184.0506" y2="550.0000"/>
</g>
<line x1="95.0000" y1="410.7093" x2="1100.0000" y2="137.8837" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="28" fill="#111"><text x="1120" y="474.1163">x</text><text x="162.0506" y="39">ln y</text><text x="160.0506" y="496.1163">0</text>
<circle cx="565.6962" cy="282.9302" r="5" fill="#174777"/>
<text x="589.6962" y="230.9302">(3, 4)</text>
<circle cx="947.3418" cy="179.3256" r="5" fill="#174777"/>
<text x="762.3418" y="127.3256">(6, 6.25)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
