<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-label="Modulus graph with exact labelled vertex and intercepts"><title>Modulus graph with exact labelled vertex and intercepts</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="15" fill="#17212b"><text x="30.00" y="30.00" >Labelled modulus graph</text><line x1="80.00" y1="155.00" x2="480.00" y2="155.00" stroke="#17212b" stroke-width="1.5" /><line x1="380.00" y1="355.00" x2="380.00" y2="55.00" stroke="#17212b" stroke-width="1.5" /><text x="486.00" y="159.00" >x</text><text x="388.00" y="47.00" >y</text><defs><clipPath id="plot"><rect x="48" y="45" width="470" height="325"/></clipPath></defs><path d="M80.000,55.000 L280.000,255.000 L480.000,55.000" fill="none" stroke="#1565c0" stroke-width="3" clip-path="url(#plot)"/><text x="545.00" y="70.00" >Exact coordinates</text><text x="545.00" y="110.00" >V: (-2, -2)</text><text x="545.00" y="154.00" >L: (-4, 0)</text><text x="545.00" y="198.00" >R: (0, 0)</text><text x="545.00" y="242.00" >Y: (0, 0)</text><circle cx="280.000" cy="255.000" r="4.5" fill="#17212b"/><text x="270.00" y="277.00" text-anchor="end">V</text><circle cx="180.000" cy="155.000" r="4.5" fill="#17212b"/><text x="170.00" y="179.00" text-anchor="end">L</text><circle cx="380.000" cy="155.000" r="4.5" fill="#17212b"/><text x="388.00" y="179.00" text-anchor="start">R/Y</text><text x="30.00" y="414.00" >V is the vertex. L and R are x-intercepts. Y is the y-intercept.</text><text x="30.00" y="438.00" >Use the exact labelled coordinates; screen measurement is unnecessary.</text></g></svg>