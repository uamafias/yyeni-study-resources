<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (3, 1) and (6, 2.5). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="376.2583" x2="1100.0000" y2="376.2583"/>
<line x1="184.0506" y1="55.0000" x2="184.0506" y2="550.0000"/>
</g>
<line x1="95.0000" y1="431.9868" x2="1100.0000" y2="173.0132" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="28" fill="#111"><text x="1120" y="383.2583">x</text><text x="162.0506" y="39">ln y</text><text x="160.0506" y="405.2583">0</text>
<circle cx="565.6962" cy="310.6954" r="5" fill="#174777"/>
<text x="589.6962" y="258.6954">(3, 1)</text>
<circle cx="947.3418" cy="212.3510" r="5" fill="#174777"/>
<text x="779.3418" y="160.3510">(6, 2.5)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
</g></svg>
