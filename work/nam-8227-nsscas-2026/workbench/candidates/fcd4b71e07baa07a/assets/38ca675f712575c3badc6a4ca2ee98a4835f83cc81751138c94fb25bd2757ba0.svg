<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (3, 5) and (6, 6.5). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="466.7290" x2="1100.0000" y2="466.7290"/>
<line x1="184.0506" y1="55.0000" x2="184.0506" y2="550.0000"/>
</g>
<line x1="95.0000" y1="321.0047" x2="1100.0000" y2="138.2710" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="28" fill="#111"><text x="1120" y="473.7290">x</text><text x="162.0506" y="39">ln y</text><text x="160.0506" y="495.7290">0</text>
<circle cx="565.6962" cy="235.4206" r="5" fill="#174777"/>
<text x="589.6962" y="183.4206">(3, 5)</text>
<circle cx="947.3418" cy="166.0280" r="5" fill="#174777"/>
<text x="779.3418" y="114.0280">(6, 6.5)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
</g></svg>
