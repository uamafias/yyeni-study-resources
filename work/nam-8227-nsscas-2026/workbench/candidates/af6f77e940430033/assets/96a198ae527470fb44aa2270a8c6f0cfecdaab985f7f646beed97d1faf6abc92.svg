<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (2, 0.25) and (3, 0). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="334.5596" x2="1100.0000" y2="334.5596"/>
<line x1="238.5714" y1="55.0000" x2="238.5714" y2="550.0000"/>
</g>
<line x1="95.0000" y1="239.6632" x2="1100.0000" y2="365.3368" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="28" fill="#111"><text x="1120" y="341.5596">x</text><text x="216.5714" y="39">ln y</text><text x="208.5714" y="376.5596">0</text>
<circle cx="648.7755" cy="308.9119" r="5" fill="#174777"/>
<text x="672.7755" y="256.9119">(2, 0.25)</text>
<circle cx="853.8776" cy="334.5596" r="5" fill="#174777"/>
<text x="877.8776" y="282.5596">(3, 0)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
</g></svg>
