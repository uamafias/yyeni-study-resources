<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (1, 1) and (2, 1.25). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="376.9903" x2="1100.0000" y2="376.9903"/>
<line x1="275.3846" y1="55.0000" x2="275.3846" y2="550.0000"/>
</g>
<line x1="95.0000" y1="321.7233" x2="1100.0000" y2="228.0097" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="28" fill="#111"><text x="1120" y="383.9903">x</text><text x="253.3846" y="39">ln y</text><text x="245.3846" y="418.9903">0</text>
<circle cx="533.0769" cy="280.8738" r="5" fill="#174777"/>
<text x="557.0769" y="228.8738">(1, 1)</text>
<circle cx="790.7692" cy="256.8447" r="5" fill="#174777"/>
<text x="814.7692" y="204.8447">(2, 1.25)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
</g></svg>
