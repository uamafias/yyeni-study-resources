<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (3, 6) and (6, 8.25). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="480.1176" x2="1100.0000" y2="480.1176"/>
<line x1="184.0506" y1="55.0000" x2="184.0506" y2="550.0000"/>
</g>
<line x1="95.0000" y1="354.9118" x2="1100.0000" y2="124.8824" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="28" fill="#111"><text x="1120" y="487.1176">x</text><text x="162.0506" y="39">ln y</text><text x="154.0506" y="522.1176">0</text>
<circle cx="565.6962" cy="247.1765" r="5" fill="#174777"/>
<text x="589.6962" y="195.1765">(3, 6)</text>
<circle cx="947.3418" cy="159.8235" r="5" fill="#174777"/>
<text x="866.8418" y="107.8235">(6, 8.25)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
