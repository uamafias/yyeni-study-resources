<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (2, 4.5) and (4, 5.5). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="458.1443" x2="1100.0000" y2="458.1443"/>
<line x1="214.2373" y1="55.0000" x2="214.2373" y2="550.0000"/>
</g>
<line x1="95.0000" y1="297.3969" x2="1100.0000" y2="146.8557" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="28" fill="#111"><text x="1120" y="465.1443">x</text><text x="192.2373" y="39">ln y</text><text x="184.2373" y="500.1443">0</text>
<circle cx="554.9153" cy="228.5052" r="5" fill="#174777"/>
<text x="578.9153" y="176.5052">(2, 4.5)</text>
<circle cx="895.5932" cy="177.4742" r="5" fill="#174777"/>
<text x="919.5932" y="125.4742">(4, 5.5)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
</g></svg>
