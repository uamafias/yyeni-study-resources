<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (2, -1) and (5, -2.5). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="205.9574" x2="1100.0000" y2="205.9574"/>
<line x1="196.9565" y1="55.0000" x2="196.9565" y2="550.0000"/>
</g>
<line x1="95.0000" y1="181.3830" x2="1100.0000" y2="423.6170" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="28" fill="#111"><text x="1120" y="212.9574">x</text><text x="174.9565" y="39">ln y</text><text x="166.9565" y="247.9574">0</text>
<circle cx="488.2609" cy="276.1702" r="5" fill="#174777"/>
<text x="337.2609" y="318.1702">(2, -1)</text>
<circle cx="925.2174" cy="381.4894" r="5" fill="#174777"/>
<text x="844.7174" y="329.4894">(5, -2.5)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
</g></svg>
