<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (3, 3) and (5, 3.5). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="429.5946" x2="1100.0000" y2="429.5946"/>
<line x1="196.9565" y1="55.0000" x2="196.9565" y2="550.0000"/>
</g>
<line x1="95.0000" y1="290.7939" x2="1100.0000" y2="175.4054" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="28" fill="#111"><text x="1120" y="436.5946">x</text><text x="174.9565" y="39">ln y</text><text x="172.9565" y="458.5946">0</text>
<circle cx="633.9130" cy="228.9189" r="5" fill="#174777"/>
<text x="657.9130" y="176.9189">(3, 3)</text>
<circle cx="925.2174" cy="195.4730" r="5" fill="#174777"/>
<text x="949.2174" y="143.4730">(5, 3.5)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
</g></svg>
