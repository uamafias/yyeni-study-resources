<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-label="Modulus graph with exact labelled vertex and intercepts"><title>Modulus graph with exact labelled vertex and intercepts</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="15" fill="#17212b"><text x="30.00" y="30.00" >Labelled modulus graph</text><line x1="205.00" y1="180.00" x2="355.00" y2="180.00" stroke="#17212b" stroke-width="1.5" /><line x1="238.33" y1="355.00" x2="238.33" y2="55.00" stroke="#17212b" stroke-width="1.5" /><text x="361.00" y="184.00" >x</text><text x="246.33" y="47.00" >y</text><defs><clipPath id="plot"><rect x="48" y="45" width="470" height="325"/></clipPath></defs><path d="M205.000,30.000 L288.333,280.000 L355.000,80.000" fill="none" stroke="#1565c0" stroke-width="3" clip-path="url(#plot)"/><text x="545.00" y="70.00" >Exact coordinates</text><text x="545.00" y="110.00" >V: (3, -6)</text><text x="545.00" y="154.00" >L: (1, 0)</text><text x="545.00" y="198.00" >R: (5, 0)</text><text x="545.00" y="242.00" >Y: (0, 3)</text><circle cx="288.333" cy="280.000" r="4.5" fill="#17212b"/><text x="296.33" y="302.00" text-anchor="start">V</text><circle cx="255.000" cy="180.000" r="4.5" fill="#17212b"/><text x="263.00" y="204.00" text-anchor="start">L</text><circle cx="321.667" cy="180.000" r="4.5" fill="#17212b"/><text x="329.67" y="204.00" text-anchor="start">R</text><circle cx="238.333" cy="130.000" r="4.5" fill="#17212b"/><text x="246.33" y="154.00" text-anchor="start">Y</text><text x="30.00" y="414.00" >V is the vertex. L and R are x-intercepts. Y is the y-intercept.</text><text x="30.00" y="438.00" >Use the exact labelled coordinates; screen measurement is unnecessary.</text></g></svg>