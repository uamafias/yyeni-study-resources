<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-label="Modulus graph with exact labelled vertex and intercepts"><title>Modulus graph with exact labelled vertex and intercepts</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="15" fill="#17212b"><text x="30.00" y="30.00" >Labelled modulus graph</text><line x1="87.14" y1="183.57" x2="472.86" y2="183.57" stroke="#17212b" stroke-width="1.5" /><line x1="172.86" y1="355.00" x2="172.86" y2="55.00" stroke="#17212b" stroke-width="1.5" /><text x="478.86" y="187.57" >x</text><text x="180.86" y="47.00" >y</text><defs><clipPath id="plot"><rect x="48" y="45" width="470" height="325"/></clipPath></defs><path d="M87.143,55.000 L301.429,269.286 L472.857,97.857" fill="none" stroke="#1565c0" stroke-width="3" clip-path="url(#plot)"/><text x="545.00" y="70.00" >Exact coordinates</text><text x="545.00" y="110.00" >V: (3, -2)</text><text x="545.00" y="154.00" >L: (1, 0)</text><text x="545.00" y="198.00" >R: (5, 0)</text><text x="545.00" y="242.00" >Y: (0, 1)</text><circle cx="301.429" cy="269.286" r="4.5" fill="#17212b"/><text x="309.43" y="291.29" text-anchor="start">V</text><circle cx="215.714" cy="183.571" r="4.5" fill="#17212b"/><text x="223.71" y="207.57" text-anchor="start">L</text><circle cx="387.143" cy="183.571" r="4.5" fill="#17212b"/><text x="395.14" y="207.57" text-anchor="start">R</text><circle cx="172.857" cy="140.714" r="4.5" fill="#17212b"/><text x="180.86" y="164.71" text-anchor="start">Y</text><text x="30.00" y="414.00" >V is the vertex. L and R are x-intercepts. Y is the y-intercept.</text><text x="30.00" y="438.00" >Use the exact labelled coordinates; screen measurement is unnecessary.</text></g></svg>