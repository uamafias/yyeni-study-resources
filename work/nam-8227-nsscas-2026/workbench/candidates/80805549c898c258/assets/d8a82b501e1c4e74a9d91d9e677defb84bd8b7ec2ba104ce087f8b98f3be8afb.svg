<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (2, 2.75) and (3, 3.5). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="438.6250" x2="1100.0000" y2="438.6250"/>
<line x1="238.5714" y1="55.0000" x2="238.5714" y2="550.0000"/>
</g>
<line x1="95.0000" y1="393.7656" x2="1100.0000" y2="166.3750" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="20" fill="#111"><text x="1120" y="445.6250">x</text><text x="216.5714" y="39">ln y</text><text x="218.5714" y="462.6250">0</text>
<circle cx="648.7755" cy="268.4688" r="5" fill="#174777"/>
<text x="672.7755" y="216.4688">(2, 2.75)</text>
<circle cx="853.8776" cy="222.0625" r="5" fill="#174777"/>
<text x="877.8776" y="170.0625">(3, 3.5)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
</g></svg>
