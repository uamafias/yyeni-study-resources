<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (3, 4) and (6, 5.5). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="458.1443" x2="1100.0000" y2="458.1443"/>
<line x1="184.0506" y1="55.0000" x2="184.0506" y2="550.0000"/>
</g>
<line x1="95.0000" y1="348.4278" x2="1100.0000" y2="146.8557" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="20" fill="#111"><text x="1120" y="465.1443">x</text><text x="162.0506" y="39">ln y</text><text x="164.0506" y="482.1443">0</text>
<circle cx="565.6962" cy="254.0206" r="5" fill="#174777"/>
<text x="589.6962" y="202.0206">(3, 4)</text>
<circle cx="947.3418" cy="177.4742" r="5" fill="#174777"/>
<text x="971.3418" y="125.4742">(6, 5.5)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
</g></svg>
