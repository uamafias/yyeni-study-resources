<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (3, 2.5) and (6, 4). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="441.3415" x2="1100.0000" y2="441.3415"/>
<line x1="184.0506" y1="55.0000" x2="184.0506" y2="550.0000"/>
</g>
<line x1="95.0000" y1="402.1037" x2="1100.0000" y2="163.6585" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="20" fill="#111"><text x="1120" y="448.3415">x</text><text x="162.0506" y="39">ln y</text><text x="164.0506" y="465.3415">0</text>
<circle cx="565.6962" cy="290.4268" r="5" fill="#174777"/>
<text x="589.6962" y="238.4268">(3, 2.5)</text>
<circle cx="947.3418" cy="199.8780" r="5" fill="#174777"/>
<text x="971.3418" y="147.8780">(6, 4)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
</g></svg>
