<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (3, 0) and (6, 0.75). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="308.0493" x2="1100.0000" y2="308.0493"/>
<line x1="184.0506" y1="55.0000" x2="184.0506" y2="550.0000"/>
</g>
<line x1="95.0000" y1="390.1794" x2="1100.0000" y2="214.8206" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="20" fill="#111"><text x="1120" y="315.0493">x</text><text x="162.0506" y="39">ln y</text><text x="164.0506" y="332.0493">0</text>
<circle cx="565.6962" cy="308.0493" r="5" fill="#174777"/>
<text x="589.6962" y="256.0493">(3, 0)</text>
<circle cx="947.3418" cy="241.4574" r="5" fill="#174777"/>
<text x="971.3418" y="189.4574">(6, 0.75)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
