<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (3, -2) and (5, -2.5). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="194.2188" x2="1100.0000" y2="194.2188"/>
<line x1="196.9565" y1="55.0000" x2="196.9565" y2="550.0000"/>
</g>
<line x1="95.0000" y1="277.3633" x2="1100.0000" y2="410.7812" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="20" fill="#111"><text x="1120" y="201.2188">x</text><text x="174.9565" y="39">ln y</text><text x="176.9565" y="218.2188">0</text>
<circle cx="633.9130" cy="348.9062" r="5" fill="#174777"/>
<text x="657.9130" y="296.9062">(3, -2)</text>
<circle cx="925.2174" cy="387.5781" r="5" fill="#174777"/>
<text x="949.2174" y="335.5781">(5, -2.5)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
</g></svg>
