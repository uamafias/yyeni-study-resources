<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Straight-line graph of ln y against x</title>
<desc id="desc">Horizontal axis x; vertical axis ln y. Exact coordinates (1, 0) and (3, 1). The labelled points are on one straight line. Schematic; use labels, not measurements.</desc>
<rect width="1200" height="640" fill="white"/>
<g stroke="#202020" stroke-width="2" fill="none">
<line x1="95.0000" y1="333.1818" x2="1100.0000" y2="333.1818"/>
<line x1="238.5714" y1="55.0000" x2="238.5714" y2="550.0000"/>
</g>
<line x1="95.0000" y1="402.7273" x2="1100.0000" y2="202.2727" stroke="#174777" stroke-width="3"/>
<g font-family="Arial, sans-serif" font-size="20" fill="#111"><text x="1120" y="340.1818">x</text><text x="216.5714" y="39">ln y</text><text x="218.5714" y="357.1818">0</text>
<circle cx="443.6735" cy="333.1818" r="5" fill="#174777"/>
<text x="467.6735" y="281.1818">(1, 0)</text>
<circle cx="853.8776" cy="251.3636" r="5" fill="#174777"/>
<text x="877.8776" y="199.3636">(3, 1)</text>
<text x="95" y="605" font-size="18">Schematic graph. Use the exact labelled coordinates, not measurements.</text>
</g></svg>
