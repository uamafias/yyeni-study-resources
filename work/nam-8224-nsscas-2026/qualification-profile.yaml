assessment_objectives:
- code: A
  name: Knowledge with understanding
  definition: scientific phenomena, facts, laws, definitions, concepts and theories; scientific vocabulary, terminology
    and conventions, (including symbols, quantities, units); scientific instruments and apparatus, including techniques
    of operation and aspects of safety; scientific quantities and their determination; scientific and technological
    applications with their social, economic and environmental implications; reasoned explanations of phenomena,
    patterns and relationships
  qualification_weight_percent: 40
  provenance: syllabus page 30
- code: B
  name: Handling information, application and solving problems
  definition: locate, select, organise and present information from a variety of sources; handle information, distinguishing
    the relevant from the extraneous; manipulate numerical and other data and translate information from one form
    to another; analyse and evaluate information so as to identify patterns, report trends and draw inferences;
    construct arguments to support hypotheses or to justify a course of action; evaluate information and hypotheses;
    apply knowledge, including principles, to new situations
  qualification_weight_percent: 40
  provenance: syllabus page 30
- code: C
  name: Practical (experimental and investigative) skills and abilities
  definition: plan experiments and investigations; collect, record and present observations, measurements and estimates;
    analyse and interpret data to reach conclusions; evaluate methods and quality of data to reach conclusions
  qualification_weight_percent: 20
  provenance: syllabus page 30
