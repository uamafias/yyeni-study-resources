<title id="title">Ammonium ion: tetrahedral, NH4+</title><desc id="desc">Central N has four N–H bonds, no lone pair and tetrahedral geometry. Two lines lie in the page, a solid wedge points towards the viewer and a hashed bond away. Brackets show total positive charge. Schematic projection, angles about 109.5 degrees.</desc>
