<svg xmlns="http://www.w3.org/2000/svg" width="840" height="460" viewBox="0 0 840 460" role="img" aria-labelledby="title desc">
<title id="title">Cis and trans but-2-ene</title><desc id="desc">Each double-bond carbon has H and CH3. Left cis has both methyl groups above; right trans has the right methyl below.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="26" y="26" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" fill="#172b3a">Cis and trans but-2-ene</text>
<text x="45" y="80" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="22" fill="#172b3a">cis-but-2-ene</text>
<text x="130" y="215" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">C</text>
<text x="270" y="215" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">C</text>
<polyline points="163,230 260,230" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="163,242 260,242" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="140,209 85,150" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="140,260 85,315" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="60" y="110" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="24" fill="#172b3a">CH3</text>
<text x="60" y="335" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="24" fill="#172b3a">H</text>
<polyline points="280,209 335,150" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="280,260 335,315" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="310" y="110" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="24" fill="#172b3a">CH3</text>
<text x="310" y="335" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="24" fill="#172b3a">H</text>
<text x="465" y="80" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="22" fill="#172b3a">trans-but-2-ene</text>
<text x="550" y="215" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">C</text>
<text x="690" y="215" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">C</text>
<polyline points="583,230 680,230" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="583,242 680,242" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="560,209 505,150" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="560,260 505,315" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="480" y="110" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="24" fill="#172b3a">CH3</text>
<text x="480" y="335" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="24" fill="#172b3a">H</text>
<polyline points="700,209 755,150" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="700,260 755,315" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
