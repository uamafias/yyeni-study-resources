<svg xmlns="http://www.w3.org/2000/svg" width="840" height="460" viewBox="0 0 840 460" role="img" aria-labelledby="title desc">
<title id="title">Displayed ethanol</title><desc id="desc">Carbon-carbon-oxygen-hydrogen chain. First carbon has three hydrogen attachments, second has two; oxygen has C-O and O-H single bonds.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="26" y="26" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" fill="#172b3a">Displayed ethanol</text>
<text x="230" y="220" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="31" fill="#172b3a">C</text>
<text x="230" y="100" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">H</text>
<text x="230" y="340" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">H</text>
<polyline points="240,145 240,208" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="240,263 240,330" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="410" y="220" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="31" fill="#172b3a">C</text>
<text x="410" y="100" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">H</text>
<text x="410" y="340" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">H</text>
<polyline points="420,145 420,208" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="420,263 420,330" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="110" y="220" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">H</text>
<text x="580" y="220" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="31" fill="#172b3a">O</text>
<text x="720" y="220" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">H</text>
<polyline points="145,240 220,240" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="270,240 400,240" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="450,240 570,240" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="620,240 710,240" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="40" y="420" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="21" fill="#172b3a">CH3CH2OH; the O–H hydrogen is included in C2H6O.</text>
</svg>
