<svg xmlns="http://www.w3.org/2000/svg" width="840" height="460" viewBox="0 0 840 460" role="img" aria-labelledby="title desc">
<title id="title">PVC repeat unit</title><desc id="desc">Two backbone carbons joined by a single bond; each connects externally through brackets. First carbon bears two hydrogens, second bears hydrogen and chlorine. Subscript n outside right bracket.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="26" y="26" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" fill="#172b3a">PVC repeat unit</text>
<text x="300" y="215" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="32" fill="#172b3a">C</text>
<text x="490" y="215" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="32" fill="#172b3a">C</text>
<polyline points="334,235 480,235" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="160,235 290,235" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="525,235 655,235" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="301" y="110" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="27" fill="#172b3a">H</text>
<polyline points="315,155 315,207" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="315,257 315,315" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="491" y="110" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="27" fill="#172b3a">H</text>
<polyline points="505,155 505,207" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="505,257 505,315" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="300" y="330" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="27" fill="#172b3a">H</text>
<text x="485" y="330" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="27" fill="#172b3a">Cl</text>
<polyline points="250,85 225,85 225,385 250,385" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="565,85 590,85 590,385 565,385" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="603" y="365" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="24" fill="#172b3a">n</text>
<text x="50" y="420" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="19" fill="#172b3a">External bonds cross brackets; C=C has become C–C.</text>
