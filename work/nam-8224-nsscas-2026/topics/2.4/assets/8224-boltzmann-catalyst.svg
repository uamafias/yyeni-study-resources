<title id="title">Boltzmann distribution: effect of a catalyst</title><desc id="desc">One normalized energy distribution at fixed relative temperature 2.5. The catalysed threshold is at energy 4 and uncatalysed at 7. The extra region between thresholds represents additional particles energetic enough for the lower-barrier route.</desc>
