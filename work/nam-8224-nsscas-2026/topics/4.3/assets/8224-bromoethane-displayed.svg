<svg xmlns="http://www.w3.org/2000/svg" width="840" height="460" viewBox="0 0 840 460" role="img" aria-labelledby="title desc">
<title id="title">Displayed bromoethane</title><desc id="desc">Two single-bonded carbons; first bears three hydrogens, second two hydrogens and bromine.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="26" y="26" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" fill="#172b3a">Displayed bromoethane</text>
<text x="280" y="215" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="32" fill="#172b3a">C</text>
<text x="280" y="95" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">H</text>
<text x="280" y="340" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">H</text>
<polyline points="290,140 290,205" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="290,260 290,330" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="470" y="215" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="32" fill="#172b3a">C</text>
<text x="470" y="95" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">H</text>
<text x="470" y="340" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">H</text>
<polyline points="480,140 480,205" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="480,260 480,330" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="150" y="215" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">H</text>
<text x="620" y="215" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">Br</text>
<polyline points="190,235 270,235" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="320,235 460,235" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="510,235 605,235" fill="none" stroke="#24475c" stroke-width="3" stroke-linejoin="round"/>
<text x="45" y="420" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="20" fill="#172b3a">CH3CH2Br: C2H5Br; carbon has four single bonds.</text>
</svg>
