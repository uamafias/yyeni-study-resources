<svg xmlns="http://www.w3.org/2000/svg" width="840" height="460" viewBox="0 0 840 460" role="img" aria-labelledby="title desc">
<title id="title">Reaction pathway: an exothermic example</title><desc id="desc">Relative enthalpy axis in kJ per mole; reactants at 0, maximum at 80, products at −40. Forward activation energy 80 and reaction enthalpy −40. Horizontal axis is progress, not time.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="26" y="26" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" fill="#172b3a">Reaction pathway: an exothermic example</text>
