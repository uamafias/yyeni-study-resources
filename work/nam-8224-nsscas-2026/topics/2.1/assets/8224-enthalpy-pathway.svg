<text x="558" y="269" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="20" fill="#a13922">ΔH = −40</text>
<text x="28" y="425" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="17" fill="#172b3a">Relative levels, not absolute stored energies. Original illustrative data.</text>
