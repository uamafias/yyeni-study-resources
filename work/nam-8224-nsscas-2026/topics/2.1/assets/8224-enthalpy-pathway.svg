<text x="25" y="55" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="18" fill="#172b3a">Enthalpy / kJ/mol</text>
<text x="527" y="389" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="18" fill="#172b3a">Progress of reaction</text>
<polyline points="110,255.0 230,255.0 260,237.5 290,193.75 330,143.0 370,115.0 400,120.25 440,158.75 480,228.75 520,290.0 555,325.0 730,325.0" fill="none" stroke="#24475c" stroke-width="4" stroke-linejoin="round"/>
<text x="120" y="270" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="18" fill="#172b3a">Reactants: 0</text>
<text x="562" y="334" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="18" fill="#172b3a">Products: −40</text>
<text x="335" y="75" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="18" fill="#172b3a">Maximum: +80</text>
<polyline points="250,255.0 250,115.0" fill="none" stroke="#176e9a" stroke-width="2" stroke-linejoin="round"/>
