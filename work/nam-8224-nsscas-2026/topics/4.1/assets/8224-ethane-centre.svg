<svg xmlns="http://www.w3.org/2000/svg" width="840" height="460" viewBox="0 0 840 460" role="img" aria-labelledby="title desc">
<title id="title">Carbon with four single-bond regions</title><desc id="desc">A carbon centre with four single bonds in a tetrahedral arrangement. Two in-plane bonds, one solid wedge towards and one hashed away. Approximate angles 109.5 degrees. R is a single-bonded group.</desc>
