<polyline points="465.90909090909093,291.95454545454544 474.09090909090907,286.2272727272727" fill="none" stroke="#24475c" stroke-width="2" stroke-linejoin="round"/>
<polyline points="475.09090909090907,304.3454545454545 484.90909090909093,297.47272727272724" fill="none" stroke="#24475c" stroke-width="2" stroke-linejoin="round"/>
