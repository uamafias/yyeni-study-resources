<title id="title">Bond fission: electron arrows</title><desc id="desc">Upper row shows homolysis of a Cl–Cl bond with two single-electron fishhook arrows, one to each Cl. Lower row shows heterolysis of C–Br with a full-headed pair arrow from the bond to Br, yielding a positive carbon fragment and bromide. Schematic fission, not a claim of reaction conditions.</desc>
