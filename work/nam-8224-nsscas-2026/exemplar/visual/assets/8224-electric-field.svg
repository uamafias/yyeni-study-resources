<title id="title">Charged particles between electric plates</title><desc id="desc">Particles enter to the right. Positive upper plate and negative lower plate: electron bends upwards more strongly, proton downwards less strongly at equal entry speeds, neutron continues straight. Schematic; deflections are not to scale.</desc>
