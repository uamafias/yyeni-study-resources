conditioned_mechanisms:
- mechanism_id: CM-8224-EQUILIBRIUM
  name: Equilibrium response
  rationale: A predicted shift depends on the stated change and reaction conditions.
  asserted_when:
  - equilibrium
  - Le Chatelier
  required_conditions:
  - name: the imposed change is stated
    any_of:
    - temperature
    - pressure
    - concentration
- mechanism_id: CM-8224-GAS-VOLUME
  name: Molar gas volume
  rationale: 22.4 and 24.0 dm3 mol-1 apply under different conditions.
  asserted_when:
  - molar gas volume
  - dm3 mol-1
  required_conditions:
  - name: conditions are named
    any_of:
    - s.t.p.
    - r.t.p.
    - 273 K
    - 298 K
prohibited_patterns:
- Do not teach beyond the explicit syllabus scope limits in curriculum/scope-scan.json.
- Do not reproduce question-paper, examiner-report or future marking-scheme wording.
- Do not present a practical observation as remembered recall when Paper 3 supplies qualitative-analysis notes and tests observation,
  recording and conclusion.
glossary_homonyms:
- term: relative atomic mass
  senses:
  - The weighted mean mass of an atom of an element relative to one twelfth of the mass of a carbon-12 atom.
  rule: Not the mass number of one isotope.
- term: mole
  senses:
  - The amount of substance containing the Avogadro constant number of specified particles.
  rule: Always state which particles are counted.
- term: empirical formula
  senses:
  - The simplest whole-number ratio of atoms of each element in a compound.
  rule: Not necessarily the molecular formula.
- term: molecular formula
  senses:
  - The actual number of atoms of each element in one molecule.
  rule: It is a whole-number multiple of the empirical formula for a molecular substance.
- term: oxidation number
  senses:
  - The charge assigned to an atom by the agreed electron-accounting rules.
  rule: Not necessarily an actual ionic charge.
- term: standard enthalpy change
  senses:
  - The enthalpy change when reactants and products are in their standard states under standard conditions.
  rule: The named process—formation, combustion or neutralisation—must also be stated.
- term: activation energy
  senses:
  - The minimum energy that colliding particles must have for a reaction to occur.
  rule: On a Boltzmann graph it is a position on the energy axis, not an area.
- term: dynamic equilibrium
  senses:
  - A closed-system state in which forward and reverse reactions continue at equal rates, so concentrations remain constant.
  rule: Equal rates do not mean equal concentrations.
- term: catalyst
  senses:
  - A substance that increases reaction rate by providing an alternative pathway of lower activation energy and is regenerated
    overall.
  rule: It does not change the equilibrium position.
- term: electrophile
  senses:
  - An electron-pair acceptor.
  rule: Usually electron-deficient; do not define it only as a positive ion.
- term: nucleophile
  senses:
  - An electron-pair donor.
  rule: Its lone pair or negative charge is the reactive feature.
- term: free radical
  senses:
  - A species containing an unpaired electron.
  rule: The dot represents the unpaired electron.
- term: homologous series
  senses:
  - A family of organic compounds with the same functional group and general formula, similar chemical properties and a gradual
    change in physical properties.
  rule: Successive members differ by CH2.
- term: structural isomer
  senses:
  - A compound with the same molecular formula as another compound but a different structural formula.
  rule: Different connectivity, not merely a different drawing.
- term: stereoisomer
  senses:
  - A compound with the same structural formula as another but a different arrangement of atoms in space.
  rule: Includes cis-trans and optical isomerism in this syllabus.
- term: concordant titres
  senses:
  - Titre values that agree within 0.10 cm3 for this syllabus.
  rule: The rough titre is not used in the mean.
- term: random error
  senses:
  - Unpredictable variation that causes repeated readings to scatter.
  rule: Repeating and averaging can reduce its effect.
- term: systematic error
  senses:
  - An error that shifts readings consistently in one direction.
  rule: Repeating does not remove it.
- term: precision
  senses:
  - The closeness of repeated measurements to one another and the resolution with which readings are recorded.
  rule: Not the same as accuracy.
- term: accuracy
  senses:
  - The closeness of a measured or calculated value to the accepted value.
  rule: A precise set of readings may still be inaccurate.
