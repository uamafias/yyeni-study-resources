  tariff_overrides:
    DEF:Define: 1
    DEF:State: 1
    FEATURE:State: 1
    DIST:Explain: 2
    PROC:Describe: 1
    PROC:Derive: 4
    MECH:Explain: 2
    CALC:Calculate: 2
    INTERP:Draw: 2
    INTERP:Explain: 2
    MISCON:Explain: 2
    SYNTH:Explain: 2
  tariff_override_reasons:
    DEF:Define: One precise core meaning; longer conditioned definitions are taught fully in notes and structured
      tasks, not misrepresented as universal one-point official definitions.
    PROC:Describe: One clearly requested operational action; full methods are practised in the integrated eight-mark
      plan.
    INTERP:Draw: Two explicitly named graphical/diagram features; full multi-ray construction is a structured
      task with its own entered source architecture.
  ao_by_objective_type:
    '*':
      DEF:
      - A
      FEATURE:
      - A
      DIST:
      - A
      PROC:
      - A
      MECH:
      - A
      CALC:
      - B
      INTERP:
      - B
      MISCON:
      - A
      SYNTH:
      - A
      - B
    phys_derivation:
      PROC:
      - B
  ao_by_paper:
    '3':
      A: C
      B: C
  misconception_slots: one_per_entry
  top_up: []
  performance_tasks:
  - item_type: multiple_choice_set
    papers:
    - '1'
    brief: Create {n} original four-option, one-mark MC questions for this topic. State each key and explain
      every distractor. Include both knowledge and application; the A/B split is a practice-design estimate,
      not an official code for individual items.
  - item_type: short_answer
    papers:
    - '2'
    brief: 'An original eight-mark structured task: two one-mark knowledge parts, one two-mark definition/explanation
      and two two-mark applications or calculations. Use checked task architecture and topic-appropriate verbs;
      replace the structure if the topic is non-numerical and record the reason.'
    ao_split:
      A: 4
      B: 4
  - item_type: practical_task
    papers:
    - '3'
    brief: 'An original 16-mark practical task in an in-scope physical context: construct a graph (5), derive
      and interpret its gradient (3), then plan an investigation (8). Provide realistic invented data with
      units, a complete operational method, controls, a results table and a data-based conclusion. Use the
      task-specific source anchors; do not label a reciprocal gradient as density or stiffness. This practices
      components, not a fixed complete Paper 3 question.'
    ao_split:
      C: 16
