assessment_objectives:
- code: A
  name: Knowledge with understanding
  definition: scientific phenomena, facts, laws, definitions, concepts and theories; scientific vocabulary,
    terminology and conventions, (including symbols, quantities, units) scientific instruments and apparatus,
    including techniques of operation and aspects of safety scientific quantities and their determination scientific
    and technological applications with their social, economic and environmental implications
  qualification_weight_percent: 47
  provenance: syllabus PDF 40–42; approximate raw specification grid, not final weighted-grade proportions
- code: B
  name: Handling information, application and solving problems
  definition: locate, select, organise and present information from a variety of sources; translate information
    from one form to another manipulate numerical and other data use information to identify patterns, report
    trends and draw inferences present reasoned explanations for phenomena, patterns and relationships make
    predictions and hypotheses solve quantitative and qualitative problems as they relate to everyday life
  qualification_weight_percent: 28
  provenance: syllabus PDF 40–42; approximate raw specification grid, not final weighted-grade proportions
- code: C
  name: Practical (experimental and investigative) skills and abilities
  definition: demonstrate knowledge of how to safely use techniques, apparatus and materials (including following
    a sequence of instructions where appropriate) plan experiments and investigations make and record observations,
    measurements and estimates interpret and evaluate experimental observations and data, including dealing
    with anomalous or inconsistent results evaluate methods and suggest possible improvements
  qualification_weight_percent: 25
  provenance: syllabus PDF 40–42; approximate raw specification grid, not final weighted-grade proportions
