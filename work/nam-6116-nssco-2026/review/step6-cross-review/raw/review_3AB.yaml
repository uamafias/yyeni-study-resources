- issue_id: "3AB-006"
  severity: low
  category: accuracy
  affected_ids: ["3.5 / Enzymes in germination"]
  finding: '"Warmth and water switch the enzymes on" is loose. Water uptake triggers enzyme activity and production. Warmth only affects the rate, and germination also needs oxygen. The sentence presents temperature as an on/off switch, which contradicts the unit''s own teaching that low temperature only slows enzymes.'
  evidence: '3.5 "Enzymes in germination": "Warmth and water switch the enzymes on, which is why a dry seed can be stored for years."'
  educational_consequence: "Learners may write that a cold seed's enzymes are \"off\", or leave oxygen out of the germination conditions taught in 4.3.5."
  recommended_repair: 'Say: "Water taken up by the seed activates its enzymes; a suitable temperature lets them work at a useful rate. A dry seed''s enzymes are inactive, which is why it can be stored for years."'
  confidence: 0.6
  status: open
