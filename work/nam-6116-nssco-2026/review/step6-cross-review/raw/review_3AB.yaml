- issue_id: "3AB-001"
  severity: high
  category: analysis
  affected_ids: [ITEM-6116-3-258-APP]
  finding: "The second marking point and the canonical answer justify \"light was not limiting at the plateau\" with an invalid reason. Light intensity being the same for both curves does not show that light was not limiting. What shows it is that the first curve is flat there, so more light gave no rise in rate. What shows carbon dioxide was limiting is that raising carbon dioxide alone raised the rate. The mark scheme credits a non-sequitur as the reason."
  evidence: 'ITEM-6116-3-258-APP marking_guidance[1]: "carbon dioxide was therefore the limiting factor at the plateau of the first curve, because the light intensity was the same here and so was not limiting." canonical_answer: "...so light intensity was not the limit there."'
  educational_consequence: "Learners learn that a factor held equal between two treatments is \"not limiting\". That is the reasoning the notes warn against in \"Identify the active limit\", where a flat curve alone does not identify the limit."
  recommended_repair: 'Rewrite mark 2 as: "the first curve is flat (level) at high light, so extra light did not raise the rate and light was not limiting; raising carbon dioxide alone did raise it, so carbon dioxide was the limiting factor." Make the canonical answer match.'
  confidence: 0.85
  status: open
- issue_id: "3AB-002"
  severity: high
  category: coherence
  affected_ids: ["3.6.2 / The digestion of starch", MISCON-6116-021, ITEM-6116-3-472-MISCON]
  finding: "The boiled-saliva control in the notes is interpreted with the exact word the examiners penalise (\"destroyed\", MISCON-6116-021: \"killed\" or \"destroyed\" instead of \"denatured\"). The inference is also back to front. The control does not show that boiling destroyed the enzyme, which is assumed. It shows that the starch loss in the first tube needed active enzyme, not some other part of saliva or the conditions."
  evidence: '3.6.2 "The digestion of starch": "...while a control made with boiled saliva still does. This shows that the enzyme was destroyed by boiling and that starch had been broken down in the first tube."'
  educational_consequence: "Learners copy \"destroyed by boiling\" into exam answers and lose the denaturation mark. They also learn to describe what a control assumes instead of what it shows."
  recommended_repair: 'Replace with: "Boiling denatures amylase, so the boiled-saliva tube shows that the starch disappeared in the first tube because of active enzyme, not because of anything else in saliva or the conditions."'
  confidence: 0.9
  status: open
- issue_id: "3AB-003"
  severity: medium
  category: curriculum
  affected_ids: [OBJ-6116-3.5-06, "3.5 / Investigating amylase and lipase"]
  finding: "OBJ-6116-3.5-06 requires investigating the effect of temperature and pH on lipase as well as amylase. The notes give a full amylase method but only one sentence on lipase, that fatty acids lower pH and can be followed with an indicator. The notes then say an indicator endpoint cannot be compared across pH values, and offer no workable alternative. A learner has no lipase method for either factor, for example milk or cream with lipase and sodium carbonate and phenolphthalein, timed until the pink disappears, at different temperatures."
  evidence: '3.5 "Investigating amylase and lipase": "For lipase acting on lipid, the fatty acids produced lower the pH, which can be followed with a pH indicator." ... "In a lipase investigation that follows pH indicator colour change, the starting pH differs between pH values, so a fixed colour-change time cannot be compared directly."'
  educational_consequence: "A learner asked to plan a lipase temperature investigation cannot write the substrate, indicator, endpoint or controls from the notes. The pH caveat may leave them thinking lipase cannot be investigated at all."
  recommended_repair: "Add a short lipase method with a temperature series (milk, sodium carbonate, phenolphthalein, time to colour loss, boiled-lipase control, equal volumes, water baths). Restate the pH caveat with what to do instead, for example measuring pH change with a meter or probe rather than a fixed indicator colour."
  confidence: 0.75
  status: open
- issue_id: "3AB-004"
  severity: medium
  category: coherence
  affected_ids: ["3.6.2 / Water absorption", "3.6.2 / How cholera causes fluid loss"]
  finding: "Water absorption is taught unconditionally as osmosis \"from the more dilute gut contents into the more concentrated blood\". The cholera section in the same unit correctly teaches the reverse, where raised gut solute concentration draws water into the gut. The condition, that water is absorbed because solutes are absorbed and so the gut contents are the more dilute side, is dropped in the water-absorption section."
  evidence: '3.6.2 "Water absorption": "Water crosses the intestinal lining by osmosis, from the more dilute gut contents into the more concentrated blood." vs "How cholera causes fluid loss": "The increased gut solute concentration draws water into the intestine by osmosis".'
  educational_consequence: "A learner may treat gut contents as always more dilute than blood. They then cannot explain why the direction reverses in cholera, or after a very salty or sugary load."
  recommended_repair: 'Condition the sentence: "Normally, as digested food and ions are absorbed, the gut contents become more dilute than the blood, so water follows by osmosis; if solutes build up in the gut, as in cholera, water moves the other way."'
  confidence: 0.7
  status: open
