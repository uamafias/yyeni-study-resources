- issue_id: 4-004
  severity: medium
  category: evaluation
  affected_ids: ["ITEM-6116-4-097-DEF"]
  finding: "The second mark requires 'one set coming from each parent, so the chromosomes form homologous pairs'. The syllabus definition (OBJ-6116-4.4.1-04) is 'a nucleus containing two sets of chromosomes (e.g. in body cells)'. A learner who writes the syllabus definition verbatim, including the example, earns only 1 of 2 marks, while the example 'in body cells' carries no credit."
  evidence: "ITEM-6116-4-097-DEF marking_guidance: '1 mark: the definition gives a second, separate feature: one set coming from each parent, so that the chromosomes form homologous pairs.' Registry OBJ-6116-4.4.1-04: 'define diploid nucleus as a nucleus containing two sets of chromosomes (e.g. in body cells)'."
  educational_consequence: "Learners are penalised for giving the exact syllabus definition, and are pushed to memorise an addition that the syllabus does not ask for."
  recommended_repair: "Make the second mark 'e.g. in body cells' (or accept either the example or one set from each parent), or reduce the item to 1 mark."
  confidence: 0.7
  status: open
- issue_id: 4-005
  severity: low
  category: accuracy
  affected_ids: ["4.2.1 Asexual reproduction"]
  finding: "The notes say that, because two gametes fuse in self-pollination, 'the offspring are not identical to the parent'. This is stated unconditionally. A plant that is homozygous at its genes (common in regularly self-pollinating crops such as the beans named in 4.2.2) gives offspring that are genetically the same as the parent. The valid point is that self-pollination is sexual because gametes fuse, not that the offspring must differ."
  evidence: "4.2.1 Asexual reproduction: 'In self-pollination pollen still fertilises an ovule, so two gametes fuse and the offspring are not identical to the parent.'"
  educational_consequence: "A learner may use 'offspring differ from the parent' as the test for sexual reproduction and misclassify cases."
  recommended_repair: "Change to 'so two gametes fuse and the offspring can differ from the parent. The fusion of gametes, not the result, makes it sexual reproduction.'"
  confidence: 0.6
  status: open
