- issue_id: 4-001
  severity: medium
  category: coherence
  affected_ids: ["4.3.2 Placenta and umbilical cord"]
  finding: "The section first states correctly that maternal and fetal blood are kept separate and do not mix, then says the mother's lungs and kidneys clean 'the blood that she shares with the fetus'. The blood is not shared; only substances are exchanged across the placenta. The same paragraph also says the fetus does not excrete for itself, whereas the fetus does make urea (and urine); it relies on the placenta to pass the urea to the mother."
  evidence: "4.3.2 Placenta and umbilical cord: 'The two blood supplies are normally kept separate and do not mix.' ... 'The mother's lungs remove carbon dioxide and her kidneys remove urea, from the blood that she shares with the fetus through the placenta.' / 'The fetus does not breathe or excrete for itself.'"
  educational_consequence: "A learner may write that maternal and fetal blood mix or are shared, which loses the mark on placental exchange and contradicts the card they learned from."
  recommended_repair: "Replace 'from the blood that she shares with the fetus through the placenta' with 'after these wastes have diffused from the fetal blood into her blood in the placenta'. Rephrase 'does not breathe or excrete for itself' to 'cannot get rid of its carbon dioxide and urea by its own lungs and kidneys, so they pass to the mother's blood'."
  confidence: 0.85
  status: open
- issue_id: 4-002
  severity: medium
  category: accuracy
  affected_ids: ["4.4.3 Gene mutation"]
  finding: "The statement that a mutation is passed on only if it happens in a cell that makes gametes is true only for sexual reproduction (in animals). In asexual reproduction, which the same notes teach (binary fission, tubers, mitosis copying the parent 'apart from the rare mutation'), a mutation in an ordinary cell is passed to the offspring. The condition has been dropped."
  evidence: "4.4.3 Gene mutation: 'A mutation is passed to offspring only if it happens in a cell that makes gametes. A mutation in an ordinary body cell is not inherited.' Compare 4.2.1 Bacterial binary fission: 'The two offspring are genetically identical apart from mutations.'"
  educational_consequence: "A learner may deny that a mutation in a bacterium or in a potato tuber can be inherited, which undermines the antibiotic-resistance explanation in 4.4.4 (a chance mutation in a bacterium is passed to all its offspring)."
  recommended_repair: "Add the condition: 'In animals and other organisms that reproduce sexually, a mutation is passed to offspring only if it happens in a cell that makes gametes. In asexual reproduction, such as binary fission, the mutation is copied into the offspring.'"
  confidence: 0.8
  status: open
