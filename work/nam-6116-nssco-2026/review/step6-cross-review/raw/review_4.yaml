  affected_ids: ["4.4.1 Homologous chromosomes", "4.4.1 Diploid nucleus", "4.4.2 X-linked recessive inheritance"]
  finding: "4.4.1 says without a condition that the chromosomes of a body cell are in homologous pairs and that each set has 'one chromosome of each kind'. 4.4.2 then teaches that Y carries no allele of an X-linked gene, so the X and Y of a male are not a matched pair. The male exception is not flagged."
