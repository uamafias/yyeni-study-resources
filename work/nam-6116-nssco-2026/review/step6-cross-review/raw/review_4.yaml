- issue_id: 4-013
  severity: low
  category: curriculum
  affected_ids: ["4.3.4 HIV and vulnerability to other illness"]
  finding: "OBJ-6116-4.3.4-04 asks for the increased vulnerability of Namibians to other illness because HIV is common: a population effect. The notes explain the individual effect well, but give the population effect only as a bare statement ('TB and other infections are also more common among the population') with no reason. The reason is that more people with active TB means more TB bacteria spread, including to HIV-negative people."
  evidence: "4.3.4 HIV and vulnerability to other illness: 'Where HIV is common, TB and other infections are also more common among the population.'"
  educational_consequence: "A 'discuss' answer on this objective would stop at the individual and miss the community-level link."
  recommended_repair: "Add one sentence: 'More people with active TB means more TB bacteria are passed on, so even people without HIV are more exposed.'"
