  finding: "The Namibian dispersal example may name the wrong plant. The plant of the Kalahari sands whose fruit has hooks that catch on animals' feet and fur is devil's claw (Harpagophytum). 'Devil's thorn' usually refers to Tribulus, whose fruit has sharp spines, not hooks. Not certain: local common names vary."
