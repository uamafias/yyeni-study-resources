profile_id: yyeni-subject-english-language-as-v0.1.0
version: 0.1.0-draft
status: draft
subject_name: English Language (Cambridge International AS Level 9093)
language_variant: British English
purpose: 'The teaching model for AS Level English Language. 9093 at AS is examined by task: six tasks on two papers,
  each on an unseen text or a brief and each marked against a level table. Forty of the hundred marks are for analysing
  how form, structure and language make meaning for an audience; forty-five are for writing to a brief; fifteen
  are for reading the unseen text accurately. The resource therefore teaches the analytical vocabulary and the moves
  each task rewards, practises them on short original extracts in flashcards, and rehearses every task on original
  practice texts and briefs.'
depth_model:
  note_mode: full teaching depth
  rationale: Notes teach each term and move a task rewards, demonstrate it on a short original extract, and name
    the errors that cost marks as discriminations. They are the source for the flashcards and a standalone study
    text.
  words_per_objective: 300-450
terminology_rules:
- Use the syllabus wording for the tasks, the three categories of Section B and the linguistic elements listed on
  page 12.
- 'Use the glossary senses exactly: curriculum/glossary.json.'
- British spelling throughout.
