  severity: high
  category: analysis
  affected_ids:
  - CLM-0455-4.2-009
  - ITEM-0455-4.2-009-WHY
  finding: Current-account deficits were treated as necessarily building debt and
    draining reserves.
  evidence: a persistent deficit also drains the foreign currency reserves
  educational_consequence: Learners ignore non-debt inflows when analysing the external
