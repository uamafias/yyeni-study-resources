profile_id: subject-0455-igcse-2026
version: 0.1.0-draft
status: draft
subject_name: Economics
language_variant: British English
purpose: >-
  The answer shapes, register and prohibitions that make 0455 output look like 0455
  output. Everything here is derived from 84 mark schemes and 17 examiner reports,
  not from a house style.

depth_model:
  1: recall a definition or a named item
  2: apply a concept to a stated situation
  3: analyse a cause through to its consequence for a named economic agent
  4: evaluate two sides and reach a supported judgement

terminology_rules:
- Use the syllabus's own term, not a near neighbour. The mark schemes refuse GDP per
  head where GDP is asked for, and refuse a synonym where a syllabus term is specific.
- >-
    Name the economic agent every consequence lands on: consumer, worker, producer,
    firm, government, or the economy.
- A diagram is described in words as well as drawn. A diagram alone earns nothing
  where a written point is required.

# The marking guidance on every card must name every part of its subtype's structure.
answer_structures:
  DEF:
  - meaning|precise|definition
  FEATURE:
  - features|elements|characteristics|what it includes
  DIST:
  - boundary|difference|distinction|whereas|unlike
  - test|how to tell|which one applies
  PROC:
  - stages|order|sequence|first
  - each stage|then|next
  - result|outcome|end with
  WHY:
  - reason|purpose|why|because
  MECH:
  - mechanism|how|because
  - consequence|therefore|so that
  BEN:
  - benefit|advantage
  - because|so that|leads to
  - for whom|consumer|worker|firm|government|economy
  LIM:
  - limitation|drawback|disadvantage
  - because|so that|leads to
  - for whom|consumer|worker|firm|government|economy
  APP:
  - context|the data|the extract|this economy|the figures
  - reasoning|because|why|link
  - conclusion|therefore|means that
  CHAIN:
  - starting point|initial change|if|when
  - mechanism|because|this causes
  - consequence|therefore|results in
  - for whom|consumer|worker|firm|government|economy
  EVAL:
  - judgement|on balance|it depends
  - why it might|argument for
  - why it might not|argument against
  - decisive|what settles it|the condition
  CALC:
  - formula
  - substitution|working
  - answer with units
  INTERP:
  - what the data shows|the relationship
  - supporting evidence|comparison
  - exception|however|except
  - why|explanation of the relationship
  DIAGRAM:
  - axes labelled|price and quantity
  - original curves drawn and labelled
  - the shift or movement, in the correct direction
  - new equilibrium marked and labelled
  - what the diagram shows, in words
  MISCON:
  - the confusion|what learners mix up
  - the boundary|the difference
  - the test|how to tell them apart
  SYNTH:
  - the link|how the two connect
  - the consequence

variant_register:
- currency: >-
    N$ and Namibian contexts where a country example is needed, with at least one
    southern African and one non-African example per unit so the examples are not
    parochial.
- data: >-
    Figures are invented for teaching and labelled as such; real published statistics
    are used only where they are stable and cited.

# A conclusion that holds only under conditions carries those conditions EVERY time
# it appears, not only in the claim. RS-43.
conditioned_mechanisms:
- A price rise raises total revenue only where demand is price-inelastic.
- A depreciation improves the current account only where the Marshall-Lerner condition
  holds and supply can respond; state the condition, not just the result.
- An increase in government spending raises output only where there is spare capacity.
- A minimum wage raises unemployment only where it is set above the market wage and
  demand for that labour is elastic.
- Economic growth raises living standards only where the gains are distributed and not
  offset by external costs.

prohibited_patterns:
- >-
    Unqualified universals - always, never, every, only - unless the statement is
    definitional, legal or arithmetic.
- Claiming what examiners reward, what carries most marks, or what a paper contains.
- Quoting figures from data as if quoting were analysis. State the relationship, then
  give the reason.
- A diagram presented without the written point it is supposed to make.
- Treating a cause as a consequence or the reverse. The examiner reports name this
  repeatedly; every cause/effect card states which direction it runs in.
- Restating a point in different words and counting it as a second point.

glossary_homonyms:
- >-
    Production and productivity are different quantities; say which one is meant.
- a free good and a public good are different things.
- market failure and business failure are different things.
- characteristics of money and functions of money are different lists.
- a budget deficit and a current account deficit are different balances.
