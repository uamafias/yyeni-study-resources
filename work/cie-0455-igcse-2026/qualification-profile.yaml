- 2026
route: full_igcse
source: Syllabi/Cambridge Curricula/IGCSE Cambridge /Economics-2026-syllabus.pdf
prior_teaching: >-
  None assumed. The syllabus expects no prior study of Economics.

assessment_objectives:
- code: AO1
  name: Knowledge and understanding
  description: >-
    Show knowledge and understanding of economic definitions, formulas, concepts and
    theories; use economic terminology.
  qualification_weight_percent: 40
- code: AO2
  name: Analysis
  description: >-
    Select, organise and interpret data; use economic information and data to recognise
    patterns and deduce relationships; apply economic analysis to written, numerical,
    diagrammatic and graphical data; analyse economic issues and situations, identifying
    and developing links.
  qualification_weight_percent: 40
- code: AO3
  name: Evaluation
  description: >-
    Evaluate economic information and data; distinguish between economic analysis and
    unreasoned statements; recognise the uncertainties of the outcomes of economic
    decisions and events; communicate economic thinking in a logical manner.
  qualification_weight_percent: 20

ao_note: >-
  0455 has THREE assessment objectives, not four. There is no separate Application
  objective: applying economic analysis to written, numerical, diagrammatic and
  graphical data sits inside AO2 Analysis, in the syllabus's own wording. Anything
  that assumes a four-AO subject will mis-shape this plan.

papers:
- paper_id: P1
  name: Multiple Choice
  duration_minutes: 45
  marks: 30
  qualification_weight_percent: 30
  ao_split: {AO1: 50, AO2: 50, AO3: 0}
  note: >-
    Thirty four-option multiple-choice questions. No evaluation is assessed here.
- paper_id: P2
  name: Structured Questions
  duration_minutes: 135
  marks: 90
  qualification_weight_percent: 70
  ao_split: {AO1: 35, AO2: 35, AO3: 30}
  structure: >-
    Section A: one compulsory source-based question worth 30 marks, built from a short
    data extract. Section B: four questions worth 20 marks each, of which the candidate
    answers three. The published mark scheme therefore totals 110 marks for a 90-mark
    paper.

corpus:
  papers_held: 84 question papers and 84 mark schemes, 2020-2025
  examiner_reports_held: 17
  question_parts_mined: 1002
  marks_mined: 4580
  note: >-
    Paper 1 is multiple choice, so the question-part corpus is Paper 2. Paper 1 is
    represented in the mark schemes as an answer key and carries no answer shape.
