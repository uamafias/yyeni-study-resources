status: draft
board: Cambridge International Education
qualification: Cambridge International AS Level
subject: Computer Science
syllabus_code: '9618'
examination_years:
- 2026
route: as_level
source: Syllabi/Cambridge Curricula/Cambridge AS & A Level/AS & A Computer Science (9618).pdf
assessment_objectives:
- code: AO1
  name: Knowledge and understanding
  description: Demonstrate knowledge and understanding of the principles and concepts of computer science,
    including abstraction, logic, algorithms and data representation.
  qualification_weight_percent: 30
- code: AO2
  name: Application
  description: Apply knowledge and understanding of the principles and concepts of computer science, including
    to analyse problems in computational terms.
  qualification_weight_percent: 40
- code: AO3
  name: Design, programming and evaluation
  description: Design, program and evaluate computer systems to solve problems, making reasoned judgements
    and presenting conclusions.
  qualification_weight_percent: 30
ao_name_note: The syllabus numbers and defines its objectives (page 13) but does not name them; the names are
  our labels for the definitions.
papers:
- paper_id: P1
  name: Theory Fundamentals
  duration_minutes: 90
  marks: 75
  qualification_weight_percent: 50
  question_basis: Sections 1 to 8. Short and longer answers testing knowledge and understanding of the principles
    of computer science and their application to solving problems.
  assessment_objective_weights: {AO1: 60, AO2: 40, AO3: 0}
- paper_id: P2
  name: Fundamental Problem-solving and Programming Skills
  duration_minutes: 120
  marks: 75
  qualification_weight_percent: 50
  question_basis: Sections 9 to 12. Programming knowledge and skills, answered in pseudocode; an insert of
    pseudocode built-in functions and operators is provided. Candidates are not required to write programming code.
  assessment_objective_weights: {AO1: 0, AO2: 40, AO3: 60}
learner_context:
  region: Namibia
  medium: English
  currency: N$
  note: AS Level learners. The syllabus assumes no prior study of computer science; learners may have taken
    IGCSE Computer Science, but nothing depends on it.
prior_teaching: None assumed beyond the syllabus's own content; terms are introduced before they are used.
first_exam: '2026-10-09'
