- paper_id: P2
  name: Business case study
  duration_minutes: 135
  marks: 100
  qualification_weight_percent: 50
  question_basis: Learners will be expected to answer compulsory questions arising
    from a case study of a business situation. The paper will consist of five questions
    of 20 marks each.
  assessment_objective_weights:
    A: 30
    B: 20
    C: 30
    D: 20
assessment_objectives:
- code: A
  name: Knowledge with understanding
  description: demonstrate knowledge and understanding of business facts, terms, concepts
    and conventions appropriate to the syllabus demonstrate knowledge and understanding
    of theories and techniques commonly applied to, or used as part of, business behaviour
  qualification_weight_percent: 40
- code: B
  name: Application
  description: apply their knowledge and understanding of facts, terms, concepts and
    conventions to business problems and issues pertaining to the case in the examination
    paper apply their knowledge and understanding of theories and techniques commonly
    applied to business problems and issues
  qualification_weight_percent: 20
- code: C
  name: Analysis
  description: select, order, analyse and interpret information, in narrative, numerical
    and graphical forms, using appropriate techniques use business data, recognise
    patterns in such data, and deduce relationships
  qualification_weight_percent: 25
- code: D
  name: Evaluation
  description: distinguish between evidence and opinion, make reasoned judgements
    and communicate them in an accurate and logical manner recognise that business
    theory is subject to various limitations and uncertainties
  qualification_weight_percent: 15
command_words:
- word: define
  meaning: give precise meaning / provide a precise statement of the meaning of a
    term or concept / describe accurately / definition of something
- word: give
  meaning: provide short, concise answers without explanation
- word: give examples
  meaning: provide / present cases from your experience/knowledge
- word: identify
  meaning: name / select / recognise / pick out what is unique about a scenario/context
- word: list
  meaning: give a number of answers one after the other, often each of one word or
    a phrase
- word: name
  meaning: state / specify / identify
- word: state
  meaning: write down / provide short, concise answers without explanation
- word: apply
  meaning: make knowledge relevant to a specific problem, task or context
- word: describe
  meaning: state the points of a topic / give characteristics and main features /
    state what something looks like or how it works / state the features or characteristics
    of an object or process / set out the factual details of something
- word: explain
  meaning: set out purposes or reasons / make the relationships between things evident
    / provide why and/or how and support with relevant evidence / make something clear
    / state what happens, together with how and why
- word: analyse
  meaning: write about in detail or examine information in detail to discover patterns,
    relationships or trends
- word: calculate
  meaning: use mathematical methods to work something out. A numerical answer is required
    – working must be shown, especially where two or more steps are involved
- word: compare
  meaning: say how one thing is like or different from another / find resemblances
    and differences
- word: differentiate
  meaning: write down the differences between two or more terms/concepts
- word: discuss
  meaning: write in detail about all the aspects, including advantages and disadvantages,
    of a subject / give a critical account of the points about the topic
- word: distinguish
  meaning: explain the differences between two or more terms/concepts / point out
    the differences of one thing from another / differentiate
- word: draw
  meaning: sketch / depict e.g. graphs
- word: explain
  meaning: set out purposes or reasons, including advantages and disadvantages / make
    the relationships between things evident / provide why and/or how and support
    with relevant evidence, including advantages and disadvantages / make something
    clear / state what happens, together with how and why
- word: advise
  meaning: recommend a certain action
- word: assess
  meaning: analyse and consider all the different aspects
- word: consider
  meaning: review and respond to given information / with the merits of … / be of
    opinion that / think over / reflect
- word: evaluate
  meaning: state whether you think something is good or bad and give reasons for your
    opinion / use the information provided to make a judgement about something (questions
    expecting this often start with “Do you think….?” or “To which extend… ?”)
- word: justify
  meaning: support a case with evidence/argument / give reasons for why something
    should be the way it is
- word: recommend
  meaning: explain the good points about something / suggest the way forward / course
    of action
- word: suggest
  meaning: apply knowledge and understanding to situations where there are a range
    of valid responses in order to make proposals / put forward considerations / write
    down possible reasons for something / use your knowledge and the information in
    the question to give what you think is the best answer
