conditioned_mechanisms:
- mechanism_id: CM-6144-SCALE
  name: Growth lowers unit cost
  asserted_when:
  - \b(?:growth|larger|expand)\b
  - \b(?:lower|reduce|fall)\b
  - \b(?:unit cost|average cost)\b
  required_conditions:
  - name: Coordination/diseconomies may offset scale savings
    any_of:
    - \bdiseconom
    - \bprovided\b
    - \bif\b
    - \bcoordination\b
