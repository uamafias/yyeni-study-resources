assessment_skill_model:
- skill_id: A
  label: Knowledge with understanding
  definition: demonstrate knowledge and understanding of business facts, terms, concepts
    and conventions appropriate to the syllabus demonstrate knowledge and understanding
    of theories and techniques commonly applied to, or used as part of, business behaviour
  authoring_requirements:
  - Use the exact requested beneficiary and dimension.
  - Keep AO labels distinct from Bloom demand.
- skill_id: B
  label: Application
  definition: apply their knowledge and understanding of facts, terms, concepts and
    conventions to business problems and issues pertaining to the case in the examination
    paper apply their knowledge and understanding of theories and techniques commonly
    applied to business problems and issues
  authoring_requirements:
  - Use the exact requested beneficiary and dimension.
  - Keep AO labels distinct from Bloom demand.
- skill_id: C
  label: Analysis
  definition: select, order, analyse and interpret information, in narrative, numerical
    and graphical forms, using appropriate techniques use business data, recognise
    patterns in such data, and deduce relationships
  authoring_requirements:
  - Use the exact requested beneficiary and dimension.
  - Keep AO labels distinct from Bloom demand.
- skill_id: D
  label: Evaluation
  definition: distinguish between evidence and opinion, make reasoned judgements and
    communicate them in an accurate and logical manner recognise that business theory
    is subject to various limitations and uncertainties
  authoring_requirements:
  - Use the exact requested beneficiary and dimension.
  - Keep AO labels distinct from Bloom demand.
application_model:
  core_rule: Use an original relevant business fact and explain why it changes the
    answer.
  context_dimensions:
  - activity
  - ownership
  - workforce
  - market
  - finance
  - community
  worked_application_policy:
    minimum_per_major_objective: 1
    contrast_required_for_decisions: true
    coverage_dimensions:
    - constraint
    - effect
    - choice
  pseudo_application_patterns:
  - A business name without a causal link.
  - Copied case sentences without processing.
analysis_model:
  chain_template:
  - precise point
  - because mechanism
  - effect on the requested party
  rules:
  - Develop consequences rather than repeat a definition.
  - Respect how/why and worker/business distinctions.
evaluation_model:
  judgement_template:
  - relevant alternatives or positive/negative considerations
  - case-dependent comparison
  - choice
  - supporting decisive reason
  decision_dimensions:
  - feasibility
  - cost
  - worker/customer effect
  - objectives
  - constraints
  rules:
  - Assess the actual option(s), not an irrelevant alternative.
  - One-sided repetition is not a developed judgement.
depth_model:
  allocation_factors:
  - Syllabus demand
  - Direct evidence, not inherited member frequency
  - Integrated explanations avoid repetition
  tiers:
  - tier: 1
    label: precise knowledge
    typical_use: precise knowledge
    indicative_word_range:
      min: 0
      max: 470
    indicative_item_range:
      min: 1
      max: 4
  - tier: 2
    label: application/procedure
    typical_use: application/procedure
    indicative_word_range:
      min: 0
      max: 470
    indicative_item_range:
      min: 1
      max: 4
  - tier: 3
    label: developed analysis/construction
    typical_use: developed analysis/construction
    indicative_word_range:
      min: 0
      max: 470
    indicative_item_range:
      min: 1
      max: 4
  - tier: 4
    label: decision
    typical_use: decision
    indicative_word_range:
      min: 0
      max: 470
    indicative_item_range:
      min: 1
      max: 4
quantitative_model:
  required_components:
  - formula
  - substitution
  - result and format
  - interpretation
  interpretation_rules:
  - Ratios to two decimal places under Annexe A.
  - Preserve % versus x:1.
  - Use benchmark ratios as contextual references, not universal financial laws.
legal_and_jurisdiction_model:
  core_rule: Name the syllabus model and qualify jurisdiction-sensitive legal statements;
    no invented current rates, statutory lists or registration steps.
  high_risk_topics:
  - ownership
  - worker protection
  - social security
  - consumer protection
learning_item_model:
  item_types:
  - flashcard
  - short_answer
  - data_response
  - essay_plan
  - case_analysis
  flashcard_subtypes:
  - DEF
  - FEATURE
  - APP
  - DIST
  - CHAIN
  - EVAL
  - PROC
  - CALC
  - INTERP
  - MISCON
  - SYNTH
  rules:
  - Every item has AO and Bloom labels.
  - Every answer is taught in the notes.
  - Original question wording and contexts.
terminology_rules:
- Follow the subject glossary while retaining its recorded source issues.
- Discriminate profit/cash, revenue/profit, market/marketing and production/productivity.
prohibited_patterns:
- No learner-facing exam-frequency or examiner-behaviour claims.
- No detailed registration procedures.
- No quantitative social-cost-benefit analysis.
- No unsupported current legal detail.
semantic_review_questions:
- Can the learner reconstruct the answer from these notes?
- Does the task actually exercise the declared outcome and Bloom level?
- Are conditions and the requested beneficiary explicit?
variant_register:
- term: limited company
  variants:
  - private
  - public
  consequence: Ownership/share-market access differs; public limited is not synonymous
    with state owned.
- term: training
  variants:
  - on-the-job
  - off-the-job
  consequence: Setting, cost and disruption differ.
- term: production methods
  variants:
  - job
  - batch
  - flow
  consequence: Volume, variety and sequence differ. This family trigger must not match
    an incidental reference to production cost.
