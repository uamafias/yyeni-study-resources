    brief: Follow curriculum/performance-slot-specs.json for this topic’s exact source/data
      task and subparts. 6 marks; AO split is a planning estimate.
  - item_type: practical_task
    papers:
    - '3'
    marks: 50
    ao_split:
      C: 24
      D: 16
      B: 10
    brief: 'Water access: instrument and community storage — supplied enquiry and
      own-investigation transfer. A1 Identify [1]: Identify the enquiry population
      from the supplied water-access survey; A1 Design [5]: Design five usable questionnaire
      elements for the stated enquiry, with neutral wording and recordable responses;
      A1 Describe [4]: Carry out systematic selection from the stated household list
      after a suitable start; A1 Explain [2]: Explain how consent and privacy are
      protected in this non-sensitive survey; A1 Suggest [3]: Repair the specific
      pilot wording difficulty and explain the improvement; A1 Calculate [2]: Calculate
      a survey proportion or difference from supplied counts; A1 Draw [4]: Construct
      a suitable bar chart from the original categorical counts; A1 Describe [4]:
      Use the chart and source evidence to describe the water-access pattern; A2 State
      [2]: State two feasible aims for a small community water-storage activity; A2
      Describe [3]: Organise volunteers, permissions and responsibilities for that
      activity; A2 Suggest [2]: Propose feasible funding linked to the stated cost/resources;
      A2 Explain [3]: Match one implementation obstacle to a practical response and
      responsible implementer; B State [2]: State the actual topic/area and linked
      aim; B Explain [2]: Explain what the pilot revealed and the revision actually
      made; B Describe [4]: Describe the collection procedure actually used; B Describe
      [4]: Support the enquiry findings with evidence and explain their implication;
      B Suggest [3]: A feasible recommendation with an implementer tied to those findings
      Supply original self-contained figures and sources. Each AO split is a planner
      judgement, not an official rubric. Sections A1/A2 sum to 35 and B to 15. Use
      a clearly fictional worked enquiry and then transfer B to the learner’s actual
      investigation; do not fabricate their fieldwork.'
  - item_type: data_response
    papers:
    - '3'
    marks: 50
    ao_split:
      C: 27
      D: 9
      B: 14
    brief: 'Rural production: stratification and second dataset — supplied enquiry
      and own-investigation transfer. A1 Name [1]: Name the collection method shown
      by the invented farm-price survey; A1 Name and describe [4]: Apply interview
      and observation procedures to the two stated data needs; A1 Describe [4]: Select
      a stratified sample using the supplied village groups; A1 Explain [3]: Explain
      why the sample design fits this enquiry and its limitations; A1 Suggest [3]:
      Resolve the stated practical access/recording obstacle without changing the
      enquiry aim; A1 Design [5]: Design a short observation record for the stated
      rural-production variables; A2 Calculate [2]: Calculate the production difference
      between two periods; A2 Describe [3]: Compare the two periods using appropriate
      figures; A2 Draw [4]: Construct a divided rectangle from the supplied resource-use
      shares; A2 Explain [3]: Infer a plausible relationship between resource use
      and output, bounded by the supplied evidence; A2 Suggest [3]: A practical improvement
      to the stated production/recording problem; B Explain [2]: Two factors that
      informed selection of the research issue; B Describe [4]: Explain the actual
      sampling procedure and its fit to the population; B Describe [6]: An evidence-linked
      report of findings with valid conclusions and stated limits; B Suggest [3]:
      A matched response to a practical difficulty encountered by the researcher Supply
      original self-contained figures and sources. Each AO split is a planner judgement,
      not an official rubric. Sections A1/A2 sum to 35 and B to 15. Use a clearly
      fictional worked enquiry and then transfer B to the learner’s actual investigation;
      do not fabricate their fieldwork.'
  - item_type: case_analysis
    papers:
    - '3'
    marks: 50
    ao_split:
      C: 23
      B: 14
      D: 13
    brief: 'Education access: representation and community book project — supplied
      enquiry and own-investigation transfer. A1 State [2]: State the enquiry aim
      and a measurable objective for school access; A1 Describe [4]: Apply random
      selection from the supplied complete school list; A1 Explain [3]: Justify one
      collection method by its fit to this enquiry’s question and participants; A1
      Design [5]: Design an interview schedule that produces the specified attendance
      data; A1 Calculate [2]: Convert a stated share into an angle, with clear units;
      A1 Draw [4]: Construct a pie chart whose categories sum to the given total;
      A1 Describe [4]: Interpret the education-access pattern, including one comparison
      supported by figures; A1 Identify [1]: Identify an exception to that pattern
      from the data; A2 State [2]: Two achievable aims for a small school-book access
      project; A2 Describe [3]: Organise collection, distribution and record-keeping
      with responsible actors; A2 Suggest [2]: Feasible funding or in-kind support
      using stated community resources; A2 Explain [3]: Link a stated implementation
      problem to an appropriate response; B State [2]: State the research question/hypothesis
      and one linked objective; B Explain [3]: Justify the presentation method actually
      used; B Describe [4]: Compare the relevant findings using actual evidence; B
      Outline [3]: Conclusions answering the research question within its limits;
      B Suggest [3]: A practical recommendation and responsible implementer Supply
      original self-contained figures and sources. Each AO split is a planner judgement,
      not an official rubric. Sections A1/A2 sum to 35 and B to 15. Use a clearly
      fictional worked enquiry and then transfer B to the learner’s actual investigation;
      do not fabricate their fieldwork.'
  - item_type: source_analysis
    papers:
    - '3'
    marks: 50
    ao_split:
      C: 22
      D: 10
      B: 18
    brief: 'Community waste: sketch map, counterevidence and local enquiry — supplied
      enquiry and own-investigation transfer. A1 Define [1]: Define a research term
      needed in the supplied waste enquiry; A1 Describe [4]: Collect and record observable
      waste categories using a stated sampling frame; A1 Name and describe [4]: Apply
      two data collection methods to different information needs; A1 Explain [3]:
      Explain one selection decision and why a named bias remains possible; A1 Suggest
      [3]: Respond to the supplied safety/access difficulty by changing the procedure
      appropriately; A1 Draw [4]: Construct a simple sketch map with the specified
      locations and key; A1 Describe [3]: Read the spatial pattern using map evidence;
      A1 Calculate [2]: Calculate an absolute difference between the two supplied
      collection periods; A1 Identify [1]: Identify the observation that challenges
      the proposed explanation; A2 Describe [3]: Interpret a second short waste-service
      stimulus; A2 Explain [3]: Compare two proposals against the stated evidence
      and criterion; A2 Suggest [4]: Propose a feasible action plan, obstacle response
      and implementer using the supplied resources; B Describe [4]: Advantages and
      disadvantages of doing this enquiry locally; B Explain [2]: Explain a real pilot
      adjustment; B Describe [6]: Findings, evidence, implications and a supported
      conclusion in a report; B Suggest [3]: Resolve a researcher obstacle rather
      than merely restating the community issue Supply original self-contained figures
      and sources. Each AO split is a planner judgement, not an official rubric. Sections
      A1/A2 sum to 35 and B to 15. Use a clearly fictional worked enquiry and then
      transfer B to the learner’s actual investigation; do not fabricate their fieldwork.'
