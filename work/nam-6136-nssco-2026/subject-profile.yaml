assessment_skill_model:
- skill_id: A
  label: Knowledge with Understanding
  definition: recall, select and present relevant factual information; demonstrate
    understanding of development terms, strategies and concepts; show understanding
    of development strategies and their application; demonstrate knowledge and understanding
    of development issues in Namibia, SADC and the rest of the world.
  authoring_requirements:
  - Match the labelled task demand; do not infer credit solely from the command.
- skill_id: B
  label: Analysis and Evaluation
  definition: interpret relevant data presented in written, statistical, diagrammatic,
    pictorial and graphical forms; analyse and evaluate information, recognise patterns
    and deduce relationships and draw reasoned conclusions; analyse and evaluate alternative
    approaches to development problems.
  authoring_requirements:
  - Match the labelled task demand; do not infer credit solely from the command.
- skill_id: C
  label: Investigation
  definition: plan and carry out a simple research exercise; select and use basic
    techniques to observe, record and classify relevant data and extract relevant
    information from a range of sources; organise and present their findings in a
    clear and coherent manner.
  authoring_requirements:
  - Match the labelled task demand; do not infer credit solely from the command.
- skill_id: D
  label: Problem solving
  definition: apply practical and cognitive skills to solving problems.
  authoring_requirements:
  - Match the labelled task demand; do not infer credit solely from the command.
application_model:
  core_rule: Context must change the answer; a place name alone is insufficient. State
    the specific contextual fact and show how it changes the answer; a Namibian place
    name attached to a generic list is insufficient. Research methods must specify
    who or what is investigated, how selection and collection work, what is recorded,
    and how it addresses the aim. A method name or definition alone does not demonstrate
    application. A pilot example must show the trial difficulty and the resulting
    instrument or procedure revision. A worked fictional enquiry is clearly labelled
    and never attributed to the learner.
  context_dimensions:
  - resource availability
  - population
  - stakeholders
  - cost
  - time
  - data quality
  worked_application_policy:
    minimum_per_major_objective: 1
    contrast_required_for_decisions: true
    coverage_dimensions:
    - urban/rural
    - Namibia/southern Africa
    - household/community/national
  pseudo_application_patterns:
  - place name added to a generic list
  - copying a stimulus without interpretation
analysis_model:
  chain_template:
  - evidence or cause
  - mechanism
  - consequence for a development outcome
  rules:
  - Name who is affected and how.
  - Separate a relationship from proof of causation.
  - Preserve necessary conditions.
  - Develop cause through a defensible mechanism to an identified social, economic,
    political or environmental consequence; name affected people or places where relevant.
  - Use paired statements on the same dimension for comparisons. Separate descriptions
    of two cases do not establish the comparison.
  - Use the relevant figures or features when the task requests evidence; repeating
    source wording without interpreting it does not meet the demand.
  - State necessary conditions and distinguish association from causation. A condition
    can be fixed by the given scenario; do not append irrelevant stock caveats.
evaluation_model:
  judgement_template:
  - criterion
  - evidence
  - weighing
  - conclusion and condition
  decision_dimensions:
  - feasibility
  - equity
  - cost
  - environment
  - time
  - evidence quality
  rules:
  - Compare alternatives against the same criterion.
  - Keep conclusions within the evidence.
  - Do not present an indicative practice rubric as an official scheme.
  - Judge the specified alternative against a stated development criterion using supplied
    or established evidence. Explain why the decisive factor matters.
  - Consider a relevant alternative or limitation when the task demands a choice,
    without forcing artificial equal-length arguments into every answer.
  - Separate a community problem from a difficulty encountered by the researcher.
    Match the actual problem to a feasible response.
  - Conclusions answer the research question using the findings. Recommendations follow
    from those conclusions and identify a feasible implementer. Do not add unsupported
    findings in a conclusion.
depth_model:
  allocation_factors:
  - syllabus demand
  - exposure
  - misconception risk
  tiers:
  - tier: 1
    label: term
    typical_use: precise meaning
    indicative_word_range:
      min: 100
      max: 500
    indicative_item_range:
      min: 1
      max: 3
  - tier: 2
    label: member
    typical_use: one distinct target
    indicative_word_range:
      min: 100
      max: 500
    indicative_item_range:
      min: 1
      max: 3
  - tier: 3
    label: outcome
    typical_use: applied relationship
    indicative_word_range:
      min: 100
      max: 500
    indicative_item_range:
      min: 1
      max: 3
  - tier: 4
    label: integration
    typical_use: relationships among listed members
    indicative_word_range:
      min: 100
      max: 500
    indicative_item_range:
      min: 1
      max: 3
quantitative_model:
  required_components:
  - method
  - variable meanings
  - substitution
  - unit
  - interpretation
  interpretation_rules:
  - Distinguish absolute change, percentage change and percentage points.
  - Compare equivalent units and denominators.
  - Use clearly fictional original data and recompute all values.
  - State what is measured, its unit, denominator and period; distinguish totals,
    per-person values, percentage points and percentage changes.
  - Show the method and substitution where required; retain adequate working precision
    and state any final rounding. Interpretation explains the result in context rather
    than checking it by another arithmetic route.
  - 'Construct original datasets that reconcile: category counts to totals, shares
    to 100 percent where appropriate, and pie angles to 360 degrees. Check scale,
    labels, key, title and suitability for the variable.'
  - Do not imply that table or coordinate checks validate an unseen rendered graph.
    Learner construction tasks require an explicit model specification and independent
    numeric and representational review.
  - Short-tariff guidance names the essential scoring function. Extra limits, rounding
    discussion and alternative arguments appear only when the particular prompt and
    tariff justify them, not as mandatory stock clauses.
legal_and_jurisdiction_model:
  core_rule: Teach syllabus principles. Verify any current legal or policy claim using
    an official source; date historical examples.
  high_risk_topics:
  - national plans
  - population policies
  - health
  - gender-based violence
  - international agencies
learning_item_model:
  item_types:
  - flashcard
  - short_answer
  - data_response
  - practical_task
  - source_analysis
  flashcard_subtypes:
  - DEF
  - FEATURE
  - DIST
  - WHY
  - APP
  - CHAIN
  - INTERP
  - EVAL
  - PROC
  - CALC
  - MISCON
  rules:
  - One main target per card.
  - Parent slots practise integration, not another exhaustive list.
  - Every slot is filled once; new labels or deviations must be recorded.
  - Never copy exam/report phrasing.
terminology_rules:
- British English; N$; preserve official terms with a plain explanation.
- Do not conflate gender equality with identical lived opportunities or population
  density with distribution.
prohibited_patterns:
- examiners reward
- unsupported universal policy claims
- fabricated learner fieldwork
- copied assessment questions
semantic_review_questions:
- Is every mandatory syllabus outcome taught and practised, including outcomes with
  no assigned past-paper appearance?
- Does every definition distinguish the nearby concept learners confuse it with?
- Does each applied answer use a contextual fact that materially changes the reasoning?
- Does an explanation develop a mechanism and consequence rather than merely list
  labels?
- Are comparisons paired on the same feature and supported by relevant evidence?
- Are source findings interpreted rather than copied, and are causal claims supported
  and conditioned?
- Could another learner carry out the described method, with its sampling, recording
  and pilot adjustments?
- Do the research findings, conclusions and feasible recommendations follow the aim
  and evidence, with an implementer identified?
- Are researcher obstacles distinguished from community problems and matched with
  workable responses?
- Do every calculation, denominator, rounding decision and representation specification
  recompute correctly?
- Can each card answer be reconstructed from the notes alone, without needing an unavailable
  diagram or a different card?
- Is depth useful and proportionate, with distinct member targets and integrated parent
  tasks rather than repeated lists?
- Are exact source limitations preserved, including ambiguous report rubrics and absent
  standalone mark schemes?
variant_register:
- term: capital
  variants:
  - money capital
  - capital goods
  consequence: Finance purchases productive assets; money is not itself the produced
    equipment.
  teach_as: distinction
- term: education classification
  variants:
  - traditional and modern
  - formal, informal and non-formal
  consequence: These classify different aspects; do not treat the two groupings as
    interchangeable.
  teach_as: two independent classifications
- term: population description
  variants:
  - density
  - distribution
  consequence: Number per unit area differs from the spatial pattern.
  teach_as: distinction
- term: research statement
  variants:
  - hypothesis
  - research question
  consequence: A tentative testable proposition differs from the question the enquiry
    investigates.
  teach_as: paired examples
