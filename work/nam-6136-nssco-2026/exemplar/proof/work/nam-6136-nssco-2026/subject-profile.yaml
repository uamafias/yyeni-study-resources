conditioned_mechanisms:
- mechanism_id: renewable-use
  asserted_when:
  - \bwood\b
  - \b(?:renewable|sustainable)\b
  required_conditions:
  - name: regrowth and harvesting balance
    any_of:
    - regrowth
    - replant
    - regenerat
    - harvest.*rate
- mechanism_id: tourism-local-benefit
  asserted_when:
  - \btourism\b
  - \b(?:increases?|raises?) local incomes?\b
  required_conditions:
  - name: local participation or retention
    any_of:
    - local.*(?:own|employ|suppl|retain)
    - if.*local
    - when.*local
depictions:
  chart_model: none
  rule: No compatible general graph renderer is available in the standard. Use original
    data tables and learner plotting tasks; no hand-drawn ASCII, code-fenced or generated-image
    plots. Model answers state axes, scales, labels, values and shape. Independent
    review must check graph suitability and numeric consistency; C-35/C-41 do not
    validate these graphs.
