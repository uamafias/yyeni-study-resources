  duration_minutes: 105
  marks: 50
  qualification_weight_percent: 25
  question_basis: 'Paper 3                             1 hour 45 mins                                 50
    marks

    Written

    This paper will consist of two compulsory sections testing, primarily but not
    exclusively, skills in

    assessment objective C (investigation) and D (problem solving). Firstly, learners
    will be

    provided with a limited amount of data about a development issue, which could
    provide the

    basis for a research investigation. They will be required to answer questions
    based on the

    data. Secondly, they will be asked to answer questions based on their own investigation
    of a

    development issue carried out during the course'
  assessment_objective_weights:
