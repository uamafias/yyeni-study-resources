assessment_objectives:
- code: A
  name: Knowledge with Understanding
  description: recall, select and present relevant factual information; demonstrate
    understanding of development terms, strategies and concepts; show understanding
    of development strategies and their application; demonstrate knowledge and understanding
    of development issues in Namibia, SADC and the rest of the world.
  qualification_weight_percent: 35.0
- code: B
  name: Analysis and Evaluation
  description: interpret relevant data presented in written, statistical, diagrammatic,
    pictorial and graphical forms; analyse and evaluate information, recognise patterns
    and deduce relationships and draw reasoned conclusions; analyse and evaluate alternative
    approaches to development problems.
  qualification_weight_percent: 47.5
- code: C
  name: Investigation
  description: plan and carry out a simple research exercise; select and use basic
    techniques to observe, record and classify relevant data and extract relevant
    information from a range of sources; organise and present their findings in a
    clear and coherent manner.
  qualification_weight_percent: 12.5
- code: D
  name: Problem solving
  description: apply practical and cognitive skills to solving problems.
  qualification_weight_percent: 5.0
command_words:
- word: Annotate
  meaning: Add labels or notes or short comments to meet specific requirements usually
    on an illustrative technique.
- word: Calculate
  meaning: Is used when a numerical answer is required. In general, working should
    be shown, especially where two or more steps are involved.
- word: Compare
  meaning: Set out the factual details to show how far things either agree or disagree
    or are alike or unlike. For a comparison, two elements or themes, learners will
    be required to identify similarities and differences either in written statements
    or as shown by illustrative techniques.
- word: Complete
  meaning: To add the remaining details required to a written statement or an illustrative
    technique.
- word: Contrast
  meaning: Identify differences
- word: Define or state the meaning of or what is meant by
  meaning: To describe accurately, giving the meaning of, definition of.
- word: Describe
  meaning: 'Set out the factual details of. To give a written account to meet a specific
    requirement e.g. to give an account of something. May also be seen as ‘give an
    account of’. Is often coupled with other command words such as : name and describe
    (name the feature and set out factual details of), Describe and explain (set out
    factual details and give reasons for). Describe how, when or where (directive
    toward a particular aspect for which a written account is required).'
- word: Devise or plan
  meaning: Presentation of a particular feature such as a form or questionnaire to
    meet a specific requirement or requirements.
- word: Draw
  meaning: Make a sketch of. Often coupled with a labelled diagram (draw a diagram
    / illustration with labels to identify its features
- word: Explain or Account for/
  meaning: Give reasons for a particular feature
- word: Factor
  meaning: Characteristics bringing about a certain result.
- word: Feature
  meaning: A characteristic of.
- word: Giving your views
  meaning: Say what you think about.
- word: How
  meaning: In what way? To what extent? By what means / method? May be coupled by
    with show how (prove how, demonstrate how)
- word: Identify
  meaning: Select, ascertain. Recognise a specific feature / features on an illustrative
    technique or in a written statement.
- word: Illustrating your Answer
  meaning: Account for by using specific examples or diagrams. Often coupled with
    by a labelled diagram (use of an illustrative technique relating to specific aspect
    or aspects in a question to include relevant words or terms to identify particular
    features.)
- word: Insert or label
  meaning: Placing specific names or details to an illustrative techniques in response
    to a particular requirement.
- word: List
  meaning: Identify and name a number of features to meet a particular purpose. Where
    a given number of features is specified this should not be exceeded.
- word: Locate
  meaning: Find the place of.
- word: Mark
  meaning: Indicate or show on an illustrative technique a particular feature or features.
- word: Match
  meaning: Identify two or more statements or illustrative techniques in which there
    is an element of similarity or inter-relationship.
- word: Measure
  meaning: Implies that the quantity concerned can be directly obtained from a suitable
    measuring instrument.
- word: Name
  meaning: To state or specify or identify. To give the word or words by which a specific
    feature is known or to give examples which illustrate a particular feature.
- word: Pattern
  meaning: A particular spatial arrangement or distribution of phenomena e.g. settlements.
    In another context one may be asked to suggest a pattern or identify a pattern
    or trend (recognise a particular sequence or a number of sequences from an illustrative
    technique or from a written statement).
- word: Reasons
  meaning: Explain, justify, give the causes of.
- word: Refer to or With reference to
  meaning: Write an answer which uses some of the ideas provided in an illustrative
    technique or other additional material such as a case study.
- word: State
  meaning: Set down in brief detail. To refer to an aspect of a particular feature
    by a short statement or by words or by single word.
- word: Study
  meaning: Examine closely, pay special attention to, look carefully at and interpret.
- word: Suggest
  meaning: Set down your ideas on or knowledge of. Propose, put forward for consideration.
    Often coupled with why (requires a statement or an explanatory statement referring
    to a particular feature or features.)
- word: Use or using the information provided
  meaning: Base your answer on the information provided (on the content of an illustrative
    technique or a written statement).
- word: With the help of the information in
  meaning: Write an answer which uses some of the information in the illustrative
    technique as well as additional materials.
- word: What
  meaning: Used to form a question with selective ideas / details / factors.
- word: What differences are shown between A and B changes
  meaning: Use comparative statements to assess the changes involved as A to B. Factual
    descriptions of A and B are not required.
- word: Where
  meaning: At what place? To what place? From what place?
- word: Why
  meaning: For what cause or reason?
