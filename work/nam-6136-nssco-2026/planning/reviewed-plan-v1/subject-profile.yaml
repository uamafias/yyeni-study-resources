quantitative_model:
  required_components:
  - method
  - variable meanings
  - substitution
  - unit
  - interpretation
  interpretation_rules:
  - Distinguish absolute change, percentage change and percentage points.
  - Compare equivalent units and denominators.
  - Use clearly fictional original data and recompute all values.
  - State what is measured, its unit, denominator and period; distinguish totals,
    per-person values, percentage points and percentage changes.
  - Show the method and substitution where required; retain adequate working precision
    and state any final rounding. Interpretation explains the result in context rather
    than checking it by another arithmetic route.
  - 'Construct original datasets that reconcile: category counts to totals, shares
    to 100 percent where appropriate, and pie angles to 360 degrees. Check scale,
    labels, key, title and suitability for the variable.'
  - Do not imply that table or coordinate checks validate an unseen rendered graph.
    Learner construction tasks require an explicit model specification and independent
    numeric and representational review.
legal_and_jurisdiction_model:
  core_rule: Teach syllabus principles. Verify any current legal or policy claim using
    an official source; date historical examples.
  high_risk_topics:
  - national plans
  - population policies
  - health
  - gender-based violence
  - international agencies
learning_item_model:
  item_types:
  - flashcard
  - short_answer
  - data_response
  - practical_task
  - source_analysis
  flashcard_subtypes:
  - DEF
  - FEATURE
  - WHY
  - APP
  - CHAIN
  - INTERP
  - EVAL
  - PROC
  - CALC
  - MISCON
  rules:
  - One main target per card.
  - Parent slots practise integration, not another exhaustive list.
  - Every slot is filled once; new labels or deviations must be recorded.
  - Never copy exam/report phrasing.
terminology_rules:
- British English; N$; preserve official terms with a plain explanation.
- Do not conflate gender equality with identical lived opportunities or population
  density with distribution.
prohibited_patterns:
- examiners reward
- unsupported universal policy claims
- fabricated learner fieldwork
- copied assessment questions
semantic_review_questions:
- Is every mandatory syllabus outcome taught and practised, including outcomes with
  no assigned past-paper appearance?
- Does every definition distinguish the nearby concept learners confuse it with?
- Does each applied answer use a contextual fact that materially changes the reasoning?
- Does an explanation develop a mechanism and consequence rather than merely list
  labels?
- Are comparisons paired on the same feature and supported by relevant evidence?
- Are source findings interpreted rather than copied, and are causal claims supported
  and conditioned?
- Could another learner carry out the described method, with its sampling, recording
  and pilot adjustments?
- Do the research findings, conclusions and feasible recommendations follow the aim
  and evidence, with an implementer identified?
- Are researcher obstacles distinguished from community problems and matched with
  workable responses?
- Do every calculation, denominator, rounding decision and representation specification
  recompute correctly?
- Can each card answer be reconstructed from the notes alone, without needing an unavailable
  diagram or a different card?
- Is depth useful and proportionate, with distinct member targets and integrated parent
  tasks rather than repeated lists?
- Are exact source limitations preserved, including ambiguous report rubrics and absent
  standalone mark schemes?
variant_register:
- term: capital
  variants:
  - money capital
  - capital goods
  consequence: Finance purchases productive assets; money is not itself the produced
    equipment.
  teach_as: distinction
- term: education classification
  variants:
  - traditional and modern
  - formal, informal and non-formal
  consequence: These classify different aspects; do not treat the two groupings as
    interchangeable.
  teach_as: two independent classifications
- term: population description
  variants:
  - density
  - distribution
  consequence: Number per unit area differs from the spatial pattern.
  teach_as: distinction
- term: research statement
  variants:
  - hypothesis
  - research question
  consequence: A tentative testable proposition differs from the question the enquiry
    investigates.
  teach_as: paired examples
