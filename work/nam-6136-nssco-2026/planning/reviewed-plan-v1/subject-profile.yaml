    marks: 6
    ao_split:
      A: 3
      B: 3
    brief: 'An original 6-mark structured mini-task: State two relevant features [2],
      then Explain a source-supported consequence [4]. Both tariff pairs are observed.
      Use two to four appropriate objectives from this topic. AO split A3/B3 is a
      planning estimate. Do not turn the answer into a six-point list.'
  - item_type: data_response
    papers:
    - '1'
    - '2'
    marks: 6
    ao_split:
      B: 6
    brief: 'An original 6-mark data mini-task with a short self-contained table: Describe
      a supported pattern [2], then Discuss a choice using that evidence [4]. Both
      tariff pairs are observed. Name a decisive criterion and a condition. Use fresh
      figures, not a copied source.'
  - item_type: practical_task
    papers:
    - '3'
    marks: 35
    ao_split:
      B: 10
      C: 18
      D: 7
    brief: 'Cycle 1, water access and survey design: original supplied-investigation
      pack, 35 marks in total. Compose subparts using only observed primary-command/tariff
      pairs; each part is at most six marks. Plan the enquiry, apply sampling/data
      collection, pilot an instrument, organise and interpret supplied original data,
      and solve a practical research obstacle. Supply all context and datasets. AO
      B10/C18/D7 is a planner split, not an official Section A grid. Use distinct
      tasks and original figures in each cycle.'
  - item_type: source_analysis
    papers:
    - '3'
    marks: 15
    ao_split:
      B: 5
      C: 7
      D: 3
    brief: 'Cycle 1, water access and survey design: own-investigation rehearsal,
      15 marks in subparts of at most six. Model the reasoning first with a clearly
      fictional completed enquiry and its data, then supply prompts to transfer the
      method to the learner’s actual investigation. Link research question, aims,
