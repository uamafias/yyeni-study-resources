- 2026
route: full_igcse
guided_learning_hours: 130
source: Syllabi/Cambridge Curricula/IGCSE Cambridge /Business Studies-2026-syllabus.pdf
assessment_objectives:
- code: AO1
  name: Knowledge and understanding
  description: Demonstrate knowledge and understanding of facts, terms, concepts, conventions,
    theories and techniques commonly applied to or used as part of business behaviour.
  qualification_weight_percent: 40
- code: AO2
  name: Application
  description: Apply knowledge and understanding of facts, terms, concepts, conventions,
    theories and techniques.
  qualification_weight_percent: 20
- code: AO3
  name: Analysis
  description: Distinguish between evidence and opinion in a business context; order, analyse
    and interpret information in narrative, numerical and graphical forms.
  qualification_weight_percent: 25
- code: AO4
  name: Evaluation
  description: Present reasoned explanations, develop arguments, understand implications and
    draw inferences; make judgements, recommendations and decisions.
  qualification_weight_percent: 15
papers:
- paper_id: P1
  name: Short Answer and Data Response
  duration_minutes: 90
  marks: 80
  qualification_weight_percent: 50
  question_basis: Four questions, a mixture of short answers and structured data responses,
    each introduced by stimulus material. Content drawn from the entire syllabus.
  assessment_objective_weights: {AO1: 50, AO2: 20, AO3: 20, AO4: 10}
- paper_id: P2
  name: Case Study
  duration_minutes: 90
  marks: 80
  qualification_weight_percent: 50
  question_basis: Four questions on a case study supplied as an insert, with appendices of
    tables, graphs, extracts and advertisements. Content drawn from the entire syllabus.
  assessment_objective_weights: {AO1: 30, AO2: 20, AO3: 30, AO4: 20}
learner_context:
  region: Namibia
  medium: English
  currency: N$
  note: Learners have not necessarily studied Business Studies before; the syllabus assumes
    no prior study of the subject.
