  DEF:
  - meaning|term|definition
  FEATURE:
  - feature|name|point
  DIST:
  - difference|whereas|while
  PROC:
  - step|sequence|first
  - result|record|measurement
  WHY:
  - reason|because
  MECH:
  - cause|because
  - effect|result
  BEN:
  - advantage|benefit
  - because|effect
  LIM:
  - limitation|problem
  - effect|because
  APP:
  - given|resource|context|evidence
  - reason|because|application
  CHAIN:
  - cause|factor
  - link|because
  - effect|result
  EVAL:
  - judgement|decision|conclusion
  - evidence|reason|support
  CALC:
  - method|working
  - answer|result
  - unit|units|ratio
  INTERP:
  - pattern|trend|relationship|feature
  - evidence|value|data|observation
  MISCON:
  - confusion|error
  - correct|distinction
  - test|discriminate
  SYNTH:
  - link|combine
  - reason|effect
  short_answer:
  - point|method
  - mark|marks
  data_response:
  - resource|data
  - evidence|value
  - mark|marks
  case_analysis:
  - judgement|decision
  - reason|evidence
  - mark|marks
  practical_task:
  - hypothesis
  - method|sampling
  - data|evidence
  - conclusion
  - evaluation|improvement
variant_register:
- term: sampling
  variants:
  - random
  - systematic
  - stratified
  consequence: Selection rules have different implications for coverage and bias.
- term: plate boundary
  variants:
  - constructive
  - destructive
  - conservative
  consequence: State the relevant movement and hazard mechanism.
- term: wave type
  variants:
  - constructive
  - destructive
  consequence: Compare relative swash/backwash and sediment effects, subject to local
    conditions.
- term: industry type
  variants:
  - primary
  - secondary
  - tertiary
  consequence: Distinguish resource extraction, processing and service provision.
- term: migration type
  variants:
  - internal
  - international
  consequence: Specify the boundary crossed and the source/destination population.
conditioned_mechanisms:
- mechanism_id: CM-6137-BIOMASS
  name: Wood renewability
  asserted_when:
  - \bwood\b
  - \brenewable\b
  required_conditions:
  - name: replenishment/sustainable harvesting
    any_of:
    - \bregrow
    - \breplenish
    - \bsustainab
    - \bharvest
glossary_homonyms:
- term: watershed
  rule: Use watershed for the divide in this NSSCO teaching context; distinguish the
    US catchment usage explicitly in teacher metadata.
- term: relief
  rule: Distinguish land relief, relief rainfall and emergency aid.
- term: discharge
  rule: Specify river-flow volume per time or waste discharge.
prohibited_patterns:
- No copied examination text or recycled map answers.
- No invented numbers for real case studies.
- No description of a picture as a replacement when visual interpretation is the learning
  target.
- No universal conclusion/working/example-mark formula.
- No greenhouse/ozone conflation.
depictions:
  chart_model: none
  code_fence_languages: []
  rule: Use original PNG/SVG assets rendered from reproducible numerical/vector specifications.
    Images are linked in notes/items; no handwritten code-fence graphics. Full keys,
    units, orientation, readable labels and independent review are mandatory. The
    shared text-chart renderer is not a general Geography image validator.
