papers:
- paper_id: '1'
  name: Written thematic paper
  duration_minutes: 120
  marks: 75
  qualification_weight_percent: 37.5
  question_basis: 'Paper 1 2 hours 75 marks Written The paper will consist of 6 questions,
    two each from Sections A: Physical Geography, B: Economic activities and the use
    of resources, and C: Population and Settlement Studies. Answer three questions,
    choosing one from each section. Questions will be resource -based and involve
    problem solving and free response writing. This paper will provide as assessment
    of assessment objectives A, B and C. The weighting of this paper is 37.5%'
  assessment_objective_weights:
    A: 53.333333333333336
    B: 26.666666666666668
    C: 20.0
    D: 0.0
- paper_id: '2'
  name: Written geographical skills paper
  duration_minutes: 105
  marks: 65
  qualification_weight_percent: 32.5
  question_basis: Paper 2 1 hour 45 minutes 65 marks Written Learners must answer
    all the ques tions. This paper will be largely skills-based and candidates will
    not require knowledge of specific places, but will be expected to apply some knowledge
    of topics. This paper will test a learner’s ability to handle various ways of
    depicting geograph ical information. The questions will be neutral in that they
    do not require specific information of place. Learners will be able to demonstrate
    the skills of analysis and interpretation and application of gra phical techni
    ques as appropriate. One question will be specifically based on a large -scale
    (1:50 000) topographical map, with full colour map from any country in SADC. The
    map will always be presented with a full key. This paper will provide an assessment
    of assessment objectives A, B and C. The weighting of this paper is 32,5%
  assessment_objective_weights:
    A: 12.307692307692308
    B: 76.92307692307692
    C: 10.76923076923077
    D: 0.0
- paper_id: '3'
  name: Written geographical investigation paper
  duration_minutes: 120
  marks: 60
  qualification_weight_percent: 30.0
  question_basis: Paper 3 2 hours 60 marks Written The paper consists of two questions
    (i.e. one physical and on e human) based on techniques of geographical investigation.
    Learners are expected to answer all questions. Coursework will not become operational
    as an option until necessary materials and tr aining of teachers are in place
    but the methodology of teaching geographical enquiry skills and techniques will
    be encouraged. This paper will provide a complementary assessment of the assessment
    objectives tested by Paper 1 with an emphasis on the investigative assessment
    objective D. The weighting of this paper is 30% Topics to be assessed in each
    theme from 2020 -2024 will be highlighted under explan atory notes to teachers,
    page 30
  assessment_objective_weights:
    A: 20.0
    B: 20.0
    C: 20.0
    D: 40.0
assessment_objectives:
- code: A
  name: Knowledge with understanding
  description: 'A.1 the wide range of physical and human processes shaping development
    of: (a) physical, political, economic, social and cultural environments and their
    associated effects on the landscape; (b) spatial patterns and interactions which
    are important within such environments; A.2 the inter -relationships between people,
    their activitie s and the subsequent impacts on the environment and an ability
    to seek explanations for them; A.3 the importance of scale (local, regional or
    global ) and the time at which spatial distributions and the working of the systems
    are considered; A.4 the changes which occur through time in places, landscapes
    and spatial distribution'
  qualification_weight_percent: 30
- code: B
  name: Analysis
  description: B.1 extract and interpret geographical informa tion from maps, graphs,
    tables, cartoons, diagrams, photographs, computers and other relevant geographical
    sources; B.2 analyse geographical information; B.3 infer trends and consequences
    related to socio-geographical interactions; B.4 illustrate using labelled sketches.
  qualification_weight_percent: 41
- code: C
  name: Judgment and decision making
  description: 'C.1 reason and make judgements (including ev aluation and conclusions)
    which demonstrate where appropriate: (a) a sensitivity to and concern for landscape
    and the environment; (b) an aesthetic appreciation of the earth including its
    people, places, landscapes, natural processes and phenomena; (c) an appreciation
    of the attitudes, values and beliefs of cultural, economic, environmental, political
    and social issues which have a geographical dimension; (d) an awareness of the
    contrasting opportunities and constraints of people living in different places
    and under different physical and human conditions; (e) a willingness to review
    their own attitudes in the light o f new knowledge and experiences. C.2 recognise
    the role of decision making within a geographical context as affected by: (a)
    the physical, cultural, economic and political contexts in which decisions are
    made; (b) the values and perceptions of groups and individuals; (c) the choices
    available in the process of decision making and the influences and constraints
    within which they operate; C.3 recognise, analyse, discuss and evaluate strategies
    for sustainable development.'
  qualification_weight_percent: 17
- code: D
  name: Investigation (enquiry, practical and presentation skills)
  description: D.1 formulate a research topic; D.2 use suitable quantitative and qualitative
    techniques for observing, collecting, classifying, presenting, analysing and interpreting
    data; D.3 extract and interpret geographical information from a variety of relevant
    geographical sources such as maps and plans of various scales; audio-visual materials,
    internet and computer software, documentary materials and statistics; graphs;
    tables; cartoons D.4 depict the information in appropriate forms using maps, diagrams,
    etc. D.5 make informed judgements and decisions; D.6 select, use and present geographical
    information in an appropriate form and effective manner.
  qualification_weight_percent: 12
