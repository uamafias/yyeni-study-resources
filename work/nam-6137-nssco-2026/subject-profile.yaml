profile_id: yyeni-6137-geography-2026
version: 0.2.0-draft
status: draft
subject_name: Geography NSSCO 6137
language_variant: British English
purpose: Full teaching notes, retrieval/application cards and resource/investigation
  practice for Namibian learners on the confirmed 2026 three-paper route.
foundational_concepts:
- process and landform
- spatial evidence
- cause and consequence
- scale and time
- sustainability
- geographical enquiry
depth_model:
  note_mode: full teaching depth
  rule: Teach every named member, causal link, method and relevant case detail. Member
    notes complement the umbrella explanation; avoid repeated prose. Word budgets
    are generated, not a target to skim just above.
