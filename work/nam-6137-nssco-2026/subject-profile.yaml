  - link|because
  - effect|result
  EVAL:
  - judgement|decision|conclusion
  - evidence|reason|support
  CALC:
  - method|working
  - answer|result
  - unit|units|ratio
  INTERP:
  - pattern|trend|relationship|feature
  - evidence|value|data|observation
  MISCON:
  - confusion|error
  - correct|distinction
  - test|discriminate
  SYNTH:
  - link|combine
  - reason|effect
