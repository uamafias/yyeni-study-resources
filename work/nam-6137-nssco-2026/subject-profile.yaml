  performance_tasks:
  - item_type: short_answer
    papers:
    - '1'
    brief: 'Seven-mark original thematic/resource mini-package: short knowledge and
      explanation parts totalling 5 A marks plus two evidence-reading B marks. Choose
      live commands and exact tariffs for each part. This is a teaching package, not
      a copied whole question. In integrated enquiry use content-linked interpretation,
      not a supposed Paper 1 fieldwork-method question.'
    ao_split:
      A: 5
      B: 2
  - item_type: data_response
    papers:
    - '2'
    brief: 'Seven-mark original map/photograph/graph/data package, tailored to this
      topic: one knowledge mark, five analytical/resource marks and one supported
      decision mark. Supply all resources and keys needed. In map skills use a consistent
      1:50000 map; use actual licensed photographs where the outcome names photographs.'
    ao_split:
      A: 1
      B: 5
      C: 1
  - item_type: case_analysis
    papers:
    - '1'
    brief: Five-mark judgement on a precise geographical claim with a verified named
      case where appropriate. Use How far do you agree; judge relevant facts and reach
      a supported decision. Four marks judge relevant facts and one credits the supported
      decision, which may be implied. Apply the 2024 demand without forcing equal-sided
      essays. In integrated enquiry apply the judgement to the supplied investigation
      evidence.
    ao_split:
      C: 5
  - item_type: practical_task
    papers:
    - '3'
    brief: 'Original 30-mark investigation variant 1: emphasis on equipment, measurement
      and a usable sequence. Use coastal processes for topic 1.5, tourism for topic
      2.3, and alternating coastal/tourism contexts in topic 4.1. Include short parts
      with observed command/tariff combinations, two testable hypotheses, all data/stimuli,
      conclusions and specific evaluation. Planned allocation A6/B6/C6/D12 is a proportional
      teaching design from the 60-mark grid, not a claim that every official question
      has this split.'
    ao_split:
      A: 6
      B: 6
      C: 6
      D: 12
  - item_type: practical_task
    papers:
    - '3'
    brief: 'Original 30-mark investigation variant 2: emphasis on sampling, recording
      and practical limitations. Use coastal processes for topic 1.5, tourism for
      topic 2.3, and alternating coastal/tourism contexts in topic 4.1. Include short
      parts with observed command/tariff combinations, two testable hypotheses, all
      data/stimuli, conclusions and specific evaluation. Planned allocation A6/B6/C6/D12
      is a proportional teaching design from the 60-mark grid, not a claim that every
      official question has this split.'
    ao_split:
      A: 6
      B: 6
      C: 6
      D: 12
  - item_type: practical_task
    papers:
    - '3'
    brief: 'Original 30-mark investigation variant 3: emphasis on graphical completion,
      evidence and exceptions. Use coastal processes for topic 1.5, tourism for topic
      2.3, and alternating coastal/tourism contexts in topic 4.1. Include short parts
      with observed command/tariff combinations, two testable hypotheses, all data/stimuli,
      conclusions and specific evaluation. Planned allocation A6/B6/C6/D12 is a proportional
      teaching design from the 60-mark grid, not a claim that every official question
      has this split.'
    ao_split:
      A: 6
      B: 6
      C: 6
      D: 12
  - item_type: practical_task
    papers:
