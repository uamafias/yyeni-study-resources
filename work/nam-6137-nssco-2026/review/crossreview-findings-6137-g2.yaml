- issue_id: 6137-1.5-007
  severity: low
  category: coherence
  affected_ids: [ITEM-6137-1.5-P04, ITEM-6137-1.5-P06, ITEM-6137-1.5-P07]
  finding: >
    In three of the four 30-mark investigation packages, a "Name the two water movements" part follows a
    "Describe the swash/backwash sequence" part (or a "Name the uprush" part). The earlier part already
    requires the names, so the same knowledge earns marks twice (P04 b+c, P06 b+a, P07 a+c). In P04, 6 of the
    30 marks test longshore drift, which is unrelated to its beach-profile hypotheses. In P07(j), the prompt
    already gives U's after width as 30 m, so "calculate the mean from 29, 30, 31" is answered in the stem.
    The arithmetic is otherwise correct throughout: P04 3/30 = 1:10 vs 1:20; P05 means 20/30/40 mm; P06
    6/4 = +1.5 m; P07 10/20 = 50% and mean 30 m. Mark totals all equal 30.
  evidence: >
    P04 "(b) Describe the sequence producing longshore drift. [3] (c) Name the two water movements in that
    sequence. [2]"; P07 prompt "Mean widths before→after are U 20→30 m" then "(j) Complete U's mean after
