    Add to the stem: "Heights have been worked out from the field angle and distance readings for you."
  confidence: 0.6

# ---------------------------------------------------------------- 1.6
- issue_id: 6137-1.6-001
  severity: high
  category: curriculum
  affected_ids: [BL-6137-1.6.03-04, OBJ-6137-1.6.03-02, ITEM-6137-1.6-006-FEATURE, ITEM-6137-1.6-010-INTERP, CL-6137-1.6.03-02-2]
  finding: >
    The syllabus requires learners to name and describe the "minimum and maximum thermometer / six's
    thermometer". The notes do not describe how a Six's thermometer works or how it is read. There is no
    U-tube, alcohol, mercury, steel indices pushed by the mercury, maximum on one side and minimum on the
    other, reading at the lower end of the index (the end nearest the mercury), reading at eye level, or
    resetting the indices with a magnet. The notes say only "Read ... the specified end of the index" and
    "Reset ... using the approved method". The objective's recall card (006) asks for "a note of the missed
    reset", not anything about the instrument. Examiners set 4 marks on its use (2021 P1 1(a)(iv): read max
    on the right, min on the left, read the lower end of the index, reset with a magnet). In 2022 P3 1(a)(ii)
    learners "did not know which one was the min and max tube".
  evidence: >
    BL-6137-1.6.03-04: "A combined maximum–minimum or Six's thermometer uses indices to preserve the extremes
    ... Read the labelled scale and the specified end of the index ... Reset only after recording, using the
    approved method for the particular instrument."
  educational_consequence: >
    A learner using only these notes cannot describe the instrument, read it from a diagram or explain the
    reset. This was a repeated examiner-reported weakness, and 2028 Paper 3 is Weather and Climate.
  recommended_repair: >
    Add: "A Six's thermometer is a U-shaped tube. Expanding or contracting alcohol pushes a thread of
    mercury, and the mercury pushes a small steel index along each arm. The index stays at the furthest
    point reached. The maximum is read on the right-hand (maximum) scale and the minimum on the left-hand
    (minimum) scale, which reads upside down. Read at the bottom of each index, the end touching the
    mercury, with the eye level with the index. After recording, reset by drawing each index back down to
    the mercury with a magnet." Replace 006 with "Describe how a Six's thermometer is read and reset. [3]".
  confidence: 0.85

- issue_id: 6137-1.6-002
  severity: medium
  category: curriculum
  affected_ids: [BL-6137-1.6.02-01, BL-6137-1.6.02-03, ITEM-6137-1.6-P01, CL-6137-1.6.02-01-1]
  finding: >
    The Stevenson-screen notes deliberately avoid giving the standard height and imply that wood is not a
    defining feature. 2022 P3 1(a)(i) expected "121 cm above ground" (about 1.2 m) and "wooden slats", and
    examiners commented "Wood is a bad conductor of heat". The notes never state the poor-conductor or
    insulating role. They also tell learners not to give a number, which removes a creditable point.
  evidence: >
    BL-6137-1.6.02-03: "Different observing standards give precise height requirements, so follow the stated
    method rather than inventing one universal number from a drawing." BL-6137-1.6.02-01: "Modern shelters
    can use different materials, so the function should be understood rather than reduced to wood alone."
    (wood was never introduced)
  educational_consequence: >
    Learners omit the height and the wood/insulation point, both standard marking points in a 3-mark screen
    question.
  recommended_repair: >
    "The screen stands on legs so that the thermometers are about 1.2 m above the ground (standards range
    from about 1.25 to 2 m), usually over short grass. This keeps them away from heat radiated by the ground.
    It is traditionally made of wood, a poor conductor of heat, so the box itself does not warm the
    instruments."
  confidence: 0.8

- issue_id: 6137-1.6-003
  severity: medium
  category: analysis
  affected_ids: [BL-6137-1.6.08-05, CL-6137-1.6.08-02-1]
  finding: >
    The altitude paragraph explains why higher sites are cooler by appealing to rising air that expands and
    cools. That is the adiabatic process for a moving parcel, not the reason a fixed mountain site is cooler
    than a lowland site. The standard NSSCO reasons are missing: the atmosphere is heated mainly from the
    ground (by radiation from the Earth's surface), so air farther from that surface is cooler; and air at
    altitude is thinner (less dense) and absorbs or holds less heat. A learner reading the notes would
    explain altitude cooling with the rising-parcel mechanism.
  evidence: >
    BL-6137-1.6.08-05: "Altitude commonly influences temperature in the troposphere: higher sites are
    generally cooler than comparable lower sites. Rising air expands in lower surrounding pressure and
    cools, while the environmental temperature profile also reflects heating, mixing, radiation and
    atmospheric structure."
  educational_consequence: >
    Learners give a process-of-rising-air answer to "why is it cooler at higher altitude". They miss the
    heated-from-below and thin-air points, and so mix up the lapse rate with rainfall-forming uplift.
  recommended_repair: >
    "Higher places are generally cooler because the air is heated mainly from below, by heat radiated from
    the Earth's surface, so places higher above the general land surface receive less of it. Air at height
    is also thinner (less dense) and holds less heat. A typical school figure is about 6.5°C cooler per
    1,000 m, although inversions can reverse this over a layer." Keep "rising air expands and cools" in the
    rainfall section, where it belongs.
  confidence: 0.65

- issue_id: 6137-1.6-004
  severity: medium
  category: curriculum
  affected_ids: [BL-6137-1.6.08-08, BL-6137-1.6.08-15, OBJ-6137-1.6.08-03, OBJ-6137-1.6.08-06]
  finding: >
    The pressure-system and ocean-current factors are taught only abstractly, and the examined named
    content is missing. (1) The notes never explain why subtropical high pressure and deserts occur near
    23-30°S/N: air rises at the Equator, spreads poleward, cools and descends at the tropics (2022 P1
    1(a)(iv)). (2) Namibia's own controls are unnamed: no subtropical/South Atlantic high, and no ITCZ or
    seasonal convergence zone moving south in summer to bring rain to northern Namibia. (3) The notes do not
    say that cold currents flow from higher latitudes towards the Equator (the Benguela flows northward). The
    2023 P2 1(b) item asked for this direction. They also do not teach the inversion/stable-air mechanism:
    cold water cools air from below, so it cannot rise, and onshore air is cooled, which gives fog but little
    rain. That mechanism is the standard explanation of the Namib's low rainfall.
  evidence: >
    BL-6137-1.6.08-15: "Large-scale convergence zones can move seasonally and help organise rainfall patterns
    ... A summer-rainfall pattern in part of the southern African interior can be connected to seasonal
    moisture and ascent". BL-6137-1.6.08-08: "The Benguela system off southwestern Africa brings a cold
    marine influence along Namibia's coast ... NASA accounts connect fog over the Namib with the cool
    coastal ocean".
  educational_consequence: >
    Learners cannot answer "explain why deserts lie near 23°" or "describe the direction of cold currents".
    They give vague high/low contrasts, which is the weakness examiners reported.
  recommended_repair: >
    Add: "Air rising at the Equator spreads towards the poles, cools and sinks at about 20-30° north and
    south, forming subtropical high pressure. The sinking air warms and dries, so rainfall is low; many
    deserts, including the Namib, lie here on west coasts." And: "The cold Benguela Current flows northward
    along Namibia's coast, from higher latitudes towards the Equator. It cools the air above it, so the air
    is stable and does not rise to form rain clouds, but fog often forms." And: "In summer the zone of
    converging, rising air (ITCZ) moves south, bringing most rain to northern and north-eastern Namibia."
    Drop the attribution "NASA accounts".
  confidence: 0.7

- issue_id: 6137-1.6-005
  severity: low
  category: accuracy
  affected_ids: [BL-6137-1.6.03-11, ITEM-6137-1.6-014-INTERP, CL-6137-1.6.03-06-1]
  finding: >
