# ================================================================ coverage and learner tests
# TOPIC 1.5 Coastal/Marine processes
#   Read: full rendered notes (478 lines), all 78 claims in the canonical ledger, all 60 items (53 cards +
#   P01-P07, including the four 30-mark packages P04-P07, every part, answer and rubric). Examiner findings
#   tagged 1.5 were read. I did not open any images.
#   Objective coverage: every 1.5 objective (1.5.01-1.5.10 with members, 1.5.91-93, X.01) has notes text and
#   at least one card. Gaps in depth: 1.5.04 "explain the energy of the waves" (6137-1.5-001), cross-beach
#   sorting (-003), prevailing-wind link (-002).
#   Checked and found correct: all directions and geometry (longshore-drift plans with the sea to the west
#   and NE swash/W backwash giving net north; groyne updrift south with northward drift; the spit plan can
#   be drawn); the refraction, tombolo, bar, notch and platform mechanisms; all arithmetic (30-18=12,
#   15-28=-13, 1:10 vs 1:20, 20/30/40 mm, +1.5 m, 50%, 30 m); the 30-mark totals; the P05 H2 rejection; the
#   P06 non-recovery handling. No non-British spelling, no money, no "examiners reward" wording.
#   Learner test 1: OBJ-6137-1.5.04 (constructive/destructive with energy). NOT supported to top tariff. The
#   notes give only the swash/backwash balance and "low/high, less steep/steeper"; no energy, frequency,
#   wavelength or breaker type.
#   Learner test 2: OBJ-6137-1.5.06-07 (headland and bay). Mostly supported: differential resistance and
#   relative retreat are well explained. The terms "discordant" and "rock bands at right angles" and the
#   naming of erosion processes in that explanation are missing, so a top mark is unlikely.
#
# TOPIC 1.6 Weather and Climate
#   Read: full rendered notes (438 lines), all 80 claims, all 55 items (52 cards + P01-P03). Examiner
#   findings tagged 1.6 were read. I did not open any images.
#   Objective coverage: every 1.6 objective (1.6.01-1.6.08 with members, 1.6.91, X.02) has notes text and a
#   card. Thin: 1.6.03-02 Six's thermometer (-001; its recall card 006 does not test the instrument),
#   1.6.02 screen height and wood (-002), and 1.6.08 pressure systems and currents named content (-004).
#   Checked and found correct: Southern Hemisphere rotation (low clockwise, high anticlockwise); the
#   south-facing screen door; all arithmetic (16°C, 20°C, 10°C, 12/3/6 mm, 6 h, 18/6 h, 8 hPa over 12 h,
#   5 m/s = 18 km/h, 60%/50%, 19.2°C, ranges 6/18°C, 26/4/12/4/17); 63% RH at 25/20°C is consistent with
#   standard tables; the warm/cold front slopes; rain shadow; ozone vs greenhouse. No non-British spelling
#   and no money.
#   Learner test 1: OBJ-6137-1.6.03-02 (max/min / Six's thermometer). NOT supported. No construction,
#   reading or magnet-reset procedure.
#   Learner test 2: OBJ-6137-1.6.06 (types of rainfall). Supported. The trigger, ascent, cooling,
#   condensation and precipitation chain is clear for convectional, relief (with rain shadow) and
#   frontal/cyclonic rainfall. Adding "evaporation/transpiration supplies moisture" to the convectional
#   chain would match the 2021 P1 marking points fully.
