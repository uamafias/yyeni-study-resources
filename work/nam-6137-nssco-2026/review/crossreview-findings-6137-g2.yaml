# Read-only semantic review, group g2: 6137 topics 1.5 Coastal/Marine processes and 1.6 Weather and Climate
# Reviewer: Claude (cross-vendor review of Codex authoring). No repository files were changed.

# ---------------------------------------------------------------- 1.5
- issue_id: 6137-1.5-001
  severity: high
  category: curriculum
  affected_ids: [BL-6137-1.5.04-01, BL-6137-1.5.04-02, OBJ-6137-1.5.04, ITEM-6137-1.5-009-DIST, ITEM-6137-1.5-010-APP, ITEM-6137-1.5-011-INTERP, ITEM-6137-1.5-012-INTERP, ITEM-6137-1.5-P02, CL-6137-1.5.04-1]
  finding: >
    The syllabus objective reads "distinguish the types of waves such as constructive and destructive and
    explain the energy of the waves, swash and backwash". The notes and cards never explain wave energy.
    The words "low energy" and "high energy" appear nowhere in the 1.5 notes (grep count 0). The notes give
    no frequency (constructive about 6-8 per minute, destructive about 10-14 per minute), no wavelength
    contrast, no breaker type (spilling/surging vs plunging), and do not say that destructive waves plunge
    down and so drive a strong backwash. They also do not cover the beach profiles each type produces (gentle
    or berm-building vs steep). The only characterisation is "relatively low, less steep waves" vs "higher,
    steeper waves", and all cards (009-012, P02) test only the swash/backwash balance or a net-units sum.
    2026 Paper 3 is the coastal topic, so this is the core wave-type content a learner needs.
  evidence: >
    BL-6137-1.5.04-02: "Constructive conditions are commonly associated in the school model with relatively
    low, less steep waves and sufficient time for swash to move material onto the beach ... Destructive
    conditions are commonly associated with higher, steeper waves and stronger backwash relative to swash".
    ITEM-6137-1.5-009-DIST canonical: "Constructive conditions have relatively stronger swash and tend to
    accumulate beach material. Destructive conditions have relatively stronger backwash ..."
  educational_consequence: >
    A learner asked to "explain the energy of" or "describe the characteristics of" constructive and
    destructive waves can give only the swash/backwash balance. They cannot use height, frequency,
    wavelength, breaker form or energy, so they lose most of the marks on a standard 4-6 mark wave-type
    question.
  recommended_repair: >
    Add a paragraph to CU-6137-1.5.04, for example: "Constructive waves are low-energy waves. They are
    low in height with a long wavelength and arrive infrequently, roughly 6-8 a minute. They spill or surge
    onto the beach, so the strong swash carries material up the beach. Much of the water soaks into the
    beach, leaving a weak backwash, so material is deposited and a gently sloping beach with berms builds
    up. Destructive waves are high-energy waves, often generated by storms. They are high and steep with a
    short wavelength and arrive frequently, roughly 10-14 a minute. They plunge downwards, so the swash is
    weak and the backwash strong, and material is dragged off the beach, leaving a steeper profile." Add one
    card: "Explain why destructive waves remove beach material [3]", rewarding high energy, plunging
    breaker/frequent waves and backwash stronger than swash.
  confidence: 0.9

- issue_id: 6137-1.5-002
  severity: medium
  category: curriculum
  affected_ids: [BL-6137-1.5.07-01, ITEM-6137-1.5-028-PROC, ITEM-6137-1.5-P04, ITEM-6137-1.5-P06, CL-6137-1.5.07-1]
  finding: >
    The longshore-drift explanation never links the angle of wave approach to the prevailing wind. The word
    "prevailing" appears 0 times in the 1.5 notes and items. Marking points on past Paper 3 longshore-drift
    questions (2021 P3 1(b)(iii); 2024 P3 1(e)(i), labelled diagram) begin with "wind drives waves / waves
    move in the direction of the prevailing wind". The 2024 report marks down diagrams that lack arrows for
    prevailing wind direction and for longshore-drift direction. The notes also never tell learners that a
    longshore-drift diagram should show these arrows.
  evidence: >
    BL-6137-1.5.07-01: "Waves approaching at an angle can send swash diagonally up the beach. Gravity then
    returns backwash more directly downslope." ITEM-6137-1.5-028-PROC canonical: "Oblique waves send swash
    diagonally up the beach ..." (no cause of the oblique approach).
  educational_consequence: >
    Learners leave out the first marking point (the wind driving waves at an angle) and draw diagrams with
    no prevailing-wind or drift-direction arrows, which is the error examiners named.
  recommended_repair: >
    Add to BL-6137-1.5.07-01: "Waves are driven by the wind, so they usually approach the shore at the angle
    of the prevailing wind." Add to the diagram guidance: "A labelled diagram should show the prevailing
    wind direction, the oblique swash, the backwash at right angles to the shore and the direction of net
    drift." Add "waves driven by the prevailing wind approach at an angle" as the first creditable point in
    028 and in the P04(b)/P06(b) rubrics.
  confidence: 0.8

- issue_id: 6137-1.5-003
  severity: medium
  category: curriculum
  affected_ids: [BL-6137-1.5.09-02, CU-6137-1.5.92, ITEM-6137-1.5-P05]
  finding: >
    Nothing in the notes or cards explains why beach material varies in size across the beach, from the
    waterline up to the back of the beach. 2024 Paper 3 1(d)(iv) asked exactly this ("Describe three reasons
    why the size of beach material varies across the beach"). The expected points were: strong swash or
    storm waves throw large material up the beach; the weaker backwash carries only smaller material back
    down; attrition is more frequent near the water. The notes only say "Waves and currents sort and
    redistribute the sediment". The pebble package P05 tests only an alongshore (northward) size trend.
  evidence: >
    BL-6137-1.5.09-02: "Waves and currents sort and redistribute the sediment, producing a changing profile."
    (no mechanism). P05: "Sites at northward distances 0,10,20 m ..."
  educational_consequence: >
    In a 2026 Paper 3 pebble or profile question, learners will list erosion processes without explaining
    sorting. The 2024 report names this as the common failure.
  recommended_repair: >
    Add to CU-6137-1.5.92 or 1.5.09: "Across a beach, material is often sorted by size. Strong swash,
    especially in storms, carries large pebbles to the back of the beach. The weaker backwash can carry only
    smaller material back down. Material near the water is moved more often, so attrition makes it smaller
    and rounder. Large pebbles are therefore often found at the top of the beach and finer sand near the
    sea." Consider adding a card, or a P05 variant, sampling along a shore-normal transect.
  confidence: 0.8

- issue_id: 6137-1.5-004
  severity: low
  category: curriculum
  affected_ids: [BL-6137-1.5.06-07, ITEM-6137-1.5-027-INTERP]
  finding: >
    The headland-and-bay explanation is correct but never uses the terms "discordant coastline" or "bands of
    hard and soft rock at right angles to the coast". Both are expected answers in 2020 P1 2(a)(iii), where
    examiners said candidates "did not even mention the erosion processes". The notes do not name the erosion
    processes in the headland/bay paragraph either.
  evidence: "BL-6137-1.5.06-07: \"The model is particularly clear where alternating rock bands meet the coast.\""
  educational_consequence: Learners lose the vocabulary marks (discordant; rock bands at right angles; names of erosion processes).
  recommended_repair: >
    "Where bands of more and less resistant rock run at right angles to the coast (a discordant coastline),
    hydraulic action and abrasion erode the less resistant rock faster to form bays, leaving the more
    resistant rock as headlands."
  confidence: 0.7

