# ---------------------------------------------------------------- 1.4
- issue_id: 6137-1.4-001
  severity: high
  category: curriculum
  affected_ids: [BL-6137-1.4.04-05, BL-6137-1.4.04-06, ITEM-6137-1.4-019-INTERP, ITEM-6137-1.4-016-PROC, CL-6137-1.4.04-02-1]
  finding: >
    Syllabus 1.4.04 names "seif dunes at Swakopmund" and asks learners to describe and explain wind-deposition landforms in
    Namibia. The notes avoid stating that seif dunes occur at Swakopmund, saying only that the area "contain[s] varied
    forms". They never explain why seif or linear dunes form in the Namib: the prevailing south to south-westerly winds run
    roughly parallel to the ridges; seasonal winds from another direction (e.g. easterly berg winds) keep the ridges
    elongated; sand supply is plentiful; vegetation is sparse and conditions are dry. The only seif card (ITEM-019)
    deliberately avoids the wind explanation. 2024 P1 2(a)(iii) asked "Describe why seif dunes are formed in the Namib
    Desert", and its expected answers are exactly these factors.
  evidence: >
    BL-6137-1.4.04-06: "Namibia's coastal dune environments, including the broader Swakopmund area used for studying wind
    deposition, contain varied forms. A seif or linear dune should be identified by its elongated ridge rather than by
    assuming that the place name establishes its type." ITEM-019 answer: "Today's wind alone cannot establish the long-term
    formation regime."
  educational_consequence: >
    Learners cannot give the syllabus's named example with confidence, and cannot explain why seif dunes form in the Namib.
    That answer was poorly done in 2024.
  recommended_repair: >
    Rewrite BL-6137-1.4.04-06: "Seif (linear) dunes occur in the dune belt around Swakopmund and across much of the Namib
    Sand Sea. They form where a strong prevailing south to south-westerly wind blows roughly along the ridge, while
    occasional winds from another direction (such as hot easterly berg winds in winter) pile sand onto the flanks so the
    ridge grows in length rather than migrating as a crescent. A plentiful sand supply (sand brought north along the coast
    and blown inland), sparse vegetation and dry, loose sand allow long ridges to build." Add an EXPLAIN card: "Describe why
    seif dunes form in the Namib Desert near Swakopmund." Verify the dune-belt detail against a source before publishing.
  confidence: 0.8

- issue_id: 6137-1.4-002
  severity: low
  category: curriculum
  affected_ids: [BL-6137-1.4.04-03, BL-6137-1.4.04-04, ITEM-6137-1.4-018-INTERP]
  finding: >
    The star-dune explanation gives only the multi-directional wind regime. It does not state the plentiful sand supply that
    large star dunes such as those at Sossusvlei require, or that each arm has its own slip face. The 2024 P1 2(b)(i) mark
    scheme credits both points ("unlimited supply of sand"; "peak with many arms/slip faces").
  evidence: >
    BL-6137-1.4.04-03: "Winds from different directions over time can promote deposition and redistribution around more than
    one flank, helping build the complex shape."
  educational_consequence: Learners get one of the three formation points and lose easy marks.
  recommended_repair: >
    Add: "Star dunes need a very large sand supply. Because winds blow from several directions over the year, sand is pushed
    back towards the centre, so the dune grows upwards into a high peak with several arms, each with its own slip face,
    instead of moving away."
  confidence: 0.7

