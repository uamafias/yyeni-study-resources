# ---------------------------------------------------------------- 1.1
- issue_id: 6137-1.1-001
  severity: high
  category: curriculum
  affected_ids: [BL-6137-1.1.03-01, BL-6137-1.1.03-02, BL-6137-1.1.03-03, ITEM-6137-1.1-008-PROC, ITEM-6137-1.1-009-INTERP, CL-6137-1.1.03-1, CL-6137-1.1.03-2]
  finding: >
    Syllabus 1.1.03 asks learners to "describe how convection current causes plate movement". Neither the notes nor
    any card states the causal link: the sideways-moving mantle current drags/carries the overlying plate, and plates
    move apart above rising currents and towards each other above sinking currents. The notes only say the flow "can be
    associated with" plate motion, then shift to slab pull/ridge push and warn against the convection model. The model
    answer for ITEM-008 ends "completing circulation connected to plate motion", so a learner learns the convection
    loop but never how it moves a plate. The 2023 P1 1(a)(ii) report says candidates lost the second mark for exactly this
    missing result (rising magma, crust breaking, plates moving).
  evidence: >
    BL-6137-1.1.03-02: "Rising and spreading mantle flow can be associated with plates moving apart ... It should not imply
    that friction from one circular current is the sole force moving every plate". ITEM-008 answer: "Cooler, denser material
    sinks elsewhere, completing circulation connected to plate motion."
  educational_consequence: >
    Learners describe heat transfer and circulation but leave out the plate-moving step. They lose the result mark on the
    syllabus's own question and may conclude that convection does not move plates.
  recommended_repair: >
    Add to BL-6137-1.1.03-02: "Where the current moves sideways beneath the lithosphere, it drags the plate above it in the
    same direction. Plates therefore move apart above rising currents (constructive margins) and towards each other where
    currents converge and sink (destructive margins). Slab pull and ridge push add to this movement." Change the ITEM-008
    answer to end "...the sideways flow drags the overlying plates, moving them apart above the rising current and together
    where it sinks." Update the marking guidance to "1 for sideways flow dragging the plate", and add this point to CL-6137-1.1.03-1.
  confidence: 0.85

- issue_id: 6137-1.1-002
  severity: medium
  category: curriculum
  affected_ids: [BL-6137-1.1.09-06, BL-6137-1.1.09-08, ITEM-6137-1.1-033-FEATURE, ITEM-6137-1.1-031-INTERP]
  finding: >
    Objective 1.1.09 ("explain how earthquakes and volcanoes are formed and their impact on human beings and the
    environment") is only partly covered by cards. Volcanic impacts and how volcanoes form get no card: the only 1.1.09-02
    card is "Name ... lava". The notes also never teach two recurring, high-tariff 1.1.09 demands: why people continue to
    live in earthquake or volcanic areas (2020 P1 1(c), 2023 P1 1(a)(iv), 5 marks), and why an earthquake of the same
    magnitude causes more deaths in an LEDC than an MEDC (2020 P1 1(a)(iv), 2023 P1 1(b)(ii), 5 marks). BL-09-08 has one
    generic sentence. BL-09-06 mentions soils, geothermal energy and tourism only as long-term opportunities.
  evidence: >
    BL-6137-1.1.09-08: "The same earthquake can have different consequences in two places with different buildings, ground
    conditions and response capacity." ITEM-033 prompt: "Name molten rock after it emerges at the Earth's surface."
  educational_consequence: >
    Learners could not write a top-tariff answer to "Explain why people live in areas where earthquakes occur" or to the
    LEDC/MEDC contrast from these notes. They also never practise describing volcanic effects on people and the environment.
  recommended_repair: >
    Add a short block under 1.1.09: reasons people stay (cannot afford to move, family and land ties, jobs, fertile weathered
    volcanic soils, geothermal energy, minerals, tourism, infrequent events, confidence in buildings or warnings). Add a
    contrast block on LEDC/MEDC vulnerability (building quality and enforcement, warning systems, emergency and medical
    services, transport access). Add one card on volcanic effects on people and the environment and one card on why people
    live in hazard zones.
  confidence: 0.8

