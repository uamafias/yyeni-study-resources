# ---------------------------------------------------------------- 1.2
- issue_id: 6137-1.2-001
  severity: high
  category: curriculum
  affected_ids: [BL-6137-1.2.02-09, BL-6137-1.2.85-01, BL-6137-1.2.85-03, BL-6137-1.2.84-01, BL-6137-1.2.82-03]
  finding: >
    Syllabus 1.2.02 reads "name and describe types of weathering and associated landforms". The notes never name a
    weathering landform. They refer only to "rounded residual masses", "solution features" and "loose angular material", and
    no item asks for a landform. Missing: scree/talus slopes below frost-shattered cliffs, exfoliation domes on granite,
    residual boulders or tors (kopjes), and limestone solution landforms (enlarged joints, caves). The 2024 P1 1(b)(ii)
    exfoliation diagram also reserved a mark for "talus/scree/regolith at base of dome". The exfoliation blocks never
    mention debris collecting at the base.
  evidence: >
    BL-6137-1.2.02-09: "Bare rock, fractured blocks, rounded residual masses and solution features all need a process
    explanation appropriate to their evidence." No item in topic_1.2_items.json names or asks for a weathering landform.
  educational_consequence: >
    Learners cannot name or describe the landforms the syllabus requires. They also drop the scree/talus mark when drawing
    or describing exfoliation.
  recommended_repair: >
    Add a block "Landforms produced by weathering": scree (talus) of angular fragments below jointed cliffs where
    freeze-thaw operates; exfoliation domes, rounded granite hills with curved peeling sheets and loose sheets and debris at
    their foot; residual boulders or kopjes left as jointed granite weathers along its joints; limestone joints widened by
    carbonation into grooves and caves. Optionally add Namibian granite inselbergs (e.g. Spitzkoppe) and Otavi-area dolomite
    caves, after verifying them against a source. Add the base-debris step to BL-6137-1.2.85-01 and the exfoliation card
    answers. Add one FEATURE or INTERP card asking for a landform of physical weathering and its process.
  confidence: 0.8

- issue_id: 6137-1.2-002
  severity: medium
  category: curriculum
  affected_ids: [BL-6137-1.2.03-04, BL-6137-1.2.03-05, ITEM-6137-1.2-011-FEATURE, CL-6137-1.2.03-02-1]
  finding: >
    The rock controls on weathering (1.2.03-02) are taught only as mineral composition, joints and porosity/permeability.
    Grain size is mentioned in passing without a mechanism. Hardness/resistance and rock colour (darker rocks absorb more
    heat, which matters for thermal weathering) are absent. The notes also discourage the hardness framing ("misleading to
    call one rock universally weak"). The 2022 P1 2(b)(iii) answer for "Describe two rock features which influence the rate
    of weathering" credits hardness, composition, grain size, jointing, permeability and colour.
  evidence: >
    BL-6137-1.2.03-04: "It is misleading to call one rock universally weak and another universally strong without
    specifying the process." BL-6137-1.2.03-05: "Bedding, grain size and the arrangement of minerals can also influence how
    weathering proceeds."
  educational_consequence: >
    Learners have a narrow list of rock features, and may avoid the resistance and colour answers that the mark scheme
    credits.
  recommended_repair: >
    Add to BL-6137-1.2.03-04/05: "Rock resistance: less resistant rocks generally break down faster under a given process
    than more resistant ones. Grain size: coarse-grained rocks such as granite can loosen grain by grain as different
    minerals expand by different amounts. Colour: dark rock absorbs more heat by day, so surface heating and cooling, and the
    thermal stress they cause, can be greater." Keep the existing "depends on the process" qualifier.
  confidence: 0.7

# ---------------------------------------------------------------- 1.3
- issue_id: 6137-1.3-001
  severity: high
  category: analysis
  affected_ids: [BL-6137-1.3.06-02, BL-6137-1.3.06-06, BL-6137-1.3.06-11, ITEM-6137-1.3-032-FEATURE, ITEM-6137-1.3-034-FEATURE, CL-6137-1.3.06-01-1, CL-6137-1.3.06-01-2, CL-6137-1.3.06-03-2]
  finding: >
    Syllabus 1.3.06 asks why and where deposition occurs "with reference to volume and velocity of flow, nature of the load
    and bed-rock". The notes never teach the volume reason: when discharge falls (dry season, evaporation, seepage into
    permeable beds, abstraction, the end of a flood), the river has less energy and deposits load. Instead every volume
    passage warns against using volume as a reason, and the closing worked example shows deposition where discharge
    increases. The bedrock reason (water seeping into permeable or fissured bedrock reduces volume; obstacles and rock steps
    create slack water) appears only as a hedge. The only volume card names "discharge" (ITEM-032), and no card covers
    bedrock. A learner would reasonably conclude that volume is irrelevant to deposition.
  evidence: >
    BL-6137-1.3.06-02: "A deposition explanation must follow the actual change described, not substitute volume for
    velocity". BL-6137-1.3.06-11: "Discharge is greater at the second section even though velocity is lower ... not an
    incorrect claim that the volume passing per second must have decreased." BL-6137-1.3.06-06: "permeable ground can allow
    water losses that influence flow, but the resulting deposition must be linked to changed transport conditions rather
    than assumed from the rock name alone."
  educational_consequence: >
    Learners cannot answer the syllabus question about volume and bedrock, and may argue that volume does not matter. The
    worked example teaches the exception before the rule.
  recommended_repair: >
    Insert before BL-6137-1.3.06-11: "Volume: when the volume of water falls, for example in the dry season, through
    evaporation in hot dry areas, by seepage into a sandy or permeable bed, or through water abstraction, the river has less
    energy and can no longer carry all its load, so it deposits it. Many Namibian ephemeral rivers drop their load on their
    beds as flow dies away after rain. Bedrock: where the river crosses permeable or fissured rock, water seeps away and
    volume falls; resistant rock bars and boulders create sheltered slack water where load settles." Keep BL-06-11 as an
    explicitly labelled exception. Add an APP or CHAIN card: "Explain how a fall in discharge as a river crosses permeable
    sandy bedrock can cause deposition."
  confidence: 0.85

- issue_id: 6137-1.3-002
  severity: medium
  category: curriculum
  affected_ids: [BL-6137-1.3.07-10, ITEM-6137-1.3-041-INTERP]
  finding: >
    The syllabus names "inland deltas/oshanas" as a landform (1.3.07-05). The notes define an inland delta only in the
    abstract and never name the standard southern African example, the Okavango Delta in Botswana. It is fed by the
    Okavango (Kavango) River, which flows from Angola across Namibia's Kavango regions and ends in the Kalahari rather than
    the sea. Only the oshana example is given, and the only card tests oshanas.
  evidence: >
    BL-6137-1.3.07-10: "An inland delta is a branching depositional system that spreads within an interior basin rather than
    building directly into the sea ... When a resource names a particular system, describe its documented characteristics".
  educational_consequence: >
    Learners asked for a named inland delta, or to explain one, have no example and would fall back on the oshanas, which
    are a different system.
  recommended_repair: >
    Add to BL-6137-1.3.07-10: "The Okavango Delta in north-western Botswana is a major inland delta. The Okavango River,
    which crosses Namibia from Angola, spreads into distributaries across a flat basin. Its water is lost by evaporation,
    transpiration and seepage instead of reaching the sea, and it deposits sediment across the swamps." Add one FEATURE card
    naming it.
  confidence: 0.75

- issue_id: 6137-1.3-003
  severity: medium
  category: curriculum
  affected_ids: [BL-6137-1.3.04-01, BL-6137-1.3.04-05, BL-6137-1.3.04-12]
  finding: >
    The erosion landforms (waterfall, rapids, gorge) are taught only through hypothetical diagrams, with no named Namibian or
    southern African example. Examiner evidence rewards place-specific detail: 2022 P1 2(c) "Must include place specific
    information ... e.g. Ruacana waterfall on Kunene River", and 2021 P1 2(c) reserved a mark for a named floodplain example.
    Well-known examples are available: Ruacana and Epupa Falls on the Kunene, Popa Falls rapids on the Okavango, Fish River
    Canyon (gorge) and Victoria Falls with its gorges on the Zambezi.
  evidence: >
    BL-6137-1.3.04-12: "A gorge is a deep, narrow valley with steep sides. Retreat of a waterfall can create a gorge ..." (no
    named example anywhere in sections 1.3.03-1.3.05).
  educational_consequence: >
    Learners lose the place-specific marks on "named example of a fast-flowing river" questions and have no local reference
    for these landforms.
  recommended_repair: >
    Add one sentence per landform with a named example, e.g. "Ruacana and Epupa Falls on the Kunene River (waterfalls); Popa
    Falls on the Okavango (rapids); Fish River Canyon in southern Namibia (a deep gorge cut by the Fish River); Victoria Falls
    on the Zambezi, where retreat has left a series of zig-zag gorges." Add a short opportunities note: hydro-electric power
    at Ruacana and tourism at Epupa.
  confidence: 0.75

