# Reviewer: Claude (read-only). Date: 2026-10-30. No repo files edited.
# Scripts: scratchpad/check_claims_seen.py, scratchpad/dump_changes.py, scratchpad/find.py

claims_seen_check:
  script: /private/tmp/claude-501/-Users-professor-Documents-YYeni-Study-Resources/29c25c8f-cb06-4d79-a9df-d7841d205921/scratchpad/check_claims_seen.py
  result: >-
    All 23 Codex-revised claims are at revision 2 in their ledgers. Every block, item and
    part that cites them has claims_seen = 2 (60 citing references). No record lists a claim in
    claims_seen without citing it. A sweep of every claim across all 18 topics found 0
    claims_seen/revision mismatches. The ids are consistent. Text consistency is a separate
    question and fails in several places (F01, F07-F10).

findings:
  - id: F01
    topic: "2.4"
    object_ids: [CL-6137-2.4.04-R1, BL-6137-2.4.04-03, ITEM-6137-2.4-025-EVAL]
    severity: high
    defect: >-
      Codex changed the Atlas 45% figure to "electricity produced in Namibia". That is
      factually wrong. Ruacana alone produces most of Namibia's domestic generation:
      26% of all electricity used in 2018/19 while about 70% was imported, so roughly 85-90%
      of local output, and 87.3% of local generation in March 2025. The Atlas 45% can only be
      a share of electricity used. The wording also puts "in the Atlas account" in front of
      learners. ITEM-2.4-025 still says "45 per cent of Namibia's electricity", so the claim
      and the card now contradict each other.
    evidence:
      - "https://atlasofnamibia.online/node/144 - 'the Kunene that supplies up to 45 per cent of Namibia's electricity'"
      - "https://atlasofnamibia.online/node/126 - Ruacana 'contributed 26 per cent of all the electricity used in Namibia' (2018/19); 'about 70 per cent of the electricity used in Namibia has been imported'"
      - "https://www.namibian.com.na/local-power-lights-up-march-figures-with-59/ - Ruacana 'producing 87.3%' of locally generated electricity, March 2025"
    fix:
      - object: BL-6137-2.4.04-03
        old: "it supplies up to 45 per cent of electricity produced in Namibia in the Atlas account."
        new: "it supplies up to 45 per cent of the electricity Namibia uses and most electricity generated within Namibia."
      - object: CL-6137-2.4.04-R1 (raise to revision 3; reset claims_seen on BL-2.4.04-03, ITEM-2.4-025, ITEM-2.4-P03)
        old: "the Kunene supplies up to 45 per cent of electricity produced in Namibia in the Atlas account,"
        new: "the Kunene supplies up to 45 per cent of the electricity Namibia uses, and Ruacana produces most electricity generated in Namibia,"
      - object: ITEM-6137-2.4-025-EVAL
        note: "No change needed once the claim is corrected. Its existing wording matches the Atlas."

  - id: F02
    topic: "3.2"
    object_ids: [BL-6137-3.2.02-03, BL-6137-3.2.02-04, CL-6137-3.2.02-R1]
    severity: high
    defect: >-
      The syllabus objective OBJ-6137-3.2.02 says "account for its spatial distribution".
      Codex removed all the named Namibian location evidence Claude had added: Zambezi
      bordering Zambia and Botswana, the Trans-Caprivi Highway through Katima Mulilo,
      Ohangwena bordering Angola and its density (about 32 per km2 in 2023), and Kunene at
      about 1 per km2. The notes now say mainly what prevalence cannot prove, so the unit no
      longer gives learners the standard locational account. Keeping the non-causal caveat is
      right; deleting the geography is not.
    evidence:
      - "Current BL-6137-3.2.02-04: 'Regional prevalence alone cannot establish why regions differ or which explanation matters most.' There are no place-specific factors anywhere in CU-6137-3.2.02."
      - "topics/3.2/work_order.md: OBJ-6137-3.2.02 'interpret Namibia's HIV and AIDS statistics and account for its spatial distribution'"
    fix:
      - object: BL-6137-3.2.02-03
        old: "Transport routes and border crossings offer a possible explanation for part of the pattern. Travel or migration can separate partners,"
        new: "Zambezi borders Zambia and Botswana, and the Trans-Caprivi Highway carries freight through Katima Mulilo; Ohangwena borders Angola. Travel or migration along such routes can separate partners,"
      - object: BL-6137-3.2.02-04
        old: "Regional prevalence alone cannot establish why regions differ or which explanation matters most. It reflects past infections,"
        new: "Ohangwena is densely settled (about 32 people per km² in 2023); Kunene has about one person per km² and lower prevalence. These are associations: prevalence also reflects past infections,"
      - object: CL-6137-3.2.02-R1 (raise to revision 3; reset claims_seen on the 3 citers)
        old: "Mobility can affect sexual networks and access to prevention or treatment, but these regional prevalences do not establish the main cause of their differences."
        new: "Zambezi borders Zambia and Botswana on the Trans-Caprivi route through Katima Mulilo; Ohangwena borders Angola (about 32 people per km², 2023), Kunene about 1. Mobility can affect sexual networks and service access, but prevalence alone does not establish the main cause."

  - id: F03
    topic: "3.2"
    object_ids: [ITEM-6137-3.2-P03]
    severity: medium
    defect: >-
      The prompt asks whether Zambezi's prevalence is mainly due to "its transport routes and
      borders", but the answer never names Zambezi's borders or route. The rubric no longer
      requires the supplied or named evidence either, so the "for" side is a generic mechanism.
      The card is still two-sided, and the tariff of 2+2+1 = 5 is correct.
    evidence: "Current answer: 'Transport and borders are a plausible part of the explanation, but the figures cannot show that they are the main cause. Mobility can separate partners...'"
    fix:
      - field: canonical_answer
        old: "Transport and borders are a plausible part of the explanation, but the figures cannot show that they are the main cause."
        new: "Transport and borders are plausible: Zambezi borders Zambia and Botswana, and the Trans-Caprivi Highway crosses Katima Mulilo. The figures cannot show they are the main cause."
      - field: marking_guidance[0]
        old: "Up to 2 C marks for explaining a plausible mobility-related exposure or service-access mechanism."
        new: "Up to 2 C marks for a mobility-related exposure or service-access mechanism linked to Zambezi's borders or route."

  - id: F04
    topic: "2.4"
    object_ids: [BL-6137-2.4.09-03]
    severity: medium
    defect: >-
      Codex's new wording "reduce payments overseas" is wrong. Namibia imports electricity
      overland from SAPP neighbours such as South Africa, Zambia and Zimbabwe, not from
      overseas. The undated "generates less than half" is also out of date: Namibia produced
      51.6% of its own electricity in 2025.
    evidence: "https://www.namibian.com.na/share-of-sources-of-electricity-for-namibia/ (19 July 2026) - 'Namibia produced 51.6% of its own electricity in 2025', '52.2% in the first five months of this year'"
    fix:
      old: "Because Namibia generates less than half of the electricity it uses, local generation can displace imported electricity and reduce payments overseas."
      new: "Because Namibia generated less than half of the electricity it used in 2024, local generation can displace imported electricity and reduce payments to neighbouring suppliers."

  - id: F05
    topic: "2.4"
    object_ids: [ITEM-6137-2.4-038-CHAIN, ITEM-6137-2.4-P03]
    severity: medium
    defect: >-
      Both cards state "Namibia generates less than half of the electricity it uses" in the
      present tense. Their cited claim CL-6137-2.4.10-R1 and block BL-2.4.10-01 date this to
      2024, and 2025 local production was 51.6%. A learner reading in 2026 is given a
      statement that is now false.
    evidence: "CL-6137-2.4.10-R1: 'Namibia generates less than half of the electricity it uses (2024)'; Namibian 19 July 2026 as in F04"
    fix:
      - object: ITEM-6137-2.4-038-CHAIN
        old: "Namibia generates less than half of the electricity it uses and imports the rest"
        new: "In 2024 Namibia generated less than half of the electricity it used and imported the rest"
      - object: ITEM-6137-2.4-P03
        old: "Partly agree. Namibia generates less than half of the electricity it uses, and Ruacana"
        new: "Partly agree. In 2024 Namibia generated less than half of the electricity it used, and Ruacana"

  - id: F06
    topic: "1.6"
    object_ids: [CL-6137-1.6.02-01-R1, ITEM-6137-1.6-006-FEATURE, ITEM-6137-1.6-P01, BL-6137-1.6.02-01]
    severity: medium
    defect: >-
      Revision 2 of this claim dropped the "school model about 1.2 m" figure and "wood, a poor
      conductor of heat". Those are still taught by ITEM-1.6-006 (answer "About 1.2 m",
      prompt "in the school model"), ITEM-1.6-P01(b) ("about 1.2 m"; "wooden walls are poor
