# Review group g3 — 6137 NSSCO Geography, topics 1.7, 2.1, 2.6
# Reviewer: independent cross-review (Claude) of Codex-authored text. Read-only; nothing in the repository was changed.
# All arithmetic in notes and items for these three topics was recomputed and is correct (see per-topic comments at end).

# ---------------------------------------------------------------- 1.7
- issue_id: 6137-1.7-001
  severity: high
  category: curriculum
  affected_ids: [BL-6137-1.7.03-02, BL-6137-1.7.03-04, BL-6137-1.7.03-06, BL-6137-1.7.03-07, BL-6137-1.7.01-04, ITEM-6137-1.7-011-CHAIN, ITEM-6137-1.7-012-INTERP, CL-6137-1.7.03-01-1, CL-6137-1.7.03-03-2]
  finding: >
    The objective 1.7.03 asks learners to describe and explain the climate of each region under temperature, rainfall,
    wind, cloud cover and humidity. The notes never teach the explanations. They do not cover convectional rainfall at the
    equator (strong insolation, rising air, cooling, condensation, cumulonimbus, afternoon thunderstorms), the doldrums or
    ITCZ, the seasonal movement of the ITCZ that gives savannah its wet and dry seasons, the trade winds, or the descending
    air of subtropical high pressure over the deserts. They do not name the cold Benguela Current or explain how it gives the
    Namib fog but no rain. Wind is mentioned only to say that a graph cannot show it. "Subsidence" appears once, in a list,
    with no explanation. The only cards for 1.7.03 tell learners what a graph cannot show. ITEM-6137-1.7-011-CHAIN is tagged to
    1.7.03 but tests savannah vegetation response, which belongs to 1.7.02. So no card asks for a climate explanation. The
    examiner record contains exactly these questions: 2022 P1 1(a)(iii) "Explain how the amount of rainfall in a tropical
    desert is influenced by wind direction and atmospheric pressure" and 1(a)(iv) "Explain why many tropical deserts are
    located close to 23° N and S". Their expected answers are Hadley-type descent, high pressure, dry trade winds, cold
    west-coast currents and rain shadow. The distribution block also leaves out the west-coast and cold-current pattern of
    tropical deserts that examiners credit (2023 P2 1(a)).
  evidence: >
    BL-6137-1.7.03-02: "Frequent moist-air ascent and cloud formation can support precipitation... Do not turn this into a claim
    that rain falls at the same time every day". BL-6137-1.7.03-04: "Seasonal shifts in convergence, moisture-bearing airflow and
    pressure influence can help explain the rainfall contrast." BL-6137-1.7.03-07: "Cold marine influence and atmospheric
    stability can support cool surface conditions and fog despite low rainfall." Notes line 125: "does not identify whether dry
    conditions result mainly from subsidence, rain shadow, cold-current influence or continental position." ITEM-6137-1.7-011
    prompt: "Explain how seasonal water availability can help produce savannah vegetation..."
  educational_consequence: >
    A learner working only from these notes cannot answer the standard 4–5 mark climate-explanation questions. They have no
    pressure or wind mechanism for desert aridity, no convection chain for the equator, and no Benguela/fog chain for the
    Namib, which is their own country's desert.
  recommended_repair: >
    Add one explanatory paragraph per region, at NSSCO level. Equatorial: overhead sun all year → intense heating → air
    rises (low pressure, doldrums, light winds) → cools → condenses → cumulonimbus → heavy afternoon convectional rain; high
    humidity and cloud; about 26–28°C with a 1–3°C range. Savannah: the ITCZ and overhead sun move with the seasons; low
    pressure and convectional rain in summer; in winter, dry trade winds and high pressure give clear skies and low humidity.
    Tropical desert: air that rose at the equator descends at about 20–30° → high pressure → it warms as it sinks → no
    condensation → clear skies, low humidity, large diurnal range; dry offshore trade winds; on west coasts, cold currents
    (Benguela for the Namib) cool the air from below → stable air and an inversion → fog, not rain. Add the "west sides of
    continents beside cold currents" point to BL-6137-1.7.01-04. Retag ITEM-1.7-011 to 1.7.02, or rewrite it as "Explain
    why tropical deserts such as the Namib receive very little rainfall" (4 marks: descending air/high pressure; no
    condensation; offshore/trade winds dry; cold Benguela Current gives fog not rain).
  confidence: 0.9

- issue_id: 6137-1.7-002
  severity: medium
  category: curriculum
  affected_ids: [BL-6137-1.7.02-03, BL-6137-1.7.02-07, BL-6137-1.7.02-08, BL-6137-1.7.02-09, ITEM-6137-1.7-P01]
  finding: >
    The vegetation notes give generic features but leave out the named plants and features that the examined questions use.
    There is no welwitschia, even though the Namib is the named desert example and the 2022 P1 1(b)(ii) scheme states "No mark
    for plant names except the welwitschia". There is no baobab or acacia for savannah (water storage, thorns and small leaves,
    deep roots), and no fire-resistant bark is named. The rainforest features examined in 2023 P2 1(c), "thin branchless
    trunks" (grow tall to reach light) and "thick fleshy stems", are absent. Grass dormancy and leaf fall are present.
  evidence: >
    BL-6137-1.7.02-09 (notes line 81): "The Namib is a useful named setting because fog and highly variable rainfall create different
    water opportunities..." No plant is named anywhere in the notes.
  educational_consequence: >
    The learner cannot give the one place-specific plant that examiners credit, and cannot explain trunk features that have
    been examined directly.
  recommended_repair: >
    Add the following. Welwitschia: two long leaves that absorb fog moisture, a long taproot, and stomata that open after rain. Baobab: a
    water-storing trunk and dry-season leaf fall. Acacia: thorns and small leaves that reduce water loss and browsing, and a
    deep taproot. Rainforest: tall straight branchless trunks reaching the light of the canopy. Add one card asking how the
    welwitschia survives in the Namib.
  confidence: 0.8

- issue_id: 6137-1.7-003
  severity: medium
  category: curriculum
  affected_ids: [BL-6137-1.7.05-03, ITEM-6137-1.7-018-CHAIN]
  finding: >
    The consequences of deforestation are reduced to habitat loss, erosion of exposed soil, carbon release and "local
    moisture exchange". The hydrological chain that examiners list in 2021 and 2022 P1 is missing: reduced interception,
    increased runoff and flooding, less infiltration and groundwater, sediment in rivers, reduced transpiration, humidity and
    rainfall. Leaching and loss of soil fertility once the nutrient cycle is broken are only implied.
  evidence: >
    BL-6137-1.7.05-03: "Burning or decomposition of removed biomass can release carbon, and reduced tree cover changes uptake and
    local moisture exchange."
  educational_consequence: >
    Learners give two vague consequences where the scheme credits five distinct local and global impacts.
  recommended_repair: >
    Add: "Fewer trees intercept less rain, so more water reaches the ground quickly; infiltration falls and surface runoff
    rises, causing flooding and carrying soil into rivers (sedimentation). Less transpiration lowers humidity and can reduce
    local rainfall. Without litter, nutrients are leached and soils lose fertility. Burning and loss of trees add CO2,
    enhancing global warming."
  confidence: 0.8

- issue_id: 6137-1.7-004
  severity: medium
  category: evaluation
  affected_ids: [ITEM-6137-1.7-027-MISCON]
  finding: >
    The misconception card does not discriminate the misconception. The prompt itself states that drip tips and buttress
    roots are rainforest features wrongly applied to desert water storage, and it names the correct comparison. All the learner
    has to do is restate it. MIS-6137-23 asks for "Match adaptation functions to contrasting environments, explaining each
    match".
  evidence: >
    Prompt: "Explain the error in applying rainforest drip tips and buttress roots as a generic desert water-storage answer.
    Compare a moist-forest drainage/support feature with a waxy water-storing stem in scarce-water conditions."
  educational_consequence: >
    A learner who holds the misconception can still answer correctly, because the prompt has already corrected it.
  recommended_repair: >
    "Four features: drip-tip leaves, buttress roots, a thick waxy water-storing stem, spines instead of leaves. Match each
    to rainforest or tropical desert and explain the function in that environment. [2]"
  confidence: 0.75

- issue_id: 6137-1.7-005
  severity: medium
  category: evaluation
  affected_ids: [ITEM-6137-1.7-023-EVAL, ITEM-6137-1.7-025-EVAL, ITEM-6137-1.7-026-EVAL, ITEM-6137-1.7-P03]
  finding: >
    Every judgement card in 1.7 follows one template: "How far do you agree that [a label or input] proves [an outcome]?"
    The answer is "Disagree, the input does not prove the outcome". The only variation is 024's "Partly agree". None of these
    cards asks the learner to weigh real advantages and disadvantages of agroforestry, reforestation or sustainable harvesting
    (for example soil protection, fuel and fodder, income delay, land competition), which is what the 1.7.06 discussion
    objective needs. See also 6137-2.6-001, which covers the same pattern.
  evidence: >
    023 "Disagree. A name and stated inputs do not establish..."; 025 "Disagree. The planting count is an input..."; 026
    "Disagree for maintained stock..."; P03 "Disagree with both claims being established."
  educational_consequence: >
    Learners learn one reflexive move ("disagree, more evidence needed") rather than weighing substantive facts. It earns
    little on a real "How far do you agree" item, where 4 marks are for judging accurate relevant facts.
  recommended_repair: >
    Rewrite at least two of these as substantive judgements. Example: "How far do you agree that agroforestry is the best
    way to reduce deforestation in a farming area? [5]". The answer weighs soil cover and windbreaks, fuelwood that reduces
    clearance, and diversified income against the slow returns, tree–crop competition and need for tenure and training, and
    ends with a decision.
  confidence: 0.7

# ---------------------------------------------------------------- 2.1
- issue_id: 6137-2.1-001
  severity: medium
  category: curriculum
  affected_ids: [BL-6137-2.1.05-11, BL-6137-2.1.05-16, ITEM-6137-2.1-027-EVAL, ITEM-6137-2.1-032-FEATURE, ITEM-6137-2.1-033-FEATURE]
  finding: >
    Among the management strategies for sustainable fish use, the notes cover legislation (Marine Resources Act, 2000),
    TAC and quotas, and mesh size. They omit the named Namibian measures that the 2021 and 2024 P1 schemes credit: the
    200-nautical-mile Exclusive Economic Zone, fishing rights, permits and licences, closed seasons for breeding, minimum
    fish size, and fines with offshore patrols and observers. Closed seasons are reduced to "temporal or spatial controls".
    Examiners specifically asked teachers to teach learners to describe EEZ and TAC "and not just writing abbreviations". EEZ
    does not appear anywhere in the topic.
  evidence: >
    BL-6137-2.1.05-16: "Other measures can include temporal or spatial controls, research, observation and management of
    pollution or habitat pressures according to the relevant framework."
  educational_consequence: >
    Learners reach the top of a 3–4 mark "describe management strategies in Namibia" question only partially, and lose the
    EEZ point that is most often expected.
  recommended_repair: >
    Add: "Namibia controls fishing within its 200-nautical-mile Exclusive Economic Zone, where foreign vessels need
    permission. Rights holders need a licence and fish within a quota set from the annual TAC. Closed seasons protect
    breeding periods, minimum sizes protect juveniles, and patrol vessels, aircraft and on-board observers check catches,
    with fines for offenders." Add a FEATURE card: "Name the 200-nautical-mile zone within which Namibia controls fishing."
  confidence: 0.85

- issue_id: 6137-2.1-002
  severity: medium
  category: curriculum
  affected_ids: [BL-6137-2.1.03-02, BL-6137-2.1.03-05, ITEM-6137-2.1-015-CHAIN, ITEM-6137-2.1-018-INTERP]
  finding: >
    The upwelling mechanism is not tied to Namibia. Surface water is moved by "winds", but the south-east trade winds
    (prevailing winds blowing offshore or along the coast) are not named. The Benguela Current is named, but its northward
    flow and its role as a cold, oxygen-rich, plankton-rich current are not described. The 2024 P1 1(a)(iii) scheme credits
    "prevailing winds allow for the upwelling" and "cold currents which supply oxygen and encourage the growth of
    plankton".
  evidence: >
    BL-6137-2.1.03-02: "In a coastal setting, winds and the associated movement of surface water can allow deeper water to replace
    water moved away." BL-6137-2.1.03-05: "The Benguela system contributes a cold-water setting along Namibia's Atlantic coast".
  educational_consequence: >
    The learner can describe a generic process but not the Namibian cause, and so loses the wind/current mark.
  recommended_repair: >
    In BL-2.1.03-02, say: "Along Namibia's coast the south-east trade winds push surface water offshore. Cold, nutrient-rich
    water from the deep rises to replace it within the north-flowing Benguela Current." Add "south-east trade winds" to the
    answer of ITEM-2.1-015.
  confidence: 0.8

- issue_id: 6137-2.1-003
  severity: medium
  category: curriculum
  affected_ids: [BL-6137-2.1.03-07, BL-6137-2.1.03-08, ITEM-6137-2.1-016-INTERP, ITEM-6137-2.1-020-INTERP]
  finding: >
    "Length of the coast" is a syllabus physical factor that favours fish availability. The notes and both cards only state
    the negative caveat, that length does not automatically mean more fish. They never give the positive point: Namibia's
    long coastline, from the Kunene River to the Orange River and about 1,500 km, gives a large fishing area and EEZ and room
    for ports. The 2024 P1 scheme credits "long coast line from north/Kunene river to south/Orange river with plenty of
    fish".
  evidence: >
    BL-6137-2.1.03-07: "A longer coast with low productivity or difficult access need not support a larger catch... Do not multiply a coastline length..."
    ITEM-2.1-020 answer: "It establishes coastal extent, not a uniform fish density."
  educational_consequence: >
    A learner asked how length of coast affects fish availability in Namibia gives only a caveat and misses the creditable
    positive link.
  recommended_repair: >
    Add before the caveat: "Namibia's coastline runs about 1,500 km from the Kunene River mouth to the Orange River. This
    gives a large offshore area (and EEZ) over the productive Benguela upwelling zone and sites for fishing ports such as
    Walvis Bay and Lüderitz." Rewrite one of 016 or 020 so that the positive effect earns a mark.
  confidence: 0.75

- issue_id: 6137-2.1-004
  severity: medium
  category: curriculum
  affected_ids: [BL-6137-2.1.05-09, ITEM-6137-2.1-031-FEATURE]
  finding: >
    Overfishing is defined but its causes are never taught: profit motive, rising demand and population, modern
    fish-finding technology such as sonar and factory ships, weak enforcement and illegal fishing. Under 2021 P1 4(c)(i),
    examiners reported that candidates "could not explain the causes of overfishing... rather stated what overfishing is",
    which is exactly what the notes model.
  evidence: >
    BL-6137-2.1.05-09: "Overfishing occurs when fishing pressure removes too much relative to the stock's capacity... Do not invent a
    safe universal catch percentage."
  educational_consequence: >
    The examined weakness is reproduced. The learner can define overfishing but cannot explain why it happens.
  recommended_repair: >
    Add: "Overfishing is driven by high demand and prices (profit motive), more boats and efficient technology such as sonar
    and large trawlers that locate and catch whole shoals, illegal or unreported fishing, and weak monitoring. Catching
    juveniles before they breed reduces future stock."
  confidence: 0.8

- issue_id: 6137-2.1-005
  severity: low
  category: curriculum
  affected_ids: [BL-6137-2.1.05-01, BL-6137-2.1.05-02, ITEM-6137-2.1-026-FEATURE]
  finding: >
    The physical threats are limited to harmful algal blooms, temperature and oxygen. The Namibia-specific threats credited in
    2024 P1 3(a)(iv) are missing: hydrogen-sulphide (sulphur) eruptions off the central coast, Benguela Niño warm-water
    intrusions, and predation by large seal colonies.
  evidence: >
    BL-6137-2.1.05-01: "Harmful algal events, changes in water temperature or oxygen conditions, pollution and excessive extraction..."
  educational_consequence: The learner has fewer creditable Namibian physical threats to explain.
  recommended_repair: >
    Add one sentence on sulphur (hydrogen sulphide) eruptions from decaying organic matter on the shelf, which kill fish or
    drive them away. Add one sentence on warm Benguela Niño events that push fish south or offshore.
  confidence: 0.6

- issue_id: 6137-2.1-006
  severity: medium
  category: curriculum
  affected_ids: [BL-6137-2.1.10-01, BL-6137-2.1.10-02, ITEM-6137-2.1-050-CHAIN, ITEM-6137-2.1-051-INTERP]
  finding: >
    Objective 2.1.10 asks for the role of the fishing industry in policies for sustainable development. The notes give only
    generic principles. They mention no Namibian policy content: fishing rights favouring Namibian ownership
    (Namibianisation), onshore value-adding processing to keep jobs in the country, the TAC/quota system, and fishing as an
    export earner within national development plans. Both cards are about the absence of evidence, not about what the role is.
  evidence: >
    BL-6137-2.1.10-01: "Fishing can contribute through food, employment, processing, services and trade. These opportunities depend
    on continued resource availability..."
  educational_consequence: The learner cannot describe a Namibian policy role. The notes only say what would not count as evidence.
  recommended_repair: >
    Add a short paragraph: since independence, policy has used science-based TACs to rebuild stocks, allocated fishing
    rights to encourage Namibian participation, and encouraged onshore processing so that jobs, skills and export value stay
    in Walvis Bay and Lüderitz. Revenue from quota fees supports management. Rewrite ITEM-2.1-050 to ask how one such policy
    supports sustainable development.
  confidence: 0.7

- issue_id: 6137-2.1-007
  severity: low
  category: evaluation
  affected_ids: [ITEM-6137-2.1-052-MISCON]
  finding: >
    MIS-6137-15 is the confusion that "secondary industry extracts raw materials or means second-hand activity". The card
    instead tests "classifying a filleting plant as primary because it uses fish", and its prompt names the error before the
    learner answers. It therefore does not discriminate the recorded confusion about second-hand activity.
  evidence: >
    Prompt: "Explain the error in classifying a filleting/freezing plant as primary just because it uses fish. Compare it with
    catching fish and transporting packages."
  educational_consequence: The examiner-recorded "second-hand" misreading is never directly confronted on a card.
  recommended_repair: >
    "A learner writes: 'Secondary industry is second-hand trading, such as selling used boat engines.' Explain the error and
    classify (i) catching hake, (ii) canning pilchards, (iii) selling used engines. [2]"
  confidence: 0.6

- issue_id: 6137-2.1-008
  severity: low
  category: coherence
  affected_ids: [BL-6137-2.1.02-11, BL-6137-2.1.08-03, BL-6137-2.1.09-05]
  finding: >
    House rule is invented businesses only. "Namport" (Namibian Ports Authority, a state-owned company) is named three times as
    a source ("Namport identifies Lüderitz as a base...", "records cold-storage facilities at Walvis Bay"). It is a
    public port authority rather than a private firm, but the lead should decide whether it falls under the rule. Separately,
    the location factors under 2.1.02 ("industries in general") are illustrated almost entirely with fish plants.
  evidence: Notes lines 90, 387, 410 ("Namport identifies Lüderitz as a base serving the fishing industry...").
  educational_consequence: Minor. The learner may come to treat a source attribution as content to memorise.
  recommended_repair: Replace "Namport identifies/records" with "Port information shows", or keep it if public authorities are exempt.
  confidence: 0.5

# ---------------------------------------------------------------- 2.6
- issue_id: 6137-2.6-001
  severity: high
  category: evaluation
  affected_ids: [BL-6137-2.6.06-02, BL-6137-2.6.06-03, ITEM-6137-2.6-018-EVAL, ITEM-6137-2.6-019-EVAL, ITEM-6137-2.6-020-EVAL, ITEM-6137-2.6-021-EVAL, ITEM-6137-2.6-022-EVAL, ITEM-6137-2.6-023-EVAL, ITEM-6137-2.6-P03]
  finding: >
    Objective 2.6.06 asks learners to evaluate the role of government, NGOs, the private sector, local authorities and
    communities in the sustainable use of wildlife in Namibia. All seven judgement items take the form "X alone proves Y?",
    and all seven answer "Disagree". None asks what a stakeholder actually does or how successful it has been. The
    government card (019) never mentions government; it is a stock-balance sum. The notes give no factual Namibian content
    on government roles: no poaching or anti-poaching units, hunting quotas, park management, tourism and hunting
    concessions, the 1996 Nature Conservation Amendment Act enabling conservancies, community game guards, or the rise of
    wildlife numbers since the 1990s. The 2024 P1 4(c) item is exactly "How far do you agree that the role of the government in the
    sustainable use of wildlife animals is a success in Namibia?" Its scheme credits policy formulation, law enforcement,
    monitoring and hunting quotas, running national parks and giving concessions, set against shortcomings (limited
    funding, poaching, corruption, human–wildlife conflict, land-use change). Examiners noted that learners "could not
    evaluate its success" and must "write what the government did".
  evidence: >
    BL-6137-2.6.06-02: "Government establishes and implements the relevant conservation framework, manages public
    responsibilities and supports enforcement or monitoring... A rule on paper does not demonstrate that illegal removal has
    fallen". ITEM-2.6-019 prompt: "How far do you agree that permit compliance proves maintained population here? Opening stock
    is 100...". The words poaching, trophy hunting and concession (for hunting) do not appear in the notes.
  educational_consequence: >
    Learners are trained to answer a stakeholder-evaluation question with "disagree, no evidence", and have no facts to
    weigh. On the real 5-mark item they would score at most the 1 decision mark.
  recommended_repair: >
    (1) Add factual stakeholder content. Government (Ministry of Environment, Forestry and Tourism): conservation laws and
    the 1996 amendment allowing communal conservancies; running Etosha and other parks; anti-poaching and rhino and elephant
    protection; setting hunting and harvest quotas; granting tourism and hunting concessions. Limits: budget, poaching and
    corruption, conflict compensation. Do the same for NGOs (research, training, conflict-reduction such as livestock-guarding
    dogs), private lodges and hunting operators, local authorities, and conservancy members (game guards). (2) Rewrite 019 as
    the 2024 shape: "How far do you agree that the Namibian government's role in the sustainable use of wildlife has been a
    success? [5]". The answer weighs these roles against the shortcomings and reaches a decision. Do the same for at least
    two other stakeholder cards.
  confidence: 0.9

- issue_id: 6137-2.6-002
  severity: medium
  category: curriculum
  affected_ids: [BL-6137-2.6.02-01, BL-6137-2.6.02-03, ITEM-6137-2.6-006-CHAIN, ITEM-6137-2.6-007-INTERP, ITEM-6137-2.6-P01]
  finding: >
    The economic importance of wildlife is reduced to tourism, guiding, accommodation, suppliers and "appropriately regulated
    uses". The notes never say trophy hunting, game meat, live game sales, government revenue from taxes, fees and
    concessions, foreign exchange, or conservancy income funding local facilities. All of these are on the 2020 and 2024 P1
    schemes. Examiners noted that candidates "stated 'jobs' and 'tourism', but could not say how these contributed".
  evidence: >
    BL-6137-2.6.02-03: "Some regulated wildlife uses can provide revenue or products alongside conservation responsibilities."
  educational_consequence: The learner reproduces the examined weak answer of "jobs and tourism" without the revenue mechanisms.
  recommended_repair: >
    Replace the euphemism with named uses: "Trophy hunting brings high fees from relatively few visitors; game meat and live
    animals are sold; parks charge entrance fees; the state gains tax and concession fees; foreign tourists bring foreign
    exchange; conservancy income can fund schools, water points or roads." Rewrite ITEM-2.6-006 as "Explain how trophy
    hunting and photographic tourism contribute to Namibia's economy."
  confidence: 0.85

- issue_id: 6137-2.6-003
  severity: medium
  category: curriculum
  affected_ids: [ITEM-6137-2.6-008-CHAIN, ITEM-6137-2.6-009-INTERP, BL-6137-2.6.03-01]
  finding: >
    Objective 2.6.03 (impact of wildlife on the environment) was examined in 2024 P1 4(a)(iv) as "Explain the positive impacts". Examiners
    reported that learners "concentrated on negative impacts". Both cards for 2.6.03 cover only a negative impact (cover lost
    at a water point). Positive impacts (dung fertilising soil, seed dispersal, pollination, grazing that reduces fire fuel,
    predators controlling herbivore numbers) appear in a single sentence in the notes and on no card.
  evidence: >
    ITEM-2.6-008: "Explain how animal use concentrated around a water point can affect vegetation where removal exceeds regrowth."
    BL-6137-2.6.03-01: "Movement, dung and feeding can redistribute nutrients or seeds for some species."
  educational_consequence: The card set reinforces the exact one-sided error that examiners reported.
  recommended_repair: >
    Add a block that develops positive impacts, and rewrite ITEM-2.6-009 or add a card: "Explain two positive impacts of wild
    animals on the environment. [4]". Answer: dung returns nutrients and improves soil fertility; seeds pass through guts
    and are dispersed; grazing reduces dry grass fuel and fire intensity; predators keep herbivore numbers in check, which
    prevents overgrazing.
  confidence: 0.8

- issue_id: 6137-2.6-004
  severity: low
  category: accuracy
  affected_ids: [BL-6137-2.6.01-04]
  finding: >
    The notes assert that the syllabus's "Cheetah foundation" must mean the Cheetah Conservation Fund. That is doubtful. The
    AfriCat Foundation (Okonjima, between Otjiwarongo and Okahandja) is literally a "foundation" known for cheetah and
    leopard work in the same area. The CCF facts (research and education centre near Otjiwarongo) are correct, and both
    organisations are near Otjiwarongo, so the location cards stay valid. The claim that CCF is "the correct named
    organisation" goes further than the evidence.
  evidence: >
    BL-6137-2.6.01-04: "The syllabus's reference to a cheetah foundation should be understood through the correct named
    organisation and location, without inventing a new park called Cheetah Foundation."
  educational_consequence: A teacher who uses AfriCat may see the notes as contradicting them. The learner impact is small.
  recommended_repair: >
    Write: "The syllabus's 'cheetah foundation' can be studied through organisations such as the Cheetah Conservation Fund
    (research and education centre east of Otjiwarongo); the AfriCat Foundation at Okonjima, south of Otjiwarongo, is
    another example."
  confidence: 0.5

- issue_id: 6137-2.6-005
  severity: low
  category: curriculum
  affected_ids: [BL-6137-2.6.01-06, BL-6137-2.6.01-07, ITEM-6137-2.6-002-INTERP]
  finding: >
