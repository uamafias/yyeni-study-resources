  severity: low
  category: curriculum
  affected_ids: [ITEM-6137-2.6-015-CHAIN, ITEM-6137-2.6-016-INTERP, BL-6137-2.6.05-01]
  finding: >
    Both 2.6.05 cards are about how unevenly benefits are distributed. Neither asks the learner to describe how the
    conflicts happen. The 2024 P1 4(a)(iii) scheme expects the conflict types: elephants raiding crops and damaging water
    infrastructure, predators killing livestock, competition between livestock and wildlife for grazing and water, danger to
    people, and fences blocking migration. Examiners said learners "are unable to describe how human-wildlife conflict
    occurs". The notes list most of these types but briefly, and they lack Namibian examples (for example, elephants
    in the Kunene and Zambezi regions).
  evidence: >
    ITEM-2.6-015: "Explain why a wildlife-management scheme can face conflict even while total tourism receipts rise."
  educational_consequence: The learner is never asked to describe the types of conflict, which is the gap examiners reported.
  recommended_repair: >
    Rewrite ITEM-2.6-016 as "Describe three conflicts between wildlife management and farming in northern Namibia. [3]". The
    answer covers elephants trampling crops and breaking water pipes, lions and cheetahs killing livestock, and wildlife
    competing with cattle for grazing and water.
  confidence: 0.7

