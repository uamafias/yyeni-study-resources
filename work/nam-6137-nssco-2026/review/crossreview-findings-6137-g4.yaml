  category: curriculum
  affected_ids: [CU-6137-2.3.07, BL-6137-2.3.07-01, BL-6137-2.3.07-02, BL-6137-2.3.07-04, BL-6137-2.3.07-06, ITEM-6137-2.3-030-CHAIN, ITEM-6137-2.3-031-INTERP]
