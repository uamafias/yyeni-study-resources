- issue_id: 6137-2.3-007
  severity: low
  category: analysis
  affected_ids: [ITEM-6137-2.3-P06]
  finding: >
    H2 in P06 ("visitor counts are higher in the busy period") is true by definition, because the periods are labelled busy and quiet. Testing it
    with one ten-minute count per period trains learners to treat a circular hypothesis as a finding. Separately, one ten-minute count is taken to
    represent a whole season.
  evidence: "Matched ten-minute visitor counts: quiet 20, busy 60. ... H2: visitor counts are higher in the busy period."
  educational_consequence: Weak hypothesis-writing model; learners may write untestable or circular hypotheses in Paper 3.
  recommended_repair: >
    Replace H2 with a non-circular prediction, e.g. "Businesses employ more staff in the busy period" (using a business-survey record, which also
    helps 6137-2.3-004), or "Visitor numbers in December are at least double those in March" with counts repeated on several days.
  confidence: 0.7

