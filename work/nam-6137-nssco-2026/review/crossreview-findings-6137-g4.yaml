# Review group g4 — 6137 NSSCO Geography, topics 2.2 Agriculture and 2.3 Leisure and Tourism
# Reviewer: Claude (independent cross-review of Codex-authored text). Read-only review; nothing in the repo was changed.
# Fact checks made against live sources this session:
#   - FAO/WFP Namibia special report (https://www.fao.org/4/ak334e/ak334e00.htm): dated 14 July 2009; says 2009 floods
#     "exacerbated the impact of the 2007 drought and the 2008 floods"; "On the upland ... many farmers have harvested better
#     crops than in 2007/08". The notes (BL-6137-2.2.09-12, BL-6137-2.2.10-14) and ITEM-6137-2.2-P03 are ACCURATE.
#   - MCC evaluation brief (https://www.mcc.gov/resources/doc/evalbrief-060617-nam-conservancy/): June 2017; private
#     investment and employment gains; "households generally did not experience major income or expenditure increases".
#     The notes (2.3 benefits section) and ITEM-6137-2.3-P03 are ACCURATE (they leave out that female-headed households did gain; not a defect).
# Every worked figure in both topics' notes and items was recomputed by hand. No arithmetic errors found (see the comment block at the end).

- issue_id: 6137-2.2-001
  severity: high
  category: curriculum
  affected_ids: [BL-6137-2.2.05-01, BL-6137-2.2.05-02, BL-6137-2.2.05-03, BL-6137-2.2.05-04, BL-6137-2.2.04-02, BL-6137-2.2.04-04, BL-6137-2.2.04-06, BL-6137-2.2.04-08, ITEM-6137-2.2-017-CHAIN, ITEM-6137-2.2-018-INTERP, CL-6137-2.2.05-1]
  finding: >
    Objectives 2.2.04 ("locate on a map of Namibia...") and 2.2.05 ("explain the development of these farming systems in Namibia")
    are taught almost entirely as general reasoning. They lack the named Namibian content a learner needs. The whole 2.2.05 section is four short
    paragraphs. It mentions "colonial dispossession and the division between communal and commercial farming areas" but names nothing:
    no Police Zone / veterinary cordon fence (Red Line) and its effect on the marketing of northern communal livestock, no post-1990
    land reform or resettlement, no Green Scheme (state-supported irrigation projects for small-scale and commercial crop growers), no Agribank or
    Agronomic Board market support. Small-scale cash-crop farming has no real location at all. BL-6137-2.2.04-04 says only "Vegetable
    production near settlements or irrigation opportunities provides a useful pattern to investigate". There are no Kavango/Zambezi
    river irrigation schemes, no Etunda (Omusati), no Orange River (Aussenkehr/Noordoewer) grapes or Naute dates (the last two are large-scale irrigated commercial
    crop examples). Karakul sheep in the south and the northern cattle-post system are also absent. The syllabus case studies "(i) Subsistence farming in Northern
    Namibia (ii) Livestock commercial farming in Central Namibia (iii) Maize triangle" (syllabus p13), which the case-study register also selects,
    get one or two generic sentences each. Root cause: the work order passed only the bare objective wording; the case studies never reached the author
    (this matches the known work-order-builder defect). The task brief expected Green Scheme and land-issue facts. They are not wrong; they are absent.
  evidence: >
    BL-6137-2.2.05-02: "Colonial dispossession and the division between communal and commercial farming areas left lasting differences in land
    access and investment opportunities." (no further named content anywhere in 2.2). BL-6137-2.2.04-04: "Small-scale cash-crop farming is less
    usefully treated as one continuous belt. ... Vegetable production near settlements or irrigation opportunities provides a useful pattern to
    investigate." grep of notes/items/claims for "Green Scheme|land reform|resettle|cordon|Red Line|karakul|Orange River|Aussenkehr|Etunda" = 0 hits.
    Examiner evidence (assessment-evidence/examiner-findings.json) repeatedly records "Must use named examples" / "Candidates who did not give
    an example could not score marks."
  educational_consequence: >
    On a question asking the learner to explain how Namibia's three farming systems developed, or to name and locate small-scale cash-crop areas, the learner can write
    only general statements and cannot score the place-specific marks. They may also come to think cash-crop farming has no real location.
  recommended_repair: >
    Extend CU-6137-2.2.05 (and its word budget) with sourced, dated content: (1) the colonial Police Zone / veterinary cordon fence dividing the
    commercial (freehold) south and centre from the northern communal areas, and why it still limits northern beef exports; (2) independence and land
    reform (resettlement, the willing-buyer approach) and its slow pace; (3) the Green Scheme (2003/04 policy) irrigation projects, e.g. Etunda near Ruacana and
    the Kavango River projects, as the main state route into small-scale cash-crop and commercial crop farming; (4) market support (Agronomic Board
    border controls on maize and horticulture). Add to BL-6137-2.2.04-04/08 named cash-crop and irrigated sites: Kavango and Zambezi river
    margins, Etunda, Hardap/Mariental, Orange River at Aussenkehr/Noordoewer (grapes), Naute (dates), and karakul in the south. Add at least two
    cards: "Name one irrigation scheme in Namibia and its main crop" and "Explain how the veterinary cordon fence has influenced commercial livestock
    farming in northern Namibia." Check every added fact against a primary source; do not invent statistics.
  confidence: 0.9

- issue_id: 6137-2.2-002
  severity: high
  category: evaluation
  affected_ids: [ITEM-6137-2.2-025-EVAL, ITEM-6137-2.2-026-EVAL, ITEM-6137-2.2-027-EVAL, ITEM-6137-2.2-028-EVAL, ITEM-6137-2.2-029-EVAL, ITEM-6137-2.2-030-EVAL, ITEM-6137-2.2-061-EVAL, ITEM-6137-2.2-062-EVAL, ITEM-6137-2.2-063-EVAL, ITEM-6137-2.2-064-EVAL, ITEM-6137-2.2-P03, ITEM-6137-2.3-032-EVAL, ITEM-6137-2.3-033-EVAL, ITEM-6137-2.3-034-EVAL, ITEM-6137-2.3-035-EVAL, ITEM-6137-2.3-P03]
  finding: >
    Every "How far do you agree" item in both topics (11 in 2.2, 5 in 2.3) poses an overstated claim built to fail ("proves", "solves",
    "eliminates", "must", "alone"), and every canonical answer opens "Disagree". The evidence in each prompt is arranged so that the target strategy
    cannot work (insect absent, water and nutrients deficient, nutrients already adequate, bridge closed). The bank never has a case where the
    evidence supports agreeing, or a balanced "partly agree" with both sides weighed. For 2.2.07 ("analyse the strategies to improve the output in
    large-scale commercial farming such as GM crops, HYVs, irrigation, fertilisers, pesticides") and 2.2.13, these EVAL cards are the only
    above-recall cards per strategy. No card asks how irrigation, HYVs, GM traits, fertilisers or pesticides actually raise output, or what their
    standard drawbacks are (seed cost/annual repurchase, dependence on suppliers, higher water/fertiliser demand of HYVs, consumer resistance to GM, pesticide resistance).
  evidence: >
    ITEM-6137-2.2-026-EVAL Q: "How far do you agree that an insect-resistant GM trait solves this crop's water constraint? The target insect is
    absent, water remains inadequate..." A: "Disagree." ITEM-6137-2.2-027-EVAL: "...both are deficient and no remedy is planned." A: "Disagree...".
    ITEM-6137-2.2-029-EVAL: "Nutrients are adequate, but usable soil moisture is inadequate..." A: "Disagree." Same pattern in 2.2-025, 028, 030,
    061-064, 2.2-P03 and 2.3-032 to 035, 2.3-P03.
  educational_consequence: >
    Learners learn a reflex ("the answer to How far do you agree is disagree, evidence insufficient") instead of weighing advantages against
    disadvantages. On a real 5-mark judgement about, say, irrigation on large commercial farms, they will under-state the genuine benefits and
    lose the marks for the positive side. They will also have no practised answer for "explain how HYVs increase output".
  recommended_repair: >
    Rewrite at least half of the EVAL items so the evidence supports "agree" or "agree to a large extent with a stated limit". Example for 2.2-028:
    "How far do you agree that drip irrigation improved this farm's water use? Per-hectare application fell from 1,000 to 700 m3 and the irrigated
    area stayed at two hectares" (agree: a 600 m3 saving; limit: source sustainability not shown). For 2.2-026: "How far do you agree that
    the insect-resistant variety raised usable output where the target insect caused heavy damage? Resistant 2.5 t/ha against 2.0 t/ha susceptible under the same insect pressure"
    (agree, +25%; limits: seed cost, resistance management). Add one CHAIN card per 2.2.07 strategy giving the positive mechanism, and one card on
    the standard disadvantages of GM crops and HYVs.
  confidence: 0.85

- issue_id: 6137-2.2-003
  severity: medium
  category: curriculum
  affected_ids: [BL-6137-2.2.09-12, BL-6137-2.2.10-14, CU-6137-2.2.12, CU-6137-2.2.13, ITEM-6137-2.2-051-CHAIN, ITEM-6137-2.2-052-INTERP]
  finding: >
    The other syllabus case-study slots in 2.2 have no named content. The second-page case studies are "(i) Farming practices leading to desertification in Namibia;
    Sustainable Agriculture in Namibia (ii) 2011 drought in the Horn of Africa/Darfur region (iii) Large scale sugar farming and food shortages in
    Swaziland". The case studies are not prescriptive, and the FAO/WFP 2009 Namibia floods case is a valid, accurate substitute for the food-shortage
    slot. But the notes give no Namibian desertification or sustainable-agriculture example, and bush encroachment is the only Namibia-tagged environmental point. Food aid (2.2.11)
    and conflict (2.2.09-04) have no real case. The notes even rule this out ("Namibia examples should not be assigned an invented war"); a real external
    case such as the 2011 Horn of Africa drought or Darfur would serve.
  evidence: >
    BL "Bush encroachment involves an increase in woody vegetation ... In Namibia it is a relevant issue for grazing management." (the only named
    Namibian point in the environmental and sustainable sections). Food aid section: four paragraphs, no place named.
  educational_consequence: >
    The learner cannot give a named example of desertification-causing practice or of sustainable farming in Namibia, or a named food-aid or conflict case,
    and so loses the marks a "with reference to a named example" question carries.
  recommended_repair: >
    Add short, sourced, dated case blocks: (a) desertification-linked practices in Namibia, e.g. overstocking around water points in communal
    rangeland, deforestation for fields and fuel in the north-east, and bush encroachment on commercial rangeland; (b) a Namibian sustainable-agriculture
    example, e.g. conservation agriculture (ripping and mulching) promoted in northern regions, or rotational grazing; (c) one external food-aid/conflict
    case (2011 Horn of Africa drought, using FAO/WFP dated sources). Add one card for each.
  confidence: 0.75

- issue_id: 6137-2.2-004
  severity: medium
  category: coherence
  affected_ids: [ITEM-6137-2.2-013-INTERP, ITEM-6137-2.2-014-INTERP, ITEM-6137-2.2-016-INTERP]
  finding: >
    The map-pending distribution cards put the answer in the prompt. The prompt tells the learner the distribution ("household crops in
    northern areas, commercial cattle in central areas and sheep/goats farther south"; "Omusati–Oshana–Ohangwena–Oshikoto labels") and then asks them to describe it.
    The canonical answer restates the prompt. Once the map is supplied, the prompt should send the learner to the map, not to the wording. (Only the
    text is reported here; the missing map itself is the separately tracked gate.)
  evidence: >
    ITEM-6137-2.2-013-INTERP Q: "Describe the broad distribution on the supplied Namibia farming map: household crops in northern areas, commercial
    cattle in central areas and sheep/goats farther south, with local irrigated crop sites." A: "The main household-crop association is northern;
    the commercial livestock pattern shifts from central cattle towards southern small stock..."
  educational_consequence: >
    The card does not test whether the learner can locate the three systems on a Namibia map (objective 2.2.04). A learner can get it "right"
    by paraphrasing the question, and still fail the real locate task.
  recommended_repair: >
    When the map is added, change the prompts to "Describe the distribution of the three farming systems shown on the map of Namibia" (013),
    "Using the key, describe the distribution of small-scale subsistence farming on the map" (014), and "Describe the location of large-scale commercial farming
    shown on the map" (016). Keep the region names only on the map, not in the prompt.
  confidence: 0.8

- issue_id: 6137-2.2-005
  severity: low
  category: curriculum
  affected_ids: [ITEM-6137-2.2-021-FEATURE]
  finding: >
    The recall anchor for OBJ-6137-2.2.06-01 ("scale of agricultural production") tests yield, which the notes themselves say is NOT a
    measure of scale ("Small scale does not necessarily mean low yield"; scale = area, herd size, total output, workforce or capital).
  evidence: >
    ITEM-6137-2.2-021-FEATURE Q: "Name the measure obtained by dividing crop output by cultivated area for the same crop and season." A: "Yield per
    unit area". Notes: "Scale can describe cultivated area, herd size, total output, workforce or capital committed."
  educational_consequence: Weak; the learner may link yield with scale, which the notes elsewhere warn against.
  recommended_repair: >
    Replace with "Name two measures that can describe the scale of a farm." A: "Two of: area farmed, herd size, total output, number of workers,
    capital invested." Move the yield card to 2.2.02-03 (outputs) if it is kept.
  confidence: 0.8

- issue_id: 6137-2.3-001
  severity: high
  category: curriculum
  affected_ids: [BL-6137-2.3.03-01, BL-6137-2.3.03-02, BL-6137-2.3.03-03, ITEM-6137-2.3-007-FEATURE, ITEM-6137-2.3-008-INTERP]
  finding: >
    Objective 2.3.03 "describe the types of leisure and tourist activities in Namibia" and the Etosha National Park syllabus case study are covered
    by three generic paragraphs. Activities are listed by category only ("wildlife viewing, guided nature visits, walking, coastal recreation,
    heritage visits, cultural experiences"). No Namibian destination other than Etosha is named. There is nothing on Sossusvlei/Namib-Naukluft, Swakopmund adventure
    activities (sandboarding, quad biking, skydiving), Fish River Canyon hiking, Skeleton Coast, the Cape Cross seal colony, Twyfelfontein rock art
    (World Heritage Site), trophy hunting or fishing. The Etosha "case study" is one paragraph: no location, no Etosha Pan or waterholes, no named camps
    (Okaukuejo, Halali, Namutoni), and no park-specific benefits or problems (seasonality between dry-season waterhole viewing and the wet season, water supply, gravel roads,
    community benefit). Etosha appears only as a classification example. Root cause again: the case study was not in the work order.
  evidence: >
    BL-6137-2.3.03-02: "Etosha is a named example of nature-based tourism. The Ministry's park information describes game viewing and accommodation
    or camping services at park camps. ... no such total should be inferred from the existence of facilities." grep of notes/items for
    "Sossusvlei|Swakopmund|Fish River|Twyfelfontein|Okaukuejo|Halali|Namutoni|Skeleton|Mauritius" = 0 hits.
  educational_consequence: >
    A learner asked to describe types of tourist activities in Namibia, or to use Etosha as a case study for benefits and problems, has only abstract
    categories and will lose the named-example marks (examiner reports say candidates without examples "could not score marks").
  recommended_repair: >
    Expand CU-6137-2.3.03 with a sourced table of activity types and named locations: wildlife and game viewing (Etosha, conservancies), desert
    and landscape (Sossusvlei, Fish River Canyon), adventure (Swakopmund dunes), coastal (Walvis Bay lagoon, Cape Cross), heritage (Twyfelfontein),
    cultural (community-based tourism enterprises), hunting and angling. Add an Etosha case block: location (north-central Namibia, around the
    Etosha Pan), main attractions (waterholes, game viewing in the dry season), facilities (named rest camps), benefits (jobs, park fees,
    foreign exchange) and problems (seasonality, water supply, road access, wildlife-human conflict at the boundary), all from MEFT or similarly dated sources.
    Add two cards: "Name two tourist activities in Namibia and a place where each occurs" and "Describe two advantages of tourism in Etosha National Park."
  confidence: 0.9

- issue_id: 6137-2.3-002
  severity: high
  category: curriculum
  affected_ids: [BL-6137-2.3.91-01, BL-6137-2.3.91-02, BL-6137-2.3.91-03, BL-6137-2.3.91-04, BL-6137-2.3.91-05, ITEM-6137-2.3-036-PROC, ITEM-6137-2.3-037-WHY, ITEM-6137-2.3-P04, OBJ-6137-2.3.91]
  finding: >
    The 2026 Paper 3 environmental-quality assessment never teaches the bi-polar grid, the technique the syllabus names. The syllabus wording is: "Environmental
    quality impact assessments: design of a bi-polar grid and decisions about the categories to include, use of the grid to make judgements of the
    impact of tourism or leisure facility and presentation of data in a graphical form. Consideration should also be given to the time of day and
    number of locations needed..." (syllabus p15). The notes and P04 use a one-directional 0/1/2 (poor/intermediate/good) score on three
    indicators. Nowhere is a bi-polar grid described: paired opposite descriptors (e.g. "no litter ... heavily littered") on a scale such as
    +2 to -2 or 1 to 5. Nothing covers how to choose categories, how many sites are needed or why time of day matters, and nothing covers graphical presentation of
    grid results (e.g. a bar chart of site totals or a profile/radar diagram). The registry label for OBJ-6137-2.3.91 ("Tourism environmental-quality
    assessment") dropped this syllabus detail, so the author never saw it. The word "bi-polar" appears 0 times in 2.3.
  evidence: >
    BL-6137-2.3.91-04: "Suppose three indicators each use 0 for poor, 1 for intermediate and 2 for good. A site scoring 1,0,2 has a total of three
    out of six." ITEM-6137-2.3-P04 prompt: "0 poor, 1 intermediate, 2 good for each of litter, noise and facilities." OBJ-6137-2.3.91 syllabus_text:
    "Tourism environmental-quality assessment".
  educational_consequence: >
    On the 2026 Paper 3 human-geography question (30 of 60 marks) a learner asked to design, complete or interpret a bi-polar grid will not
    recognise the format, will not know that negative and positive halves are scored, and cannot justify category choice or site and time decisions.
  recommended_repair: >
    Rewrite BL-6137-2.3.91-01/04 around a bi-polar grid. Example: five rows of opposite descriptors (litter-free / heavily littered; quiet / very noisy;
    vegetation intact / trampled; well-maintained facilities / damaged facilities; uncongested / congested), each scored from +2 to -2, with site totals from
    +10 to -10. Add a paragraph on choosing categories relevant to the hypothesis, using enough sites (e.g. at set distances from the attraction),
    and fixing the time of day because noise and congestion vary through the day. Add presentation: a bar chart of site totals, or a profile/radar
    diagram per site. Rebuild P04 on that grid (recompute totals), with one part asking the learner to suggest two further categories and one part asking why
    all sites should be surveyed at the same time of day.
  confidence: 0.9

- issue_id: 6137-2.3-003
  severity: high
  category: curriculum
  affected_ids: [BL-6137-2.3.92-01, BL-6137-2.3.92-02, BL-6137-2.3.92-05, ITEM-6137-2.3-038-PROC, ITEM-6137-2.3-039-WHY, ITEM-6137-2.3-P05, OBJ-6137-2.3.92]
  finding: >
    The footpath-erosion investigation leaves out the relationship the syllabus says to investigate. The syllabus wording is: "Consideration should be given to the
    relationship between amount of erosion and distance from a tourism hot spot or leisure facility" and "decisions on sampling and measuring techniques".
    Every footpath block, card and P05 uses short pedestrian counts as the independent variable. Distance from a hot spot or facility is never taught.
    Neither is systematic sampling along a transect from the attraction (e.g. a reading every 10 m or 50 m), the decline of path width and depth with distance, or
    measuring depth at several fixed points across the path with a ranging pole and ruler. In P05, depth is a single value per station although width is
    measured three times. That conflicts with the notes' own "repeated readings" advice.
  evidence: >
    BL-6137-2.3.92-02: "A testable hypothesis might predict greater path width at sites with higher pedestrian counts during matched observation
    periods." ITEM-6137-2.3-P05: "uses matched ten-minute pedestrian counts ... Measured incision depths are A 1 cm, B 2 cm, C 3 cm." grep for
    "distance from|hot ?spot" in 2.3 = 0 hits.
  educational_consequence: >
    The likely 2026 Paper 3 footpath task (erosion against distance from a car park, viewpoint or lodge) is never practised. Learners will not know to
    sample at regular distances along the path, or to expect, test and explain a decrease in erosion with distance.
  recommended_repair: >
    Add a block: "Choose a path leading away from a hot spot (e.g. a viewpoint or campsite). Measure width and depth at fixed intervals (systematic
    sampling, e.g. every 20 m) along it. At each station, measure depth at several equally spaced points across the path from a pole laid between the
    edges and take the mean. Hypothesis: path width and depth decrease with distance from the hot spot." Rebuild P05 (or add P08) with distance (0, 20,
    40, 60, 80 m) as the x-axis, mean width and depth values, one anomaly to explain, and a scatter graph or line graph. Keep the pedestrian-count version as a secondary
    example.
  confidence: 0.85

- issue_id: 6137-2.3-004
  severity: medium
  category: curriculum
  affected_ids: [BL-6137-2.3.93-01, BL-6137-2.3.93-02, BL-6137-2.3.93-03, ITEM-6137-2.3-040-PROC, ITEM-6137-2.3-P06, OBJ-6137-2.3.93]
  finding: >
    The syllabus survey strand is "Surveys: of business and people to make judgements of the economic and seasonal impact of tourism ... design of
    questions, suitable sampling techniques as well as methods of presentation." The notes and P06 cover only questionnaires to residents or visitors.
    They have nothing on business surveys (asking lodge, shop or craft-market operators about seasonal changes in turnover, staff numbers, the share of customers who are tourists, or where
    supplies are bought). Question design is reduced to "neutral" yes/no wording. Open vs closed questions, multiple-choice categories, the
    pilot survey's purpose (mentioned once) and the choice of presentation method (pie or divided bar for categories, bar chart for comparison) are not taught.
  evidence: >
    BL-6137-2.3.93-01: "A tourism questionnaire can investigate visitors' activities or residents' experiences, but its target population must be
    stated." P06 uses one yes/no question to twenty residents. grep "business survey|business owner|shopkeeper" = 0 hits.
  educational_consequence: >
    Learners cannot design a business questionnaire or choose an appropriate graph for survey categories, both likely 2026 Paper 3 tasks.
  recommended_repair: >
    Add a block on business surveys, with an example 4-question sheet (e.g. "In which months do you employ extra staff?", "Roughly what share of your
    customers are tourists?", "Where do you buy most of your supplies? local/elsewhere in Namibia/imported"). Add a short paragraph on open vs closed
    questions and on matching graph type to data (pie or divided bar for proportions, comparative bar for two periods). Add one PROC or WHY card.
  confidence: 0.8

