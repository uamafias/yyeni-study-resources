# ============================== 2.5 WATER RESOURCES IN NAMIBIA ==============================

- issue_id: 6137-2.5-001
  severity: high
  category: curriculum
  affected_ids: [BL-6137-2.5.02-01, BL-6137-2.5.02-04, BL-6137-2.5.03-01, BL-6137-2.5.04-07, BL-6137-2.5.05-06, BL-6137-2.5.05-07, ITEM-6137-2.5-007-FEATURE, ITEM-6137-2.5-008-INTERP, ITEM-6137-2.5-011-CHAIN, ITEM-6137-2.5-012-INTERP]
  finding: >
    The topic is "Utilisation and management of water resources in Namibia" and 2.5.02 says "identify sources
    of water in Namibia". Apart from Windhoek's supply (Omatako, Swakoppoort, Von Bach dams; groundwater;
    Goreangab reclamation), the notes name no Namibian water source or setting. Missing: perennial rivers only
    on the borders (Kunene, Okavango, Zambezi, Kwando/Linyanti/Chobe, Orange); ephemeral interior rivers
    (e.g. Swakop, Kuiseb, Fish); major aquifers (e.g. Tsumeb-Otavi-Grootfontein karst, Stampriet artesian
    basin, Ohangwena); major dams (Hardap, Naute, Neckartal); the Eastern National Water Carrier; the
    desalination plant near Wlotzkasbaken serving the Erongo coast and uranium mines; groundwater's role in
    rural, farming and mining supply; Namibia's very high evaporation and tiny share of rainfall reaching
    recharge. Cards 007/008 ask only for the abstract categories "groundwater"/"surface water", and 011/012
    (2.5.03 "significance ... to human activities") test a pump failure, not significance.
  evidence: >
    BL-6137-2.5.02-04 "Namibia's dry setting makes the timing and location of surface water especially
    relevant." (the only Namibia-specific sentence in the sources section). ITEM-6137-2.5-007-FEATURE "Name the
    two broad source categories represented by an aquifer and a river." ITEM-6137-2.5-012-INTERP "a source holds
    water, but the only delivery pump fails".
  educational_consequence: >
    A learner cannot "identify sources of water in Namibia" or explain why groundwater matters so much in
    Namibia. Both are core to a topic named after the country.
  recommended_repair: >
    Add a "Namibia's water sources" block (dated, sourced from NamWater/MAWLR/Atlas of Namibia): perennial
    border rivers listed with the regions they serve; ephemeral rivers that flow only after rain; named aquifers
    and that groundwater supplies most rural, farm and many town needs; named dams; the coastal desalination
    plant (name the plant, not the operating company); the evaporation problem. Rewrite 008 as "Describe two
    sources of water used in Namibia, naming one surface and one groundwater source" and 011 as "Explain why
    groundwater is important to farming and settlement in central and southern Namibia".
  confidence: 0.9

- issue_id: 6137-2.5-002
  severity: medium
  category: curriculum
  affected_ids: [BL-6137-2.5.05-03, BL-6137-2.4.06-02, ITEM-6137-2.5-019-EVAL]
  finding: >
    The positive and negative effects of building dams/reservoirs are hardly taught, though they are examined
    repeatedly (2020 P1 5-mark positive/negative effects; 2024 P2 "how far do you agree that people might object
    to a plan to build a dam"). The notes give only "construction can inundate land or alter downstream
    conditions" plus sediment and evaporation. Missing: relocation of people, loss of farmland/grazing,
    habitat loss, water-borne diseases (bilharzia, malaria) in still water, less water/silt downstream,
    dam-failure risk, high cost; benefits such as a reliable supply, irrigation, HEP, flood control,
    fishing/recreation/tourism, jobs. No card tests dam effects.
  evidence: >
    BL-6137-2.5.05-03 "Construction can inundate land or alter downstream conditions. A high wall without
    adequate inflow cannot create an unlimited reserve".
  educational_consequence: Learners cannot write a balanced 5-mark answer on whether a dam should be built.
  recommended_repair: >
    Add a block listing 4-5 benefits and 4-5 problems of dams with one-line mechanisms (e.g. "still reservoir
    water lets snails and mosquitoes breed, spreading bilharzia and malaria"), and replace or add a card: "How far
    do you agree that the benefits of a new dam outweigh its problems for local people?"
  confidence: 0.85

