  severity: medium
  category: curriculum
  affected_ids: [BL-6137-3.1.04-09, BL-6137-3.1.04-11, BL-6137-3.1.05-09, ITEM-6137-3.1-018-FEATURE]
  finding: >
    HIV/AIDS is never mentioned, though it is the leading southern-African influence on death rates, life
    expectancy and age structure in this period. The 2021 P1 examiner key for 3.1.04 lists "HIV/AIDS" first.
    The mortality section lists water, sanitation, nutrition, vaccination, conflict and hazards only.
  evidence: >
    BL-6137-3.1.04-11 "Social and environmental influences on deaths include living conditions, food security,
    conflict, unsafe water, pollution and hazards."
  educational_consequence: >
    Namibian learners omit the factor most relevant to their own region when explaining death rates or life
    expectancy.
  recommended_repair: >
    Add: "In southern Africa, including Namibia, HIV/AIDS raised death rates among young adults and lowered life
    expectancy from the 1990s; wider access to antiretroviral treatment has since improved survival."
  confidence: 0.8

- issue_id: 6137-3.1-004
  severity: medium
  category: analysis
  affected_ids: [ITEM-6137-3.1-054-MISCON]
  finding: >
    The MIS-6137-12 card restates the distinction instead of testing it. The misconception's
    discriminating demand is "Compare two populations of equal size but different age structures". 054 gives no
    populations and asks the learner to "explain the error ... What test distinguishes them?", so a learner can
    answer by repeating the definition. (020 and P02 do supply equal-size data but are not the misconception
    slot.)
  evidence: >
    ITEM-6137-3.1-054-MISCON "Explain the error in treating an ageing population's problems as simply those of
    too many people overall. What test distinguishes them?"
  educational_consequence: The examiner-reported confusion (ageing answers framed as overpopulation) is not actually tested.
  recommended_repair: >
    "Countries X and Y each have 1,000,000 people. X has 40% under 15 and 5% over 65; Y has 14% under 15 and 28%
    over 65. A learner says Y's problems are 'too many people'. Explain the error and name two problems
    specific to Y." Answer: same total, so the problem is age composition: pensions, health and care costs,
    a shrinking workforce/tax base.
  confidence: 0.8

- issue_id: 6137-3.1-005
  severity: medium
  category: curriculum
  affected_ids: [BL-6137-3.1.03-01, BL-6137-3.1.03-02, BL-6137-3.1.03-03, BL-6137-3.1.03-06, BL-6137-3.1.03-07, BL-6137-3.1.10-06, BL-6137-3.1.10-13]
  finding: >
    3.1.03 (over/under-population) and 3.1.10 (involuntary international migration) are taught with no real
    example. The examiner's 5-mark item is "For a named country you have studied, describe the problems of
    overpopulation". Notes give only "a hypothetical settlement" and "a second hypothetical area"; forced
    migration has no named flow (e.g. refugees hosted at Osire in Namibia, or a named conflict-driven
    displacement).
  evidence: >
    BL-6137-3.1.03-06 "A hypothetical settlement has 1,000 residents..."; BL-6137-3.1.03-07 "A second
    hypothetical area has useful production opportunities but lacks the workers".
  educational_consequence: Learners have no named country to anchor these answers.
  recommended_repair: >
    Add one dated overpopulation example (e.g. Bangladesh or an informal-settlement pressure example in
    Windhoek), one underpopulation example (e.g. Australia/Canada labour shortages and skilled immigration), and
    one involuntary-migration example with origin, destination and cause.
  confidence: 0.75

