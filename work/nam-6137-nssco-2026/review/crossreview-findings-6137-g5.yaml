- issue_id: 6137-2.4-005
  severity: medium
  category: curriculum
  affected_ids: [BL-6137-2.4.02-01, BL-6137-2.4.02-02, BL-6137-2.4.02-05, BL-6137-2.4.02-10]
  finding: >
    2.4.02 asks for "the significance of non-renewable energy in terms of its availability and the contribution
    made by coal, oil, natural gas and wood". The notes deliberately avoid any statement of contribution: they
    never say that fossil fuels supply most of the world's commercial energy, that oil dominates transport,
    that wood is the main household fuel for many rural people in LEDCs/Namibia, or that Namibia has the
    undeveloped offshore Kudu gas field and no coal mining. Everything is framed as conditions ("availability
    depends on deposits, extraction, transport, finance and infrastructure").
  evidence: >
    BL-6137-2.4.02-05 "Explain the pathway without inventing a current price or national import percentage."
    Examiner 2024 P2 (internal) "Discuss how far you agree with many world regions still using oil" credited
    reserves, high energy density, existing infrastructure, economic benefits.
  educational_consequence: >
    Learners cannot describe the relative contribution of each fuel; they only learn that "it depends".
  recommended_repair: >
    Add a dated, sourced block: fossil fuels (oil, coal, gas) provide roughly four-fifths of world primary
    energy; oil is the main transport fuel; coal is a major electricity source in southern Africa (South Africa);
    fuelwood remains the main cooking fuel for many rural Namibian households; Namibia has gas (Kudu) but it is
    not yet developed. Give approximate shares from a named, dated source rather than none.
  confidence: 0.75

- issue_id: 6137-2.4-006
  severity: low
  category: curriculum
  affected_ids: [BL-6137-2.4.05-01, BL-6137-2.4.05-03, ITEM-6137-2.4-021-PROC, ITEM-6137-2.4-P01]
  finding: >
    The HEP generation sequence never names the penstock (the pipe carrying water down to the turbine) or the
    transformer/power lines; it says "the appropriate intake and waterway" and "suitable electrical equipment".
    These are the standard named stages in an NSSCO process answer.
  evidence: >
    BL-6137-2.4.05-01 "Water is directed through the appropriate intake and waterway to a turbine ... Electricity
    then enters the supply system through suitable electrical equipment and transmission connections."
  educational_consequence: Learners give a vaguer sequence and may lose the step marks tied to named parts.
  recommended_repair: >
    "Water from the reservoir or river enters an intake and falls through a steep pipe (the penstock), gaining
    speed; it turns the turbine, which spins the generator; a transformer raises the voltage and power lines
    carry the electricity to users; the water leaves through the tailrace."
  confidence: 0.8

