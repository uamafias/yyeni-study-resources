# ============================== 3.1 POPULATION STUDIES ==============================

- issue_id: 6137-3.1-001
  severity: high
  category: curriculum
  affected_ids: [BL-6137-3.1.09-06, BL-6137-3.1.92-01, BL-6137-3.1.04-14, ITEM-6137-3.1-036-CHAIN, ITEM-6137-3.1-037-INTERP, ITEM-6137-3.1-038-FEATURE]
  finding: >
    The syllabus case study "Population change and structure of population of Windhoek in Namibia" is not
    taught: there is no account of Windhoek's growth, its rural-urban migrants, informal settlements, or its age-sex
    structure. Namibia's own population distribution is never described. The notes say only that the census
    "provides a dated source" and "regional tables or maps show the actual variation". Missing: the
    concentration in the north-central regions, Khomas/Windhoek and the Erongo coastal towns; the sparse Namib,
    southern and eastern Kalahari areas; national density (about 3.7 per km² from the 3,022,401 census total over
    about 825,600 km²) and the reasons. Examiner keys for 3.1.09 expect exactly these place names
    ("Far North/Zambezi", "coastal towns ... Swakopmund, Walvis Bay, Lüderitz", density 2 606 971/825 615 ≈
    3.2).
  evidence: >
    BL-6137-3.1.09-06 "Namibia's 2023 census provides a dated source for studying uneven settlement. Its national
    total should not be spread uniformly across the land. Regional and local tables or maps show the actual
    variation." Syllabus p.23 "Case studies: ... (ii) Population change and structure of population of Windhoek
    in Namibia".
  educational_consequence: >
    Learners cannot describe or explain where people live in Namibia or use Windhoek as a case. These are
    examined, and P3 practicals (informal-settlement growth) build on them.
  recommended_repair: >
    Add a Namibia distribution block (dense: north-central regions such as Ohangwena, Omusati, Oshana,
    Oshikoto, Khomas, Erongo coast; sparse: Namib, Hardap, //Karas, Omaheke; reasons: rainfall gradient,
    perennial rivers in the north, mining/port jobs at the coast, capital-city functions, history of land
    allocation). Add a dated Windhoek case block (growth from rural-urban migration mainly from the north,
    informal settlements on the northern/north-western edge, youthful working-age bulge) from the 2023 census
    or NSA reports. Add one card on each.
  confidence: 0.85

- issue_id: 6137-3.1-002
  severity: high
  category: curriculum
  affected_ids: [BL-6137-3.1.04-07, BL-6137-3.1.04-22, ITEM-6137-3.1-016-FEATURE, ITEM-6137-3.1-P03, ITEM-6137-3.1-048-FEATURE, ITEM-6137-3.1-049-EVAL]
  finding: >
    The syllabus case study is "Population policy and control in China". The notes teach only the 2021
    three-child relaxation (a pro-natalist step) and mention the one-child policy only as something not to
    describe as current. They never explain what the one-child policy was (1979/80-2015), how it worked
    (permits, incentives and penalties, later-marriage campaigns), its effects (fall in birth rate, sex-ratio
    imbalance, rapid ageing, "4-2-1" family) or the 2016 two-child step. The anti-natalist "control" strategy
    asked for in 3.1.04 and 3.1.12 therefore has no example. The examiner notes candidates already cite the
    one-child policy.
  evidence: >
    BL-6137-3.1.04-07 "This contrasts with describing a restrictive one-child arrangement as today's unchanging
    policy." No other description of the one-child policy exists in the notes or cards.
  educational_consequence: >
    Learners cannot describe a population-control policy and its consequences, the standard 5-mark case
    question for 3.1.12.
  recommended_repair: >
    Add a dated China block: "From about 1980 to 2015 China limited most urban couples to one child, using
    permits, rewards for compliance and penalties for extra births. The birth rate fell quickly, but the policy
    contributed to a male-biased sex ratio and rapid ageing. China moved to two children (2016) and three
    children (2021) with support measures." Add one card on aims, methods and effects.
  confidence: 0.85

