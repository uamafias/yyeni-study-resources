- issue_id: 6137-3.1-007
  severity: low
  category: accuracy
  affected_ids: [ITEM-6137-3.1-016-FEATURE, BL-6137-3.1.04-07, CL-6137-3.1.04-03-1]
  finding: >
    The card asks learners to "Name the birth-policy direction announced by China in July 2021". The three-child
    policy was announced on 31 May 2021; the July 2021 document (State Council/CPC decision of 20 July) formalised
    it. The notes' "July 2021 account" is defensible, but "announced ... in July" is not. The card also gives the
    answer away in its own prompt ("permission rose to three children"), and its answer is a description, not a
    name.
  evidence: >
    ITEM-6137-3.1-016-FEATURE "Name the birth-policy direction announced by China in July 2021, when permission
    rose to three children." / "A shift towards supporting or encouraging births..."
  educational_consequence: Minor date inaccuracy; the card tests very little.
  recommended_repair: >
    "In 2021 China raised the number of children couples may have. State the number and whether the change was
    anti-natalist or pro-natalist." Answer: three; pro-natalist.
  confidence: 0.6

