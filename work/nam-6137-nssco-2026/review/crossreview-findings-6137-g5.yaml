# ============================== 2.4 ENERGY SOURCES ==============================

- issue_id: 6137-2.4-001
  severity: high
  category: curriculum
  affected_ids: [BL-6137-2.4.08-01, BL-6137-2.4.09-01, BL-6137-2.4.09-02, BL-6137-2.4.09-03, BL-6137-2.4.10-01, BL-6137-2.4.10-02, BL-6137-2.4.10-03, BL-6137-2.4.10-04, ITEM-6137-2.4-038-CHAIN, ITEM-6137-2.4-039-INTERP, ITEM-6137-2.4-040-CHAIN, ITEM-6137-2.4-041-INTERP]
  finding: >
    Objectives 2.4.08-2.4.10 are explicitly about Namibia ("Namibia's energy policy", "economic and development
    context for Namibia's energy policy", "Namibia's energy sector ... linked to the SADC region and global trade
    in oil"), but the notes contain almost no Namibian content. Absent: the energy policy itself and its
    goals (White Paper on Energy Policy 1998 / National Energy Policy 2017: security of supply through
    diversification, rural/urban access, renewables, cost-effective petroleum supply, social upliftment,
    sustainability); Namibia's generating stations (Ruacana hydro, Van Eck coal near Windhoek, Anixas diesel at
    Walvis Bay, solar PV plants); dependence on electricity imports from Eskom and other SADC utilities; the
    Southern African Power Pool (SAPP) and interconnectors (e.g. the Caprivi Link to Zambia/Zimbabwe); that
    Namibia has no oil refinery and imports all refined fuel, largely through Walvis Bay. The only Namibian
    anchors are a one-sentence mention of the 2022 NIRP and a generic "connected to the wider southern African
    region". The four cards for 2.4.09/2.4.10 are generic (small food enterprise refrigeration; "a country
    relying on imported petroleum products"; "a regional electricity map").
  evidence: >
    BL-6137-2.4.10-01 "Namibia's electricity system is connected to the wider southern African region through
    transmission and exchange arrangements ... A line on a map shows a connection, not proof that unlimited
    electricity can be imported at every time."  BL-6137-2.4.10-03 "The mechanism can be taught without asserting
    a specific present supplier or fuel price."  Examiner report 2022 P1 (internal) for exactly this objective
    expected: Ruacana, Van Eck, Anixas, Omburu PV; reliance on ESKOM PPA; PPAs with Botswana, Zambia, Zimbabwe,
    DRC, Mozambique; the Caprivi interconnector; "Namibia has no refinery capacity ... imports all her refined
    products ... through Walvis Bay". Same report: "candidates have very limited knowledge of the goals in
    Namibia's Energy policy" and lists the goals.
  educational_consequence: >
    A learner who studies only these notes cannot answer "State two goals of Namibia's energy policy" or
    "Describe how Namibia's energy sector is linked to SADC and global trade in oil" — the exact questions on
    which the examiner already reports weak performance. They would reproduce the generic answer the examiner
    criticised ("It is linked through power lines").
  recommended_repair: >
    Add one Namibia block per objective, dated and sourced (MME/NamPower/ECB): 2.4.08 name the Environmental
    Management Act 2007 and environmental clearance for energy projects, a named fuelwood-pressure area (e.g.
    north-central/Kavango regions), and household energy safety measures; 2.4.09 list 4-6 policy goals
    (security of supply via diversification, access/rural electrification, renewables, cost-effective
    petroleum supply, sustainability, investment) and why (high import share, rural households without grid);
    2.4.10 "Namibia imports a large share of its electricity through SAPP, historically mainly from Eskom (South
    Africa), and also from Zambia, Zimbabwe and Mozambique; interconnectors such as the Caprivi Link connect it
    to northern grids. Namibia has no refinery, so all petrol, diesel and paraffin are imported as refined
    products, mainly through Walvis Bay, making prices sensitive to world oil prices and the exchange rate."
    Rebase 038-041 on those facts (e.g. 040: "Explain how a rise in world oil prices affects Namibia, which
    imports all its refined fuel through Walvis Bay").
  confidence: 0.9

- issue_id: 6137-2.4-002
  severity: medium
  category: curriculum
  affected_ids: [BL-6137-2.4.03-02, BL-6137-2.4.06-04, BL-6137-2.4.06-05, BL-6137-2.4.04-03]
  finding: >
    The syllabus names three case studies for 2.4 (p.20): nuclear accidents such as Fukushima, geothermal power
    in Iceland, HEP in China. None appears. The case studies are non-prescriptive, but the notes substitute no
    alternative for nuclear danger or geothermal, so 2.4.03-01 and 2.4.06-03 are taught with no example.
    Uranium mining in Namibia (Rössing, Husab), the obvious local link to nuclear power, is also absent.
  evidence: >
    BL-6137-2.4.06-05 "Severe accidents are a safety concern requiring prevention and preparedness" (no named
    accident). BL-6137-2.4.03-02 "In suitable settings, hot fluids or heated rock can provide usable heat" (no
    setting named).
  educational_consequence: >
    Learners cannot illustrate nuclear risk or geothermal use with a named place, which 5-mark "describe/discuss"
    answers credit.
  recommended_repair: >
    Add short dated case blocks: Fukushima Daiichi 2011 (earthquake and tsunami disabled cooling; evacuation;
    radioactive release); Iceland (plate boundary, geothermal electricity and district heating); Three Gorges
    (China) or keep Ruacana for HEP plus one sentence on Namibia as a uranium producer without nuclear power.
  confidence: 0.85

