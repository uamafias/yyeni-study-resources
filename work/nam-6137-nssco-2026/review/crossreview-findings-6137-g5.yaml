- issue_id: 6137-3.1-009
  severity: low
  category: curriculum
  affected_ids: [BL-6137-3.1.91-01, BL-6137-3.1.91-03]
  finding: >
    The syllabus practical for 3.1 specifies an environmental quality impact assessment using a bi-polar grid
    applied to rural depopulation and informal-settlement growth, plus business/people surveys. The notes
    mention an "environmental-quality score" and sampling but never name or describe a bi-polar grid or apply it
    to informal settlements. Paper 3 in 2026 is prescribed to 1.5 and 2.3, so this is low priority for 2026.
  evidence: >
    BL-6137-3.1.91-01 "...such as mapped land cover, water demand, waste collection or an environmental-quality
    score."
  educational_consequence: Future P3 cohorts would not know the named technique.
  recommended_repair: >
    Add two sentences: "A bi-polar grid scores opposite descriptions (e.g. litter-free -3 ... +3 heavy litter)
    at each site; totals compare sites such as a formal suburb and an informal settlement at the same time of
    day."
  confidence: 0.7

