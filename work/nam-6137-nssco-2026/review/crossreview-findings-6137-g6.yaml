- issue_id: 6137-4.2-003
  severity: medium
  category: quantitative
  affected_ids: [OBJ-6137-4.2.03-02, ITEM-6137-4.2-015-CALC, ITEM-6137-4.2-016-INTERP, ITEM-6137-4.2-017-CALC, ITEM-6137-4.2-019-CALC, ITEM-6137-4.2-020-INTERP]
  finding: >
    Every bearing in notes and cards is 000°, 045°, 090°, 225° or 270°, all derivable without a protractor. No card
    requires measuring or reasoning about a non-cardinal bearing (e.g. 056° vs 236°). The 2021 and 2024 P2 reports say
    bearings were poorly answered, with errors of exactly that kind ("56, 216"). The five bearing cards are each
    3 marks for trivial values; 017 gives 3 marks for 360/4 = 90.
  evidence: "ITEM-6137-4.2-017: \"Calculate the clockwise angle from north for due east ... A: 360/4 = 90 degrees, written 090°.\" [3 marks]"
  educational_consequence: The skill learners actually fail (protractor placement and reading a non-cardinal angle) is not practised, and tariffs overstate difficulty.
  recommended_repair: >
    Add a diagram with a measured line at, say, 062°. Ask for the bearing A→B and the reverse B→A (242°), marking one
    method and one value within a tolerance of ±2°. Reduce 015/017/019 to 1-2 marks.
  confidence: 0.7

- issue_id: 6137-4.2-004
  severity: medium
  category: curriculum
  affected_ids: [OBJ-6137-4.2.05, "4.2 notes 'Human activities and mapped features'", ITEM-6137-4.2-025-FEATURE, ITEM-6137-4.2-026-INTERP, ITEM-6137-4.2-041-MISCON]
  finding: >
    Objective 4.2.05 (describe human activities in relation to map features) is reduced to the building/service
    distinction (school → education, clinic → healthcare). The notes do not teach using the map to describe land use
    (farming, mining, tourism), settlement site and pattern, the distribution of services, or communications in relation
    to relief and drainage. The 2020 examiner lists "relief, drainage, distribution of buildings, different services
    and sites of growth of settlements", and 2024 shows learners mixing physical and human features.
  evidence: "Notes: \"A paired service answer therefore identifies the facility shown and the service it supplies, keeping both fields distinct\" (the whole section is five paragraphs)."
  educational_consequence: Learners are unprepared for "describe the relief/drainage", "suggest why the settlement grew at X" and "describe the distribution of ..." map questions.
  recommended_repair: >
    Add paragraphs on describing relief (heights, slopes, landforms), drainage (river direction, pattern, perennial or
    non-perennial), and settlement site and distribution from map evidence. Add 2-3 cards with map grid locations.
  confidence: 0.65

