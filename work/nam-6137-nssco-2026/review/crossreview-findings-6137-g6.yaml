# Read-only semantic review, group g6: topics 3.2, 3.3, 4.1, 4.2 (6137 NSSCO Geography)
# Reviewer: Claude (cross-vendor reviewer of Codex-authored text). Nothing in the repository was changed.
# I recomputed every worked figure in these four topics (notes and items). All arithmetic is correct; see the
# comment blocks at the end. The findings are mostly about curriculum coverage and assessment validity.
# I checked the NAMPHIA 2017 regional figures against the source PDF in the 3.2 source register. They match:
# Kunene 7.6 (4.9-10.3), Khomas 8.3 (6.6-10.1), Ohangwena 17.9 (16.0-19.8), Zambezi 22.3 (17.5-27.0);
# national 15-64 prevalence 12.6%.

# ---------------------------------------------------------------- 3.2 HIV and AIDS
- issue_id: 6137-3.2-001
  severity: high
  category: curriculum
  affected_ids: [OBJ-6137-3.2.02, "3.2 notes 'Reading Namibia's statistics and spatial patterns' (lines 52-69)", ITEM-6137-3.2-005-CALC, ITEM-6137-3.2-006-INTERP, ITEM-6137-3.2-P03, CL-6137-3.2.02-2]
  finding: >
    The syllabus requires learners to "interpret Namibia's HIV and AIDS statistics and account for its spatial
    distribution". The notes interpret four NAMPHIA figures but never account for the pattern. They name possible
    factor categories, then say a regional comparison "cannot establish the cause". No reason is given for why
    Zambezi and the north-central regions are high, or why Kunene and Khomas are low. The national figure (12.6%,
    adults 15-64, 2017) is also missing, so learners have no benchmark for "above/below national". All three 3.2.02
    cards practise subtraction, uncertainty or the prevalence/incidence distinction. None asks the learner to explain
    the distribution.
  evidence: >
    Notes: "Explaining the pattern requires evidence about factors such as prevention access, treatment and survival,
    population composition, mobility and unequal exposure. A regional comparison alone cannot establish the cause or
    justify stereotyping its residents." ITEM-6137-3.2-006 answer: "The point estimates vary across the named regions
    ... This is historical prevalence, not current incidence".
  educational_consequence: >
    A learner asked to "account for" the distribution (an AO-A/B explain demand) has no content to write and would score
    at most the description marks.
  recommended_repair: >
    Add a short explanatory paragraph framed as factors associated with higher prevalence, not stereotypes. Examples:
    Zambezi lies on the Trans-Caprivi/Walvis Bay-Ndola corridor at Katima Mulilo, with long-distance truck routes,
    cross-border movement (Zambia, Botswana, Zimbabwe) and labour migration. The north-central regions have dense
    populations and border trade towns (e.g. Oshikango). Low-density regions such as Kunene have fewer high-mobility
    contact points. Add the national figure 12.6% (2017, 15-64). Add one 4-mark CHAIN card: "Explain why HIV
    prevalence in Zambezi was higher than in Kunene in 2017."
  confidence: 0.85

- issue_id: 6137-3.2-002
  severity: high
  category: curriculum
  affected_ids: [OBJ-6137-3.2.05, OBJ-6137-3.2.05-01, OBJ-6137-3.2.05-02, "3.2 notes 'Prevention, treatment and population effects' (lines 189-233)", ITEM-6137-3.2-019-FEATURE, ITEM-6137-3.2-020-FEATURE, ITEM-6137-3.2-017-CHAIN, CL-6137-3.2.05-01-1]
  finding: >
    The syllabus asks how condom use and ARVs affect population growth, population structure and the economy. The
    notes deliberately decline to state the structural effects, so the pyramid consequences are never taught: condom
    use lowers the birth rate and narrows the base, and fewer adult deaths keep the economically active bars wide. ARVs
    lower adult mortality and raise life expectancy, giving more people in older age groups and fewer orphans, and
    keep the workforce. On the economic side there is government spending on ARVs against a retained, productive
    workforce. The 2024 P1 Q6(a)(ii) asked exactly "Describe the positive impacts of condom use on the population
    structure of Namibia", and the examiner rejected generic answers ("prevent STDs", "prevent pregnancy"). The 3.2.05-01
    and 3.2.05-02 cards only ask for the use condition and the name ART.
  evidence: >
    Notes: "The overall population-growth effect is not determined by the word condom alone." and "avoids claiming
    that treatment or condoms must increase or decrease the whole population in every setting." ITEM-6137-3.2-019:
    "Name the use condition ... A: Correct and consistent use."
  educational_consequence: >
    Learners write the exact generic answers the examiner rejected and cannot link the measures to pyramid shape,
    dependency or the workforce.
  recommended_repair: >
    Add a paragraph with each effect conditioned on actual sustained use, for both measures. Condom use: fewer births →
    lower birth rate, narrower pyramid base, slower growth; fewer infections → fewer deaths aged 15-49 → wider
    working-age bars and fewer orphans. ART: lower death rate and higher life expectancy → more people survive into
    older age bars; population growth may rise slightly; the workforce and skills are kept; but there is a recurring
    cost to government. Add a 3-mark card "Describe the impact of condom use on Namibia's population structure" and a
    4-mark CHAIN card for ART and the economy.
  confidence: 0.85

- issue_id: 6137-3.2-003
  severity: high
  category: curriculum
  affected_ids: [OBJ-6137-3.2.04, OBJ-6137-3.2.04-01, OBJ-6137-3.2.04-02, OBJ-6137-3.2.04-03, "3.2 notes 'Responses and stakeholder roles' (lines 130-185)", ITEM-6137-3.2-012-FEATURE, ITEM-6137-3.2-013-EVAL, ITEM-6137-3.2-014-EVAL, ITEM-6137-3.2-015-EVAL, ITEM-6137-3.2-016-EVAL]
  finding: >
    The syllabus requires discussing efforts by the government, local authorities, NGOs, churches, the private sector
    and individuals "to address the HIV and AIDS problem in Namibia". The notes describe only abstract functions
    ("planning, service provision, procurement, standards"). They name no Namibian action: free ARV provision through
    public health facilities, free condom distribution, voluntary testing/VCT, prevention of mother-to-child
    transmission, orphan/vulnerable-child grants, school life-skills/HIV education, home-based care, church-run
    counselling and orphan care, workplace programmes. All four 3.2.04 cards are 5-mark "How far do you agree that X
    proves Y" items whose prompts already state the missing evidence. No card makes the learner name or describe an
    actual effort. The 2024 P1 Q6(a)(iv) asked "Explain the efforts taken by the government ... in Namibia".
  evidence: >
    ITEM-6137-3.2-014: "How far do you agree that a clinic building proves maintained treatment access? Staff, medicine
    continuity, affordability and reachable delivery are unrecorded." Notes: "Namibian health authorities and partners
    have undertaken surveillance and treatment-response work, including NAMPHIA's dated household survey".
  educational_consequence: >
    Learners have no stock of specific efforts per stakeholder to "discuss". They learn only that claims of success
    are unproven, which earns few marks on an explain/discuss question.
  recommended_repair: >
    Add one concrete paragraph per stakeholder with Namibian examples. Government: free ART at state facilities, free
    condoms, testing campaigns, PMTCT, social grants for orphans, HIV education in the school curriculum. Local
    authorities: clinics and awareness. NGOs: counselling, testing outreach, home-based care. Churches: care for
    orphans, counselling, reducing stigma. Private sector: workplace testing and policies. Individuals: testing,
    adherence, safer behaviour. Turn at least two of 013-016 into describe/explain cards, e.g. "Describe two efforts by
    churches to reduce the impact of HIV and AIDS in Namibia [4]".
  confidence: 0.85

- issue_id: 6137-3.2-004
  severity: medium
  category: curriculum
  affected_ids: [OBJ-6137-3.2.01-02, "3.2 notes first block (line 11)", ITEM-6137-3.2-004-FEATURE, ITEM-6137-3.2-002-INTERP, CL-6137-3.2.01-1]
  finding: >
    AIDS is defined only as "associated with the most advanced stage of HIV infection". The standard school
    definition is missing: a syndrome or collection of illnesses that develops when HIV has weakened the immune system
    so that the body cannot fight opportunistic infections. The only AIDS card asks for the acronym expansion. The
    2024 P1 Q6(a)(i) asked "Describe the term AIDS".
  evidence: "Notes: \"AIDS is acquired immunodeficiency syndrome, associated with the most advanced stage of HIV infection.\" ITEM-6137-3.2-004: \"Name what AIDS stands for.\""
  educational_consequence: A learner can expand the acronym but cannot describe the term for the full marks.
  recommended_repair: >
    Add: "AIDS is the group of illnesses (a syndrome) that develops when HIV has badly damaged the immune system, so the
    body can no longer fight opportunistic infections such as tuberculosis." Add a 2-mark "Describe the term AIDS" card.
  confidence: 0.75

- issue_id: 6137-3.2-005
  severity: medium
  category: curriculum
  affected_ids: [OBJ-6137-3.2.03-01, OBJ-6137-3.2.03-02, OBJ-6137-3.2.03-03, "3.2 notes 'Demographic, social and economic effects'", ITEM-6137-3.2-009-FEATURE, ITEM-6137-3.2-010-FEATURE, ITEM-6137-3.2-011-FEATURE, ITEM-6137-3.2-P01]
  finding: >
    The impacts are taught almost entirely at household level. National-level effects that NSSCO answers expect are
    absent or only implied: falling life expectancy, deaths concentrated in the economically active 15-49 group, more
    orphans and child-headed households, a higher dependency ratio, loss of skilled workers and productivity, a smaller
    tax base, and spending diverted to health. The 2024 P1 Q6(a)(iii) report shows learners confuse social and
    economic impacts. Each impact category has only one 1-mark card, and no card practises describing social impacts
    at exam tariff.
  evidence: "ITEM-6137-3.2-010: \"Name one social barrier ... A: Stigma or discrimination.\" ITEM-6137-3.2-011: \"Interrupted earnings/working time or increased relevant care/travel costs.\""
  educational_consequence: Answers stay at household anecdote level and do not separate the social from the economic consequence.
  recommended_repair: >
    Add a compact list of national demographic, social and economic impacts, each kept conditional on unmanaged
    illness. Add 3-mark Describe cards: "Describe the social impacts of HIV and AIDS on Namibia" and "Describe the
    economic impacts ...", with rubrics that separate the two categories.
  confidence: 0.7

- issue_id: 6137-3.2-006
  severity: medium
  category: evaluation
  affected_ids: [ITEM-6137-3.2-002-INTERP, ITEM-6137-3.2-013-EVAL, ITEM-6137-3.2-014-EVAL, ITEM-6137-3.2-015-EVAL, ITEM-6137-3.2-016-EVAL, ITEM-6137-3.2-018-INTERP, ITEM-6137-3.2-P03]
  finding: >
    Several prompts contain their own answer. Each states the evidence that is missing ("Implementation and
    confidential experience records are absent"), so the expected verdict, "Disagree", is telegraphed. Five of 25 cards
    in this topic are 5-mark evaluations of this one shape. They train hedging rather than geography and inflate AO C
    marks.
  evidence: "ITEM-6137-3.2-016: \"How far do you agree that a supportive workplace policy proves staff experienced no discrimination? Implementation and confidential experience records are absent.\" A: \"Disagree.\""
  educational_consequence: Learners score on a recall-free pattern and get no practice weighing real arguments on both sides.
  recommended_repair: >
    Rewrite the evaluations with content on both sides, e.g. "How far do you agree that providing free ARVs is the most
    effective government response to HIV in Namibia? [5]", marked for an argument for, an argument against and a
    judgement.
  confidence: 0.7

# ---------------------------------------------------------------- 3.3 Settlement Studies
- issue_id: 6137-3.3-001
  severity: high
  category: curriculum
  affected_ids: [OBJ-6137-3.3.04, OBJ-6137-3.3.04-02, "3.3 notes 'Urban structure and land use' (lines 155-247, esp. 173, 207, 210)", ITEM-6137-3.3-015-INTERP, ITEM-6137-3.3-016-INTERP, ITEM-6137-3.3-017-INTERP, ITEM-6137-3.3-018-INTERP, ITEM-6137-3.3-019-INTERP, ITEM-6137-3.3-020-INTERP, ITEM-6137-3.3-021-INTERP, CL-6137-3.3.04-2, CL-6137-3.3.02-2]
  finding: >
    The syllabus requires discussing the internal structure of LEDC and MEDC towns. The notes never teach the contrast
    and instead tell the learner to avoid it. The standard content is missing: the MEDC concentric/sector pattern
    (CBD, inner-city/twilight zone with older low-cost housing and industry, high-income suburbs at the edge), and the
    LEDC pattern (high-income housing near the CBD or along main routes, squatter/informal settlements on the urban
    fringe, industry along transport routes). No model is named. The notes give no real LEDC city morphology even
    though Windhoek is available (CBD; Northern and Southern Industrial Areas; Klein Windhoek and Ludwigsdorf;
    Katutura; informal areas on the north-western periphery). The 2024 P1 Q5(c) asked "How far do you agree that the
    location of residential areas in LEDCs differs from ... MEDCs?" The examiner reported that learners were
    "unfamiliar with urban morphology". The 2023 P1 Q3(b)(i) asked for changes along an inner city to urban fringe
    transect. All seven 3.3.04 cards describe one schematic plan.
  evidence: >
    Notes: "Avoid treating every peripheral area as low income or every central area as affluent." and "The broad
    LEDC/MEDC contexts do not establish a uniform residential or economic pattern." and "Do not invent a high-rise
    income pattern or label all housing as formal or informal unless the key supplies it."
  educational_consequence: >
    Learners cannot answer the examined LEDC/MEDC comparison and would reproduce the examiner-listed weak answers. The
    caveat-only framing may lead them to argue there is no difference.
  recommended_repair: >
    Add a paragraph and a two-panel diagram contrasting typical LEDC and MEDC residential location and quality from CBD
    to fringe. Present them as generalised models with exceptions, and add a Windhoek illustration. Add a 5-mark
    "How far do you agree ... LEDC vs MEDC residential location" card and a 4-mark transect-description card. Soften the
    lines quoted above to "models are generalisations; real cities have exceptions".
  confidence: 0.85

- issue_id: 6137-3.3-002
  severity: high
  category: curriculum
  affected_ids: [OBJ-6137-3.3.03, "3.3 notes 'Size, growth, function and urbanisation' (lines 133-151)", ITEM-6137-3.3-012-CHAIN, ITEM-6137-3.3-013-INTERP, ITEM-6137-3.3-041-MISCON, ITEM-6137-3.3-P01]
  finding: >
    Objective 3.3.03 (factors influencing size, growth and function of rural and urban settlements in LEDCs and MEDCs)
    gets three short paragraphs and an urbanisation definition. The following are not taught: site and situation;
    functions with examples (port, mining, administrative, tourist, market or service centre); push and pull factors of
    rural-urban migration; natural increase; and decline when a function ends. There are no Namibian examples, although
    obvious ones exist: Walvis Bay port; Windhoek administrative capital; Oranjemund, Rosh Pinah or Tsumeb mining;
    Swakopmund tourism; Kolmanskop as a ghost town after diamond mining moved. The 2023 P1 Q3(b)(ii) asked "Explain why
    many newly arrived migrants to cities in LEDCs live in squatter settlements". The only causal card (012) is a
    generic employment chain.
  evidence: "Notes: \"A port or administrative centre can support jobs and attract residents, while an enterprise decline can reduce opportunities.\" (the entire treatment of function)"
  educational_consequence: Learners cannot discuss factors influencing size, growth and function with examples, or explain migration-driven urban growth.
  recommended_repair: >
    Expand the section with site/situation, a function classification with Namibian examples, push factors (drought,
    lack of jobs or services in rural areas) and pull factors (jobs, schools, health care), natural increase, and growth
    and decline with one example each. Add cards: "Name a Namibian town whose main function is mining", "Explain two
    pull factors drawing migrants to Windhoek [4]", "Explain why a mining town may decline [3]".
  confidence: 0.8

- issue_id: 6137-3.3-003
  severity: medium
  category: curriculum
  affected_ids: [OBJ-6137-3.3.05, OBJ-6137-3.3.05-01, OBJ-6137-3.3.05-03, OBJ-6137-3.3.05-04, "3.3 notes 'Urban growth problems and responses'", ITEM-6137-3.3-022-FEATURE, ITEM-6137-3.3-024-FEATURE, ITEM-6137-3.3-026-FEATURE, ITEM-6137-3.3-027-FEATURE, ITEM-6137-3.3-023-EVAL]
  finding: >
    The syllabus asks learners to "analyse and discuss problems ... and suggest solutions". The notes have generic
    mechanisms but lack the concrete content papers credit. The causes of CBD congestion (converging roads, narrow old
    streets, commuters, deliveries, on-street parking, limited public transport) are not listed together. Conditions in
    informal settlements (no piped water or sanitation, disease, fire and flood risk, overcrowding) are only "some areas
    lack essential services". Named solution types are absent: site-and-service, self-help/upgrading, one-way systems,
    ring roads, park-and-ride, pedestrianisation, bus lanes. The Namibian Build Together Programme and the Shack
    Dwellers Federation savings-group housing are not mentioned. The four 3.3.05 member cards are 1-mark "Name" items.
    No card asks for causes of CBD congestion (2022 P1 Q4(c)(i)) or an option choice with rejection (2022 P1 Q4(c)(ii)).
  evidence: "ITEM-6137-3.3-024: \"Name the CBD access problem indicated by queues or delays ... A: Congestion.\" ITEM-6137-3.3-027: \"Suitable public transport or a relevant managed-demand/access measure.\""
  educational_consequence: Learners recognise the problem names but cannot write a 3-5 mark "suggest reasons" or "suggest solutions" answer.
  recommended_repair: >
    Add a causes/problems/solutions table for each of the four problems. Add a 3-mark card "Suggest three reasons why
    traffic congestion occurs in the CBD" and a 5-mark decision card (ring road / public transport / vehicle
    restriction: choose one and reject the others).
  confidence: 0.75

- issue_id: 6137-3.3-004
  severity: medium
  category: evaluation
  affected_ids: [ITEM-6137-3.3-003-INTERP, ITEM-6137-3.3-004-INTERP, ITEM-6137-3.3-005-INTERP, ITEM-6137-3.3-016-INTERP, ITEM-6137-3.3-017-INTERP, ITEM-6137-3.3-018-INTERP, ITEM-6137-3.3-019-INTERP, ITEM-6137-3.3-020-INTERP, ITEM-6137-3.3-021-INTERP, ITEM-6137-3.3-007-INTERP]
  finding: >
    Ten 3-mark INTERP cards give both the pattern and the limit in the prompt. The answer repeats them, with marks for
    "the bounded interpretation". Examples: panel C "cluster around a crossroads, with no household income data
    supplied" gives the answer "nucleated ... does not establish income". The cards test copying, not reading the
    diagram. Learners also rehearse the formula "does not establish income" about thirty times across the topic.
  evidence: "ITEM-6137-3.3-020 prompt: \"a south-eastern area is keyed as a park, but maintenance and public-access records are absent.\" Answer: \"... It does not establish actual maintained access\""
  educational_consequence: Little discriminating practice for the map/diagram description demand, and a habit of padding answers with caveats that earn no marks.
  recommended_repair: >
    Strip the descriptive content and the limitation from the prompts ("Describe the settlement pattern in panel C"),
    and mark on observed evidence such as clustering at the junction and spacing. Keep a limit mark only where the
    command is "Suggest" or "How far".
  confidence: 0.7

- issue_id: 6137-3.3-005
  severity: low
  category: accuracy
  affected_ids: ["3.3 notes line 276", ITEM-6137-3.3-P03]
  finding: >
    The National Housing Enterprise (a real state-owned company) is named, with a "2020 phase launch at Havana Proper".
