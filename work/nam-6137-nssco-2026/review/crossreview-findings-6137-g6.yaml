# ---------------------------------------------------------------- 4.1 Research skills
- issue_id: 6137-4.1-001
  severity: medium
  category: curriculum
  affected_ids: [OBJ-6137-4.1.03, OBJ-6137-4.1.03-05, "4.1 notes 'Collecting and recording evidence'", ITEM-6137-4.1-005-PROC, ITEM-6137-4.1-006-WHY, ITEM-6137-4.1-P04]
  finding: >
    The 4.1 notes never name standard field equipment or how to use it, and item 006 teaches that naming equipment is
    beside the point. Papers 3 of 2023 and 2024 asked learners to tick the correct equipment (ranging poles, tape
    measure) and to describe how to use ranging poles and a clinometer for a beach profile and stream width. Missing
    items: tape measure, ranging poles, clinometer, ruler or callipers for pebbles, stopwatch, tally counter, quadrat,
    float. P04 gives "falls over ten horizontal metres" but no method for measuring them. (Topic 1.5 notes do describe
    a beach profile; 4.1 does not cross-refer.)
  evidence: "ITEM-6137-4.1-006: \"Explain why naming a tape measure alone is not a reproducible path-width method.\" Notes: \"Equipment alone is not a method: naming a tape does not explain where to place it\""
  educational_consequence: Learners cannot answer equipment-recognition and "describe how to use" P3 items, which the 2023/2024 reports show are routinely asked.
  recommended_repair: >
    Add a short equipment table (instrument: what it measures: how to use it). Give a 3-step beach-gradient method:
    two ranging poles at a measured distance, clinometer reading at equal heights, record the angle. Cross-refer to
    topic 1.5. Add a card such as "Name two pieces of equipment needed to measure river width and describe how to use
    them [3]".
  confidence: 0.75

- issue_id: 6137-4.1-002
  severity: medium
  category: coherence
  affected_ids: [ITEM-6137-4.1-P01, ITEM-6137-4.1-P04, ITEM-6137-4.1-P05, ITEM-6137-4.1-P07, ITEM-6137-3.2-P01, ITEM-6137-3.3-P01]
  finding: >
    Several 3-mark "Describe three ..." package parts have a canonical answer that lists categories, not answer
    statements. The rubric says "credit three distinct relevant descriptions". A learner self-marking cannot tell what a
    creditworthy description is, and the rubric credits content the answer never states.
  evidence: "ITEM-6137-4.1-P04 (b) answer: \"Suitable erosion, transport and deposition descriptions or distinct relevant mechanisms.\" ITEM-6137-4.1-P01 (b): \"Suitable descriptions include erosion removing material, transport moving it and deposition ...\""
  educational_consequence: The self-check fails, and learners may accept one-word answers as "descriptions".
  recommended_repair: >
    Write three model statements, e.g. "Attrition: pebbles knock together and become smaller and rounder. Longshore
    drift moves material along the beach in the direction of the prevailing wind. Deposition builds the beach where
    wave energy falls." Then add "accept other correct processes".
  confidence: 0.7

- issue_id: 6137-4.1-003
  severity: low
  category: coherence
  affected_ids: [ITEM-6137-4.1-P01, ITEM-6137-4.1-P02, ITEM-6137-4.1-P04, ITEM-6137-4.1-P05, ITEM-6137-4.1-P06, ITEM-6137-4.1-P07]
  finding: >
    Parts (a) to (c) of the packages test topic 1.5 (longshore drift, backwash, deposition) or topic 2.3 (tourism jobs,
    sectors, pressures). That content does not appear in the 4.1 notes, and the packages give no cross-reference. A
    learner working from 4.1 alone fails the learner test on 5 of 7 marks in P01 and P02. Integrating the topics is
    legitimate; the missing pointer is not.
  evidence: "ITEM-6137-4.1-P01: \"(a) Name movement of beach sediment along the shore by oblique swash and return flow. ... (c) Name a water movement returning down the beach after swash.\""
  educational_consequence: A learner may think the content was never taught.
  recommended_repair: Add "(see topic 1.5 Coastal and marine processes)" or "(see topic 2.3 Leisure and tourism)" to the package stems, or a Connections line in the 4.1 notes.
  confidence: 0.6

- issue_id: 6137-4.1-004
  severity: low
  category: curriculum
  affected_ids: ["4.1 notes lines 176, 199, 329, 344, 356", ITEM-6137-4.1-028-WHY, ITEM-6137-4.1-050-INTERP]
  finding: >
    Some register and concepts sit above NSSCO Grade 10-11 level: "self-weighting estimate", "appropriate weighting",
    "monotonic pattern", "dual-axis display", and a formal reliability/validity distinction. Card 028's answer requires
    "distribution/weighting". These are not syllabus content and add reading load.
  evidence: "Notes: \"a sample of ten from each gives equal comparison groups, not a self-weighting estimate of the combined population. State the design and use appropriate weighting\"; \"without establishing a monotonic pattern\""
  educational_consequence: Reading difficulty, and a learner may think weighting is required knowledge.
  recommended_repair: Replace with plain wording ("equal groups are good for comparing, but do not show how many of each live there") and drop "weighting" from the 028 answer and rubric.
  confidence: 0.6

