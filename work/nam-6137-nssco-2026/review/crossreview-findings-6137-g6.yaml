- issue_id: 6137-3.3-006
  severity: low
  category: coherence
  affected_ids: [ITEM-6137-3.3-043-MISCON]
  finding: >
    The MIS-6137-25 slot demands "Compare two areas with height and quality-of-life indicators pointing in different
    directions". The card instead asks the learner to explain the error in prose, and no data contrast is given to
    discriminate.
  evidence: "\"Explain the error in concluding that a tall residential building proves high income or quality of life.\""
  educational_consequence: The misconception is restated rather than tested.
  recommended_repair: "Give data: Area X 12-storey flats, 40% homes without piped water; Area Y single-storey houses, 98% piped water. Ask which area has better living conditions and why height misleads."
