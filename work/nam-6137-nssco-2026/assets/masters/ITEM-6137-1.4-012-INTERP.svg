  <text x="950" y="569" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff" >3</text>
  <rect x="16" y="741" width="968" height="349" rx="8" fill="#f4faf6" stroke="#0b6e4f" stroke-width="2" />
  <text x="36" y="781" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="#0b6e4f" >Interpretation</text>
  <circle cx="52" cy="816" r="19" fill="#0b6e4f" stroke="#ffffff" stroke-width="2.5" />
  <text x="52" y="825" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff" >1</text>
  <text x="84" y="825" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >A stays in the air at every time and never touches the surface:</text>
  <text x="84" y="857" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >suspension.</text>
  <circle cx="52" cy="888" r="19" fill="#0b6e4f" stroke="#ffffff" stroke-width="2.5" />
  <text x="52" y="897" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff" >2</text>
  <text x="84" y="897" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >B lifts off, travels a short arc and lands, again and again:</text>
  <text x="84" y="929" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >saltation.</text>
  <circle cx="52" cy="960" r="19" fill="#0b6e4f" stroke="#ffffff" stroke-width="2.5" />
  <text x="52" y="969" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff" >3</text>
  <text x="84" y="969" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >C stays in contact with the surface, rolling or sliding: surface</text>
  <text x="84" y="1001" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >creep.</text>
  <text x="36" y="1043" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >Classify by the path and ground contact, not by drawn size: the same</text>
  <text x="36" y="1075" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >grain can move differently in a stronger gust.</text>
</g>
