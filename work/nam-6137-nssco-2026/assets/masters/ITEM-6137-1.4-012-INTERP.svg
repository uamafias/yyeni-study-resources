<g id="layer-a">
  <text x="520" y="225.55" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#6c4f8f" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" paint-order="stroke" >stays in the air: suspension</text>
  <text x="520" y="373" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#d9822b" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" paint-order="stroke" >repeated short hops: saltation</text>
  <text x="922" y="560" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="end" fill="#5a3f1c" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" paint-order="stroke" >rolls: surface creep</text>
