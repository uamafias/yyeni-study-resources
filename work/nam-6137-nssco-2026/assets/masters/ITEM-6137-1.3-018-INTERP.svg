  <text x="84" y="990" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >The abrupt 4 m drop at the lip is a waterfall; the hollow at its</text>
  <text x="84" y="1022" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >foot is a plunge pool, eroded by the falling water and its load.</text>
