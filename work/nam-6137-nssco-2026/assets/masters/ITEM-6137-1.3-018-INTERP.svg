  <text x="52" y="1166" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff" >3</text>
  <text x="84" y="1166" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >Repeated undercutting and collapse move the waterfall upstream,</text>
  <text x="84" y="1198" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >leaving the narrow, steep-sided gorge downstream (b, c).</text>
