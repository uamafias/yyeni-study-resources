  <rect x="16" y="726" width="968" height="374" rx="8" fill="#f4faf6" stroke="#0b6e4f" stroke-width="2" />
  <text x="36" y="766" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="#0b6e4f" >Interpretation</text>
  <circle cx="52" cy="801" r="19" fill="#0b6e4f" stroke="#ffffff" stroke-width="2.5" />
  <text x="52" y="810" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff" >1</text>
  <text x="84" y="810" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >The arrows are parallel to the fault and point in opposite</text>
  <text x="84" y="842" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >directions: M moves south and K moves north.</text>
  <circle cx="52" cy="873" r="19" fill="#0b6e4f" stroke="#ffffff" stroke-width="2.5" />
  <text x="52" y="882" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff" >2</text>
  <text x="84" y="882" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >So the plates slide horizontally past one another along the</text>
  <text x="84" y="914" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >margin; no crust is created or destroyed.</text>
  <circle cx="52" cy="945" r="19" fill="#0b6e4f" stroke="#ffffff" stroke-width="2.5" />
  <text x="52" y="954" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff" >3</text>
  <text x="84" y="954" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >The stream’s eastern part is displaced north along the fault, the</text>
  <text x="84" y="986" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >same sense as K’s movement: consistent with sideways displacement</text>
  <text x="84" y="1018" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >on the fault.</text>
  <text x="36" y="1062" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >The offset records past displacement; on its own it does not show</text>
  <text x="36" y="1094" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >when the fault moved.</text>
