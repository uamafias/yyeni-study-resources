<g id="layer-a">
  <circle cx="315" cy="260" r="19" fill="#0b6e4f" stroke="#ffffff" stroke-width="2.5" />
  <text x="315" y="269" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff" >1</text>
  <circle cx="820" cy="340" r="19" fill="#0b6e4f" stroke="#ffffff" stroke-width="2.5" />
  <text x="820" y="349" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff" >1</text>
  <circle cx="315" cy="720" r="19" fill="#0b6e4f" stroke="#ffffff" stroke-width="2.5" />
  <text x="315" y="729" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff" >2</text>
  <circle cx="895" cy="550" r="19" fill="#0b6e4f" stroke="#ffffff" stroke-width="2.5" />
  <text x="895" y="559" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff" >3</text>
  <rect x="16" y="931" width="968" height="344" rx="8" fill="#f4faf6" stroke="#0b6e4f" stroke-width="2" />
  <text x="36" y="971" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="#0b6e4f" >Interpretation</text>
  <circle cx="52" cy="1006" r="19" fill="#0b6e4f" stroke="#ffffff" stroke-width="2.5" />
  <text x="52" y="1015" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff" >1</text>
  <text x="84" y="1015" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >Water enters the joint (1). When the air falls below 0 °C it</text>
  <text x="84" y="1047" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >freezes; the ice expands and pushes against the joint walls (2).</text>
  <circle cx="52" cy="1078" r="19" fill="#0b6e4f" stroke="#ffffff" stroke-width="2.5" />
  <text x="52" y="1087" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff" >2</text>
  <text x="84" y="1087" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >Thawing lets more water in, and repeated freezing and thawing</text>
  <text x="84" y="1119" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >widens the joint: 2 mm to 6 mm (3).</text>
  <circle cx="52" cy="1150" r="19" fill="#0b6e4f" stroke="#ffffff" stroke-width="2.5" />
  <text x="52" y="1159" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff" >3</text>
  <text x="84" y="1159" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >The loose fragment (4) is physical breakdown: the rock splits</text>
  <text x="84" y="1191" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >into pieces but its minerals do not change.</text>
  <text x="36" y="1233" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >One reading below 0 °C does not by itself break rock: water supply</text>
  <text x="36" y="1265" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >and repeated cycles around freezing matter.</text>
</g>
