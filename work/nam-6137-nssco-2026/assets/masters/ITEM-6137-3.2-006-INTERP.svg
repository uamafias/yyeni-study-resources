  <text x="52" y="830" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff" >1</text>
  <text x="84" y="830" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >Point estimates vary: Ohangwena (17.9%) and Zambezi (22.3%) are</text>
  <text x="84" y="862" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >much higher than Kunene (7.6%) and Khomas (8.3%).</text>
  <circle cx="52" cy="893" r="19" fill="#0b6e4f" stroke="#ffffff" stroke-width="2.5" />
  <text x="52" y="902" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff" >2</text>
  <text x="84" y="902" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >Zambezi’s estimate is highest, but its interval (17.5–27.0)</text>
  <text x="84" y="934" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >overlaps Ohangwena’s (16.0–19.8); Kunene’s and Khomas’s also</text>
  <text x="84" y="966" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >overlap.</text>
  <circle cx="52" cy="997" r="19" fill="#0b6e4f" stroke="#ffffff" stroke-width="2.5" />
  <text x="52" y="1006" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff" >3</text>
  <text x="84" y="1006" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >These are 2017 prevalence estimates for adults aged 15–64: not</text>
  <text x="84" y="1038" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >current figures, not new infections, and not about any</text>
  <text x="84" y="1070" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#1a1a1a" >individual.</text>
