      - EXPOSURE-CIE-9609-AS-2026-2028
      - OBJ-9609-5.4.4-01
      - OBJ-9609-5.4.4-02-01
      - OBJ-9609-5.4.4-02-02
      - OBJ-9609-5.4.4-02-03
      - OBJ-9609-5.4.4-03
      - EV-9609-S23-13-5b-0144
      - CU-9609-5.4.4
      - CONTRACT-9609-AS-5.4
    finding: >-
      The exposure repair remains internally inconsistent. One previously identified importance question is still mapped to the break-even-output calculation, old pre-remap metrics remain nested beside newer totals, several exposure classes contradict the file's own tariff definition, and downstream topic metadata still reports the old figures. The remap note's claim that every 5.4 field was rebuilt with no old figure retained is therefore false.
    evidence:
      - >-
        EV-9609-S23-13-5b-0144 asks whether break-even analysis is the most important finance activity but still maps to OBJ-9609-5.4.4-02-01. Under the repair's own semantic policy, importance belongs with OBJ-9609-5.4.4-01 or the uses-and-limitations objective -03, not the output calculation.
      - >-
        In exam-exposure.json, OBJ-9609-5.4.4-02-01 retains 26 parts and 15 series inside evidence but reports 10 parts and 9 series at top level. OBJ-9609-5.4.4-02-02 retains four parts, Analyse/Evaluate and a 12-mark maximum inside evidence but reports one Calculate part and a 3-mark maximum at top level.
      - >-
        The same file defines probed_high as reaching at least 8 marks, yet OBJ-9609-5.4.1-02-01 and OBJ-9609-5.4.4-02-03 remain probed_high with top-level maxima of 3. CU-9609-5.4.4's notes still say 26 of 47 parts touch break-even output, and contract.json records an unexplained 3/2/1 exposure-class split rather than the current 4/4/11 topic distribution.
