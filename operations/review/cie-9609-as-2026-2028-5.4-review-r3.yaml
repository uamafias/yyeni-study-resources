  - issue_id: SR-9609-5.4-CODEX-R3-005
    severity: medium
    category: quantitative
    affected_ids:
      - OBJ-9609-5.4.4-02-01
      - OBJ-9609-5.4.4-02-03
      - OBJ-9609-5.4.4-02-04
      - ITEM-9609-5.4-064-APP
    finding: >-
      ITEM-064 confuses three different quantities. From break-even output of 240 haircuts and expected output of 300, the learner can derive a 60-haircut margin of safety, not "60 haircuts of profit"; profit is a currency amount and cannot be calculated without contribution per haircut. The answer also says the first 240 haircuts earn the owner nothing personally, although break-even establishes zero business profit, not whether an owner receives wages, salary or drawings.
    evidence:
      - >-
        ITEM-9609-5.4-064-APP's canonical answer says "Everything from the 241st onward is where her profit comes from" and that expected sales "leave 60 haircuts of profit".
      - >-
        The prompt gives no selling price or variable cost per haircut, so it supplies no contribution figure with which a currency profit can be calculated.
      - >-
        CU-9609-5.4.4 block 5.4.4-b4 defines margin of safety in units and profit in currency, while ITEM-9609-5.4-087-SHOR correctly separates owner's drawings from business costs and profit break-even.
    educational_consequence: >-
      Learners may label a margin of safety as profit, attach units to a currency result, and conflate business profit with the owner's personal remuneration. These are precisely the distinctions needed for quantitative interpretation marks.
    recommended_repair: >-
      State that 240 haircuts cover total cost and give zero business profit, and that 300 implies a 60-haircut margin of safety. Add contribution per haircut if a monetary profit is required; otherwise say its amount cannot be calculated. Remove the claim about what the owner personally earns.
    confidence: 1.0
    status: open
  - issue_id: SR-9609-5.4-CODEX-R3-006
    severity: medium
    category: quantitative
    affected_ids:
      - OBJ-9609-5.4.3-02
      - ITEM-9609-5.4-046-CALC
    finding: >-
      ITEM-046 asks for "the lowest price that still adds to profit" when variable cost is N$310, but no such single price is determined by the data. A price of exactly N$310 gives zero contribution and adds nothing; every price above N$310 adds something, with the minimum depending on the allowed currency increment. The canonical answer calls N$310 the floor and then introduces N$360, which was not in the prompt and is not the requested lowest price.
    evidence:
      - >-
        ITEM-9609-5.4-046-CALC asks for a numerical lowest price and supplies only variable cost N$310 and a fixed-cost allocation of N$140.
      - >-
        Its answer correctly calculates full cost of N$450, then says the short-run floor is N$310 and uses an arbitrary N$360 to demonstrate N$50 contribution. At N$310 the special order neither improves profit nor reduces loss.
      - >-
        CLM-9609-5.4-055 states the valid rule as price exceeding every incremental cost, not price equalling it.
    educational_consequence: >-
      A learner can give the canonical N$310 as a price that adds to profit even though its contribution is zero, or copy the unexplained N$360. The item therefore does not have one derivable answer to its own calculation request.
    recommended_repair: >-
      Ask for the break-even or no-loss price and accept N$310, or ask for the condition and answer "any price above N$310". If an exact lowest positive-contribution price is required, specify pricing to the nearest cent and use N$310.01; remove the invented N$360 unless it is placed in the stem.
    confidence: 1.0
    status: open
  - issue_id: SR-9609-5.4-CODEX-R3-007
    severity: medium
    category: accuracy
    affected_ids:
      - OBJ-9609-5.4.1-02-01
      - OBJ-9609-5.4.4-03
      - ITEM-9609-5.4-087-SHOR
    finding: >-
      The repaired lender checklist correctly removes owner's drawings, but it now treats unspecified bank charges and accountancy fees as fixed costs whose omission necessarily understates break-even. Those labels do not determine cost behaviour: a monthly account fee or retainer may be fixed, while transaction charges, borrowing charges or work billed by activity can vary. The answer contradicts the topic's own rule that classification depends on how the amount changes with output or activity.
    evidence:
      - >-
        ITEM-9609-5.4-087-SHOR says "Insurance, bank charges and accountancy fees are the ones most often left out, and each omission understates fixed costs" without identifying fixed forms of the latter two or evidencing the frequency claim.
      - >-
        CU-9609-5.4.1 block 5.4.1-b4 and ITEM-9609-5.4-005-DIST teach that fixed/variable classification turns on cost behaviour, not the name of the expense.
      - >-
        The same checklist is a canonical answer about auditing break-even inputs, so its unqualified examples are intended to determine what enters the fixed-cost numerator.
    educational_consequence: >-
      Learners may add all bank and accountancy charges to fixed costs by label, calculate the wrong break-even output and contradict the classification principle they were taught earlier.
    recommended_repair: >-
      Use unambiguous examples such as a fixed monthly bank-account fee and a fixed annual accountancy retainer, or ask how each charge behaves before classifying it. Remove the unsupported "most often left out" claim and state that only the fixed component belongs in the fixed-cost total.
    confidence: 0.98
    status: open
