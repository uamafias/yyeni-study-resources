coverage_confirmed: >-
  I verified all 18 packet entries and the detached manifest hash, read the full topic objective branch and every packet artifact, and traced all 21 assessable objectives in both directions. OBJ-9609-5.4.1-01 is taught in CU-9609-5.4.1 blocks 5.4.1-b2/b3 and practised by ITEM-9609-5.4-001-DEF to -004-APP. The decomposed cost-types container OBJ-9609-5.4.1-02 is taught in b4/b8 and practised by -005-DIST, -006/-007-DEF and -013/-014-DEF; member -02-01 is taught in b4/b5/b7/b8 and practised by -006 to -012, while member -02-02 is taught in b4/b6/b8 and practised by -013 to -018. OBJ-9609-5.4.2-01 is taught in CU-9609-5.4.2 b2/b3 and practised by -019 to -022; -02 is taught in b2/b6/b7/b9 and practised by -019/-023 to -026/-085; -03 is taught in b2/b4 and reinforced in later contribution blocks, and practised by -020/-027 to -030; -04 is taught in b5/b7/b9 and practised by -031 to -034; -05 is taught in b6/b9 and practised by -035 to -037/-085; and -06 is taught in b7/b8 and practised by -038 to -040/-085. OBJ-9609-5.4.3-01 is taught in CU-9609-5.4.3 b2/b3/b7 and practised by -041 to -044/-088; -02 is taught in b4/b7 and practised by -045 to -047/-086; -03 is taught in b5/b7 and practised by -048 to -051; and -04 is taught in b6 and practised by -052 to -055/-086. OBJ-9609-5.4.4-01 is taught in CU-9609-5.4.4 b2/b3 and practised by -056 to -059. The decomposed numeric-and-graphic container OBJ-9609-5.4.4-02 is taught in b2/b4-b9/b11, with supporting contribution teaching in CU-9609-5.4.2 b4 and the special-order application in CU-9609-5.4.3 b6, and is practised by -027/-028, -057, -060 to -079, -084 and -089 to -092. Member -02-01 is taught in CU-9609-5.4.4 b2/b4-b8/b11 and practised by -057/-060 to -067/-084/-089/-092; -02 is taught in CU-9609-5.4.2 b4 and CU-9609-5.4.4 b4/b5/b7/b11 and practised by -027/-028/-068 to -071; -03 is taught in CU-9609-5.4.4 b4/b5/b11 and practised by -072 to -075/-084/-090; and the rarely examined -04 is taught at full depth in b4/b5/b9 and practised by -076 to -079/-084/-091. OBJ-9609-5.4.4-03 is taught in b10 and practised by -080 to -083/-087. The rebuilt charts are algebraically coherent, require readings the stems do not disclose, and now include drawing practice; the full/contribution boundary, special-order governing claim, numerical sensitivity, diagnosis, item count and renamed ITEM-068 repairs also hold. The reverse pass found an objective, prerequisite or approved assessment purpose for every substantial block and no excluded construct presented as core. The costing sense of contribution is explicitly disambiguated, no consequential registered finance variant is invoked, and no unqualified legal rule is taught. C-18 does not establish an AO4 deficit: nine sustained five-part EVAL cards and four extended performance tasks make a credible practice-time share above the count share. C-30 is a genuine but disclosed historical audit limitation; the 16 old stamps cannot be reconstructed, but the present artifacts were reread here and are anchored to this verified packet, so the warning is not itself a current learner defect. Objective presence and depth are confirmed throughout, but the high-severity causal and special-order defects below prevent semantic approval.
reconstruction_test: >-
  Using only the generated resource, I reconstructed a precise recall definition of direct cost; 3-mark explanations on fixed and variable cost, cost monitoring, contribution versus profit and a break-even limitation; calculations of total, average and marginal cost, contribution, break-even output, margin of safety and profit with working, units and interpretation; an 8-mark analysis for an unfamiliar mobile-services business considering a discounted booking; a 12-mark evaluation of break-even analysis for a new bicycle-repair business; and transfer to a context not named in the notes. The repaired fixed/variable boundary, formula set, worked Kaoko example, actual chart-reading and chart-drawing tasks, conditional sensitivity discussion and five-part evaluation scaffold support those answers, including the rarely examined profit objective. No objective is absent or too thin to reconstruct. However, mastery of the canonical material as written would also reproduce non-credit-worthy reasoning: OBJ-9609-5.4.1-01 says all decisions based on an inaccurate figure fail together and in the same direction; several keep-or-drop chains make unavoidable overhead and the absence of a better capacity use implicit; ITEM-055-EVAL recommends acceptance without establishing that N$5 is the complete incremental cost; ITEM-064-APP calls a 60-unit margin of safety profit and equates break-even with the owner's personal earnings; ITEM-046-CALC has no determinate lowest positive-contribution price; and ITEM-087-SHOR classifies unspecified bank charges as fixed. Those failures do not erase coverage, but they would train invalid analysis, evaluation and quantitative interpretation, so the reconstruction test does not support release.
issues:
  - issue_id: SR-9609-5.4-CODEX-R3-001
    severity: high
    category: analysis
    affected_ids:
      - OBJ-9609-5.4.1-01
      - CLM-9609-5.4-003
      - CU-9609-5.4.1/5.4.1-b3
      - ITEM-9609-5.4-002-WHY
    finding: >-
      The foundational explanation of why accurate cost information matters makes an invalid universal causal claim: if a cost figure is wrong, all four decisions resting on it supposedly go wrong together and in the same direction. An error need not be material to every decision, and under-allocating a fixed total to one product normally over-allocates it to another, making the two products look wrong in opposite directions. The valid conclusion is that inaccurate information can mislead any dependent decision, with the direction determined by whether the relevant cost is under- or overstated.
    evidence:
      - >-
        CLM-9609-5.4-003 says that "every decision resting on it is wrong in the same direction"; CU-9609-5.4.1 block 5.4.1-b3 and notes lines 24-28 repeat that all four decisions "go wrong together".
      - >-
        ITEM-9609-5.4-002-WHY makes the same assertion canonical and its marking guidance requires "every decision" to move in "the same wrong direction" rather than accepting one valid conditional pathway.
      - >-
        The same block immediately gives one product carrying too little cost and another carrying too much, which are opposite distortions and contradict the claimed common direction.
    educational_consequence: >-
      A learner can reproduce the supplied answer in an Explain or Analyse response and write an unsupported absolute instead of a conditional mechanism. The model also obscures the central insight that under- and overstatement cause different pricing, continuation and performance errors.
    recommended_repair: >-
      Rewrite CLM-003, block b3 and ITEM-002 to say that inaccurate cost information can mislead each decision that materially depends on it. Develop separate under-costing and over-costing pathways, and require one correctly conditioned pathway rather than the claim that all decisions fail together.
    confidence: 1.0
    status: open
  - issue_id: SR-9609-5.4-CODEX-R3-002
    severity: high
    category: analysis
    affected_ids:
      - OBJ-9609-5.4.1-02-02
      - OBJ-9609-5.4.2-02
      - OBJ-9609-5.4.2-06
      - CLM-9609-5.4-040
      - CU-9609-5.4.1/5.4.1-b6
      - CU-9609-5.4.2/5.4.2-b7
      - ITEM-9609-5.4-003-CHAIN
      - ITEM-9609-5.4-017-CHAIN
      - ITEM-9609-5.4-025-EVAL
    finding: >-
      The earlier full-costing repair correctly conditions the targeted claim and cards on overhead being unavoidable, but parallel learner-facing chains still assert that dropping a positive-contribution product leaves the overhead unchanged and makes the business worse off without establishing either that the cost is unavoidable over the decision horizon or that the freed capacity has no better use. Positive contribution proves the loss from dropping without replacement, not that keeping the product is the best available decision.
    evidence:
      - >-
        CU-9609-5.4.1 block 5.4.1-b6 and notes lines 58-64 say the N$120 000 rent "does not fall" when product A is dropped, although the example gives no lease term, downsizing constraint or other fact that makes the rent unavoidable.
      - >-
        ITEM-9609-5.4-003-CHAIN says the contribution goes while all shared costs remain, and its marking guidance conditions only on a chosen allocation basis. ITEM-9609-5.4-017-CHAIN similarly requires "the overhead stays" and calls the product's loss "not in cash" without supplying an avoidability fact.
      - >-
        CLM-9609-5.4-040 and CU-9609-5.4.2 block 5.4.2-b7 condition on fixed costs continuing but still conclude the product is worth keeping without asking whether its capacity could earn more elsewhere. ITEM-9609-5.4-025-EVAL uses avoidability as the sole decisive criterion and offers permanent "subsidy" as the counterargument, again omitting opportunity cost.
      - >-
        ITEM-9609-5.4-026-CHAIN and ITEM-9609-5.4-085-ESSA show that the missing conditions can be supplied: the former fixes the lease and dedicated-resource facts, while the latter ends on both avoidable cost and whether the freed capacity has a better use.
    educational_consequence: >-
      Learners are trained to treat allocated overhead as necessarily unchanged and positive contribution as a sufficient keep decision. In an unfamiliar case they may recommend retaining a line even when its fixed costs can be avoided or its resources can earn a larger contribution elsewhere, invalidating AO3 chains and the decisive AO4 criterion.
    recommended_repair: >-
      Carry both conditions through every version of the mechanism: identify which costs would actually disappear over the relevant horizon, then compare the product's contribution with the best alternative use of its capacity. Revise the two early chain cards and ITEM-025's guidance, and replace "not in cash" with the accurate point that an allocated accounting loss is not by itself the incremental effect of stopping.
    confidence: 0.99
    status: open
  - issue_id: SR-9609-5.4-CODEX-R3-003
    severity: high
    category: evaluation
    affected_ids:
      - OBJ-9609-5.4.3-04
      - CLM-9609-5.4-061
      - ITEM-9609-5.4-055-EVAL
    finding: >-
      The special-order repair is complete in CLM-061 and most practice, but ITEM-055 still does not establish the decisive cost fact it rewards. Its learner-visible stem says only that flour, yeast and packaging cost N$5 a roll; it does not say that N$5 is the total variable or incremental cost, or that oven energy and every other order-caused cost are included or unchanged. The canonical answer nevertheless asserts that N$5 is the only cost caused by the order and recommends acceptance from that invented completeness.
    evidence:
      - >-
        ITEM-9609-5.4-055-EVAL supplies the three named inputs at N$5, a fixed monthly baker salary, collection by the hotel and adequate idle capacity, but never states "total variable cost" or "no other incremental cost".
      - >-
        The canonical answer says "the only cost these rolls cause is the N$5" and the marking guidance requires the learner to establish that no other cost is created, a fact the prompt does not provide. Power or fuel used by the oven is an obvious possible incremental cost in the stated bakery context.
      - >-
        CLM-9609-5.4-061 and CU-9609-5.4.3 block 5.4.3-b6 correctly require revenue to exceed every cost the order causes, demonstrating why the missing total matters.
    educational_consequence: >-
      A learner is rewarded for manufacturing a decisive case fact and may recommend a standing discounted order without counting all incremental costs. That directly weakens AO2 use of evidence and the five-part AO4 judgement in the topic's main special-order evaluation.
    recommended_repair: >-
      State that N$5 is the complete per-roll variable cost including energy and every other output-related input, and state that the order creates no setup or other fixed cost; alternatively, keep those facts unknown and make the recommendation conditional on checking them. Make the learner-visible prompt, answer and guidance use the same total-incremental-cost language.
    confidence: 0.99
    status: open
  - issue_id: SR-9609-5.4-CODEX-R3-004
