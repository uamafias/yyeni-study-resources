coverage_confirmed: >-
  I verified all 18 packet entries and the detached manifest hash, read every packet artifact after first reading the full 5.4 objective branch, and audited all 21 assessable objectives in both directions. OBJ-9609-5.4.1-01 is taught in CU-9609-5.4.1 blocks 5.4.1-b2/b3 and practised by ITEM-9609-5.4-001 to -004. The cost-types container OBJ-9609-5.4.1-02 is taught in b4/b8 and practised through -005 to -018; member -02-01 is developed in b4/b5/b7/b8 and -006 to -012/-093/-094, while member -02-02 is developed in b4/b6/b8 and -013 to -018. OBJ-9609-5.4.2-01 is taught in CU-9609-5.4.2 b2/b3 and practised by -019 to -022; -02 in b2/b6/b7/b9 and -019/-023 to -026/-085; -03 in b2/b4 and -020/-027 to -030; -04 in b5/b7/b9 and -031 to -034; -05 in b6/b9 and -035 to -037/-085/-095; and -06 in b7/b8 and -038 to -040/-085/-096. OBJ-9609-5.4.3-01 is taught in CU-9609-5.4.3 b2/b3/b7 and practised by -041 to -044/-088/-097/-098; -02 in b4/b7 and -045 to -047/-086/-099/-100; -03 in b5/b7 and -048 to -051/-101; and -04 in b6 and -052 to -055/-086/-102. OBJ-9609-5.4.4-01 is taught in CU-9609-5.4.4 b2/b3 and practised by -056 to -059/-103. The numeric-and-graphic container OBJ-9609-5.4.4-02 is taught in b2/b4-b9/b11, with contribution support in CU-9609-5.4.2 b4, and practised by -027/-028, -057, -060 to -079, -084 and -089 to -092. Member -02-01 is taught in b2/b4-b8/b11 and practised by -057/-060 to -067/-084/-089/-092; -02-02 is taught in CU-9609-5.4.2 b4 and CU-9609-5.4.4 b4-b7/b11 and practised by -027/-028/-068 to -071; -02-03 is taught in b4-b6/b11 and practised by -072 to -075/-084/-090/-104; and the rarely examined -02-04 is taught at full depth in b4-b6/b9 and practised by -076 to -079/-084/-091. OBJ-9609-5.4.4-03 is taught in b10 and practised by -080 to -083/-087/-105. The reverse audit gives every substantial block an objective, prerequisite or legitimate assessment purpose, with no excluded construct presented as core. Exposure has not reduced any objective's depth; the costing sense of contribution is explicitly disambiguated; the allowed AS command words, tariffs and five-part evaluation model are respected in the substantive responses; causal language is generally conditional; and no unqualified jurisdictional rule or consequential finance variant is introduced. All seven R3 learner-content repairs hold in their named passages. C-30 is a bounded historical audit gap: the 13 old stamps cannot prove their prior text, but the current artifacts were independently reread and are anchored to this verified packet. Coverage is nevertheless not confirmed for release because the compulsory graphical modality is materially misrepresented in the repeated chart identified below.
reconstruction_test: >-
  Using only the generated resource, I reconstructed a precise recall definition of contribution; short explanations on cost accuracy, fixed versus variable costs, full-costing allocation, cost monitoring and break-even limitations; calculations of total, average and marginal cost, contribution, break-even output, margin of safety and profit with working, units and interpretation; an analysis for an unfamiliar mobile-repair business considering a discounted fleet booking; a five-part evaluation of break-even analysis for a new bicycle-repair business; and transfer to a context not named in the notes. The corrected cost-classification boundary, special-order incremental test, keep-or-drop conditions, formula set and evaluation scaffolds support credit-worthy answers across the tariff range, and no objective is otherwise absent or nominal. The graphical reconstruction fails: the chart repeated in ITEM-9609-5.4-068 and -089 to -091 does not draw the lines represented by its declared data and therefore does not display the break-even intersection learners are told to read. ITEM-089 also teaches the false claim that the revenue line never meets the fixed-cost line. A learner can repeat the supplied numerical answers or the drawing steps in ITEM-092, but cannot obtain the required readings from the displayed stimulus. The new temporal distinction in ITEM-098 would also reproduce a misleading AO1 boundary. The reconstruction test therefore does not support release.
issues:
  - issue_id: SR-9609-5.4-CODEX-R4-001
    severity: critical
    category: quantitative
    affected_ids:
      - OBJ-9609-5.4.4-02
      - OBJ-9609-5.4.4-02-01
      - OBJ-9609-5.4.4-02-02
      - OBJ-9609-5.4.4-02-03
      - OBJ-9609-5.4.4-02-04
      - ITEM-9609-5.4-068-INTERP
      - ITEM-9609-5.4-089-INTERP
      - ITEM-9609-5.4-090-APP
      - ITEM-9609-5.4-091-APP
    finding: >-
      The repaired graphical practice is still not a valid break-even chart. Its metadata describes price N$80, variable cost N$40 and fixed costs N$160 000, but the learner-visible ASCII plot draws the dotted revenue trace above and approximately parallel to the total-cost trace instead of from the origin through their N$320 000 intersection at 4 000 units. No crossing is displayed, so the break-even output and margin of safety cannot be read from the chart as the prompts require. The main interpretation answer also contains a separate false graphical statement: the horizontal fixed-cost line does meet the revenue line, at 2 000 units and N$160 000; that crossing is merely not the break-even point because total cost is higher there.
    evidence:
      - >-
        ITEM-9609-5.4-068-INTERP and ITEM-9609-5.4-089-INTERP to -091-APP repeat the same plot. On its N$320 000 row the dotted trace is near 2 000 units while the total-cost trace is near 4 000 units, and the traces never cross; nevertheless -089/-090 say the lines meet at 4 000 and require that value to be read from the picture.
      - >-
        The declared data require total revenue = N$80Q and total cost = N$160 000 + N$40Q, so the lines must cross at (4 000, N$320 000), with revenue also crossing the fixed-cost line at (2 000, N$160 000). The displayed geometry shows neither relationship.
      - >-
        ITEM-9609-5.4-089-INTERP's canonical answer says the fixed-cost line "never meets the revenue line, because fixed costs are the same at every output". That conclusion does not follow and contradicts the declared values.
      - >-
        QA check C-35 passes because the hidden chart parameters and stated calculations recompute; it does not validate the geometry learners actually see. ITEM-092-PROC gives correct plotting instructions but does not repair the invalid stimulus used for graph reading.
    educational_consequence: >-
      The syllabus expressly requires break-even output, contribution, margin of safety and profit in graphical as well as numerical form. Learners cannot practise locating the intersection or reading the two gaps from this stimulus and may instead memorise values supplied by the canonical answers; they may also learn the false rule that revenue cannot cross a fixed-cost line.
    recommended_repair: >-
      Replace the ASCII stimulus with a correctly scaled rendered chart, or regenerate the characters from verified coordinates, so TR runs through (0, 0), TC through (0, N$160 000), and both meet at (4 000, N$320 000). Visually inspect the rendered learner artifact, not only its metadata. Correct ITEM-089 to say that the revenue/fixed-cost crossing at 2 000 units is not break-even because break-even is the revenue/total-cost crossing, then re-run every graphical item against the displayed chart.
    confidence: 1.0
    status: open
  - issue_id: SR-9609-5.4-CODEX-R4-002
    severity: medium
    category: evidence
    affected_ids:
      - ASSESS-CIE-9609-AS-2026-2028
      - EXPOSURE-CIE-9609-AS-2026-2028
      - CONTRACT-9609-AS-5.4
      - EV-9609-S22-22-1b-0021
      - OBJ-9609-5.4.1-02-01
      - OBJ-9609-5.4.1-02-02
      - OBJ-9609-5.4.2-02
    finding: >-
      The R3 exposure repair is not semantically complete. EV-9609-S22-22-1b-0021 asks about the problem of allocating fixed costs to different box sizes, but remains mapped only to fixed-versus-variable classification. The operative concept is allocating a shared cost between products, which belongs to direct/indirect allocation and/or the limitation of full costing. The contract also retains the superseded exposure split 3/2/1 inside depth_constraints while separately reporting the recomputed 11/6/2 split, despite the repair claim that downstream metadata was rebuilt from one result.
    evidence:
      - >-
        assessment_evidence.json EV-9609-S22-22-1b-0021 records the stem "Explain one problem FP may have when deciding how to allocate fixed costs to each box size" but maps it to OBJ-9609-5.4.1-02-01. Its own note says the mapping came from a member-name match, not a semantic decision.
      - >-
        CU-9609-5.4.1 block 5.4.1-b6 and ITEM-9609-5.4-016-WHY/-018-APP teach the choice of allocation basis under OBJ-9609-5.4.1-02-02; CU-9609-5.4.2 b6 and ITEM-024-LIM teach the same decision problem as a limitation of full costing under OBJ-9609-5.4.2-02.
      - >-
        contract.json depth_constraints.exposure_classes still says probed_low 3, probed_high 2 and unprobed 1, while its later exposure_classes field says unprobed 11, probed_high 6 and probed_low 2. The following note calls the former split pre-remap rather than removing or explicitly quarantining it as history.
    educational_consequence: >-
      Present learner depth remains adequate, so the immediate harm is bounded. The wrong semantic hit and two live-looking class summaries can still assign future subtype floors, rare-review membership and assessment emphasis to the wrong objectives.
    recommended_repair: >-
      Remap EV-9609-S22-22-1b-0021 by the decision it tests, rebuild the affected exposure records from the evidence map, and keep one authoritative current exposure split in the contract. If the 3/2/1 values must remain for history, move them into an explicitly historical revision record that no build stage can consume.
    confidence: 0.99
    status: open
  - issue_id: SR-9609-5.4-CODEX-R4-003
    severity: medium
    category: accuracy
    affected_ids:
      - OBJ-9609-5.4.3-01
      - ITEM-9609-5.4-098-DIST
    finding: >-
      ITEM-098 turns a valid average-versus-marginal distinction into a false temporal boundary. Average cost is not inherently backward-looking: it can be calculated from actual past costs or from forecast total cost at a planned future output. Marginal cost is the cost of one additional unit, not necessarily a different time orientation. The mathematical boundary is total cost per unit versus the incremental cost of one more unit.
    evidence:
      - >-
        ITEM-9609-5.4-098-DIST's canonical answer calls average cost "looking backwards over everything already spent" and marginal cost "looking forward"; its marking guidance requires that backward/forward distinction.
      - >-
        CLM-9609-5.4-051/-053 and CU-9609-5.4.3 block 5.4.3-b2 state the accurate distinction without a time claim: average cost is total cost divided by output, while marginal cost is the cost of one more unit.
      - >-
        The same resource uses forecast full cost and planned output in pricing and break-even decisions, demonstrating that an average cost need not be historical.
    educational_consequence: >-
      A learner may reproduce "past versus future" as the defining distinction in an AO1 answer even though both measures can be estimated prospectively, weakening an otherwise correct comparison.
    recommended_repair: >-
      Remove the backward-looking/forward-looking requirement. Define average cost as the share of total cost at a stated output and marginal cost as the extra cost of one more unit, then retain the useful decision contrast between long-run price coverage and an incremental output decision.
    confidence: 0.98
    status: open
  - issue_id: SR-9609-5.4-CODEX-R4-004
    severity: medium
    category: publishing
    affected_ids:
      - CONTRACT-9609-AS-5.4
      - ITEM-9609-5.4-093-APP
      - ITEM-9609-5.4-105-APP
    finding: >-
      The topic contract still authorises and describes a 92-item output although the reviewed bank, current brief and QA report contain 105 items. Its item_budget, required_outputs.learning_items and item-budget history all stop at 92, so the 13 post-R3 cards have no reconciled contract total.
    evidence:
      - >-
        contract.json depth_constraints.item_budget and required_outputs.learning_items both equal 92, and item_budget_note ends with the increase to 92 after the drawing task.
      - >-
        topic_5.4_items.json contains ITEM-9609-5.4-001 through -105; ITEM-093 through -105 say they were authored on 2026-09-12 after the R3 exposure remap.
      - >-
        The generated brief and qa_report.json both identify 105 learning items, so this is not merely an alternative planned count.
    educational_consequence: >-
      A later rebuild, pacing calculation or publication gate can treat thirteen valid cards as surplus, omit them, or report a workload that does not match the resource the learner receives.
    recommended_repair: >-
      Reconcile every current item-count field to 105 and extend the history to explain the 92-to-105 change and its authority. Make the contract total a derived value or add a deterministic comparison against the live bank so another repair cannot silently outgrow it.
    confidence: 1.0
    status: open
  - issue_id: SR-9609-5.4-CODEX-R4-005
    severity: medium
    category: coherence
    affected_ids:
      - OBJ-9609-5.4.3-04
      - CLM-9609-5.4-060
      - ITEM-9609-5.4-055-EVAL
      - ITEM-9609-5.4-102-DEF
    finding: >-
      The main evaluation mapped to special-order decisions contradicts the resource's own boundary for a special order. CLM-060, the notes and ITEM-102 require it to be one-off, but ITEM-055 supplies a standing weekly order of unspecified duration. Its answer then recommends acceptance "as a fixed-term arrangement" even though no term is in the stem. That changes the decision horizon from the defined short-run case towards recurring pricing, where continued capacity and whole-business cost coverage need explicit treatment.
    evidence:
      - >-
        CLM-9609-5.4-060 and ITEM-9609-5.4-102-DEF define a special order as a one-off request below the normal price; ITEM-102's guidance says both elements are necessary.
      - >-
        ITEM-9609-5.4-055-EVAL instead states "a standing weekly order of 900 rolls" and gives no end date, then the canonical answer creates a fixed-term condition not supplied in the case.
      - >-
        CU-9609-5.4.2 b8 and CU-9609-5.4.3 b4/b6 make the time horizon decisive: contribution fits a short-run decision with unchanged fixed costs, while a long-run price must cover the business's costs at a realistic volume.
    educational_consequence: >-
      A learner may classify an open recurring discount as a one-off special order and apply the short-run incremental test without first establishing the duration over which capacity and fixed costs remain unchanged.
    recommended_repair: >-
      Make ITEM-055 one delivery or a contract with a stated short fixed term and unchanged costs throughout. Alternatively, keep the standing order and ask explicitly when it ceases to be a special-order decision, requiring a recommendation conditional on duration, future full-price demand and long-run total contribution.
    confidence: 0.96
    status: open
  - issue_id: SR-9609-5.4-CODEX-R4-006
    severity: low
    category: publishing
    affected_ids:
      - ITEM-9609-5.4-092-PROC
      - yyeni-subject-business-v0.1.0
    finding: >-
      PROC is a valid flashcard subtype and is used by ITEM-092, but it has no entry in the subject profile's answer_structures register and is consequently absent from the generated brief's declared structures. C-16 can therefore report that every declared part is named without having any declared PROC parts to test.
    evidence:
      - >-
        subject-profile.yaml learning_item_model.flashcard_subtypes includes PROC, and assessment-framework.json maps PROC to AO1 and ordered stages.
      - >-
        subject-profile.yaml answer_structures defines EVAL, CHAIN, APP, DEF, DIST, CALC, INTERP, MECH, BEN, LIM and several performance types, but not PROC; brief section 4 reproduces the same omission.
      - >-
        ITEM-9609-5.4-092-PROC is currently clear and does state ordered plotting steps, so the defect is in the declared validation contract rather than in that answer's immediate readability.
    educational_consequence: >-
      The present card remains usable, but future procedural cards can pass the structure check without an ordered-stage, input, output or completion requirement, weakening the claimed architecture.
    recommended_repair: >-
      Add a PROC answer structure appropriate to an ordered procedure and make C-16 fail when a PROC card does not name and perform those parts; regenerate the brief from the profile.
    confidence: 1.0
    status: open
