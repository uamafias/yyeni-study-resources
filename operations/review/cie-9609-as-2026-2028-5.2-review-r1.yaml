  - issue_id: SR-9609-5.2-CODEX-004
    severity: high
    category: coherence
    affected_ids:
      - OBJ-9609-5.2.2-02
      - CLM-9609-5.2-039
      - CLM-9609-5.2-058
      - CU-9609-5.2.2-EXT
    finding: >-
      The three-family shortcut defines debt as borrowing and repaying with interest but places leasing, hire purchase, debt factoring and trade credit in that family. The same unit later correctly says debt factoring is not a loan and nothing is borrowed or repaid. The shortcut therefore teaches a classification that its own detailed explanation contradicts.
    evidence:
      - "CU-9609-5.2.2-EXT block 5.2.2e-b3 and notes line 127 define the listed 'Debt' family as borrowing and repaying with interest."
      - "CU-9609-5.2.2-EXT block 5.2.2e-b10, CLM-9609-5.2-058 and notes line 195 say factoring is a sale of receivables, not a loan, with nothing borrowed or repaid."
      - "Trade credit may have no explicit interest, while leasing pays for use of an asset owned by a lessor; neither fits the stated family rule."
    educational_consequence: >-
      The mnemonic encourages category errors in Identify, Define and comparison answers and causes learners to infer interest, repayment and legal-debt features that do not apply to every included source.
    recommended_repair: >-
      Remove the rigid three-family mnemonic or replace it with accurate dimensions such as ownership dilution, repayment obligation, asset ownership, counterparty and term. If grouping is retained, use separate and qualified groups for equity, borrowing, asset finance, supplier/receivables finance, grants and type-dependent crowd funding.
    confidence: 0.99
    status: open
  - issue_id: SR-9609-5.2-CODEX-005
    severity: high
    category: accuracy
    affected_ids:
      - OBJ-9609-5.2.2-02-10
      - CLM-9609-5.2-059
      - CU-9609-5.2.2-EXT
    finding: >-
      Debt factoring is said to pass both collection work and non-payment risk to the factor. Collection is normally transferred in factoring, but bad-debt risk transfers only under non-recourse factoring; with recourse, the business remains responsible if the customer does not pay.
    evidence:
      - "CLM-9609-5.2-059: factoring 'passes the work and risk of collection to the factor'."
      - "CU-9609-5.2.2-EXT block 5.2.2e-b6 and notes line 159 repeat the unqualified risk-transfer claim."
      - "ACCA's factoring guidance distinguishes recourse, where the seller bears customer non-payment risk, from non-recourse, where the factor bears it (https://www.accaglobal.com/gb/en/business-finance/types-finance/cashflow-invoice.html)."
    educational_consequence: >-
      The learner may claim a benefit that a particular factoring agreement does not provide and choose factoring on a false risk premise in an application or evaluation answer.
    recommended_repair: >-
      Add the recourse/non-recourse distinction at the point where risk is discussed. State that administration and collection are normally transferred, while bad-debt protection is conditional and generally costs more; align the claim, notes and relevant evaluation guidance.
    confidence: 0.99
    status: open
  - issue_id: SR-9609-5.2-CODEX-006
    severity: high
    category: curriculum
    affected_ids:
      - OBJ-9609-5.2.2-02-13
      - CLM-9609-5.2-064
      - CLM-9609-5.2-065
      - CU-9609-5.2.2-EXT
      - ITEM-9609-5.2-029-DEF
      - ITEM-9609-5.2-032-EVAL
    finding: >-
      Crowd funding is taught almost entirely as donation/reward funding and is then described generically as finance obtained without an investor. Equity-based and loan-based crowd funding are omitted, although they change repayment, interest, ownership and control. The same passage introduces the explicitly excluded A Level term 'cost of capital' to deny a cost, which is both unnecessary at AS and false for the omitted models.
    evidence:
      - "CU-9609-5.2.2-EXT block 5.2.2e-b3 and notes line 129 place donation/reward crowd funding in a 'Given' family and say 'No cost of capital at all'."
      - "CLM-9609-5.2-065, block 5.2.2e-b7 and notes line 167 say crowd funding gives access without a bank or investor, without restricting the statement to donation/reward campaigns."
      - "ITEM-9609-5.2-029-DEF gives no model distinction, and ITEM-9609-5.2-032-EVAL evaluates only a consumer reward campaign while mapping the whole objective."
      - "The FCA identifies loan-based, investment-based, donation-based and reward/pre-payment crowd funding, each with different obligations (https://www.fca.org.uk/firms/authorisation/consumer-investments)."
    educational_consequence: >-
      The mandatory source is under-taught and a learner may state that all crowd funding avoids investors, repayment, interest and dilution. The A Level term also creates avoidable scope confusion.
    recommended_repair: >-
      Teach the four broad models briefly and condition every benefit and limitation on the model. Rewrite the definition and evaluation item so the prompt identifies the model or the answer compares them. Remove 'cost of capital' and use AS language such as repayment, interest, rewards, fees and ownership dilution.
    confidence: 0.99
    status: open
  - issue_id: SR-9609-5.2-CODEX-007
    severity: critical
    category: application
    affected_ids:
      - OBJ-9609-5.2.1-01
      - OBJ-9609-5.2.2-02-04
      - OBJ-9609-5.2.2-02-06
      - OBJ-9609-5.2.2-02-12
      - CLM-9609-5.2-047
      - ITEM-9609-5.2-002-APP
      - ITEM-9609-5.2-026-APP
    finding: >-
      Provider decisions and product availability that vary by lender and jurisdiction are repeatedly presented as certain. The resource states that sale and leaseback will release far more than a bank would lend, that no lender will finance a start-up with no assets, that venture capital is then the realistic route, that asset finance needs no security over other property, and that a bank will refuse a micro-business while a micro-finance provider will use named alternative methods. These conclusions are not entailed by the supplied facts.
    evidence:
      - "ITEM-9609-5.2-002-APP asserts sale and leaseback releases 'far more than a bank would lend' although no valuation, loan-to-value policy or bank offer is given."
      - "CU-9609-5.2.2-EXT block 5.2.2e-b9 and notes lines 181-183 say no other security is needed, 'No lender will touch it' and venture capital is the realistic route."
      - "CLM-9609-5.2-047 says venture capital supplies capital that banks would refuse rather than capital banks may be unwilling to supply."
      - "ITEM-9609-5.2-026-APP says the commercial bank 'will refuse' and prescribes group guarantees or character assessment, details absent from its claims and dependent on the provider."
      - "The notes themselves acknowledge at line 161 that micro-finance regulation and cost vary considerably between countries, but the cards do not carry that qualification."
    educational_consequence: >-
      Learners are trained to invent lender outcomes from thin context and to present local product assumptions as universal, a critical RS-23 error in a Cambridge International answer.
    recommended_repair: >-
      Replace certainty with evidence-led conditional language: a lender may be less willing without collateral or a record, and a provider may request other security, guarantees or proof of cash flow. State that venture-capital, asset-finance and micro-finance availability and terms vary by market and provider. Remove any method not verified for the named context or explicitly frame it as an example that may be used.
    confidence: 0.98
    status: open
  - issue_id: SR-9609-5.2-CODEX-008
    severity: high
    category: analysis
    affected_ids:
      - CLM-9609-5.2-073
      - CLM-9609-5.2-076
      - ITEM-9609-5.2-015-CHAIN
      - ITEM-9609-5.2-031-CHAIN
      - ITEM-9609-5.2-058-CHAIN
      - ITEM-9609-5.2-062-APP
      - CU-9609-5.2.2-EXT
      - CU-9609-5.2.3-4
    finding: >-
      Conditional causal language is not applied consistently. Several chains and applications turn a risk or preference into an automatic outcome: all lease payments are said to exceed outright purchase, a failed crowd-funding campaign is treated as evidence of weak demand whatever changes, debt is said to make a business fail while equity makes it survive, founders who value control are said to accept worse debt terms, and owners who value control are said to choose borrowing even when it costs more.
    evidence:
      - "ITEM-9609-5.2-058-CHAIN concludes that a highly indebted business 'fails in a downturn' while an equity-financed one 'survives', with no conditions about reserves, debt size or revenue resilience."
      - "ITEM-9609-5.2-031-CHAIN says a failed campaign 'is read' as failed demand and makes the next attempt harder 'whatever it does differently'."
      - "ITEM-9609-5.2-015-CHAIN and notes line 149 make total lease cost exceeding outright purchase universal, ignoring lease term, services and residual value."
      - "CLM-9609-5.2-073 and notes line 215 say control-conscious owners 'will' choose borrowing; ITEM-9609-5.2-062-APP says they 'will therefore accept debt' on worse terms."
      - "CU-9609-5.2.2-EXT block 5.2.2e-b3 says a debt obligation is 'exactly the obligation that destroys businesses in a bad year'."
    educational_consequence: >-
      These models train unsupported causal jumps, so learners may lose AO3 credit even when they reproduce the resource accurately.
    recommended_repair: >-
      Audit every CHAIN, APP and EVAL answer for may/can/could/likely plus an explicit moderating condition. For each cited example, add the missing condition or counter-effect and remove guaranteed failure, survival, lender, investor and cost outcomes.
    confidence: 0.98
    status: open
