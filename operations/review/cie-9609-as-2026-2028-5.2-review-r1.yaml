      - "CU-9609-5.2.3-4 block 5.2.34-b7 and notes line 263 incorrectly summarise all internal sources as costing nothing."
    educational_consequence: >-
      A learner receives mutually incompatible rules and may equate accounting reserves with cash or ignore the real cash and opportunity costs of internal finance when explaining suitability.
