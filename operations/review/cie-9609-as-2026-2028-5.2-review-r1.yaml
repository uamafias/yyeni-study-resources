    finding: >-
      Three of the twelve EVAL cards do not model all five required parts. Item -008 starts with 'It depends' and never states plainly whether the founders should accept the offer; item -059 has no specific business context to ground the judgement; item -068 is a Why question whose answer explains a principle but supplies no specific context, selected option, strongest counterargument or condition for success/change.
