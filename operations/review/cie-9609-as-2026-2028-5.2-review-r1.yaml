    finding: >-
      The internal-source summary says every internal source needs no outsider's agreement, is available quickly and costs nothing, while the same material shows that sale and leaseback needs an outside buyer/lessor and creates lease payments, and that retained earnings may already be tied up and unavailable as cash. CLM-9609-5.2-025 itself calls retained earnings immediately available, contradicting the later misconception correction.
    evidence:
