coverage_confirmed: >-
  I traced all 24 assessable entries in the 5.2 registry branch in both directions. OBJ-9609-5.2.1-01 is taught in CU-9609-5.2.1 blocks 5.2.1-b2 to b6 and practised by ITEM-9609-5.2-060-DIST; the internal-source container and its five members are taught in CU-9609-5.2.2-INT blocks 5.2.2i-b2 to b7 and practised by the source-specific items ITEM-9609-5.2-001 to -004 and -037 to -045 plus shared items -054 to -056; the external-source container and its fourteen members are taught in CU-9609-5.2.2-EXT blocks 5.2.2e-b2 to b10 and practised by the source-specific items -005 to -036, -038 to -039 and -046 to -053 plus shared items -057 to -059; OBJ-9609-5.2.3-01 is taught in CU-9609-5.2.3-4 blocks 5.2.34-b2 to b3 and practised by items -061 to -063; and OBJ-9609-5.2.4-01 is taught in blocks 5.2.34-b3 to b6 and practised by items -064 to -068. The reverse pass found that the substantial blocks are intended to serve those objectives or named cross-links, but it also found the inaccurate family taxonomy, unsupported assessment-priority claims and over-broad item mappings reported below. D-17 is satisfied in intent by the contextual data-response and case-analysis tasks ITEM-9609-5.2-065-DATA and ITEM-9609-5.2-067-CASE, so a separate APP flashcard is not required once those tasks are repaired.
reconstruction_test: >-
  Using only the generated notes and items, I constructed a 2-mark definition of venture capital, a 1-mark identification of a mortgage for property finance, three 3-mark explanations on retained earnings, sale and leaseback and trade credit, an 8-mark analysis for an unfamiliar fishing co-operative financing a cold room, a 12-mark evaluation of loan versus equity for a seasonal agribusiness, and a transfer application to a mobile-repair business not mentioned in the resource. The definition, identification and five-part evaluation scaffold were usable, and the five choice factors supported transfer. Strong answers could not be reconstructed reliably for OBJ-9609-5.2.1-01 because the ownership/disclosure and social-enterprise rules are misstated; for OBJ-9609-5.2.2-01-02 because retained earnings are both called immediately available and explicitly distinguished from cash; for OBJ-9609-5.2.2-02-06 because lease cost is asserted universally; for OBJ-9609-5.2.2-02-10 because recourse factoring is omitted; for OBJ-9609-5.2.2-02-12 because lender refusal and micro-finance mechanisms are jurisdiction-dependent but stated flatly in cards; and for OBJ-9609-5.2.2-02-13 because debt- and equity-based crowd funding are absent. Those source-level defects also prevent a dependable OBJ-9609-5.2.4-01 judgement even though its answer structure is well taught.
issues:
  - issue_id: SR-9609-5.2-CODEX-001
    severity: critical
    category: accuracy
    affected_ids:
      - OBJ-9609-5.2.1-01
      - CLM-9609-5.2-007
      - CU-9609-5.2.1
      - ITEM-9609-5.2-060-DIST
    finding: >-
      The resource says incorporation generally brings a requirement to publish audited accounts and treats limited liability plus publication as reducing lender risk, so incorporated businesses usually borrow more and more cheaply. Limited liability limits owners' exposure; it does not itself reduce the lender's risk and may lead a lender to seek security or guarantees. Disclosure duties also differ by company type and jurisdiction, so the statement is not valid as an international rule or as a flat Namibian rule.
    evidence:
      - "CLM-9609-5.2-007: 'Limited liability and the requirement to publish audited accounts reduce the risk a lender or investor faces'."
      - "CU-9609-5.2.1 block 5.2.1-b3 and notes line 23 apply 'the requirement to publish audited accounts' to incorporation generally."
      - "ITEM-9609-5.2-060-DIST rewards the same claim as a reason public-company borrowing is easier and cheaper."
      - "Namibia Companies Act 2004 section 306(5) specifically requires a public company to lodge annual financial statements with the Registrar; it does not establish the learner text's general publication rule for every incorporated business (https://namiblii.org/akn/na/act/2004/28/eng@2023-07-21)."
    educational_consequence: >-
      A learner may explain ownership and finance with a legally false distinction and an inverted risk mechanism, losing AO1 and AO3 credit and applying a country-specific disclosure assumption in an international paper.
    recommended_repair: >-
      Separate legal availability from lender willingness. State that a company is a separate borrower and that disclosure, audit and filing rules depend on company type and jurisdiction; explain that limited liability may cause lenders to assess company cash flow and assets and sometimes request security or personal guarantees. Remove any automatic claim that incorporation lowers borrowing cost.
    confidence: 0.99
    status: open
  - issue_id: SR-9609-5.2-CODEX-002
    severity: critical
    category: accuracy
    affected_ids:
      - OBJ-9609-5.2.1-01
      - CLM-9609-5.2-003
      - CLM-9609-5.2-006
      - CLM-9609-5.2-008
      - CU-9609-5.2.1
    finding: >-
      The ownership section turns tendencies into exclusive availability rules: it limits a sole trader to a closed list that omits grants and crowd funding, says a public limited company can reach sums beyond any other ownership form, and says grants, donations and impact investment are open to a social enterprise but closed to an ordinary business. A social enterprise describes purpose and can use several legal forms; grant and investment eligibility depends on the provider and scheme, not merely on that label.
    evidence:
      - "CLM-9609-5.2-003 begins 'A sole trader can raise finance only' and omits sources that may be open to a sole trader."
      - "CLM-9609-5.2-006 says a public limited company has access to more capital than 'any other form of ownership'."
      - "CLM-9609-5.2-008 and CU-9609-5.2.1 block 5.2.1-b4 say grants, donations and impact investment are closed to an ordinary business."
      - "Notes line 41 conflicts with notes line 165, which correctly presents government grants as conditional on the activity and scheme rather than on social-enterprise status."
      - "Official guidance illustrates that a social enterprise must still choose a legal structure such as sole trader, partnership, company or co-operative (https://www.gov.uk/set-up-a-social-enterprise)."
    educational_consequence: >-
      The learner cannot form an accurate ownership-to-finance availability map and may rule valid sources in or out solely from a business-purpose label, directly undermining the compulsory relationship objective.
    recommended_repair: >-
      Rebuild the section as a qualified matrix: identify sources that are legally impossible for a form, sources that may be available subject to provider criteria, and sources whose availability varies by jurisdiction. Treat social enterprise as an objective/purpose layered onto a legal form, and remove all categorical 'open/closed', 'only' and 'beyond any other form' wording unless legally necessary.
    confidence: 0.98
    status: open
  - issue_id: SR-9609-5.2-CODEX-003
    severity: high
