coverage_confirmed: >-
  Nominal coverage was traced in both directions for all 24 assessable objectives, but semantic coverage is not confirmed. OBJ-9609-5.2.1-01 is taught in CU-9609-5.2.1 blocks 5.2.1-b2 to b6 and practised by ITEM-9609-5.2-060-DIST and -069-WHY. The internal-source container is taught in CU-9609-5.2.2-INT blocks 5.2.2i-b2 to b7 and practised by items -055, -056 and -070; owner's investment by block b4 and items -040, -041 and -077; retained earnings by blocks b4 to b7 and items -037, -054 and -056; sale of unwanted assets by block b4 and items -042, -043 and -054; sale and leaseback by blocks b4 to b6 and items -001 to -004; and working capital as a source by blocks b4, b6 and b7 and items -044, -045 and -054. The external-source container is taught in CU-9609-5.2.2-EXT blocks 5.2.2e-b2 to b10 and practised by item -070. Its members are taught in b4 (share capital, new partners, venture capital), b5 (bank loans, mortgages, debentures, leasing, hire purchase), b6 (overdrafts, trade credit, factoring, micro-finance) and b7 (crowd funding, grants); respectively they are practised by items -046/-047/-058, -048/-049/-071, -050/-051/-072, -005 to -008, -009 to -012 plus -057, -013 to -016 plus -057, -038/-057/-073, -017 to -020 plus -058, -052/-053/-057/-074, -021 to -024, -039/-057/-075, -025 to -028, -029 to -032, and -033 to -036. OBJ-9609-5.2.3-01 is taught in CU-9609-5.2.3-4 blocks 5.2.34-b2 and b3 and practised by items -059, -061, -062, -063 and -076. OBJ-9609-5.2.4-01 is taught in blocks 5.2.34-b3 to b6 and practised by items -059 and -064 to -068. The reverse audit found a stated objective or legitimate cross-link for most substantial blocks, but CU-9609-5.2.2-INT block 5.2.2i-b5 is unlabelled scope expansion. More importantly, the mapped ownership, sale-and-leaseback, leasing, micro-finance, crowd-funding, grant and source-choice items contain the critical and high defects below, so a link cannot be treated as adequate teaching or practice. The deterministic report contains 29 passes and no fail, warn or not_run result to adjudicate; I did not re-count those checks. Direct verification instead contradicts C-28, and semantic inspection contradicts the conclusions implied by C-09, C-12 and C-16.
reconstruction_test: >-
  Using only this generated resource, I constructed a two-mark definition of a debenture, a one-mark identification of a mortgage, three-mark explanations on owner's investment, retained earnings and trade credit, an eight-mark analysis for an unfamiliar fishing co-operative choosing finance for a cold room and seasonal fuel, a twelve-mark evaluation for a seasonal wholesaler choosing loan versus equity, and a transfer application to a mobile-repair business not named in the resource. Basic definitions, the five choice factors and the five-part evaluation scaffold support recall and some transfer. Strong answers cannot be reconstructed reliably for OBJ-9609-5.2.1-01 because ITEM-9609-5.2-060-DIST reinstates the superseded ownership and disclosure errors; for OBJ-9609-5.2.2-01 and members -01-04 and -01-05 because the resource contradicts itself about outsiders and the speed of internal finance and adds unsupported mechanisms; for external members -02-04, -02-06, -02-08, -02-09, -02-12, -02-13 and -02-14 because provider outcomes, lease terms, security, jurisdiction, crowd-funding forms or grant cost are modelled incorrectly; and for OBJ-9609-5.2.4-01 because several evaluation tasks name the five required parts without supplying enough facts or a genuine strongest alternative. The notes also do not teach the lessor-cost mechanism in ITEM-9609-5.2-015-CHAIN, the per-loan administration mechanism in -027-CHAIN, the discretionary-dividend mechanism in -058-CHAIN, or the debenture-holder structure in -049-DIST. An offline learner therefore has to import outside knowledge or memorise unsupported card text for those answers.
