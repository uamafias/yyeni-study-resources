      Use ordinary non-command wording in headings, such as 'choosing and evaluating'. Rewrite ITEM-9609-5.2-054-APP as a three-mark Explain item about one source, or label it clearly as a multi-part practice task whose first part is Identify and whose explanation is separate; remove Justify from learner-facing instructions and guidance.
