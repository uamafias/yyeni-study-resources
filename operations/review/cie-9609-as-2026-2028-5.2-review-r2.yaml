  - issue_id: SR-9609-5.2-CODEX-R2-003
    severity: critical
    category: application
    affected_ids:
      - OBJ-9609-5.2.2-01-04
      - OBJ-9609-5.2.2-02-04
      - OBJ-9609-5.2.2-02-08
      - OBJ-9609-5.2.2-02-09
      - OBJ-9609-5.2.2-02-12
      - OBJ-9609-5.2.4-01
      - CLM-9609-5.2-047
      - CLM-9609-5.2-057
      - CLM-9609-5.2-063
      - ITEM-9609-5.2-002-APP
      - ITEM-9609-5.2-026-APP
      - ITEM-9609-5.2-053-DIST
      - ITEM-9609-5.2-065-DATA
      - ITEM-9609-5.2-068-EVAL
      - ITEM-9609-5.2-074-WHY
    finding: >-
      Provider decisions and jurisdiction-dependent enforcement are still presented as facts. The resource guarantees that sale and leaseback raises more than a bank loan, reverts from 'a bank is often unwilling' to venture capital supplying money 'a bank would refuse', treats micro-finance as collateral-free and sometimes the only realistic source, says an ordinary bank loan requires both security and a record, and tells learners that a mortgage lender can take property and recover most or all of the debt without carrying the notes' jurisdiction qualification into the items.
    evidence:
      - "ITEM-9609-5.2-002-APP says sale and leaseback releases 'far more than a bank would lend' and that a loan 'would provide less', although no valuation or offer is supplied."
      - "CU-9609-5.2.2-EXT block 5.2.2e-b4 and notes line 156 say venture capital supplies capital 'that a bank would refuse', contradicting the repaired conditional wording in CLM-9609-5.2-047."
      - "ITEM-9609-5.2-026-APP says micro-finance lends without collateral and may be the only realistic source; ITEM-9609-5.2-068-EVAL says a bank loan requires security and a record and otherwise may be offered on terms 'that would sink' a start-up."
      - "ITEM-9609-5.2-053-DIST and -074-WHY state the lender's ability to take property and recover most or all of the debt flatly, although CLM-9609-5.2-057 is jurisdiction-flagged and the notes say enforcement detail depends on national law."
      - "Official SBA guidance states that lender and programme requirements vary and that some business loans require no collateral: https://www.sba.gov/loans/."
      - "World Bank/CGAP guidance documents unsecured microcredit, group guarantees and other lending methods, so 'micro-finance lends without requiring collateral' is not a universal product rule: https://documents1.worldbank.org/curated/en/998591468339564503/pdf/342650rev0ENGLISH0Guideline1RegSup.pdf."
    educational_consequence: >-
      Learners are trained to invent a lender's decision from thin case facts and to state one legal enforcement model as international law. That directly weakens AO2/AO3 and triggers the brief's critical RS-23 rule.
    recommended_repair: >-
      Audit every provider-facing sentence in the notes and APP, CHAIN and EVAL answers. Express availability and price as likelihoods supported by the named facts; preserve unsecured and guaranteed alternatives; and carry the jurisdiction qualification into every mortgage or enforcement answer rather than leaving it only in a note or claim annotation.
    confidence: 0.99
    status: open
  - issue_id: SR-9609-5.2-CODEX-R2-004
    severity: critical
