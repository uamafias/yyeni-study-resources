    finding: >-
      The delivery policy uses exposure as a priority ranking despite the packet's explicit rule that exposure is evidence only. The distributed schedule says the rarely-examined set is the first material shed under pressure, while the exposure artefact labels that set for lower drill volume. The seven named mandatory objectives are therefore deliberately made the first candidates for removal because they were not recently observed.
    evidence:
      - "curriculum/exam-exposure.json principle: exposure is metadata, never a priority ranking, and every mandatory objective must remain covered."
      - "curriculum/exam-exposure.json review_set_rarely_examined learner_framing specifies 'lower drill volume'."
      - "curriculum/item-budget.json delivery_schedules.distributed_20_weeks.under_pressure: 'The rarely-examined review set is the first thing this schedule sheds'."
      - "The review brief states that an objective taught thinly because it has never been examined is a critical finding."
    educational_consequence: >-
      A learner following the normal distributed schedule under time pressure can receive no rehearsal of seven compulsory sources precisely because past papers did not name them, even though the first examinations under syllabus v2 are in 2026.
    recommended_repair: >-
      Remove exposure-based shedding and the lower-volume learner framing. Preserve the same minimum teaching and retrieval floor for every mandatory objective in every schedule; if workload must be reduced, use diagnosed learner mastery or task redundancy rather than past-paper silence.
