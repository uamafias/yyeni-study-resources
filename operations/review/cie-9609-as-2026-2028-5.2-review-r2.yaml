    finding: >-
      Retired and mixed command-word instruction remains after the prompt repair. The learner objective and section title instruct the learner to justify a choice, and ITEM-9609-5.2-054-APP starts with the one-mark command 'Identify' but then requires a comparison and explanation; its guidance explicitly says the choice must be justified.
    evidence:
