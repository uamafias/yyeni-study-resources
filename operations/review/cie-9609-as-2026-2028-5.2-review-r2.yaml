      Regenerate the item from CLM-9609-5.2-003, -006, -007, -011 and -012. Keep only the legal share-issue distinction as absolute; make lender willingness conditional on record, cash flow, security and information, and include grants and crowd funding among sources a sole trader may access subject to provider criteria.
