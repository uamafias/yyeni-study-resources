    status: open
  - issue_id: SR-9609-5.2-CODEX-R2-005
    severity: high
    category: coherence
    affected_ids:
      - OBJ-9609-5.2.2-01
      - OBJ-9609-5.2.2-01-02
      - OBJ-9609-5.2.2-01-05
      - CU-9609-5.2.2-INT
      - ITEM-9609-5.2-056-EVAL
    finding: >-
      The repaired internal-source generalisation still contradicts later learner material. The working-capital paragraph says no external party is involved at all while its mechanisms require customers and suppliers to change or tolerate payment timing. ITEM-9609-5.2-056-EVAL then states that internal sources are slow to release as a class, although owner's investment and retained cash may be available immediately and the notes' repaired summary deliberately avoids a common speed rule.
    evidence:
      - "CU-9609-5.2.2-INT block 5.2.2i-b4 and notes line 106: collecting from customers sooner and taking longer to pay suppliers are followed by 'No external party is involved at all'."
      - "CU-9609-5.2.2-INT block 5.2.2i-b3 correctly says the category is not free of outsiders and that no one speed/cost rule covers all five sources."
      - "ITEM-9609-5.2-056-EVAL canonical answer gives 'internal sources are slow to release' as the decisive criterion for the whole category."
    educational_consequence: >-
      Learners may confuse the source of the cash with the absence of counterparties and may reject immediately available internal cash by applying a false class-wide speed rule.
    recommended_repair: >-
      Define 'internal' only by where the finance originates. State that changing receivable and payable timing requires customer or supplier participation, and evaluate the speed of owner's investment, retained cash, asset sales, sale and leaseback and working-capital release separately.
    confidence: 0.98
    status: open
  - issue_id: SR-9609-5.2-CODEX-R2-006
    severity: high
    category: curriculum
    affected_ids:
      - OBJ-9609-5.2.2-02-13
      - CLM-9609-5.2-064
      - CLM-9609-5.2-065
      - ITEM-9609-5.2-030-APP
      - ITEM-9609-5.2-032-EVAL
    finding: >-
      Crowd-funding variants are named in the notes but their consequences are not conditioned in the application and evaluation items. Both prompts say only 'crowd funding', while their answers assume a reward or pre-purchase campaign in which backers are customers, success directly tests product demand, and money arrives only if a target is reached. Those claims do not hold in the same way for donation, equity or loan-based models.
    evidence:
      - "ITEM-9609-5.2-030-APP says backers become the first customers and that reaching the target is direct evidence of demand, without naming reward/pre-payment crowd funding."
      - "ITEM-9609-5.2-032-EVAL says generic crowd funding raises money and tests demand at the same time, again without selecting a form."
      - "CLM-9609-5.2-064/-065 and CU-9609-5.2.2-EXT block 5.2.2e-b7 correctly distinguish donation, reward, equity and loan forms, so the items are narrower than their prompts."
      - "The FCA distinguishes loan, investment, donation and reward/pre-payment models with different returns and obligations: https://www.fca.org.uk/investsmart/understanding-crowdfunding."
    educational_consequence: >-
      A learner may claim customer-demand evidence and no repayment or dilution for any crowd-funding arrangement, losing credit when the case concerns equity or loan-based finance.
    recommended_repair: >-
      Name reward/pre-payment crowd funding in both prompts and answers, or rewrite the tasks to compare the four forms and condition each benefit, limitation and success mechanism on the selected form.
    confidence: 0.99
    status: open
  - issue_id: SR-9609-5.2-CODEX-R2-007
    severity: high
    category: accuracy
    affected_ids:
      - OBJ-9609-5.2.2-02-14
      - CU-9609-5.2.2-EXT
      - ITEM-9609-5.2-035-CHAIN
      - ITEM-9609-5.2-036-EVAL
    finding: >-
      The grant material turns the absence of repayment, interest and dilution into the false conclusion that a grant is the cheapest source a business can obtain. ITEM-9609-5.2-035-CHAIN says every other source incurs at least one of those three costs, although owner's investment, retained earnings and sale of unwanted assets incur none of them. ITEM-9609-5.2-036-EVAL then says a matching grant application should always be made and is close to costless, contradicting its own case fact that the application consumes scarce owner time.
    evidence:
      - "CU-9609-5.2.2-EXT block 5.2.2e-b7 and notes line 188 call a grant 'the cheapest money a business can obtain'."
      - "ITEM-9609-5.2-035-CHAIN: 'Every other source costs at least one of those three'."
      - "CLM-9609-5.2-021 and the internal-source notes show sources with no repayment, interest or dilution but with opportunity costs, directly disproving the comparison."
      - "ITEM-9609-5.2-036-EVAL ends that a matching application 'should always be made' even though its prompt says the process is lengthy and the owner is the main salesperson."
    educational_consequence: >-
      Learners may equate no explicit financing charge with no cost, ignore application and compliance costs, and reproduce an invalid comparison or automatic recommendation in AO3/AO4 work.
    recommended_repair: >-
      Describe grants as having no repayment, interest or dilution, not as universally cheapest. Compare total economic and administrative cost, and make the application judgement depend on expected grant value, probability of success, conditions and the opportunity cost of management time.
    confidence: 1.0
    status: open
  - issue_id: SR-9609-5.2-CODEX-R2-008
    severity: high
    category: coherence
    affected_ids:
      - OBJ-9609-5.2.2-01-04
      - OBJ-9609-5.2.2-02-01
      - OBJ-9609-5.2.2-02-02
      - OBJ-9609-5.2.2-02-06
      - OBJ-9609-5.2.2-02-08
      - OBJ-9609-5.2.2-02-12
      - ITEM-9609-5.2-003-CHAIN
      - ITEM-9609-5.2-015-CHAIN
      - ITEM-9609-5.2-027-CHAIN
      - ITEM-9609-5.2-049-DIST
      - ITEM-9609-5.2-058-CHAIN
    finding: >-
      The repaired build still fails semantic offline reconstruction. Several canonical answers require mechanisms or distinctions not taught by their cited claims or the rendered notes: break-even effects for sale and leaseback; the lessor's tied-up funds and transfer of residual-value risk; per-loan administration as a reason for micro-finance rates; many debenture holders on published terms versus one negotiated bank lender; and the discretionary nature of dividends in a poor year.
    evidence:
      - "ITEM-9609-5.2-003-CHAIN reaches a higher break-even point, but CLM-9609-5.2-030 and the notes teach only the fixed lease payment."
      - "ITEM-9609-5.2-015-CHAIN explains lease cost through the lessor's financing and residual-value risk; CLM-9609-5.2-051 and notes line 166 only assert that total payment is usually higher."
      - "ITEM-9609-5.2-027-CHAIN adds a high administration cost per unit lent, absent from CLM-9609-5.2-063 and the micro-finance notes."
      - "ITEM-9609-5.2-049-DIST uses 'many holders on fixed published terms' as its boundary; neither CLM-9609-5.2-042 nor the notes teach that structure."
      - "ITEM-9609-5.2-058-CHAIN depends on a company being able to pay no dividend in a poor year; the cited share-capital claim and notes say only that shareholders expect dividends."
      - "qa_report.json marks prior high issue SR-9609-5.2-CODEX-012 resolved and says these answers were rewritten to use only the notes, but items -015, -027 and -058 still contain the cited unsupported mechanisms."
    educational_consequence: >-
      An offline learner cannot derive the expected answers from the promised source of record and must memorise unexplained card text or supply outside knowledge, preventing reliable transfer to an unfamiliar case.
    recommended_repair: >-
      For each item, either add a concise, verified and in-scope mechanism to a canonical claim and the rendered notes, or remove the unsupported mechanism and assess only what the notes teach. Re-run the reconstruction test on answer meaning, not claim-ID overlap.
    confidence: 0.99
    status: open
  - issue_id: SR-9609-5.2-CODEX-R2-009
    severity: high
    category: evaluation
    affected_ids:
      - OBJ-9609-5.2.4-01
      - ITEM-9609-5.2-065-DATA
      - ITEM-9609-5.2-066-ESSA
      - ITEM-9609-5.2-067-CASE
    finding: >-
      C-16 finds labels, but three extended tasks do not semantically complete the declared five-part structure. The essay-plan prompt supplies no specific business facts even though its guidance requires an answer anchored in a named business. The hire-purchase task treats equity as the strongest counterargument after the case has ruled out new owners and assumes away the feasible unsecured-loan comparison. The seasonal case recommends equity because it assumes loan instalments fall evenly, although the prompt specifies only a fixed interest rate and gives no repayment timing, profitability, cash reserve or cost comparison from which to decide.
    evidence:
      - "ITEM-9609-5.2-066-ESSA asks only about 'a small business planning to expand'; its context and facts are empty, while its guidance demands the named business and a decisive factor."
      - "ITEM-9609-5.2-065-DATA's counterargument is a new equity investor even though the prompt says all four family shareholders want full ownership; the answer also declares that hire purchase removes the security obstacle although it later acknowledges an unsecured loan."
      - "ITEM-9609-5.2-067-CASE infers evenly timed instalments from a five-year fixed-rate loan and selects equity without the cash-flow and total-cost evidence needed to make that judgement."
      - "The subject profile and review brief require specific context, a decisive criterion, the genuinely strongest counterargument and a defensible condition in data_response, essay_plan and case_analysis items."
    educational_consequence: >-
      Learners are shown that naming the five headings is enough even when the context cannot determine the answer or the counterargument is not a feasible alternative, weakening AO4 judgement.
    recommended_repair: >-
      Add decision-relevant facts to the essay plan. For the two cases, compare feasible alternatives and provide repayment timing, available cash, price and owner-priority facts before selecting a source; then make the counterargument the best viable rejected option.
    confidence: 0.97
    status: open
  - issue_id: SR-9609-5.2-CODEX-R2-010
    severity: medium
