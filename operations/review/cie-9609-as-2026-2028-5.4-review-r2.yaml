coverage_confirmed: >-
  I verified all 18 packet entries and the detached manifest hash, read the full topic branch and packet, and traced all 21 assessable objectives in both directions. OBJ-9609-5.4.1-01 is taught in CU-9609-5.4.1 blocks 5.4.1-b2/b3 and practised by ITEM-9609-5.4-001-DEF to -004-APP. The decomposed cost-types container OBJ-9609-5.4.1-02 is taught in b4/b8 and practised by -005-DIST, -006/-007-DEF and -013/-014-DEF; member -02-01 is taught in b4/b5/b7/b8 and practised by -006 to -012, while member -02-02 is taught in b4/b6/b8 and practised by -013 to -018. OBJ-9609-5.4.2-01 is taught in CU-9609-5.4.2 b2/b3 and practised by -019 to -022; the fixed/variable boundary, direct-fixed example and variable-indirect example now repair R1-001. OBJ-9609-5.4.2-02 is taught in b2/b6/b7/b9 and practised by -019/-023 to -026/-085; -03 is taught in b2/b4 and practised by -020/-027 to -030; -04 is taught in b5/b7/b9 and practised by -031 to -034; -05 is taught in b6/b9 and practised by -035 to -037/-085; and -06 is taught in b7/b8 and practised by -038 to -040/-085. OBJ-9609-5.4.3-01 is taught in CU-9609-5.4.3 b2/b3/b7 and practised by -041 to -044/-088; -02 is taught in b4/b7 and practised by -045 to -047/-086; -03 is taught in b5/b7 and practised by -048 to -051; and -04 is taught in b6 and practised by -052 to -055/-086, although the special-order practice is not semantically adequate for the reasons in issue R2-002. OBJ-9609-5.4.4-01 is taught in CU-9609-5.4.4 b2/b3 and practised by -056 to -059. The decomposed calculation-and-interpretation container OBJ-9609-5.4.4-02 is taught in b2/b4-b9/b11 and practised by -027/-028, -057, -060 to -079, -084 and -089 to -091; member -02-01 is taught in b2/b4-b8/b11 and practised by -057/-060 to -067/-084/-089; -02 is taught in b4/b5/b7/b11 and CU-9609-5.4.2 b4, and practised by -027/-028/-068 to -071; -03 is taught in b4/b5/b11 and practised by -072 to -075/-084/-090; and the rarely examined -04 is taught at full numerical depth in b4/b5/b9 and practised by -076 to -079/-084/-091. The coordinate table and Kaoko worked chart now teach the graphical form, but graphical practice is not confirmed because the new item chart is internally inconsistent and the prompts disclose the values supposedly being read. OBJ-9609-5.4.4-03 is taught in b10 and practised by -080 to -083/-087; the repaired sensitivity language correctly rejects the claim that assumptions cancel. The reverse pass found an objective, prerequisite or approved assessment purpose for every substantive block and no excluded construct presented as core. The contribution homonym is explicitly disambiguated, no registered consequential finance variant is invoked, and no jurisdiction-specific rule is taught. C-18's reported count deviation does not establish an AO4-time defect: the AO4-bearing set includes sustained five-part evaluations and four extended performance tasks, so its practice-time weight is educationally credible, subject to repairing the defective tasks below. C-30 is judged separately as a bounded historical audit defect in R2-006. Nominal coverage exists throughout, but semantic coverage is not confirmed for the compulsory graphical dimension of OBJ-9609-5.4.4-02 or for the special-order practice under OBJ-9609-5.4.3-04.
reconstruction_test: >-
  Using only this resource, I reconstructed a precise recall definition of direct cost; 3-mark explanations of accurate cost information, the full/contribution distinction, cost monitoring and a break-even limitation; calculations of total, average and marginal cost, contribution, break-even output, margin of safety and profit with units and interpretation; an 8-mark analysis for an unfamiliar mobile-services business considering a discounted booking; a 12-mark evaluation of break-even analysis for a new bicycle-repair business; and transfer to a context absent from the notes. The progression, formulas, worked Kaoko example, repaired direct-fixed/variable-indirect distinction, conditional sensitivity discussion and five-part evaluation scaffold support those answers. Reconstruction fails for the graphical performance demanded by OBJ-9609-5.4.4-02 and especially the rarely examined profit member -02-04: the new item chart cannot simultaneously have fixed costs of N$160 000, intersect at 2 400 units and N$240 000, and show N$480 000 revenue and N$400 000 total cost at 6 000 units; moreover, every target reading is stated in the prompt, so none has to be recovered from the graph. Several canonical special-order answers also cannot be derived from their own stimuli because they assume unchanged labour, delivery or other incremental costs and sufficient spare units without supplying those facts. ITEM-9609-5.4-034-APP over-diagnoses a contribution shortfall, and the repaired interpretations in -048-CALC and -078-CALC overstate the numerical sensitivity they describe. The remaining objectives contain enough knowledge and reasoning support for strong unfamiliar answers, but these item-level failures would still train non-credit-worthy application, analysis and evaluation.
issues:
  - issue_id: SR-9609-5.4-CODEX-R2-001
    severity: critical
    category: quantitative
    affected_ids:
      - OBJ-9609-5.4.4-02
      - OBJ-9609-5.4.4-02-01
      - OBJ-9609-5.4.4-02-02
      - OBJ-9609-5.4.4-02-03
      - OBJ-9609-5.4.4-02-04
      - ITEM-9609-5.4-068-DEF
      - ITEM-9609-5.4-089-INTERP
      - ITEM-9609-5.4-090-APP
      - ITEM-9609-5.4-091-APP
    finding: >-
      The repair for the compulsory graphical form does not provide valid graph-reading practice. The three new chart tasks state the values the learner is supposedly meant to read, so the chart can be removed without changing the task. More seriously, ITEM-091's shared chart is mathematically impossible: fixed costs of N$160 000, revenue of N$480 000 and total cost of N$400 000 at 6 000 units imply straight-line slopes of N$80 and N$40 and therefore a crossing at 4 000 units and N$320 000, not at the stated 2 400 units. ITEM-068 describes slopes verbally but supplies no graph. The pattern-based C-31 pass therefore does not establish semantic modality coverage.
    evidence:
      - >-
        ITEM-9609-5.4-089-INTERP says in its stem that the lines cross at 2 400 units and N$240 000, then asks the learner to read the break-even output; the requested value is already given.
      - >-
        ITEM-9609-5.4-090-APP states both the 2 400-unit crossing and current output of 6 000 before asking for margin of safety, so its N$3 600 answer is subtraction from prose rather than a chart reading.
      - >-
        ITEM-9609-5.4-091-APP supplies N$480 000 revenue and N$400 000 total cost at 6 000 units before asking for profit, while the displayed chart also fixes the intercept at N$160 000 and labels the crossing at 2 400. From those 6 000-unit readings, 80q = 160 000 + 40q gives q = 4 000, so the stimulus contradicts its own crossing point.
      - >-
        OBJ-9609-5.4.4-02 expressly requires calculation and interpretation in numeric and graphic form; -02-04 is the rarely examined profit member and its only graphical item is the inconsistent ITEM-091.
    educational_consequence: >-
      A learner can complete every new item without extracting a value from a graph, and one who tries to reconcile the plotted lines will derive a different break-even point and margin of safety from the canonical answers. This leaves a compulsory modality, including the protected rarely examined profit member, unreliable despite the mechanical coverage pass.
    recommended_repair: >-
      Build one internally consistent unseen chart from a declared price, variable cost and fixed-cost total; verify every coordinate and crossing algebraically. Remove the target readings from the stems and require the learner to read break-even output, margin of safety and profit from the visual, and to infer contribution from the difference in line slopes. Add a drawing task whose answer specifies correctly placed points and labels, then rerun C-31 with a check that the chart is necessary to answer.
    confidence: 1.0
    status: open
  - issue_id: SR-9609-5.4-CODEX-R2-002
    severity: high
    category: evaluation
    affected_ids:
      - OBJ-9609-5.4.2-05
      - OBJ-9609-5.4.3-04
      - CLM-9609-5.4-061
      - ITEM-9609-5.4-037-EVAL
      - ITEM-9609-5.4-052-CALC
      - ITEM-9609-5.4-053-APP
      - ITEM-9609-5.4-055-EVAL
      - ITEM-9609-5.4-086-CASE
    finding: >-
      The special-order repair leaves a systematic conflict between the correct incremental-cost test and the rules rewarded by the items. A one-off order improves the result only when its revenue exceeds every incremental cost, including any order-specific fixed, labour, delivery or setup cost, and when it does not displace a better use of capacity. CLM-061 reduces that to price above variable cost plus spare capacity; several answers then invent unchanged costs or sufficient capacity from prompts that do not establish either. ITEM-037's marking guidance separately retains the rejected R1 rule that other work must first cover fixed costs.
    evidence:
      - >-
        CLM-9609-5.4-055 and CU-9609-5.4.3 block 5.4.3-b4 correctly require the offer to beat every cost the order causes and any opportunity cost. CLM-9609-5.4-061 instead says price above variable cost and spare capacity are sufficient because fixed costs are paid anyway, without conditioning the claim on there being no additional fixed or other incremental cost.
      - >-
        ITEM-9609-5.4-037-EVAL's answer correctly says the discounted work improves profit or reduces loss while capacity is idle, but its required criterion still says "whether fixed costs are covered by other work", the false condition R1-007 was meant to remove.
      - >-
        ITEM-9609-5.4-055-EVAL supplies only flour, yeast and packaging of N$5 and an idle oven. It does not state total variable cost, whether the baker's time is already paid, or the cost of the promised delivery, yet its answer treats N$5 as the complete incremental cost, asserts the baker is paid anyway and recommends acceptance.
      - >-
        ITEM-9609-5.4-052-CALC and -053-APP likewise infer that fixed costs do not change and that the stated variable cost is the only cost caused by the order, although their prompts establish only spare capacity. ITEM-9609-5.4-086-CASE treats 60% utilisation as proof that an order for 400 signs fits, without giving capacity in signs or any order-specific cost.
    educational_consequence: >-
      Learners are trained to manufacture decisive case facts, to ignore relevant incremental costs, and in ITEM-037 to reject profitable work because unrelated sales have not covered fixed costs. These errors directly undermine AO2 application and the decisive criterion in a 12-mark AO4 answer.
    recommended_repair: >-
      Rewrite CLM-061 around incremental revenue minus all incremental costs and opportunity cost. In every special-order prompt, state total per-unit incremental cost, any setup, labour or delivery cost, whether fixed costs change, and spare capacity in units; otherwise require a conditional conclusion. Replace ITEM-037's stale guidance with the criterion used in its answer: what the capacity would otherwise earn and what costs the discounted work itself causes.
    confidence: 1.0
    status: open
