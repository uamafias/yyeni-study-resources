    finding: >-
      C-30 is a real but bounded historical audit gap: these advanced claim-revision stamps lack prior_hash, so the record cannot prove what text was replaced or distinguish a genuine reread from a bulk stamp. I independently reread the current artifacts and the packet hash fixes their present content, so the warning is not itself evidence that a stale derivative remains.
    evidence:
      - >-
        qa_report.json C-30 names these 16 pre-audit-trail stamps as unverifiable while reporting later stamps auditable and clean.
      - >-
        C-29 confirms that every current block and item records the current revision of every cited claim; this addresses present revision alignment but cannot reconstruct the missing historical hashes.
    educational_consequence: >-
      There is no demonstrated learner-facing error from the missing history, but a later maintainer cannot rely on these stamps as evidence that the affected derivatives were actually reread when the claims advanced.
    recommended_repair: >-
      Do not fabricate historical hashes. Preserve the exception explicitly, anchor the current artifacts to this independently hash-verified R2 review, and require prior_hash for every future advanced stamp.
