    finding: >-
      The semantic exposure repair is incomplete and exam-exposure.json still mixes pre-remap metrics with post-remap counts. Several records about the definition, usefulness or importance of break-even analysis remain mapped to the break-even-output calculation. The exposure entries then retain the old question-part counts, command-word mix, maximum tariff and probed_high class even though a separate field records far fewer parts after remapping.
    evidence:
      - >-
        EV-9609-W25-12-3a-0074 asks to define break-even analysis but maps to OBJ-9609-5.4.4-02-01 rather than the meaning objective OBJ-9609-5.4.4-01.
      - >-
        EV-9609-W22-23-1b-0027 and EV-9609-M24-22-1b-0078 ask for a use of break-even data or analysis; EV-9609-S23-13-5b-0144 evaluates its importance; and EV-9609-W21-13-7a-0187 analyses how it helps a start-up. All remain on -02-01 instead of the meaning/importance or uses/limitations objectives.
      - >-
        The -02-01 exposure entry retains question_parts_naming_it 26, a 12-mark maximum and a probed_high class while observed_parts_after_remap_2026_09_10 is 14. The -02-02 entry retains four parts, Analyse/Evaluate exposure and probed_high while its post-remap field is one part.
      - >-
        exam-exposure.json nevertheless says the 5.4 counts were recomputed, and assessment_evidence.json explicitly records token matching as a known weakness rather than a validated semantic map.
    educational_consequence: >-
      No current objective was thinned because of exposure, so the learner-facing harm is bounded. However, future item-type allocation, review-set membership and assessment-demand claims can still be driven by false objective granularity and by command words belonging to removed records.
    recommended_repair: >-
      Semantically remap every topic 5.4 record, including synonymous formulations of meaning, help, use and importance. Rebuild question_parts_naming_it, distinct series, maximum tariff, command-word counts and exposure class from the repaired mappings instead of retaining the old fields beside a new count, then make the remap note describe the resulting state accurately.
