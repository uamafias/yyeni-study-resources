  - issue_id: SR-9609-5.4-CODEX-R2-004
    severity: medium
    category: quantitative
    affected_ids:
      - OBJ-9609-5.4.3-03
      - OBJ-9609-5.4.4-02-04
      - ITEM-9609-5.4-048-CALC
      - ITEM-9609-5.4-078-CALC
    finding: >-
      The repaired CALC cards now add interpretation, but both overstate the sensitivity shown by their own figures. The arithmetic checks are separated correctly; the new business meanings are not quantitatively supported.
    evidence:
      - >-
        ITEM-9609-5.4-048-CALC says a 10% fall in volume would remove most of N$25 200 profit. Contribution is N$43 per unit; at 2 160 units profit is N$14 880, so the fall removes N$10 320, or 41%, and 59% remains.
      - >-
        ITEM-9609-5.4-078-CALC says output 20% below the 12 000-unit plan would leave Kaoko with "almost nothing". At 9 600 bottles, profit is (9 600 x N$12) - N$96 000 = N$19 200, which is 40% of the stated N$48 000 profit.
      - >-
        Both marking guides require sensitivity interpretation, so these are rewarded conclusions rather than incidental wording.
    educational_consequence: >-
      A learner may calculate correctly and then lose interpretation credit by describing a minority reduction as "most" or 40% of the original profit as almost nothing, weakening quantitative AO2 reasoning.
    recommended_repair: >-
      State the exact retained and lost percentages, or change the hypothetical volume falls to thresholds that support the intended language. Keep the second calculation route as a check and use neutral, evidence-matched interpretation.
    confidence: 1.0
    status: open
  - issue_id: SR-9609-5.4-CODEX-R2-005
    severity: medium
    category: analysis
    affected_ids:
      - OBJ-9609-5.4.2-04
      - ITEM-9609-5.4-034-APP
    finding: >-
      ITEM-034 correctly derives a N$7 000 loss from contribution of N$74 000 and fixed costs of N$81 000, then makes a diagnosis the figures cannot support: that pricing is not the problem and insufficient event volume is. The same shortfall could be addressed or caused by price, variable cost, fixed cost or volume; positive aggregate contribution does not select among them.
    evidence:
      - >-
        The prompt supplies only total contribution and fixed costs. It gives no price, contribution per event, event count, capacity, demand or comparator.
      - >-
        The canonical conclusion says "The problem is not her pricing on each event; it is that she did not do enough events", and the guidance requires a conclusion about volume rather than pricing.
      - >-
        CU-9609-5.4.3 block 5.4.3-b5 correctly teaches that a cost result raises a question but cannot identify its cause without further evidence, making the item internally inconsistent with the notes.
    educational_consequence: >-
      Learners can be rewarded for treating an accounting result as causal evidence and for excluding valid remedies without case support, an AO3 inference error.
    recommended_repair: >-
      Limit the answer to the supported conclusion: the business made a N$7 000 loss because contribution did not cover fixed costs. Ask what additional information would distinguish low volume, a thin contribution margin and excessive fixed cost, or supply that evidence before requiring a diagnosis.
    confidence: 1.0
    status: open
