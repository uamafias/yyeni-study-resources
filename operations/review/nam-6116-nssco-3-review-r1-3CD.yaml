- issue_id: 3CD-006
  severity: low
  category: accuracy
  affected_ids:
  - ITEM-6116-3-110-APP
  finding: 'The marking guidance makes an absolute claim that the notes do not teach and that is not strictly true: blood
    glucose rises "only" when liver glycogen is broken down. Adrenaline also mobilises other reserves. The item works at this
    level because the stem tells the learner that blood glucose does not rise, but the "only" is unnecessary.'
  evidence: '"1 mark: blood glucose rises only when liver glycogen is broken down, so with no glycogen left there is no glucose
    to release." (ITEM-6116-3-110-APP)'
  educational_consequence: 'Learners take away a false absolute: that glycogen breakdown is the sole route by which blood
    glucose can rise.'
  recommended_repair: Change to "adrenaline raises blood glucose mainly by causing the liver to break down glycogen; with
    no glycogen store, it cannot do this".
  confidence: 0.5
  status: open
