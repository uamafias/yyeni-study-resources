- issue_id: 3CD-008
  severity: low
  category: accuracy
  affected_ids:
  - 3.12 Synthetic growth substances as weedkillers
  finding: The effect of selective weedkillers is first stated without its condition ("leave grasses and cereals unharmed").
    The dose and species condition comes only in the following sentence. The key-point line has the condition ("at the intended
    dose"); the body sentence does not.
  evidence: '"they kill broad-leaved weeds such as dandelions but leave grasses and cereals unharmed. Selectivity ... depends
    on the dose, the plant species and the conditions of application."'
  educational_consequence: A learner may memorise the absolute claim that weedkillers never harm grasses.
  recommended_repair: Change to "at the recommended dose they kill broad-leaved weeds ... while grasses and cereals are largely
    unaffected".
