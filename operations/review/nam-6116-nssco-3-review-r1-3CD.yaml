  - ITEM-6116-3-480-MISCON
  finding: 'These are binary inversions with the error flagged in the stem. Reversing the stated equation, or negating each
    stated condition (tight to slack, thin to thick), gives most of the answer. Each needs one small piece of knowledge: that
    the reversed equation is photosynthesis, and that the stated conditions are those for distant vision. They discriminate
