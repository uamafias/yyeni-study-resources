- issue_id: 3CD-009
  severity: low
  category: curriculum
  affected_ids:
  - 3.9 Nicotine
  finding: The objective asks for the effects of nicotine "on the gas exchange system". The notes give only dependence and
    cardiovascular effects, and they say outright that these are different from airway damage. This is defensible, but the
    notes do not explain how these effects fit an objective about the gas exchange system. A learner may think the answer
    is off-topic.
  evidence: 'OBJ-6116-3.9-10 "describe the effects of nicotine in tobacco smoke on the gas exchange system"; notes: "Its other
    effects are on the circulation ... They are different from the airway damage caused by tar."'
  educational_consequence: The learner is unsure what to write for a nicotine question set under gas exchange.
  recommended_repair: 'Add one line: nicotine''s main contribution is addiction, which keeps the smoker exposed to tar and
    carbon monoxide that damage the gas exchange system. Its direct effects are mainly on the heart and blood vessels.'
  confidence: 0.5
  status: open
