issues:
- issue_id: 3CD-001
  severity: medium
  category: curriculum
  affected_ids:
  - 3.13.1 Alcohol and synaptic signalling
  - 3.13.1 Transmission across a synapse
  - ITEM-6116-3-481-MISCON
  finding: Objective OBJ-6116-3.13.1-05 asks learners to "describe the effects of alcohol on the release of the neurotransmitter".
    The notes never connect alcohol to transmitter release. They say only that alcohol "slows synaptic transmission". The
    one sentence about blocked release, in the synapse section, is about an unnamed chemical and is not linked to alcohol.
    The expected point is that alcohol reduces or slows neurotransmitter release at synapses, so impulses in the next neurone
    are delayed or fewer.
  evidence: '"Alcohol is a depressant that slows synaptic transmission in the nervous system." (3.13.1 Alcohol and synaptic
    signalling); "A chemical that blocks release leaves the impulse arriving normally but stops the signal reaching the next
    cell." (3.13.1 Transmission across a synapse)'
  educational_consequence: Asked about alcohol and neurotransmitter release, a learner can only say "slows transmission" and
    cannot name the step affected. That answer is likely to lose the mark that depends on release.
  recommended_repair: 'In 3.13.1 Alcohol and synaptic signalling, add one sentence: alcohol reduces (slows) the release of
    neurotransmitter at synapses, so less transmitter crosses the gap and the next neurone is stimulated more slowly. Keep
    the ITEM-481 wording consistent with it.'
  confidence: 0.8
  status: open
- issue_id: 3CD-002
  severity: medium
  category: coherence
  affected_ids:
  - 3.7 Where this connects
  finding: 'Both sub-topic cross-references in the 3.7 connector point to the wrong place. In the objective registry, 3.6.1.1
    is leaf structure and 3.6.1.2 is mineral ions; the photosynthesis equation and rate objectives are 3.6.1.3. The note says
    the reverse, and it also cites a numbering that the notes file does not use: its headings stop at "3.6.1 Photosynthesis
    and plant nutrition".'
  evidence: '"Leaf anatomy is in 3.6.1.2. ... Sucrose moved in the phloem is made in photosynthesis, covered in 3.6.1.1."
    (3.7 Where this connects)'
  educational_consequence: A learner who follows the reference to revise leaf anatomy lands on mineral-deficiency content.
    A learner looking for photosynthesis lands on leaf structure.
  recommended_repair: Change to "Leaf anatomy is in 3.6.1.1" and "covered in 3.6.1.3", or cite the heading names in 3.6.1.
  confidence: 0.9
  status: open
- issue_id: 3CD-003
  severity: medium
  category: accuracy
  affected_ids:
  - 3.13.3 Adrenaline and metabolic activity (worked example)
  finding: 'The worked example credits adrenaline with supplying the energy for a movement that is over before adrenaline
    can act. Stepping back from a car takes a fraction of a second and is a nervous response. Adrenaline is secreted into
    the blood and acts afterwards, raising pulse rate and blood glucose to support continued activity. The example also contradicts
    the notes'' own rule in 3.13.1: nervous responses are rapid, hormonal responses are slower.'
  evidence: '"a runner sees a car and steps back quickly. Adrenaline is released, the pulse rate rises ... More glucose and
    oxygen reach the leg muscles, which respire faster and release the energy for rapid movement." (3.13.3 Adrenaline and
    metabolic activity)'
  educational_consequence: Learners may explain an instant avoiding movement by adrenaline, mixing up nervous and hormonal
    coordination. This is exactly the comparison that OBJ-6116-3.13.1-22 tests.
  recommended_repair: 'Reframe the example: the quick step is a nervous response. Adrenaline released at the same time keeps
    pulse rate and blood glucose raised for the following seconds to minutes, for example while the person runs on or stays
    alert. Say that the hormonal effect follows the nervous one.'
  confidence: 0.7
  status: open
- issue_id: 3CD-004
  severity: medium
  category: evaluation
  affected_ids:
  - ITEM-6116-3-471-MISCON
  - ITEM-6116-3-473-MISCON
  - ITEM-6116-3-481-MISCON
  finding: These misconception items give away the answer in the stem. 471 and 473 each name exactly two agents and two effects,
    say the pairing is wrong, and ask for it to be reassigned. A learner can earn both marks by swapping the pairs, with no
    biology needed. In 481 the stem itself says lung damage "happens with smoking", which is the whole content of mark 1.
    None of the three makes the learner choose between the right idea and the wrong one.
  evidence: 'ITEM-471: "Explain the mistake in saying that tar binds haemoglobin while carbon monoxide damages airway cleaning.
    Assign each effect correctly." ITEM-473: "phloem carries soil water upwards while xylem delivers sucrose ... Give the
    correct tissue for each cargo." ITEM-481: "caused by damage to the lungs, as happens with smoking"; mark 1 "states that
    lung damage is caused by smoking, not by drinking alcohol."'
  educational_consequence: Learners who still hold the misconception score full or half marks. The items then report the misconception
    as cleared when it is not.
  recommended_repair: Use the discriminating tests in misconceptions.json. For 020, ask which smoke component reduces oxygen
    carried by blood and which damages cilia, without pairing them in the stem. For 022, give one cargo and ask for the tissue
    and direction. For 041, remove "as happens with smoking" and ask which organ system alcohol acts on to slow reactions.
  confidence: 0.85
  status: open
