- issue_id: 5-008
  severity: low
  category: coherence
  affected_ids:
  - ITEM-6116-5-P01 Q6
  finding: Q6 asks which 'observation' would show extinction, but the key (B, 'None remains alive anywhere') is the definition
    of extinction, not something anyone can observe. The notes themselves stress that failing to find a species does not show
    it is extinct.
  evidence: 'ITEM-6116-5-P01 Q6: ''Which observation would show that a species is extinct? ... B. None remains alive anywhere''.'
  educational_consequence: Learners may come to think extinction is something a survey can directly observe, which works against
    the effort-and-detection point taught in 5.4.2.
  recommended_repair: Reword the stem to 'Which statement describes a species that is extinct?'
  confidence: 0.6
  status: open
- issue_id: 5-009
  severity: low
  category: evaluation
  affected_ids:
  - ITEM-6116-5-108-MISCON
  - MISCON-6116-033
  finding: The item announces that the idea is wrong ('Explain the error'), so the learner never has to choose between producer
    and decomposer. The stated premise ('because it releases mineral ions') is also an unusual reason, not the common confusion
    the notes describe (an organism placed at the bottom of a diagram or at the start of a decay chain). The item checks recall
    of the distinction but does not discriminate the misconception. P01 Q1 does discriminate it, with fungus and bacterium
    distractors.
  evidence: 'ITEM-6116-5-108-MISCON prompt: ''A learner calls a fungus growing on dead leaves a producer because it releases
    mineral ions. Explain the error in this idea.'' Notes 5.1 Producer: ''A common mistake is to call any organism at the
    bottom of a diagram a producer.'''
  educational_consequence: A learner holding the misconception can still score by stating the producer definition, so the
    item does not show whether the misconception has gone.
  recommended_repair: Ask the learner to classify a fungus on dead leaves and an alga on the same leaf litter, each with a
    reason, or base the premise on the observed confusion (a fungus at the start of a decay chain).
  confidence: 0.5
  status: open
