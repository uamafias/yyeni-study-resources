issues:
- issue_id: 5-001
  severity: medium
  category: quantitative
  affected_ids:
  - 5.4.2 Tourism and conservation (worked example)
  finding: The worked example sets a condition of fewer than 40 visitors a day for successful breeding, then recommends a
    cap of 40, which allows exactly 40 visitors. At 40 visitors the stated condition is not met, so the recommended cap does
    not protect the birds by the example's own rule. Arithmetic (80 x 120 = N$9600; 40 x 120 = N$4800) is correct.
  evidence: '5.4.2 Tourism and conservation: ''nesting birds breed successfully only when there are fewer than 40 visitors
    a day ... A cap of 40 earns N$4800 a day and protects the birds.'''
  educational_consequence: Learners copy an inclusive/exclusive boundary slip in threshold questions and apply a limit that
    sits on the failing side of the stated condition.
  recommended_repair: Change the condition to '40 or fewer visitors a day', or change the cap to 39 visitors (39 x 120 = N$4680).
  confidence: 0.9
  status: open
- issue_id: 5-002
  severity: medium
  category: coherence
  affected_ids:
  - ITEM-6116-5-087-CHAIN
  finding: The canonical answer skips the algal growth and death step and never names decomposers or their respiration, yet
    marking point 1 requires 'growth and then death of algae and plants, so decomposers use more oxygen'. As written, the
    model answer would not earn its own first mark. It also jumps from nutrients straight to 'decay', which is the very missing-step
    error the notes warn about.
  evidence: 'ITEM-6116-5-087-CHAIN canonical_answer: ''Excess nutrients increase decay and the demand for oxygen.'' Marking
    guidance: ''1 mark: excess nutrients increase the growth and then death of algae and plants, so decomposers use more oxygen.''
    Notes 5.4.1 Eutrophication: ''The fish did not die of the nutrients themselves: the missing step is the oxygen loss.'''
  educational_consequence: A learner who models their answer on the canonical text writes nutrients -> decay and loses the
    mechanism mark for omitting algal growth/death and decomposer respiration.
  recommended_repair: 'Rewrite the first sentence: ''Excess nutrients cause rapid growth of algae and plants; when they die,
    decomposers break down the dead material and their aerobic respiration uses up dissolved oxygen.'''
  confidence: 0.75
  status: open
- issue_id: 5-003
  severity: medium
  category: curriculum
  affected_ids:
  - OBJ-6116-5.2-13
  - 5.2 Forest removal and carbon balance
  finding: The objective asks for the effects of cutting down forests on the balance between oxygen AND carbon dioxide. The
    notes section discusses only carbon dioxide and carbon stores; it never states that removing trees reduces the oxygen
    released by photosynthesis, or that burning cleared trees uses oxygen. The fossil-fuel section (5.2-12) does treat oxygen,
    so the omission is specific to forests.
  evidence: '5.2 Forest removal and carbon balance: ''Deforestation reduces the uptake of carbon dioxide by photosynthesis
    and can release stored carbon when trees are burnt or decay.'' No mention of oxygen anywhere in the section.'
  educational_consequence: A learner answering a 'balance between oxygen and carbon dioxide' question on deforestation omits
    the oxygen half and loses marks.
  recommended_repair: 'Add: ''Fewer trees means less photosynthesis, so less oxygen is released and less carbon dioxide removed;
    burning or decay of the felled trees uses oxygen and releases carbon dioxide. As with fossil fuels, the change in atmospheric
    oxygen is small compared with the change in carbon dioxide.'''
  confidence: 0.75
  status: open
- issue_id: 5-004
  severity: medium
  category: curriculum
  affected_ids:
  - OBJ-6116-5.3-05
  - 5.3 Sigmoid population growth
  finding: The objective requires learners to identify the phases of a sigmoid curve and explain the role of limiting factors
    in each phase. The notes describe the phases only informally ('lag phase', 'phase of rapid increase', 'slowing phase',
    'roughly stable phase') and never give the conventional names exponential (log) phase and stationary phase, nor mention
    a death/decline phase. The lag phase is not explained (only 'the population is small and growth is slow'), and the role
    of limiting factors in the lag and rapid phases (few limiting factors acting, plenty of resources) is not stated.
  evidence: '5.3 Sigmoid population growth: ''a population can grow through a lag phase, a phase of rapid increase, a slowing
    phase and then a roughly stable phase ... In the lag phase the population is small and growth is slow. In the rapid phase
    births greatly exceed deaths.'''
  educational_consequence: Learners asked to 'name phase X' on a curve may not produce 'exponential/log' or 'stationary',
    and cannot explain why the lag phase is slow or why limiting factors are weak in the exponential phase.
  recommended_repair: 'Name the phases lag, exponential (log), stationary (and optionally death), and give one limiting-factor
    explanation per phase: lag - few breeding individuals, still establishing; exponential - resources plentiful, limiting
    factors weak, births far exceed deaths; stationary - food, space, disease or predation limit growth so births roughly
    equal deaths. Check against the NSSCO/Cambridge marking convention before adding the death phase.'
  confidence: 0.55
  status: open
- issue_id: 5-005
  severity: low
  category: quantitative
  affected_ids:
  - 5.1 Limits to chain length (worked example)
  finding: The figures are correct (1000 -> 200 -> 40 -> 8 kJ at 20% per transfer; 200 and 40 exceed 30, 8 does not), but
    'the first two levels can be supported but the third cannot' is ambiguous because the producer base is itself a trophic
    level. The intended meaning is that the primary and secondary consumer levels can be supported and the tertiary level
    cannot.
  evidence: '5.1 Limits to chain length: ''The next levels receive 200 kJ, then 40 kJ, then 8 kJ. If a population of consumers
    needs 30 kJ per year to survive, the first two levels can be supported but the third cannot.'''
  educational_consequence: A learner counting the producers as level 1 concludes that only primary consumers are supported
    and miscounts the length of the chain.
  recommended_repair: Write 'the primary and secondary consumer levels (200 kJ and 40 kJ) can be supported but a tertiary
    consumer level (8 kJ) cannot'.
  confidence: 0.6
  status: open
- issue_id: 5-006
  severity: low
  category: coherence
  affected_ids:
  - 5.1 Key points
  - 5.1 Transfer between trophic levels
  finding: The 5.1 key-points summary gives only egestion and respiration as the reasons less energy passes on at each step
    and drops uneaten material, which the body text includes. Mark schemes at this level usually credit 'not all of the organism
    is eaten'.
  evidence: '5.1 Key points: ''Less energy is left at each feeding step because of egestion and respiration, so chains are
    short.'' 5.1 Transfer between trophic levels: ''some material is uneaten or egested, and some energy is used in respiration''.'
  educational_consequence: A learner revising from the summary alone gives two reasons and misses a creditable third (parts
    not eaten).
  recommended_repair: 'Key points: ''because some material is not eaten, some is egested, and much is used in respiration
    and lost as heat''.'
  confidence: 0.5
  status: open
- issue_id: 5-007
  severity: low
  category: analysis
  affected_ids:
