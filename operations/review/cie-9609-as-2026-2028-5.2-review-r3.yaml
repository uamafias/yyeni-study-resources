coverage_confirmed: >-
  I traced all 24 assessable objectives from the registry in both directions after verifying all 18 packet entries and the detached manifest hash. OBJ-9609-5.2.1-01 is taught in CU-9609-5.2.1 blocks 5.2.1-b2 to b6 and practised by ITEM-9609-5.2-060-DIST and -069-WHY. The internal container OBJ-9609-5.2.2-01 is taught in CU-9609-5.2.2-INT blocks 5.2.2i-b2 to b3 and practised by items -055, -056 and -070; its five members are taught in blocks b4 to b7 and practised respectively by -040/-041/-077, -037/-054/-056, -042/-043/-054, -001 to -004, and -044/-045/-054. The external container OBJ-9609-5.2.2-02 is taught in CU-9609-5.2.2-EXT blocks 5.2.2e-b2 to b3, reinforced by the category distinction in CU-9609-5.2.2-INT b2 and the topic summary, and practised by item -070. Its fourteen members are taught and practised as follows: share capital in b3/b4/b10 and -046/-047/-058; debentures in b5 and -048/-049/-071; new partners in b4 and -050/-051/-072; venture capital in b4/b9 and -005 to -008; overdrafts in b6/b8/b9 and -009 to -012/-057; leasing in b3/b5/b9/b10 and -013 to -016/-057; hire purchase in b5/b9/b10 and -038/-057/-073/-078/-079; bank loans in b3/b5 and -017 to -020/-058; mortgages in b5 and -052/-053/-057/-074; factoring in b3/b6/b9/b10 and -021 to -024; trade credit in b3/b6 and -039/-057/-075; micro-finance in b6 and -025 to -028; crowd funding in b3/b7 and -029 to -032; and grants in b3/b7 and -033 to -036. OBJ-9609-5.2.3-01 is taught in CU-9609-5.2.3-4 b2/b5/b7 and the applied matching examples in CU-EXT b8/b9, and practised by -059/-061 to -063/-076. OBJ-9609-5.2.4-01 is taught in CU-9609-5.2.3-4 b3 to b7 and practised by -059/-064 to -068. The reverse pass found a curricular purpose for every substantive content-unit block; CU-EXT b11 is justified by the assessment framework and the cross-link blocks are signposts rather than new teaching. However, semantic adequacy cannot be confirmed for the objectives named in the issues below: several cards contradict the blocks that nominally cover them, one card crosses into working-capital management without a valid boundary, and the prerequisite graph omits the external-source knowledge needed by the choice objectives. The seven rarely examined objectives retain full teaching depth and are not reduced by the delivery schedule, but their defective cards still require repair.
reconstruction_test: >-
  Using only the packet, I reconstructed a 1-mark source identification, a 2-mark definition of venture capital, 3-mark explanations on retained earnings, mortgages, factoring and trade credit, the hire-purchase calculation, an 8-mark analysis for an unfamiliar aquaculture co-operative financing cold storage, a 12-mark loan-versus-equity evaluation for a seasonal exporter, and an application to a mobile-repair business not used in the notes. The core definitions, the five choice factors, the matching principle, the recourse distinction and the five-part evaluation scaffold supported transfer. Reliable answers could not be reconstructed for OBJ-9609-5.2.1-01 because filing is equated with verification and the canonical claim makes provider willingness a determination of legal form; for OBJ-9609-5.2.2-01 and members -01, -03 and -05 because cards reintroduce no-cost/no-counterparty absolutes and an invented boundary with working-capital management; for OBJ-9609-5.2.2-01-04 because ITEM-002 requires an untaught sale-value-versus-loan-to-value mechanism; for OBJ-9609-5.2.2-02-02 because ITEM-049 requires untaught published-term, holder-number and renegotiability distinctions; for OBJ-9609-5.2.2-02-06 because generic lease prompts assume maintenance, return and residual-value terms that the notes say vary by agreement; for OBJ-9609-5.2.2-02-13 because ITEM-032 assigns equity crowd funding a reliability and scale advantage contradicted by the shared campaign mechanism; and for OBJ-9609-5.2.2-02-14 because ITEM-036 ends in the same unconditional grant recommendation the notes reject. OBJ-9609-5.2.4-01 is also unreliable because several model judgements manufacture finance terms absent from their cases. The hire-purchase arithmetic itself reconstructs correctly from ITEM-078, but the standalone notes do not contain the promised numerical worked example and ITEM-079 compares a three-year total uplift with an unspecified borrowing rate.
issues:
  - issue_id: SR-9609-5.2-CODEX-R3-001
    severity: high
    category: accuracy
    affected_ids:
      - OBJ-9609-5.2.1-01
      - CLM-9609-5.2-002
      - CLM-9609-5.2-012
      - CU-9609-5.2.1
      - ITEM-9609-5.2-060-DIST
    finding: >-
      The ownership repair still conflates filing with verification and leaves a flat causal claim about providers. CLM-9609-5.2-002 says legal form determines how willing providers are, although the notes correctly call willingness a tendency. CLM-9609-5.2-012 then says filed accounts give a lender "verified information"; filing creates a record, but does not make unaudited accounts independently verified. The same wording appears in the learner notes and ITEM-9609-5.2-060-DIST, so the repaired distinction between filing and audit is undone at the point where the lender mechanism is taught.
    evidence:
      - "CLM-9609-5.2-002: legal form 'determines ... how willing providers are to supply' finance; CU-9609-5.2.1 block 5.2.1-b3 instead says provider willingness is a tendency, not a rule."
      - "CLM-9609-5.2-012 and notes line 34 call a filed public record 'verified information' immediately after acknowledging that filing and audit duties differ."
      - "ITEM-9609-5.2-060-DIST repeats that where a company files accounts there is 'verified information a lender can price'."
      - "As an authoritative illustration of the distinction, UK government guidance says qualifying small companies may file accounts while using an audit exemption: https://www.gov.uk/audit-exemptions-for-private-limited-companies"
    educational_consequence: >-
      A learner may state that legal form determines a lender's decision and that filing itself verifies accounts, weakening AO1 and reversing the intended evidence-and-risk reasoning in an international answer.
    recommended_repair: >-
      Change CLM-002 from "determines" to "influences" for provider willingness. In CLM-012, CU-5.2.1 and ITEM-060 distinguish information that is available because accounts are filed from information that is independently verified only where an audit or other assurance applies; keep every effect on availability or price conditional on lender, company type and jurisdiction.
    confidence: 0.99
    status: open
  - issue_id: SR-9609-5.2-CODEX-R3-002
    severity: high
    category: curriculum
    affected_ids:
      - OBJ-9609-5.2.2-02-06
      - CLM-9609-5.2-051
      - CU-9609-5.2.2-EXT
      - ITEM-9609-5.2-014-APP
      - ITEM-9609-5.2-015-CHAIN
      - ITEM-9609-5.2-057-APP
    finding: >-
      The leasing-variant repair is not propagated into the canonical claim or the applied and analysis cards. CLM-9609-5.2-051 still presents maintenance and easy replacement as generic benefits. CU-EXT b5 first says the lessor carries residual-value risk, then says two paragraphs later that the agreement decides who carries it. ITEM-014 assumes a generic lease lets the business hand back and exchange the machine, ITEM-015 assumes the lessor bears residual-value risk, and ITEM-057 describes both leasing and hire purchase as finance secured on the asset. None of those prompts supplies the contractual term on which the rewarded consequence depends.
    evidence:
      - "CLM-9609-5.2-051 and notes line 168 say leasing often includes maintenance, makes replacement easy and leaves the lessor carrying end-value risk."
      - "CU-9609-5.2.2-EXT block 5.2.2e-b5 and notes line 170 then say maintenance, early return, swapping and residual-value risk are all agreement-dependent."
      - "ITEM-9609-5.2-014-APP rewards handing back and taking a newer model without stating that the lease permits either; ITEM-9609-5.2-015-CHAIN makes transfer of residual-value risk part of the mandatory mechanism."
      - "IFRS for SMEs Module 20 records lease arrangements in which residual-value gains or losses accrue to the lessee and makes risk allocation depend on the lease provisions: https://www.ifrs.org/content/dam/ifrs/supporting-implementation/smes/module-20.pdf"
    educational_consequence: >-
      Learners are trained to award a lease benefits that the case agreement may not provide and to treat ownership by the lessor as proof that every residual-value risk has transferred, producing invalid AO2 and AO3 chains.
    recommended_repair: >-
      Rewrite CLM-051 so only the lower initial outlay and lessor ownership are generic. Condition maintenance, replacement, early return and end-value exposure on named terms. Add those terms to ITEM-014 and ITEM-015 prompts or remove the dependent benefits, and describe leasing as lessor ownership rather than secured finance in ITEM-057.
    confidence: 0.99
    status: open
  - issue_id: SR-9609-5.2-CODEX-R3-003
    severity: high
    category: evaluation
    affected_ids:
      - OBJ-9609-5.2.2-02-14
      - ITEM-9609-5.2-035-CHAIN
      - ITEM-9609-5.2-036-EVAL
    finding: >-
      The grant repair leaves its decisive false absolute in place. ITEM-9609-5.2-036-EVAL correctly identifies scarce owner time and uncertain success, then concludes that a matching application is "close to costless and should always be made". Matching the activity removes one opportunity cost but not the lengthy application, success probability, compliance burden or alternative uses of the owner's time. Its guidance also calls grants "uniquely cheap", while ITEM-035's own answer acknowledges internal alternatives and the notes teach donation and reward crowd funding that can also avoid repayment, interest and dilution.
    evidence:
      - "ITEM-9609-5.2-036-EVAL supplies the facts 'owner is the main salesperson' and 'grant application process is lengthy' but its answer ends 'close to costless and should always be made'."
      - "CU-9609-5.2.2-EXT block 5.2.2e-b7 and notes line 190 state that applying takes management time, grants are competitive, conditions can distort a decision, and grants rarely cover the full project."
      - "ITEM-9609-5.2-035-CHAIN limits the description to external sources but omits donation and reward crowd funding when explaining why a grant avoids repayment, interest and dilution."
      - "The brief records the same 'should always be made' conclusion as the core of prior issue SR-9609-5.2-CODEX-R2-007, yet the current card still contains it."
    educational_consequence: >-
      A learner may equate absence of an explicit financing charge with absence of economic cost and give an unconditional AO4 recommendation that contradicts the case facts.
    recommended_repair: >-
      Make the recommendation depend on the expected grant amount, probability of success, application and compliance time, conditions, and the value of the displaced selling activity. Remove "always" and "uniquely cheap"; compare grants with every feasible external alternative, including the relevant crowd-funding form.
    confidence: 1.0
    status: open
  - issue_id: SR-9609-5.2-CODEX-R3-004
    severity: high
    category: coherence
    affected_ids:
      - OBJ-9609-5.2.2-01
      - OBJ-9609-5.2.2-01-01
      - OBJ-9609-5.2.2-01-05
      - CLM-9609-5.2-021
      - ITEM-9609-5.2-012-EVAL
      - ITEM-9609-5.2-024-EVAL
      - ITEM-9609-5.2-055-CHAIN
      - ITEM-9609-5.2-077-WHY
    finding: >-
      Four cards reintroduce the no-cost, no-counterparty and fixed-ceiling rules that the internal-source repair explicitly removed. ITEM-012 calls late supplier payment interest-free and says it requires nobody's permission; ITEM-024 calls negotiated longer supplier terms costless. ITEM-055 says internal finance cannot meet a large need however well the business is run and that good management does not raise its ceiling, although good management can build profit, cash and saleable assets and the relevant comparison is the need against what is currently available. ITEM-077 says owner's savings "cost nothing to use", ignoring their opportunity cost while its own answer recognises risk.
    evidence:
      - "CLM-9609-5.2-021 and CU-9609-5.2.2-INT block 5.2.2i-b3 say internal finance is not free of cost or outsiders; notes line 94 states 'No interest is not the same as no cost'."
      - "CU-9609-5.2.2-INT block 5.2.2i-b4 and notes line 106 say a supplier must tolerate later payment and that delaying payment can damage credit standing."
      - "ITEM-9609-5.2-012-EVAL says supplier delay 'requires nobody's permission'; ITEM-9609-5.2-024-EVAL says negotiating longer terms achieves the same effect 'at no cost'."
      - "ITEM-9609-5.2-055-CHAIN uses the absolute prompt 'however well the business is run' and rewards the false proposition that good management cannot raise internal capacity; ITEM-9609-5.2-077-WHY says the owner's money costs nothing to use."
    educational_consequence: >-
      Learners receive mutually incompatible rules about permission, speed, scale and economic cost, and may reproduce categorical claims that lose AO3/AO4 credit even when they have mastered the repaired notes.
    recommended_repair: >-
      Regenerate the four answers from the repaired internal-source claims. Separate no contractual interest from opportunity, relationship and transaction costs; state when supplier agreement is needed; and make scale relative to the present financing need and present internal resources rather than to an absolute idea of a "large" need.
    confidence: 0.99
    status: open
  - issue_id: SR-9609-5.2-CODEX-R3-005
    severity: high
    category: coherence
    affected_ids:
      - OBJ-9609-5.2.2-01-04
      - OBJ-9609-5.2.2-01-05
      - OBJ-9609-5.2.2-02-02
      - OBJ-9609-5.2.2-02-13
      - ITEM-9609-5.2-002-APP
      - ITEM-9609-5.2-003-CHAIN
      - ITEM-9609-5.2-032-EVAL
      - ITEM-9609-5.2-045-DIST
      - ITEM-9609-5.2-049-DIST
    finding: >-
      Semantic offline reconstruction still fails in several places despite the second-round repair. ITEM-002 requires a buyer-full-value versus lender-loan-to-value mechanism absent from its claims and notes. ITEM-003's guidance requires a higher break-even point that neither its answer nor the notes teach. ITEM-032 assigns equity crowd funding reliability and scale because it supposedly does not require many people to be persuaded quickly, although equity crowd funding is also a target-based public campaign. ITEM-045 invents a clean distinction between using and managing working capital even though releasing cash through inventory, receivables and payables is itself working-capital management. ITEM-049 still requires many holders on published terms and claims bank-loan terms can be revisited, none of which is taught by the cited claims.
    evidence:
      - "ITEM-9609-5.2-002-APP says the buyer pays the assets' full value while a lender advances only a proportion and concludes that a loan 'would provide less'; CLM-9609-5.2-029/-030 teach none of those comparative facts."
      - "ITEM-9609-5.2-003-CHAIN marking guidance requires 'higher break-even', but the canonical answer and CU-INT teach only the fixed lease payment and downturn cash effect."
      - "ITEM-9609-5.2-032-EVAL says an equity round 'does not depend on thousands of small buyers being persuaded in a few weeks' and can raise considerably more; CLM-9609-5.2-064/-065 contain no such distinction. FCA guidance describes crowdfunding platforms generally as matching funders with a campaign and generally working to a target: https://www.fca.org.uk/investsmart/understanding-crowdfunding"
      - "ITEM-9609-5.2-045-DIST's operating-versus-financing boundary appears nowhere in CLM-9609-5.2-031/-032 or the notes; ITEM-9609-5.2-049-DIST's marking guidance still says 'many holders on fixed published terms' although the claimed repair was to use only what the notes teach."
    educational_consequence: >-
      An offline learner cannot derive the rewarded answers from the promised source of record and must either invent outside knowledge or memorise card-only propositions, several of which are not generally true.
    recommended_repair: >-
      For each card, either add a verified, in-scope mechanism to a canonical claim and the rendered notes or remove it from the answer and guidance. Delete the false crowd-funding and working-capital boundaries, and reduce the debenture distinction to ownership, lender identity, repayment structure and fixed-interest consequences that are actually taught.
    confidence: 0.99
    status: open
  - issue_id: SR-9609-5.2-CODEX-R3-006
    severity: high
    category: application
    affected_ids:
      - OBJ-9609-5.2.2-01-02
      - OBJ-9609-5.2.2-01-03
      - OBJ-9609-5.2.2-01-05
      - OBJ-9609-5.2.4-01
      - ITEM-9609-5.2-054-APP
      - ITEM-9609-5.2-065-DATA
      - ITEM-9609-5.2-066-ESSA
      - ITEM-9609-5.2-067-CASE
    finding: >-
      Several applied and extended answers manufacture decisive facts rather than reason from the case. ITEM-054 declares sale of idle machinery the fastest source although no buyer, sale time, cash balance or early-payment response is supplied. ITEM-065 invents a hire-purchase term matching the processing line's life and says asset backing removes the security obstacle, although no agreement or provider terms are given. ITEM-066 says a secured loan should price better than hire purchase with no offers or total costs. ITEM-067 recommends giving up 25% equity without a loan rate, expected profit, business value or total-cost comparison; monthly repayment timing establishes a cash-flow risk but not by itself which price is acceptable.
    evidence:
      - "ITEM-9609-5.2-054-APP supplies an idle machine but no evidence that it can be sold quickly; its answer says sale 'converts directly into cash' and costs nothing operationally."
      - "ITEM-9609-5.2-065-DATA gives no hire-purchase duration or quote, but the answer says instalments run over roughly the asset's working life and that security on the line 'removes' the obstacle."
      - "ITEM-9609-5.2-066-ESSA gives no loan or hire-purchase price, yet its answer says a bank loan 'should therefore price better'."
      - "ITEM-9609-5.2-067-CASE supplies equal monthly instalments and two months' cash but no interest rate, profit/cash forecast or valuation of the 25% stake; its five-part labels therefore do not make the recommendation economically determinate."
    educational_consequence: >-
      The model teaches learners that contextual application means filling gaps with convenient assumptions. This weakens AO2 evidence use and produces AO4 judgements that sound decisive but cannot be defended from the stimulus.
    recommended_repair: >-
      Add the missing marketability, timing, repayment-term, quoted-cost, cash-flow and equity-valuation facts, or change each answer to a conditional comparison that explicitly identifies the missing fact. A clear judgement must follow from the supplied case rather than from an invented provider offer.
    confidence: 0.98
    status: open
  - issue_id: SR-9609-5.2-CODEX-R3-007
    severity: medium
    category: quantitative
    affected_ids:
      - OBJ-9609-5.2.2-02-07
      - CLM-9609-5.2-086
      - CU-9609-5.2.2-EXT
      - ITEM-9609-5.2-078-CALC
      - ITEM-9609-5.2-079-INTERP
    finding: >-
      The added hire-purchase calculation is arithmetically correct, but the standalone teaching and interpretation remain incomplete. The notes give only the prose instruction "add the deposit to every instalment" and no numerical worked calculation, although the contract promises every formula, unit and worked example in the offline notes. ITEM-079 then treats a 20.8% total uplift over three years as comparable with an unspecified alternative borrowing "rate" and concludes that the higher-rate alternative makes hire purchase cheaper overall; rate alone cannot establish that without the amount outstanding, timing, fees and total borrowing cost on a common basis.
    evidence:
      - "CU-9609-5.2.2-EXT block 5.2.2e-b5 and notes line 172 contain no figures or step-by-step worked hire-purchase example; ITEM-9609-5.2-078-CALC is the only worked calculation."
      - "ITEM-9609-5.2-078-CALC correctly computes N$181 200 total and N$31 200 extra, but its 20.8% is total extra cost as a percentage of cash price, not an annual interest rate."
      - "ITEM-9609-5.2-079-INTERP says borrowing working capital 'at a higher rate' makes hire purchase cheaper overall without supplying a comparable rate, duration, balance or fee structure."
      - "contract.json requires the notes to stand alone and says every mechanism, formula and worked example is written out in full."
    educational_consequence: >-
      A learner using the notes offline does not see the promised numerical method and may compare an overall three-year percentage with a borrowing rate on a different basis, leading to a wrong finance decision despite correct arithmetic.
    recommended_repair: >-
      Put the explicit formula deposit + number of instalments x instalment amount, units and a numerical worked example into the notes. In ITEM-079 compare total currency costs over the same period, or supply enough data to calculate comparable effective costs; do not infer "cheaper overall" from a rate label alone.
    confidence: 0.97
    status: open
  - issue_id: SR-9609-5.2-CODEX-R3-008
    severity: medium
    category: curriculum
    affected_ids:
      - OBJ-9609-5.2.2-02
      - OBJ-9609-5.2.3-01
      - OBJ-9609-5.2.4-01
    finding: >-
      The prerequisite chain for choosing and evaluating finance omits the external-source container. Both objective_registry.json and dependency_graph.json make only the internal-source container OBJ-9609-5.2.2-01 a prerequisite of OBJ-9609-5.2.3-01, even though the factors and appropriateness objectives require comparison across internal and external sources. The rendered notes happen to teach external sources first, but the formal graph permits a scheduler or reconstructor to reach source choice without them.
    evidence:
      - "objective_registry.json OBJ-9609-5.2.3-01 lists prerequisite_ids: [OBJ-9609-5.2.2-01] and omits OBJ-9609-5.2.2-02."
      - "dependency_graph.json contains OBJ-9609-5.2.2-01 -> OBJ-9609-5.2.3-01 and OBJ-9609-5.2.3-01 -> OBJ-9609-5.2.4-01, but no corresponding external-source edge."
      - "CU-9609-5.2.3-4 block 5.2.34-b2 and its worked judgement compare external sources, demonstrating that external-source knowledge is semantically required."
    educational_consequence: >-
      A dependency-driven learning path can present the choice framework before the learner knows most of the alternatives being evaluated, making later practice nominally reachable but not reconstructible.
    recommended_repair: >-
      Add OBJ-9609-5.2.2-02 as a prerequisite of OBJ-9609-5.2.3-01 in both the registry and dependency graph; retain OBJ-9609-5.2.3-01 as the immediate prerequisite of appropriateness.
    confidence: 0.99
    status: open
  - issue_id: SR-9609-5.2-CODEX-R3-009
    severity: medium
    category: publishing
    affected_ids:
      - CONTRACT-9609-AS-5.2
      - OBJ-9609-5.2.2-02-07
    finding: >-
      The quantitative repair leaves stale allocation metadata. The contract's live item_budget and required_outputs both say 79, but item_budget_note still says the budget was raised from 68 to 77 and explains only the nine command-shaped additions. In exam-exposure.json the hire-purchase objective still has item_allocation 1 while the same record requires CALC, DEF and INTERP and the submitted bank contains five mapped items. These values cannot all describe the current allocation.
    evidence:
      - "contract.json depth_constraints.item_budget is 79 and required_outputs.learning_items is 79, while depth_constraints.item_budget_note says 'Raised from 68 to 77'."
      - "exam-exposure.json OBJ-9609-5.2.2-02-07 records item_allocation: 1 and required_subtypes: [CALC, DEF, INTERP]."
      - "qa_report.json reports 79 items and describes ITEM-078-CALC and ITEM-079-INTERP as the repair, but no deterministic check asserts allocation-field equality with the live bank."
    educational_consequence: >-
      A later build or delivery schedule can regenerate from the stale allocation and discard the calculation repair, while a reviewer cannot tell whether the declared allocation or the current bank is authoritative.
    recommended_repair: >-
      Update the contract note to 79 and explain the two quantitative additions. Recompute the hire-purchase allocation field from its required subtypes and current item policy, then add a deterministic consistency check between allocation metadata, required subtype count and the live item bank.
    confidence: 1.0
    status: open
