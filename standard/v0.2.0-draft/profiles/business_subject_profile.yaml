profile_id: yyeni-subject-business-v0.1.0
version: 0.1.0-draft
status: draft
subject_name: Business
language_variant: en-GB
purpose: Enable learners to understand how businesses operate, apply concepts to real contexts, analyse causes and consequences,
  evaluate alternatives, and make justified recommendations.
foundational_concepts:
- context
- decision-making
- objectives
- stakeholders
- change
- trade-offs
- risk and uncertainty
- time horizon
- implementation
- quantitative evidence
objective_types:
- type_id: business_concept
  label: Business concept or definition
  description: A term or idea that must be understood precisely and distinguished from related concepts.
  required_components:
  - canonical definition
  - plain-language explanation
  - essential features
  - boundary or non-example
  - business significance
  - common misconception
  recommended_item_types:
  - flashcard
  - short_answer
  - case_analysis
- type_id: business_process
  label: Business process
  description: An ordered sequence of actions or decisions used to achieve a business purpose.
  required_components:
  - purpose
  - inputs
  - ordered stages
  - decision points
  - outputs
  - risks if stages are skipped
  - contextual variation
  recommended_item_types:
  - flashcard
  - worked_example
  - short_answer
  - case_analysis
- type_id: business_method_strategy
  label: Method, policy, or strategy
  description: A course of action a business may adopt and whose suitability depends on context.
  required_components:
  - definition
  - how it works
  - purpose
  - developed benefits
  - developed limitations
  - stakeholder effects
  - short- and long-term effects
  - suitability factors
  - implementation conditions
  recommended_item_types:
  - flashcard
  - case_analysis
  - data_response
  - essay_plan
  - essay_question
- type_id: business_comparison
  label: Comparison or distinction
  description: Two or more concepts or options compared using the same dimensions.
  required_components:
  - shared comparison dimensions
  - similarities
  - differences
  - implications of differences
  - contexts favouring each option
  - misconceptions
  recommended_item_types:
  - flashcard
  - short_answer
  - case_analysis
- type_id: business_relationship_impact
  label: Relationship or impact
  description: A causal or reciprocal relationship between a decision, variable, stakeholder, and business outcome.
  required_components:
  - variables
  - positive pathway
  - negative pathway
  - mechanism
  - stakeholder effects
  - measures or indicators
  - moderating context
  - feedback effects
  recommended_item_types:
  - flashcard
  - case_analysis
  - data_response
  - essay_plan
- type_id: business_theory_model
  label: Business theory or model
  description: A structured explanation or framework used to interpret business behaviour or support decisions.
  required_components:
  - central proposition
  - assumptions
  - components
  - mechanism
  - business application
  - strengths
  - limitations
  - comparison
  - contextual usefulness
  recommended_item_types:
  - flashcard
  - worked_example
  - case_analysis
  - essay_plan
  - essay_question
- type_id: business_quantitative_measure
  label: Quantitative measure or technique
  description: A formula, calculation, chart, or technique used to interpret business information and support decisions.
  required_components:
  - definition
  - formula
  - variable meanings
  - units
  - worked calculation
  - interpretation
  - comparison basis
  - decision use
  - limitations
  - common errors
  recommended_item_types:
  - flashcard
  - calculation
  - worked_example
  - data_response
- type_id: business_decision_evaluation
  label: Business decision or recommendation
  description: A choice between alternatives requiring a justified, contextual judgement.
  required_components:
  - decision options
  - criteria
  - evidence
  - trade-offs
  - stakeholder effects
  - time horizon
  - decisive factor
  - counterargument
  - implementation conditions
  - substantiated conclusion
  recommended_item_types:
  - case_analysis
  - data_response
  - essay_plan
  - essay_question
- type_id: business_case_data_interpretation
  label: Case or data interpretation
  description: Use of written, numerical, graphical, or diagrammatic stimulus to answer a business question.
  required_components:
  - relevant case facts
  - selection of concepts
  - calculation where required
  - fact-to-effect reasoning
  - limitations of data
  - contextual conclusion
  recommended_item_types:
  - data_response
  - case_analysis
  - calculation
  - essay_question
assessment_skill_model:
- skill_id: knowledge_understanding
  label: Knowledge and understanding
  definition: Accurate command of business concepts, terms, theories, methods, and quantitative techniques.
  authoring_requirements:
  - use one canonical definition
  - define technical vocabulary before use
  - teach distinctions and boundaries
  - include formulas and method steps where required
- skill_id: application
  label: Application
  definition: Use business knowledge in familiar and unfamiliar contexts so that contextual facts materially change or sharpen
    the reasoning.
  authoring_requirements:
  - identify decision-relevant context
  - use facts from the business situation
  - avoid company-name-only application
  - show why the same option differs across contexts
- skill_id: analysis
  label: Analysis
  definition: Explain causes, relationships, impacts, and consequences through valid business reasoning.
  authoring_requirements:
  - include a defensible mechanism
  - link effects to indicators, objectives, or stakeholders
  - use conditional language
  - include counter-effects where material
- skill_id: evaluation
  label: Evaluation
  definition: Use evidence and context to make a reasoned judgement, substantiated conclusion, or recommendation for action
    and implementation.
  authoring_requirements:
  - identify criteria
  - weigh significance rather than list both sides
  - state the decisive factor
  - address the strongest counterargument
  - include implementation or success conditions
application_model:
  core_rule: A worked application must use one or more specific contextual facts that change the business reasoning; naming
    an industry or business alone is insufficient.
  context_dimensions:
  - business size
  - ownership and purpose
  - economic sector
  - goods or services
  - labour or capital intensity
  - workforce skill
  - customer contact
  - financial resources
  - objectives
  - growth or decline
  - location
  - technology
  - market conditions
  - stakeholder power
  - legal environment
  - time pressure
  - risk and uncertainty
  worked_application_policy:
    minimum_per_major_objective: 1
    contrast_required_for_decisions: true
    coverage_dimensions:
    - primary, secondary, tertiary, and where relevant quaternary sectors
    - small, medium, and large businesses
    - private, public, and social-enterprise contexts
    - goods, services, and digital output
    - stable, growth, decline, crisis, and technological-change situations
  pseudo_application_patterns:
  - in this business without using a specific fact
  - for Company A without explaining why its circumstances matter
  - generic advantage followed only by a business name
  - repeating the stimulus without linking it to a consequence
analysis_model:
  chain_template:
  - decision or condition
  - immediate effect
  - behavioural, operational, financial, or market mechanism
  - measurable consequence
  - effect on an objective or stakeholder
  rules:
  - Do not jump directly from an action to higher profit.
  - Use may, can, could, or is likely to unless the result is logically certain.
  - Name the affected stakeholder or business objective.
  - Develop the most relevant chain rather than adding unnecessary links.
  - Include an important counter-effect when it could reverse the conclusion.
evaluation_model:
  judgement_template:
  - clear judgement
  - specific context
  - decisive criterion and reason
  - strongest counterargument
  - condition for success or implementation
  decision_dimensions:
  - objectives
  - cost and finance
  - urgency
  - business size
  - sector
  - workforce skills
  - stakeholder effects
  - short term versus long term
  - risk
  - reversibility
  - data reliability
  - implementation quality
  - external environment
  rules:
  - It depends is incomplete unless the factor and its effect on the decision are explained.
  - Do not force artificial balance when one factor is clearly more important.
  - Conclusions must answer the precise question and identify which option is preferable, for whom, and under what conditions.
  - Recommendations should include implementation requirements where appropriate.
depth_model:
  allocation_factors:
  - conceptual complexity
  - mark tariff
  - observed assessment evidence
  - misconception risk
  - prerequisite importance
  - cross-topic reuse
  - quantitative or procedural demand
  - need for contextual evaluation
  tiers:
  - tier: 1
    label: Atomic
    typical_use: Definition, feature, or simple distinction
    indicative_word_range:
      min: 100
      max: 300
    indicative_item_range:
      min: 2
      max: 5
  - tier: 2
    label: Standard
    typical_use: Ordinary concept, stage, or straightforward method
    indicative_word_range:
      min: 300
      max: 700
    indicative_item_range:
      min: 5
      max: 10
  - tier: 3
    label: Major
    typical_use: Multi-part process, method comparison, or significant impact
    indicative_word_range:
      min: 700
      max: 1300
    indicative_item_range:
      min: 8
      max: 16
  - tier: 4
    label: Synoptic
    typical_use: Complex decision requiring application, analysis, and evaluation
    indicative_word_range:
      min: 1000
      max: 1800
    indicative_item_range:
      min: 12
      max: 20
quantitative_model:
  required_components:
  - precise formula
  - definition of every variable
  - correct units
  - simple worked example
  - contextual worked example
  - step-by-step calculation
  - interpretation
  - comparison basis
  - business decision use
  - limitations
  - common errors
  interpretation_rules:
  - A numerical result is incomplete without a statement of what it means.
  - A measure should be compared over time, with competitors, with targets, or with an appropriate benchmark where possible.
  - The notes must explain what the measure does not reveal.
  - Rounding and units must be consistent with the qualification profile.
legal_and_jurisdiction_model:
  core_rule: For international qualifications, teach the general business principle and state that exact legal rights, thresholds,
    and procedures depend on the jurisdiction unless the syllabus specifies a country.
  high_risk_topics:
  - employment law
  - dismissal and redundancy
  - equality and discrimination
  - contracts
  - health and safety
  - taxation
  - consumer law
  - trade union rights
learning_item_model:
  item_types:
  - flashcard
  - short_answer
  - calculation
  - worked_example
  - data_response
  - essay_plan
  - essay_question
  - case_analysis
  - source_analysis
  flashcard_subtypes:
  - DEF
  - FEATURE
  - DIST
  - PROC
  - WHY
  - MECH
  - BEN
  - LIM
  - APP
  - CHAIN
  - EVAL
  - CALC
  - INTERP
  - MISCON
  - SYNTH
  rules:
  - Generate items only from approved claims.
  - Use one unified item bank per topic; difficulty and extension status are metadata.
  - Each flashcard must test one main target and be self-contained.
  - Do not create automatic reverse cards unless the direction of recall is genuinely different.
  - Split long list answers into smaller cards.
  - A comprehensive set covers the concept structure without semantic duplication.
  - Include progression from recall through explanation, application, analysis, and evaluation.
  - Extended-response skills require performance tasks in addition to flashcards.
terminology_rules:
- Use British English.
- Use business, organisation, labour, and programme consistently where appropriate.
- Preserve official syllabus terminology.
- Maintain one canonical definition for recurring terms.
prohibited_patterns:
- unsupported absolutes such as always increases profit
- generic advantage or disadvantage lists with no mechanism
- company-name-only application
- it depends with no named criterion
- every analysis chain ending in profit
- one country law presented as universal
- real-company claims invented for illustration
- optional enrichment mixed into core examinable content
- fixed flashcard-count targets that create duplication
- separate base and extension banks with inconsistent architecture
semantic_review_questions:
- Does each definition capture the precise business meaning and boundaries of the concept?
- Does every major application use facts that materially change the reasoning?
- Are analysis chains causally valid and free from unsupported jumps?
- Does each major decision include a contextual and decisive judgement?
- Are stakeholder effects and trade-offs represented where relevant?
- Are quantitative results calculated, interpreted, and evaluated correctly?
- Is the depth proportionate to syllabus importance and assessment demand?
- Could a learner use these notes to answer an unfamiliar case rather than only repeat lists?
- Are recurring terms consistent with the global glossary?
- Does any core content drift into another qualification level or optional route?
